<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  transition:background 0.25s,color 0.25s;
}

.mode-btn{position:fixed;top:16px;right:16px;padding:7px 14px;border-radius:100px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);font-family:inherit;background:var(--surface);color:var(--text-muted);transition:color 0.15s,border-color 0.15s;}
.mode-btn:hover{color:var(--text);border-color:var(--line-strong);}

.card{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;}

/* Wordmark */
.logo{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;font-size:26px;letter-spacing:-0.01em;background:var(--grad-wordmark);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;margin-bottom:28px;}

.greeting{text-align:center;margin-bottom:24px;}
.greeting-hi{font-size:22px;font-weight:700;margin-bottom:6px;color:var(--text);}
.greeting-sub{font-size:14px;color:var(--text-muted);line-height:1.5;}

/* Choice cards: posting = primary, earning = teal */
.choice-card{
  --card-accent:var(--primary);
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px 16px;
  margin-bottom:10px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:14px;
  color:var(--text);
  text-decoration:none;
  transition:border-color 0.15s,background 0.15s,box-shadow 0.15s;
}
.choice-card.hire{--card-accent:var(--primary);}
.choice-card.earn{--card-accent:var(--teal);}
/* Selected look (1.5px accent border + soft tint); inset shadow adds the 0.5px without reflow */
.choice-card:hover,
.choice-card:focus-visible,
.choice-card:active{
  border-color:var(--card-accent);
  box-shadow:inset 0 0 0 0.5px var(--card-accent);
  background:color-mix(in srgb,var(--card-accent) 10%,var(--surface));
}
.choice-card:focus-visible{outline:2px solid color-mix(in srgb,var(--card-accent) 30%,transparent);outline-offset:2px;}

/* Icon square */
.choice-icon{flex-shrink:0;width:46px;height:46px;border-radius:10px;background:var(--surface-alt);color:var(--card-accent);display:flex;align-items:center;justify-content:center;}

.choice-text{flex:1;min-width:0;}
.choice-title{font-size:16px;font-weight:700;margin-bottom:3px;color:var(--text);}
.choice-desc{font-size:13px;line-height:1.5;color:var(--text-muted);}

.choice-arrow{margin-left:auto;flex-shrink:0;display:flex;color:var(--text-muted);transition:color 0.15s,transform 0.15s;}
.choice-card:hover .choice-arrow,
.choice-card:focus-visible .choice-arrow{color:var(--card-accent);transform:translateX(2px);}

.both-link{margin-top:10px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;text-decoration:none;transition:color 0.15s;}
.both-link:hover{color:var(--primary);}
</style>

<body>

<button class="mode-btn" id="modeBtn" onclick="toggleMode()">Light</button>

<div class="card">
  <div class="logo">SwiftGigs</div>

  <div class="greeting">
    <div class="greeting-hi" id="greetingHi">Hey there</div>
    <div class="greeting-sub">What are you here to do today?<br>You can always switch later.</div>
  </div>

  <a class="choice-card hire" href="dashboard.html" onclick="chooseRoleMode('poster')">
    <div class="choice-icon" data-qg-ico="clipboard" data-qg-ico-size="22"></div>
    <div class="choice-text">
      <div class="choice-title">I need help</div>
      <div class="choice-desc">Post a task and find someone local to get it done</div>
    </div>
    <div class="choice-arrow" aria-hidden="true" data-qg-ico="arrowRight" data-qg-ico-size="18"></div>
  </a>

  <a class="choice-card earn" href="dashboard.html" onclick="chooseRoleMode('tasker')">
    <div class="choice-icon" data-qg-ico="briefcase" data-qg-ico-size="22"></div>
    <div class="choice-text">
      <div class="choice-title">I want to earn</div>
      <div class="choice-desc">Browse tasks near you, apply and get paid</div>
    </div>
    <div class="choice-arrow" aria-hidden="true" data-qg-ico="arrowRight" data-qg-ico-size="18"></div>
  </a>

  <a class="both-link" href="dashboard.html" onclick="chooseRoleMode('poster')">I want to do both — start as poster →</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbYJxU-3r7qVMqwzXHiC-qRkZNtmGobm0",
  authDomain: "quickgigs-7b12d.firebaseapp.com",
  projectId: "quickgigs-7b12d",
  storageBucket: "quickgigs-7b12d.firebasestorage.app",
  messagingSenderId: "698985399366",
  appId: "1:698985399366:web:8a3ca60c5f3ffac84bb647"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let authChecked = false;
const redirectTimeout = setTimeout(() => {
  if (!authChecked) window.location.href = 'login.html';
}, 3000);

onAuthStateChanged(auth, (user) => {
  authChecked = true;
  clearTimeout(redirectTimeout);
  if (!user) { window.location.href = 'login.html'; return; }
  const name = user.displayName || user.email.split('@')[0];
  const firstName = name.split(' ')[0];
  document.getElementById('greetingHi').textContent = 'Hey ' + firstName;

  // Skip only when signup already locked a preferred role (do not invent a default skip)
  const signupRole = localStorage.getItem('qg-role');
  if (signupRole === 'poster' || signupRole === 'worker') {
    if (typeof setMode === 'function') setMode(signupRole === 'worker' ? 'tasker' : 'poster');
    window.location.href = 'dashboard.html';
  }
});
</script>
<script src="qg-icons.js"></script>

<script>
window.chooseRoleMode = function(mode) {
  if (typeof setMode === 'function') setMode(mode);
  else {
    var m = (mode === 'worker' || mode === 'tasker') ? 'tasker' : 'poster';
    localStorage.setItem('qg-mode', m);
    localStorage.setItem('qg-session-mode', m === 'tasker' ? 'worker' : 'poster');
    localStorage.setItem('qg-role', m === 'tasker' ? 'worker' : 'poster');
  }
};

var isDark = typeof QG_isDarkTheme === 'function' ? QG_isDarkTheme() : true;
function applyTheme() {
  document.body.className = isDark ? '' : 'light';
  document.getElementById('modeBtn').textContent = isDark ? 'Light' : 'Dark';
}
window.toggleMode = function() {
  isDark = !isDark;
  if (typeof QG_setThemeDark === 'function') QG_setThemeDark(isDark);
  else localStorage.setItem('qg-theme', isDark ? 'dark' : 'light');
  applyTheme();
};
applyTheme();
</script>
