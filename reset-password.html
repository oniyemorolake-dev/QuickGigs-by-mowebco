<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- qg-build:947d37a-1789577525 -->

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SwiftGigs — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px 24px 26px;width:100%;max-width:420px;box-shadow:0 8px 28px rgba(0,0,0,0.18);}
/* Wordmark */
.logo{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;font-size:24px;letter-spacing:-0.01em;text-align:center;margin-bottom:18px;background:var(--grad-wordmark);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.title{font-size:21px;font-weight:700;line-height:1.25;text-align:center;color:var(--text);margin-bottom:6px;}
.sub{font-size:14px;color:var(--text-muted);text-align:center;line-height:1.55;margin-bottom:22px;}
.field{margin-bottom:16px;}
.field label{font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:7px;}
.field input{width:100%;padding:13px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-family:inherit;font-size:15px;color:var(--text);outline:none;transition:border-color 0.15s;}
.field input::placeholder{color:var(--text-muted);}
.field input:focus{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 30%,transparent);outline-offset:0;}
/* Password eye toggle injected by qg-utils.js (hardcoded old colors there) */
.field .qg-password-toggle{color:var(--text-muted);background:transparent;border-color:transparent;}
.field .qg-password-toggle:hover{color:var(--text);}
.field .qg-password-toggle:focus-visible{outline:2px solid var(--accent);border-color:transparent;}
.btn{width:100%;min-height:48px;padding:14px;background:var(--primary);color:var(--primary-text);border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;transition:filter 0.15s;}
.btn:not(:disabled):hover{filter:brightness(1.06);}
.btn:focus-visible{outline:2px solid color-mix(in srgb,var(--primary) 40%,transparent);outline-offset:2px;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.msg{padding:12px 14px;border-radius:12px;font-size:13.5px;margin-bottom:16px;display:none;line-height:1.5;}
.msg.error{background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 35%,transparent);color:var(--danger);}
.msg.ok{background:var(--money-soft);border:1px solid color-mix(in srgb,var(--green) 35%,transparent);color:var(--green);}
.back{display:block;text-align:center;margin-top:18px;font-size:13.5px;font-weight:600;color:var(--text-muted);text-decoration:none;transition:color 0.15s;}
.back:hover{color:var(--primary);}
</style>
<link rel="stylesheet" href="qg-tokens.css?v=20260811light1" id="qg-tokens-css">
</head>
<body>
<div class="card">
  <div class="logo">SwiftGigs</div>
  <h1 class="title">Set a new password</h1>
  <p class="sub" id="pageSub">Choose a strong password for your SwiftGigs account.</p>
  <div class="msg error" id="errorMsg"></div>
  <div class="msg ok" id="okMsg"></div>
  <form id="resetForm">
    <div class="field">
      <label>New password</label>
      <input type="password" id="password" placeholder="At least 8 characters" required minlength="8">
    </div>
    <div class="field">
      <label>Confirm password</label>
      <input type="password" id="confirmPassword" placeholder="Repeat password" required minlength="8">
    </div>
    <button type="submit" class="btn" id="submitBtn">Update password</button>
  </form>
  <a class="back" href="login.html">← Back to log in</a>
</div>

<script src="qg-utils.js?v=20260728welcome1"></script>
<script>
attachPasswordToggle('password');
attachPasswordToggle('confirmPassword');
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbYJxU-3r7qVMqwzXHiC-qRkZNtmGobm0",
  authDomain: "quickgigs-7b12d.firebaseapp.com",
  projectId: "quickgigs-7b12d",
  storageBucket: "quickgigs-7b12d.firebasestorage.app",
  messagingSenderId: "698985399366",
  appId: "1:698985399366:web:8a3ca60c5f3ffac84bb647"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const params = new URLSearchParams(window.location.search);
const mode = params.get('mode');
const oobCode = params.get('oobCode');

const errorMsg = document.getElementById('errorMsg');
const okMsg = document.getElementById('okMsg');
const form = document.getElementById('resetForm');
const submitBtn = document.getElementById('submitBtn');

function showError(text) {
  errorMsg.textContent = text;
  errorMsg.style.display = 'block';
  okMsg.style.display = 'none';
}

function showOk(text) {
  okMsg.textContent = text;
  okMsg.style.display = 'block';
  errorMsg.style.display = 'none';
}

if (!oobCode || mode !== 'resetPassword') {
  showError('This reset link is invalid or has expired. Request a new one from the log in page.');
  form.style.display = 'none';
  submitBtn.disabled = true;
} else {
  verifyPasswordResetCode(auth, oobCode).then(function(email) {
    document.getElementById('pageSub').textContent = 'Reset password for ' + email;
  }).catch(function() {
    showError('This reset link is invalid or has expired. Request a new one from the log in page.');
    form.style.display = 'none';
  });
}

form.addEventListener('submit', async function(e) {
  e.preventDefault();
  errorMsg.style.display = 'none';
  okMsg.style.display = 'none';

  var password = document.getElementById('password').value;
  var confirm = document.getElementById('confirmPassword').value;
  if (password.length < 8) {
    showError('Password must be at least 8 characters.');
    return;
  }
  if (password !== confirm) {
    showError('Passwords do not match.');
    return;
  }

  submitBtn.textContent = 'Updating...';
  submitBtn.disabled = true;

  try {
    await confirmPasswordReset(auth, oobCode, password);
    showOk('Password updated! Redirecting to log in...');
    form.style.display = 'none';
    setTimeout(function() { window.location.href = 'login.html'; }, 2000);
  } catch (err) {
    showError('Could not reset password. The link may have expired — request a new one.');
    submitBtn.textContent = 'Update password';
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
