<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SwiftGigs — Browse Categories in Canada</title>
<meta name="description" content="Explore task categories on SwiftGigs — errands, home, beauty, tutoring, and more across Canada.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="qg-layout.css">
<link rel="stylesheet" href="qg-role-theme.css?v=20260811tokens1">
<link rel="stylesheet" href="qg-tokens.css?v=20260811light1" id="qg-tokens-css">
<link rel="stylesheet" href="qg-brand.css">
<link rel="stylesheet" href="qg-mobile.css">
<link rel="stylesheet" href="qg-features.css?v=20260726contrast">
<link rel="stylesheet" href="qg-swift.css">
<script src="qg-brand-init.js"></script>
<script>document.documentElement.setAttribute('data-qg-mode','worker');</script>
<style>
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:76px;}
.nav{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.nav-logo{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;font-size:18px;}
.nav-right{display:flex;align-items:center;gap:10px;}
.mode-btn{padding:6px 13px;border-radius:100px;font-size:11.5px;font-weight:600;cursor:pointer;border:1px solid var(--border);font-family:'DM Sans',sans-serif;background:var(--surface-alt);color:var(--text);transition:border-color .15s;}
.mode-btn:hover{border-color:var(--teal);}
.back-link{color:var(--teal);text-decoration:none;font-size:13.5px;font-weight:600;}
/* Page header (overrides qg-features.css old-palette hero) */
.qg-page-hero{padding:20px 16px 4px;}
.qg-page-kicker{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:6px;}
.qg-page-title{font-family:'DM Sans',sans-serif;font-style:normal;font-size:21px;font-weight:700;line-height:1.25;color:var(--text);margin-bottom:4px;}
.qg-page-sub{font-size:13px;line-height:1.5;color:var(--text-muted);max-width:520px;}
/* Category tiles */
.qg-cat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px 16px 24px;}
@media (min-width:540px){.qg-cat-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
.qg-cat-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 12px;border-radius:14px;text-decoration:none;color:var(--text);border:1px solid var(--border);background:var(--surface);box-shadow:none;transition:border-color .15s,background .15s;}
.qg-cat-card:hover{transform:none;border-color:var(--teal);box-shadow:none;}
.qg-cat-card:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
body.light .qg-cat-card{box-shadow:none;}
.qg-cat-icon{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:var(--surface-alt);font-size:18px;line-height:1;margin-bottom:6px;flex-shrink:0;}
.qg-cat-icon svg{width:18px;height:18px;}
.qg-cat-name{font-size:13px;font-weight:600;color:var(--text);}
.qg-cat-count{font-size:11px;line-height:1.4;color:var(--text-muted);}
.qg-cat-count:nth-of-type(3){font-weight:600;}
.qg-empty-discovery{grid-column:1/-1;text-align:center;padding:48px 24px;font-size:13px;color:var(--text-muted);}
.qg-empty-discovery span{display:block;margin:0 auto 10px;font-size:16px;color:var(--teal);}
</style>
</head>
<body>
<script src="qg-theme.js"></script>
<nav class="nav">
  <a class="back-link" href="dashboard.html" aria-label="Back to dashboard">← Home</a>
  <div class="nav-brand"><span class="nav-logo sg-wordmark">SwiftGigs</span></div>
  <div class="nav-right">
    <button class="mode-btn" id="modeBtn" onclick="toggleTheme()">Light</button>
  </div>
</nav>

<div class="qg-page-hero">
  <p class="qg-page-kicker">Discover</p>
  <h1 class="qg-page-title">Browse by category</h1>
  <p class="qg-page-sub">Find gigs that match your skills — or post a task in any category as a poster.</p>
</div>

<div class="qg-cat-grid" id="catGrid" aria-live="polite">
  <div class="qg-empty-discovery"><span data-qg-ico="clock" data-qg-ico-size="16"></span>Loading categories…</div>
</div>

<nav class="tab-bar" id="qgTabBar"></nav>

<script src="qg-nav.js"></script>
<script src="qg-config.js"></script>
<script src="qg-categories.js"></script>
<script src="qg-icons.js"></script>
<script src="qg-pwa.js?v=947d37a-1789577525"></script>
<script src="supabase-db.js?v=20260827chat1"></script>
<script>
if (typeof renderQuickGigsTabBar === 'function') renderQuickGigsTabBar('browse');
else {
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof renderQuickGigsTabBar === 'function') renderQuickGigsTabBar('browse');
  });
}

var isDark = typeof QG_isDarkTheme === 'function' ? QG_isDarkTheme() : (localStorage.getItem('qg-theme') !== 'light');
function applyTheme() {
  if (typeof window.QG_applyTheme === 'function') window.QG_applyTheme(isDark, 'modeBtn', false);
  else document.body.classList.toggle('light', !isDark);
}
window.toggleTheme = function () {
  isDark = !isDark;
  if (typeof QG_setThemeDark === 'function') QG_setThemeDark(isDark);
  else localStorage.setItem('qg-theme', isDark ? 'dark' : 'light');
  applyTheme();
};
applyTheme();

// Category id -> qg-icons.js key. Kept local to this page until qg-categories.js
// grows an iconKey field of its own (that file is Cursor's zone, see AGENTS.md).
var QG_CAT_ICON_KEYS = {
  errands: 'car', home: 'home', tutoring: 'graduationCap', beauty: 'scissors',
  moving: 'truck', cooking: 'pot', tech: 'laptop', care: 'heart',
  gardening: 'leaf', events: 'party', trades: 'wrench', other: 'package'
};
function qgCatIconKey(catId) {
  return QG_CAT_ICON_KEYS[(catId || '').toLowerCase()] || 'package';
}

async function loadCategoryCounts() {
  var counts = {};
  try {
    var tasks = typeof getTasks === 'function' ? await getTasks() : [];
    (tasks || []).forEach(function (t) {
      var st = String(t.status || t.STATUS || '').toLowerCase();
      if (st && st !== 'open') return;
      var cat = String(t.category || t.CATEGORY || 'other').toLowerCase();
      counts[cat] = (counts[cat] || 0) + 1;
    });
  } catch (e) {
    console.warn('Category counts:', e);
  }

  var grid = document.getElementById('catGrid');
  var cats = window.QG_CATEGORIES || [];
  grid.innerHTML = cats.map(function (c) {
    var n = counts[c.id] || 0;
    var countTxt = n ? n + ' open task' + (n !== 1 ? 's' : '') : 'No open tasks yet';
    var iconMark = typeof qgIcon === 'function' ? qgIcon(qgCatIconKey(c.id), { size: 24 }) : c.icon;
    return '<a class="qg-cat-card" href="browsetask.html?cat=' + encodeURIComponent(c.id) + '">' +
      '<span class="qg-cat-icon" style="color:var(--teal)" aria-hidden="true">' + iconMark + '</span>' +
      '<span class="qg-cat-name">' + c.label + '</span>' +
      '<span class="qg-cat-count">' + countTxt + '</span>' +
      '<span class="qg-cat-count">' + (c.desc || '') + '</span>' +
    '</a>';
  }).join('');
}

loadCategoryCounts();
</script>
</body>
</html>
