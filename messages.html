<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Messages — SwiftGigs</title>
<meta name="description" content="Your SwiftGigs conversations with posters and taskers.">
<meta name="robots" content="noindex,nofollow">

<!-- Data, auth and logic only. -->

<body class="sg-app">
<div class="sg-screen has-tabs">
  <main class="sg-body" style="padding-top:28px">
    <div class="sg-title-row"><h1 class="sg-h1 bold">Messages</h1><button class="sg-sq purple" id="sgSearchBtn" aria-label="Search conversations"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button></div>
    <label class="sg-card sg-search" id="sgSearchBox" hidden><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" id="sgSearchInput" placeholder="Search conversations"></label>
    <div id="sgThreadList" style="margin-top:8px"></div>
  </main>
  <nav class="sg-tabs" id="sgTabs" aria-label="Main">
  <a href="dashboard.html"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11L12 3.5 20.5 11"/><path d="M5.5 9.5V20h5v-6h3v6h5V9.5"/></svg>Home</a>
  <a href="browsetask.html"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Gigs</a>
  <a href="messages.html" class="on" aria-current="page"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H6l-3 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>Messages</a>
  <a href="profile.html"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/></svg>Profile</a>
</nav>
</div>

<!-- An open conversation. The design has no screen for it, so it is built from
     the same primitives and shown as a full sheet over the inbox. -->
<div class="sg-sheet" id="sgChat" aria-hidden="true">
  <div class="sg-sheet-panel full" role="dialog" aria-modal="true" aria-labelledby="sgChatName" style="padding:0;display:flex;flex-direction:column;overflow:hidden">
    <div class="sg-topbar" style="gap:12px">
      <button class="sg-sq" id="sgChatBack" aria-label="Back to messages"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <a class="sg-person" id="sgChatPeer" style="margin:0;flex:1;min-width:0"><span class="sg-avatar" id="sgChatAvatar">U</span><span style="min-width:0"><b id="sgChatName">Chat</b><span id="sgChatTask">SwiftGigs chat</span></span></a>
      <button class="sg-sq" id="sgChatReport" aria-label="Report or block"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="19" r="1.3" fill="currentColor"/></svg></button>
    </div>
    <div class="sg-chat" id="sgChatScroll"></div>
    <div class="sg-chat-note" id="sgChatSafety" hidden></div>
    <div class="sg-chat-note" id="sgChatLocked" hidden></div>
    <div class="sg-chat-note is-error" id="sgChatError" hidden></div>
    <div class="sg-composer" id="sgComposer">
      <button class="sg-sq" id="sgAttach" aria-label="Send a photo"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 2-2 5 5"/></svg></button>
      <textarea id="sgMsgInput" rows="1" placeholder="Message" aria-label="Message"></textarea>
      <button class="sg-sq purple" id="sgSend" aria-label="Send"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 8 6 8-16-8z"/></svg></button>
      <input type="file" id="sgChatImage" accept="image/jpeg,image/png,image/webp" hidden>
    </div>
  </div>
</div>

<div id="sgToast" class="sg-toast" role="status" aria-live="polite" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyBbYJxU-3r7qVMqwzXHiC-qRkZNtmGobm0",
  authDomain: "quickgigs-7b12d.firebaseapp.com",
  projectId: "quickgigs-7b12d",
  storageBucket: "quickgigs-7b12d.firebasestorage.app",
  messagingSenderId: "698985399366",
  appId: "1:698985399366:web:8a3ca60c5f3ffac84bb647"
};
const auth = getAuth(initializeApp(firebaseConfig));
let authChecked = false;
const redirectTimeout = setTimeout(() => {
  if (!authChecked) window.location.href = 'login.html';
}, 3000);
onAuthStateChanged(auth, (user) => {
  authChecked = true;
  clearTimeout(redirectTimeout);
  if (!user) { window.location.href = 'login.html'; return; }
  window._currentUser = user;
  if (typeof enforceBanOnLogin === 'function') enforceBanOnLogin(user);
  if (typeof window.SG_onUser === 'function') window.SG_onUser(user);
});
</script>

<script>
/* ──────────────────────────────────────────────────────────────────────────
   Messages. The inbox is Claude outputs/sg-design/templates/messages.html;
   the chat engine is carried over from messages-legacy.html.
   ────────────────────────────────────────────────────────────────────────── */
(function () {
  'use strict';

  var AVATAR_GRADIENTS = [
    'linear-gradient(135deg,#7c3aed,#2dd4bf)', 'linear-gradient(135deg,#2dd4bf,#0ea5e9)',
    'linear-gradient(135deg,#f59e0b,#ef4444)', 'linear-gradient(135deg,#10b981,#84cc16)',
    'linear-gradient(135deg,#6366f1,#ec4899)'
  ];

  var allConversations = [], conversations = [], filtered = [], messages = [];
  var currentUserId = null, selectedId = '', currentConv = null;
  var currentPeer = { uid: '', name: '' };
  var currentUnlocked = false, fraudDetected = false, isUploading = false;
  var userAvatars = {}, pollTimer = null, lastMarkedReadId = '', lightboxBound = false;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return typeof escapeHtml === 'function' ? escapeHtml(s)
      : String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function toast(msg, ok) {
    var el = $('sgToast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'sg-toast' + (ok ? ' is-ok' : ' is-error');
    el.hidden = false;
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.hidden = true; }, 5000);
  }
  function setChatError(msg) {
    var el = $('sgChatError');
    if (!el) return;
    el.textContent = msg || '';
    el.hidden = !msg;
  }

  // ── Formatting (carried over) ─────────────────────────────────────────────
  function avatarGradient(name) {
    var n = 0;
    for (var i = 0; i < (name || '').length; i++) n += name.charCodeAt(i);
    return AVATAR_GRADIENTS[n % AVATAR_GRADIENTS.length];
  }
  function imagePreview(body) {
    return (typeof isChatImageBody === 'function' && isChatImageBody(body)) ? 'Photo' : String(body || '');
  }
  function relTime(iso) {
    if (!iso) return '';
    var mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 1) return 'Now';
    if (mins < 60) return mins + 'm';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h';
    var days = Math.floor(hrs / 24);
    if (days === 1) return 'Yesterday';
    if (days < 7) return new Date(iso).toLocaleDateString('en-US', { weekday: 'short' });
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  function formatClock(iso) {
    // en-US to match the rest of the app: "4:00 PM", not "16:00" or "4:00 p.m.".
    try { return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }); }
    catch (e) { return ''; }
  }
  function formatDateLabel(iso) {
    try {
      var d = new Date(iso), today = new Date();
      if (d.toDateString() === today.toDateString()) return 'Today';
      var y = new Date(today);
      y.setDate(today.getDate() - 1);
      if (d.toDateString() === y.toDateString()) return 'Yesterday';
      return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    } catch (e) { return ''; }
  }
  function countUnread(conv, userId) {
    var lastRead = String(userId) === String(conv.poster_id) ? conv.poster_last_read_at : conv.worker_last_read_at;
    if (!conv.last_message_at) return 0;
    if (conv.last_sender_id && String(conv.last_sender_id) === String(userId)) return 0;
    if (!lastRead) return conv.last_message && conv.last_message_at ? 1 : 0;
    return new Date(conv.last_message_at) > new Date(lastRead) ? 1 : 0;
  }
  function initials(name) {
    var parts = String(name || 'U').trim().split(/\s+/).slice(0, 2);
    return parts.map(function (p) { return p.charAt(0).toUpperCase(); }).join('') || 'U';
  }
  function avatarHtml(name, url, bg, cls) {
    var safe = url && typeof safeMediaUrl === 'function' ? safeMediaUrl(url) : url;
    if (safe) return '<span class="' + (cls || 'sg-avatar') + '"><img src="' + esc(safe) + '" alt=""></span>';
    return '<span class="' + (cls || 'sg-avatar') + '" style="background:' + bg + ';color:#fff">' + esc(initials(name)) + '</span>';
  }

  function mapConversation(conv, userId) {
    var posterId = conv.poster_id != null ? conv.poster_id : conv.POSTER_ID;
    var workerId = conv.worker_id != null ? conv.worker_id : conv.WORKER_ID;
    var convId = conv.conv_id != null ? conv.conv_id : conv.CONV_ID;
    var taskId = conv.task_id != null ? conv.task_id : conv.TASK_ID;
    var iAmPoster = String(posterId) === String(userId);
    var iAmTasker = String(workerId) === String(userId);
    var otherUid = iAmPoster ? workerId : posterId;
    otherUid = otherUid != null && String(otherUid) !== '' && String(otherUid) !== 'null' ? String(otherUid) : '';
    var otherName = iAmPoster ? (conv.worker_name || 'Tasker') : (conv.poster_name || 'Poster');
    if (typeof isGenericDisplayName === 'function' && isGenericDisplayName(otherName)) {
      otherName = iAmPoster ? 'Tasker' : 'Poster';
    }
    return {
      id: String(convId || ''),
      taskId: taskId,
      posterId: posterId,
      workerId: workerId,
      side: iAmPoster ? 'poster' : (iAmTasker ? 'tasker' : ''),
      otherUid: otherUid,
      name: otherName,
      avatarUrl: otherUid ? (userAvatars[String(otherUid)] || '') : '',
      avatarBg: avatarGradient(otherName),
      taskName: typeof formatTaskDisplayTitle === 'function'
        ? formatTaskDisplayTitle({ title: conv.task_title, category: conv.task_category, created_at: conv.created_at }, taskId)
        : (conv.task_title || 'Task'),
      lastMessage: conv.last_message || 'No messages yet',
      time: relTime(conv.last_message_at || conv.created_at),
      unread: countUnread(conv, userId)
    };
  }

  // ── Inbox ─────────────────────────────────────────────────────────────────
  function renderList() {
    var host = $('sgThreadList');
    if (!host) return;
    if (!filtered.length) {
      host.innerHTML = typeof QG_emptyStateHtml === 'function'
        ? QG_emptyStateHtml({
          icon: 'message',
          title: 'No messages yet',
          sub: 'When you apply or accept a gig, your conversations show up here.',
          action: { label: 'Browse gigs', href: 'browsetask.html' }
        })
        : '<div class="sg-state"><div class="sg-state-title">No messages yet</div></div>';
      return;
    }
    host.innerHTML = filtered.map(function (c) {
      return '<a class="sg-thread" href="messages.html?conv=' + encodeURIComponent(c.id) + '" data-conv="' + esc(c.id) + '">' +
        avatarHtml(c.name, c.avatarUrl, c.avatarBg) +
        '<span class="t"><b>' + esc(c.name) + '</b><span>' + esc(imagePreview(c.lastMessage)) + '</span></span>' +
        '<span class="r"><span class="time">' + esc(c.time) + '</span>' +
        (c.unread > 0 ? '<span class="dot" aria-label="Unread"></span>' : '') +
        '</span></a>';
    }).join('');
  }

  function filterList() {
    var q = (($('sgSearchInput') || {}).value || '').toLowerCase().trim();
    filtered = !q ? conversations.slice() : conversations.filter(function (c) {
      return (c.name || '').toLowerCase().indexOf(q) >= 0 ||
        (c.taskName || '').toLowerCase().indexOf(q) >= 0 ||
        (c.lastMessage || '').toLowerCase().indexOf(q) >= 0;
    });
    renderList();
  }

  async function loadConversations() {
    currentUserId = window._currentUser ? window._currentUser.uid : null;
    var host = $('sgThreadList');
    if (!currentUserId) {
      if (host) host.innerHTML = typeof QG_listSkeletonHtml === 'function'
        ? QG_listSkeletonHtml({ rows: 3, label: 'Signing you in…' }) : '';
      return;
    }
    if (typeof getConversationsForUser !== 'function') {
      if (host && typeof QG_errorStateHtml === 'function') {
        host.innerHTML = QG_errorStateHtml({
          offline: true,
          sub: 'Messaging is not ready yet. Check your connection and try again.',
          retry: { label: 'Try again', onclick: 'location.reload()' }
        });
      }
      return;
    }
    try {
      if (typeof syncCurrentUserProfile === 'function' && window._currentUser) {
        await syncCurrentUserProfile(window._currentUser).catch(function () {});
      }
      var rows = await getConversationsForUser(currentUserId);
      var rule = typeof window.getChatUnlockRule === 'function'
        ? window.getChatUnlockRule()
        : ((window.QG_CONFIG && window.QG_CONFIG.chatUnlockAfter) || 'accept');
      if (rule === 'accept' && typeof forceUnlockConversationForTask === 'function') {
        await Promise.all((rows || []).map(function (c) {
          if (c.is_unlocked && String(c.status || '').toLowerCase() !== 'application') return Promise.resolve();
          return forceUnlockConversationForTask(c, 'in_progress').catch(function () {});
        }));
        rows = await getConversationsForUser(currentUserId);
      }
      if (typeof getUsersAvatarMap === 'function') {
        userAvatars = await getUsersAvatarMap().catch(function () { return {}; });
      }
      var enriched = typeof enrichConversationNames === 'function'
        ? await Promise.all((rows || []).map(function (c) { return enrichConversationNames(c); }))
        : (rows || []);
      // Intentional: the inbox is NOT filtered by poster/tasker workspace mode.
      allConversations = enriched.map(function (c) { return mapConversation(c, currentUserId); })
        .filter(function (c) { return !!c.side; });
      conversations = allConversations.slice();
      filterList();

      var params = new URLSearchParams(window.location.search);
      var deepConv = params.get('conv') || '';
      if (deepConv) await openConversation(deepConv);
      else if (params.get('task') || params.get('peer')) {
        await resolveAndOpen(params.get('task') || '', params.get('peer') || params.get('with') || '');
      }
    } catch (err) {
      console.error('[SwiftGigs messages] load failed', err);
      if (host && !conversations.length && typeof QG_errorStateHtml === 'function') {
        host.innerHTML = QG_errorStateHtml({
          offline: true,
          retry: { label: 'Try again', onclick: 'SG_reloadConversations()' }
        });
      }
    }
  }
  window.SG_reloadConversations = loadConversations;

  async function resolveAndOpen(taskId, peer) {
    try {
      var hit = conversations.filter(function (c) {
        if (taskId && String(c.taskId) !== String(taskId)) return false;
        if (!peer) return true;
        return String(c.otherUid) === String(peer) || String(c.posterId) === String(peer) ||
          String(c.workerId) === String(peer);
      })[0];
      if (hit) return await openConversation(hit.id);
      if (taskId && peer && typeof getConversationForTask === 'function') {
        var resolved = await getConversationForTask(taskId, currentUserId, peer);
        if (!resolved) resolved = await getConversationForTask(taskId, peer, currentUserId);
        if (resolved && resolved.conv_id) await openConversation(String(resolved.conv_id));
      }
    } catch (err) {
      console.error('[SwiftGigs messages] deep link failed', err);
    }
  }

  // ── Chat ──────────────────────────────────────────────────────────────────
  function setChatOpen(open) {
    var sheet = $('sgChat');
    sheet.classList.toggle('open', !!open);
    sheet.setAttribute('aria-hidden', open ? 'false' : 'true');
    document.body.style.overflow = open ? 'hidden' : '';
    if (!open) {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      selectedId = '';
      try {
        var u = new URL(window.location.href);
        ['conv', 'task', 'peer'].forEach(function (k) { u.searchParams.delete(k); });
        window.history.replaceState({}, '', u.pathname + (u.searchParams.toString() ? '?' + u.searchParams.toString() : ''));
      } catch (e) {}
    }
  }

  function updateUrl(convId, taskId, peer) {
    try {
      var u = new URL(window.location.href);
      u.searchParams.set('conv', convId);
      if (taskId != null && String(taskId) !== '') u.searchParams.set('task', String(taskId));
      else u.searchParams.delete('task');
      if (peer) u.searchParams.set('peer', peer);
      else u.searchParams.delete('peer');
      window.history.replaceState({}, '', u.pathname + '?' + u.searchParams.toString());
    } catch (e) {}
  }

  function peerProfileHref(uid) {
    if (!uid) return '';
    var back = window.location.pathname.split('/').pop() + window.location.search;
    return 'profile.html?user_id=' + encodeURIComponent(String(uid)) + '&from=' + encodeURIComponent(back);
  }

  function paintThreadHeader(meta) {
    if (!meta) return;
    $('sgChatName').textContent = meta.name || 'Chat';
    $('sgChatTask').textContent = meta.taskName || 'SwiftGigs chat';
    var href = peerProfileHref(meta.otherUid || currentPeer.uid || '');
    var link = $('sgChatPeer');
    if (href) link.setAttribute('href', href);
    else link.removeAttribute('href');
    var av = $('sgChatAvatar');
    var url = meta.avatarUrl && typeof safeMediaUrl === 'function' ? safeMediaUrl(meta.avatarUrl) : meta.avatarUrl;
    if (url) av.innerHTML = '<img src="' + esc(url) + '" alt="">';
    else {
      av.textContent = initials(meta.name);
      av.style.background = meta.avatarBg || avatarGradient(meta.name);
      av.style.color = '#fff';
    }
  }

  function showSafetyBanner() {
    var banner = $('sgChatSafety');
    if (!banner || !currentUserId) return;
    var key = 'qg-chat-safety-seen:' + currentUserId;
    var seen = false;
    try { seen = localStorage.getItem(key) === '1'; } catch (e) {}
    if (seen) { banner.hidden = true; return; }
    /* Not getMessagesBannerCopy(): that explains the unlock rule ("Once a worker
       is accepted, you can message each other here"), which reads wrong inside a
       chat that is already open. The locked state below carries that message. */
    banner.textContent = 'Keep contact and payment details on SwiftGigs — that is what protects you. Tap to dismiss.';
    banner.hidden = false;
    banner.onclick = function () {
      try { localStorage.setItem(key, '1'); } catch (e) {}
      banner.hidden = true;
    };
  }

  async function openConversation(convId) {
    if (!convId) return;
    try {
      if (String(selectedId) !== String(convId)) lastMarkedReadId = '';
      selectedId = String(convId);
      renderList();
      setChatOpen(true);
      setChatError('');

      var meta = conversations.filter(function (c) { return String(c.id) === String(selectedId); })[0];
      paintThreadHeader(meta);
      $('sgChatScroll').innerHTML = typeof QG_spinnerHtml === 'function'
        ? QG_spinnerHtml({ label: 'Loading messages…' }) : '';
      $('sgChatLocked').hidden = true;
      $('sgComposer').hidden = false;

      if (typeof getConversation !== 'function') {
        $('sgChatScroll').innerHTML = '<div class="sg-chat-sys">Still loading. Try again in a moment.</div>';
        return;
      }

      currentConv = await getConversation(selectedId, { actorId: currentUserId });
      if (!currentConv) {
        await new Promise(function (r) { setTimeout(r, 120); });
        currentConv = await getConversation(selectedId, { actorId: currentUserId });
      }
      if (!currentConv) {
        $('sgChatScroll').innerHTML = '<div class="sg-chat-sys">Conversation not found.</div>';
        return;
      }

      var isPoster = String(currentConv.poster_id) === String(currentUserId);
      var otherUid = isPoster ? currentConv.worker_id : currentConv.poster_id;
      var otherName = isPoster ? (currentConv.worker_name || 'Tasker') : (currentConv.poster_name || 'Poster');
      currentPeer = { uid: otherUid ? String(otherUid) : '', name: otherName || 'User' };

      if (!meta) {
        meta = {
          id: selectedId, name: otherName, otherUid: currentPeer.uid, taskId: currentConv.task_id,
          taskName: currentConv.task_title || 'Task',
          avatarUrl: currentPeer.uid ? (userAvatars[currentPeer.uid] || '') : '',
          avatarBg: avatarGradient(otherName)
        };
      }
      paintThreadHeader(meta);
      updateUrl(selectedId, currentConv.task_id, currentPeer.uid);
      showSafetyBanner();

      var paymentGated = typeof window.isChatPaymentGated === 'function'
        ? window.isChatPaymentGated()
        : !!(window.QG_CONFIG && window.QG_CONFIG.paymentsEnabled && window.QG_CONFIG.chatUnlockAfter === 'payment');
      var unlocked = !paymentGated && String(currentConv.status || '').toLowerCase() !== 'application';
      if (typeof parseConversationUnlocked === 'function' && parseConversationUnlocked(currentConv)) unlocked = true;
      currentUnlocked = unlocked;

      $('sgComposer').hidden = !unlocked;
      $('sgChatLocked').hidden = unlocked;
      if (!unlocked) $('sgChatLocked').textContent = 'Chat unlocks after the application is accepted.';

      await refreshMessages({ forceScroll: true });
      startPolling();
    } catch (err) {
      console.error('[SwiftGigs messages] open failed', err);
      setChatError('Could not open this conversation.');
    }
  }

  function mapMessageRow(m) {
    var sender = m.sender_id || m.SENDER_ID || '';
    // The data layer stores message text in `body` (SELECT_MESSAGES), not message/text.
    var text = m.body != null ? m.body
      : (m.BODY != null ? m.BODY
        : (m.message != null ? m.message
          : (m.MESSAGE != null ? m.MESSAGE : (m.text != null ? m.text : ''))));
    text = String(text == null ? '' : text);
    var isImage = typeof isChatImageBody === 'function' && isChatImageBody(text);
    if (typeof sanitizeDisplayText === 'function' && !isImage) text = sanitizeDisplayText(text);
    var created = m.created_at || m.CREATED_AT || '';
    var isSystem = !!(m.is_system || m.IS_SYSTEM || sender === 'system');
    return {
      id: String(m.message_id || m.MESSAGE_ID || m.id || m.ID || ''),
      senderId: String(sender || ''),
      from: isSystem ? 'system' : (String(sender) === String(currentUserId) ? 'me' : 'them'),
      text: text,
      isImage: isImage,
      senderIsPoster: !!(currentConv && String(sender) === String(currentConv.poster_id)),
      isSystem: isSystem,
      ts: created ? new Date(created).getTime() : 0,
      date: formatDateLabel(created),
      clock: formatClock(created)
    };
  }

  async function refreshMessages(opts) {
    opts = opts || {};
    if (!selectedId || typeof getMessagesForConversation !== 'function') return;
    try {
      var rows = await getMessagesForConversation(selectedId, { actorId: currentUserId, trusted: true });
      messages = (rows || []).map(mapMessageRow);
      if (typeof hydrateChatImageSignedUrls === 'function') await hydrateChatImageSignedUrls(messages);
      var near = isNearBottom();
      renderMessages();
      if (opts.forceScroll || near) scrollToBottom();

      var last = null;
      for (var i = messages.length - 1; i >= 0; i--) {
        if (!messages[i].isSystem) { last = messages[i]; break; }
      }
      if (last) {
        conversations.forEach(function (c) {
          if (String(c.id) === String(selectedId)) {
            c.lastMessage = imagePreview(last.text);
            c.time = 'Now';
            c.unread = 0;
          }
        });
        filterList();
        if (last.from === 'them' && last.id && last.id !== lastMarkedReadId &&
            typeof markConversationRead === 'function') {
          lastMarkedReadId = last.id;
          markConversationRead(selectedId, currentUserId, currentConv && currentConv.poster_id)
            .catch(function () { lastMarkedReadId = ''; });
        }
      }
      setChatError('');
    } catch (err) {
      console.error('[SwiftGigs messages] refresh failed', err);
      setChatError('Messages could not refresh.');
    }
  }

  function messageBodyHtml(m) {
    if (m.isImage) {
      var caption = m.senderIsPoster ? 'Reference photo' : 'Progress photo';
      var signed = m.chatImageSignedUrl || '';
      var safe = signed && typeof safeMediaUrl === 'function' ? safeMediaUrl(signed) : signed;
      if (safe) {
        return '<img class="qg-modal-photo-tap" src="' + esc(safe) + '" alt="' + esc(caption) + '"' +
          ' data-photo="' + esc(safe) + '" data-photo-caption="' + esc(caption) + '">';
      }
      return esc(caption + ' — unavailable');
    }
    var body = String(m.text == null ? '' : m.text);
    // Never leave an empty bubble: earlier builds blanked text on a field mismatch.
    return body.trim() ? esc(body) : '&nbsp;';
  }

  function renderMessages() {
    var scroll = $('sgChatScroll');
    if (!scroll) return;
    if (!messages.length) {
      scroll.innerHTML = typeof QG_emptyStateHtml === 'function'
        ? QG_emptyStateHtml({ icon: 'message', title: 'No messages yet', sub: 'Say hi — keep plans on SwiftGigs.', compact: true })
        : '<div class="sg-chat-sys">No messages yet.</div>';
      return;
    }
    var lastDate = '', html = '', prevFrom = '', prevTs = 0;
    messages.forEach(function (m, idx) {
      if (m.isSystem) {
        html += '<div class="sg-chat-sys">' + esc(m.text) + '</div>';
        prevFrom = ''; prevTs = 0;
        return;
      }
      if (m.date !== lastDate) {
        html += '<div class="sg-chat-date">' + esc(m.date) + '</div>';
        lastDate = m.date; prevFrom = ''; prevTs = 0;
      }
      var ts = m.ts || 0;
      var j = idx + 1;
      var next = messages[j];
      while (next && next.isSystem) { j += 1; next = messages[j]; }
      var nextSame = next && next.from === m.from && next.date === m.date && next.ts && (next.ts - ts) < 120000;
      var grouped = prevFrom === m.from && prevTs && (ts - prevTs) < 120000;
      html += '<div class="sg-row ' + (m.from === 'me' ? 'mine' : 'theirs') + (grouped ? ' grouped' : '') + '"' +
        (m.from === 'them' ? ' data-msg="' + esc(m.id) + '"' : '') + '>' +
        '<div class="sg-bubble' + (m.isImage ? ' is-image' : '') + '">' + messageBodyHtml(m) + '</div>' +
        (!nextSame ? '<div class="sg-bubble-time">' + esc(m.clock || '') + '</div>' : '') +
        '</div>';
      prevFrom = m.from; prevTs = ts;
    });
    scroll.innerHTML = html;
    if (!lightboxBound && typeof bindQgPhotoLightbox === 'function') {
      bindQgPhotoLightbox(scroll, '.sg-bubble img.qg-modal-photo-tap');
      lightboxBound = true;
    }
  }

  function isNearBottom() {
    var s = $('sgChatScroll');
    if (!s) return true;
    return (s.scrollHeight - s.scrollTop - s.clientHeight) < 90;
  }
  function scrollToBottom() {
    var s = $('sgChatScroll');
    if (s) s.scrollTop = s.scrollHeight;
  }
  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function () {
      if (selectedId) refreshMessages().catch(function () {});
    }, 4000);
  }

  function analyzeFraudLocal(text) {
    var recent = messages.filter(function (m) { return !m.isSystem && !m.isImage; })
      .slice(-5).map(function (m) { return m.text; });
    if (typeof analyzeOffPlatformContact === 'function') {
      var r = analyzeOffPlatformContact(text, recent, { convId: selectedId, senderId: currentUserId });
      if (r && r.blocked) return r;
    }
    if (typeof moderateText === 'function') {
      var mod = moderateText(text);
      if (mod && mod.blocked) return mod;
    }
    return { blocked: false };
  }

  async function sendMessage() {
    var input = $('sgMsgInput');
    var sendBtn = $('sgSend');
    if (!input || !selectedId || !currentUserId || !currentUnlocked) return;
    var raw = input.value.trim();
    var text = typeof sanitizeInput === 'function' ? sanitizeInput(raw, 2000) : raw;
    if (!text || fraudDetected) return;

    var check = analyzeFraudLocal(text);
    if (check.blocked) {
      fraudDetected = true;
      setChatError(check.message || 'This message cannot be sent. Keep conversations on SwiftGigs.');
      sendBtn.disabled = true;
      return;
    }

    messages.push({
      id: 'pending-' + Date.now(), senderId: currentUserId, from: 'me', text: text, isImage: false,
      senderIsPoster: !!(currentConv && String(currentConv.poster_id) === String(currentUserId)),
      isSystem: false, ts: Date.now(), date: 'Today', clock: formatClock(new Date().toISOString())
    });
    renderMessages();
    scrollToBottom();
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    var recent = messages.filter(function (m) { return m.from === 'me'; }).slice(-5).map(function (m) { return m.text; });
    var result = typeof sendChatMessage === 'function'
      ? await sendChatMessage(selectedId, currentUserId, text, recent, { convId: selectedId, senderId: currentUserId })
      : { success: false };
    if (!result || !result.success) {
      if (result && (result.blocked || result.error === 'off_platform_contact')) {
        setChatError((result && result.message) || 'Message blocked.');
      } else {
        toast('Could not send. Try again.');
      }
      await refreshMessages({ forceScroll: true });
      sendBtn.disabled = false;
      return;
    }
    setChatError('');
    fraudDetected = false;
    sendBtn.disabled = false;
    await refreshMessages({ forceScroll: true });
    scrollToBottom();
  }

  async function sendChatImage(input) {
    if (!input || isUploading || !selectedId || !currentUserId || !currentUnlocked) return;
    var file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    var allowed = ['image/jpeg', 'image/png', 'image/webp'];
    var maxMb = (window.QG_CONFIG && window.QG_CONFIG.maxPhotoSizeMb) || 5;
    if (allowed.indexOf(file.type) < 0) { setChatError('Choose a JPEG, PNG, or WebP image.'); return; }
    if (file.size > maxMb * 1024 * 1024) { setChatError('Photo must be under ' + maxMb + ' MB.'); return; }
    if (typeof uploadChatPhoto !== 'function' || typeof sendChatMessage !== 'function') {
      setChatError('Photo upload is unavailable right now.');
      return;
    }
    isUploading = true;
    $('sgAttach').disabled = true;
    setChatError('');
    try {
      var upload = await uploadChatPhoto(file, currentUserId, selectedId);
      if (!upload || !upload.success || !upload.path) throw new Error((upload && upload.error) || 'Upload failed');
      var body = (window.CHAT_IMAGE_PREFIX || '[img]') + upload.path;
      messages.push({
        id: 'pending-image-' + Date.now(), senderId: currentUserId, from: 'me', text: body, isImage: true,
        senderIsPoster: !!(currentConv && String(currentConv.poster_id) === String(currentUserId)),
        isSystem: false, ts: Date.now(), date: 'Today', clock: formatClock(new Date().toISOString())
      });
      if (typeof hydrateChatImageSignedUrls === 'function') await hydrateChatImageSignedUrls(messages);
      renderMessages();
      scrollToBottom();
      var result = await sendChatMessage(selectedId, currentUserId, body, [], { convId: selectedId, senderId: currentUserId });
      if (!result || !result.success) throw new Error((result && result.error) || 'Photo could not be sent');
      await refreshMessages({ forceScroll: true });
    } catch (err) {
      console.error('[SwiftGigs messages] image send failed', err);
      setChatError(err && err.message ? err.message : 'Photo upload failed. Try again.');
      await refreshMessages({ forceScroll: true });
    } finally {
      isUploading = false;
      $('sgAttach').disabled = false;
    }
  }

  // ── Wiring ────────────────────────────────────────────────────────────────
  function wire() {
    $('sgSearchBtn').onclick = function () {
      var box = $('sgSearchBox');
      box.hidden = !box.hidden;
      if (!box.hidden) $('sgSearchInput').focus();
      else { $('sgSearchInput').value = ''; filterList(); }
    };
    $('sgSearchInput').addEventListener('input', filterList);

    $('sgThreadList').addEventListener('click', function (e) {
      var row = e.target.closest('[data-conv]');
      if (!row) return;
      e.preventDefault();
      openConversation(row.getAttribute('data-conv'));
    });

    $('sgChatBack').onclick = function () { setChatOpen(false); };
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && $('sgChat').classList.contains('open')) setChatOpen(false);
    });

    var input = $('sgMsgInput');
    input.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
      $('sgSend').disabled = !this.value.trim() || fraudDetected;
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    $('sgSend').onclick = sendMessage;
    $('sgAttach').onclick = function () { $('sgChatImage').click(); };
    $('sgChatImage').addEventListener('change', function () { sendChatImage(this); });

    $('sgChatReport').onclick = function () {
      if (!currentPeer.uid || typeof openReportModal !== 'function') {
        toast('Reporting is unavailable right now.');
        return;
      }
      openReportModal({
        targetType: 'user',
        targetId: currentPeer.uid,
        targetName: currentPeer.name,
        context: '[SwiftGigs chat report] Conversation: ' + selectedId
      });
    };
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  window.SG_onUser = function () {
    if (typeof QG_applyRoleMode === 'function') QG_applyRoleMode();
    loadConversations();
  };

  function boot() {
    wire();
    $('sgSend').disabled = true;
    if (window._currentUser) window.SG_onUser(window._currentUser);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
