<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0b0118;
  --surface:rgba(255,255,255,0.04);
  --surface-hover:rgba(107,63,160,0.08);
  --border:rgba(200,168,233,0.1);
  --text:#fff;
  --text-muted:rgba(255,255,255,0.68);
  --text-faint:rgba(255,255,255,0.62);
  --purple:#6b3fa0;
  --purple-light:#9b6fc4;
  --lavender:#c8a8e9;
  --nav-bg:#0b0118;
  --tab-bg:#0e021f;
  --input-bg:rgba(255,255,255,0.06);
  --input-border:rgba(200,168,233,0.15);
  --unread-preview:#fff;
  --read-preview:rgba(255,255,255,0.62);
}
body.light{
  --bg:#fafafe;
  --surface:#fff;
  --surface-hover:#f5f2ff;
  --border:#f0eeff;
  --text:#2d1b4e;
  --text-muted:#6b6580;
  --text-faint:#6b6580;
  --nav-bg:#fff;
  --tab-bg:#fff;
  --input-bg:#f0eeff;
  --input-border:#e8e2ff;
  --unread-preview:#2d1b4e;
  --read-preview:#6b6580;
  --lavender:#6b3fa0;
}

body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:15px;min-height:100vh;padding-bottom:76px;transition:background 0.25s,color 0.25s;}

body.light .empty-btn,
body.light .conv-badge{color:#2d1b4e;}

/* NAV */
.nav{position:sticky;top:0;z-index:50;background:var(--nav-bg);border-bottom:0.5px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:background 0.25s;}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px 8px 12px;border-radius:999px;
  background:rgba(255,255,255,0.08);border:0.5px solid var(--border);
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;
  text-decoration:none;min-height:40px;flex-shrink:0;
  transition:transform 0.18s,background 0.18s;-webkit-tap-highlight-color:transparent;
}
.back-btn:hover{transform:translateX(-2px);background:rgba(255,255,255,0.12);}
.back-arrow{font-size:18px;line-height:1;}
.back-label{line-height:1;}
body.light .back-btn{background:#f0eeff;color:var(--purple);border-color:#e8e2ff;}
body.light .back-btn:hover{background:#e8e2ff;}
.nav-logo{font-family:'Playfair Display',serif;font-style:italic;font-size:1.25rem;color:var(--lavender);}
.nav-title{font-size:16px;font-weight:500;color:var(--text);flex:1;text-align:center;}
.mode-btn{padding:6px 13px;border-radius:20px;font-size:11px;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);}
body.light .mode-btn{background:#f0eeff;color:var(--purple);}
/* Empty/list sit between sticky header and fixed tab bar — never cover chrome */
#mainContent{min-height:40vh;position:relative;z-index:1;}
.empty-state{min-height:auto;}

/* SEARCH */
.search-wrap{padding:12px 20px;background:var(--nav-bg);border-bottom:0.5px solid var(--border);transition:background 0.25s;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--input-bg);border:0.5px solid var(--input-border);border-radius:14px;padding:11px 15px;transition:border-color 0.2s;}
.search-box:focus-within{border-color:var(--purple-light);}
.search-icon{color:var(--purple-light);opacity:0.5;font-size:15px;}
.search-input{flex:1;background:none;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);}
.search-input::placeholder{color:var(--lavender);opacity:0.35;}
.messages-safety-tip{margin:0;padding:8px 20px 10px;font-size:11px;line-height:1.45;color:var(--text-muted);background:rgba(107,63,160,0.08);border-bottom:0.5px solid var(--border);}
body.light .messages-safety-tip{background:#f5f2ff;color:#5b21b6;}

/* EMPTY STATE */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 40px;text-align:center;}
.empty-icon{font-size:48px;margin-bottom:16px;}
.empty-title{font-size:17px;font-weight:500;color:var(--text);margin-bottom:8px;}
.empty-sub{font-size:14px;color:var(--text-muted);line-height:1.6;margin-bottom:24px;}
.empty-btn{padding:12px 24px;border-radius:14px;background:var(--purple);color:#fff;border:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block;}
body.light .empty-btn{color:#2d1b4e;}

/* SECTION LABEL */
.section-label{padding:14px 20px 8px;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-faint);}

/* CONVERSATION ITEM */
.conv-item{display:flex;align-items:center;gap:14px;padding:14px 20px;cursor:pointer;transition:background 0.15s;text-decoration:none;color:inherit;}
.conv-item:hover{background:var(--surface-hover);}
.conv-item:visited{color:inherit;}
.conv-item+.conv-item{border-top:0.5px solid var(--border);}
.conv-avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;color:#fff;flex-shrink:0;position:relative;background-size:cover;background-position:center;}
.conv-avatar.has-photo{color:transparent;}
body.light .conv-avatar{color:#2d1b4e;}
.unread-dot{width:10px;height:10px;border-radius:50%;background:var(--purple-light);position:absolute;top:1px;right:1px;border:2px solid var(--nav-bg);}
.conv-info{flex:1;min-width:0;}
.conv-name{font-size:14px;font-weight:500;color:var(--text);margin-bottom:2px;}
.conv-task{font-size:11px;color:var(--purple-light);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
body.light .conv-task{color:var(--purple);}
.conv-preview{font-size:12px;color:var(--read-preview);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conv-preview.unread{color:var(--unread-preview);font-weight:500;}
.conv-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.conv-time{font-size:11px;color:var(--text-faint);}
.conv-badge{background:var(--purple);color:#fff;font-size:10px;font-weight:500;border-radius:20px;padding:2px 7px;min-width:20px;text-align:center;}
body.light .conv-badge{color:#2d1b4e;}

/* LOCKED BANNER */
.locked-banner{margin:16px 20px;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;background:rgba(107,63,160,0.12);border:0.5px solid rgba(200,168,233,0.15);}
body.light .locked-banner{background:#f5f2ff;border-color:#e8e2ff;}
.locked-icon{font-size:22px;flex-shrink:0;}
.locked-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px;}
.locked-sub{font-size:12px;color:var(--text-muted);line-height:1.5;}

/* TAB BAR — always visible (empty state only fills #mainContent) */
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:var(--tab-bg);border-top:0.5px solid var(--border);display:flex!important;padding:8px 0 14px;z-index:100;transition:background 0.25s;visibility:visible!important;opacity:1!important;pointer-events:auto;min-height:56px;}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-decoration:none;}
.tab-icon{font-size:22px;color:var(--text-faint);transition:color 0.15s;line-height:1;}
.tab-lbl{font-size:10px;color:var(--text-faint);transition:color 0.15s;}
.tab-item.active .tab-icon,.tab-item.active .tab-lbl{color:var(--purple-light);}
body.light .tab-item.active .tab-icon,body.light .tab-item.active .tab-lbl{color:var(--purple);}
body.page-messages #qgTabBar,
body[data-qg-page="messages"] #qgTabBar{display:flex!important;}
.app-legal-footer{text-align:center;padding:20px 16px 96px;font-size:10px;color:var(--text-faint);line-height:1.75;}
.app-legal-footer a{color:var(--purple-light);text-decoration:none;}
body.light .app-legal-footer a{color:var(--purple);}

<script>
(function () {
  function paintMessagesTabBar() {
    if (typeof renderQuickGigsTabBar === 'function') {
      renderQuickGigsTabBar('messages');
      return true;
    }
    return false;
  }
  window.paintMessagesTabBar = paintMessagesTabBar;
  function ensureMessagesTabBar() {
    if (paintMessagesTabBar()) return;
    var tries = 0;
    var t = setInterval(function () {
      tries += 1;
      if (paintMessagesTabBar() || tries > 40) clearInterval(t);
    }, 50);
  }
  ensureMessagesTabBar();
  document.addEventListener('DOMContentLoaded', ensureMessagesTabBar);
  window.addEventListener('load', ensureMessagesTabBar);

  var back = document.getElementById('messagesBackBtn');
  if (back) {
    back.addEventListener('click', function (e) {
      try {
        if (window.history.length > 1 && document.referrer && /quickgigs|localhost|127\.0\.0\.1/i.test(document.referrer)) {
          e.preventDefault();
          window.history.back();
        }
      } catch (err) {}
    });
  }
})();
</script>

<script>
// ── THEME (shared qg-theme.js — storage key: localStorage qg-theme) ──
var isDark = typeof QG_isDarkTheme === 'function' ? QG_isDarkTheme() : (localStorage.getItem('qg-theme') !== 'light');
function applyTheme(){
  if (typeof QG_applyTheme === 'function') QG_applyTheme(isDark, 'modeBtn', false);
  else {
    // Fallback: toggle only — never wipe page/role classes
    document.documentElement.classList.toggle('light', !isDark);
    document.body.classList.toggle('light', !isDark);
    var b = document.getElementById('modeBtn');
    if (b) b.textContent = isDark ? '☀️ Light' : '🌙 Dark';
  }
  // Re-assert page + role chrome after theme paint
  document.body.classList.add('page-messages');
  if (typeof applyRoleTheme === 'function') applyRoleTheme();
}
window.toggleTheme = function(){
  isDark = !isDark;
  if (typeof QG_setThemeDark === 'function') QG_setThemeDark(isDark);
  else localStorage.setItem('qg-theme', isDark ? 'dark' : 'light');
  applyTheme();
};
applyTheme();
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', applyTheme);
} else {
  applyTheme();
}

var conversations = [];
var filtered = [];
var userAvatars = {};
var CAT_ICONS = {home:'🏠',errands:'🚗',tutoring:'🎓',beauty:'💇',moving:'🚚',cooking:'🍳',tech:'💻',care:'👶',gardening:'🌿',events:'🎉',trades:'🔧',other:'📦'};
var AVATAR_GRADIENTS = [
  'linear-gradient(135deg,#6b3fa0,#c8a8e9)',
  'linear-gradient(135deg,#16a34a,#4ade80)',
  'linear-gradient(135deg,#d97706,#fbbf24)',
  'linear-gradient(135deg,#9b6fc4,#c8a8e9)',
  'linear-gradient(135deg,#2563eb,#60a5fa)'
];

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function avatarGradient(name){
  var n = 0;
  for(var i = 0; i < (name || '').length; i++) n += name.charCodeAt(i);
  return AVATAR_GRADIENTS[n % AVATAR_GRADIENTS.length];
}

function formatRelativeTime(iso){
  if(!iso) return '';
  var diff = Date.now() - new Date(iso).getTime();
  var mins = Math.floor(diff / 60000);
  if(mins < 1) return 'Just now';
  if(mins < 60) return mins + 'm ago';
  var hrs = Math.floor(mins / 60);
  if(hrs < 24) return hrs + 'hr ago';
  var days = Math.floor(hrs / 24);
  if(days === 1) return 'Yesterday';
  if(days < 7) return days + 'd ago';
  return new Date(iso).toLocaleDateString('en-CA', {month:'short', day:'numeric'});
}

function countUnread(conv, userId){
  var lastRead = userId === conv.poster_id ? conv.poster_last_read_at : conv.worker_last_read_at;
  if(!conv.last_message_at) return 0;
  if(!lastRead) return conv.last_message && conv.last_message_at ? 1 : 0;
  return new Date(conv.last_message_at) > new Date(lastRead) ? 1 : 0;
}

function mapConversation(conv, userId){
  var iAmPoster = String(conv.poster_id) === String(userId);
  var otherUid = iAmPoster ? conv.worker_id : conv.poster_id;
  var otherName = iAmPoster ? (conv.worker_name || 'Tasker') : (conv.poster_name || 'Poster');
  if (typeof isGenericDisplayName === 'function') {
    if (isGenericDisplayName(otherName)) otherName = iAmPoster ? 'Tasker' : 'Poster';
  }
  var cat = (conv.task_category || 'other').toLowerCase();
  return {
    id: conv.conv_id,
    conv_id: conv.conv_id,
    posterId: conv.poster_id,
    workerId: conv.worker_id,
    myRole: iAmPoster ? 'poster' : 'tasker',
    rolePill: iAmPoster ? "You're the poster" : "You're the tasker",
    otherUid: otherUid,
    name: otherName,
    initials: otherName.charAt(0).toUpperCase(),
    avatarUrl: userAvatars[String(otherUid)] || '',
    avatarBg: avatarGradient(otherName),
    taskName: conv.task_title || 'Task',
    taskIcon: CAT_ICONS[cat] || '📦',
    lastMessage: conv.last_message || 'No messages yet',
    time: formatRelativeTime(conv.last_message_at || conv.created_at),
    unread: countUnread(conv, userId),
    status: conv.status === 'application' ? 'in_progress' : (conv.status === 'completed' ? 'completed' : 'in_progress'),
    paid: conv.is_unlocked,
    locked: !conv.is_unlocked
  };
}

function conversationsForCurrentMode(list) {
  var mode = typeof getMode === 'function' ? getMode() : 'poster';
  return (list || []).filter(function (c) {
    return mode === 'tasker' ? c.myRole === 'tasker' : c.myRole === 'poster';
  });
}

async function loadConversations(){
  var userId = window._currentUser ? window._currentUser.uid : null;
  if(!userId) return;
  if (typeof getConversationsForUser !== 'function') {
    document.getElementById('mainContent').innerHTML = '<div class="empty-state"><div class="empty-icon">'+(typeof qgIcon==='function'?qgIcon('alert',{size:24}):'')+'</div><div class="empty-title">Messages failed to load</div><div class="empty-sub">Refresh the page. If this keeps happening, check your connection.</div></div>';
    return;
  }
  if (typeof syncCurrentUserProfile === 'function' && window._currentUser) {
    await syncCurrentUserProfile(window._currentUser);
  }
  var content = document.getElementById('mainContent');
  content.innerHTML = '<div class="empty-state"><div class="empty-icon">'+(typeof qgIcon==='function'?qgIcon('clock',{size:24}):'')+'</div><div class="empty-title">Loading messages...</div></div>';

  try {
    var rows = await getConversationsForUser(userId);
    var rule = typeof window.getChatUnlockRule === 'function'
      ? window.getChatUnlockRule()
      : ((window.QG_CONFIG && window.QG_CONFIG.chatUnlockAfter) || 'accept');
    if (rule === 'payment' && typeof syncConversationUnlock === 'function') {
      var hadLocked = false;
      await Promise.all((rows || []).map(function (c) {
        if (c.is_unlocked) return Promise.resolve();
        hadLocked = true;
        return syncConversationUnlock(c.conv_id, userId).catch(function () {});
      }));
      if (hadLocked) {
        rows = await getConversationsForUser(userId);
      }
    } else if (rule === 'accept' && typeof forceUnlockConversationForTask === 'function') {
      // When Stripe is live, restore the escrow-gated contact rule — chat unlocks only after
      // escrow is funded. Currently gated on acceptance because payments are off.
      var unlockedAny = false;
      await Promise.all((rows || []).map(function (c) {
        if (c.is_unlocked && String(c.status || '').toLowerCase() !== 'application') {
          return Promise.resolve();
        }
        unlockedAny = true;
        return forceUnlockConversationForTask(c, 'in_progress').catch(function () {});
      }));
      if (unlockedAny) {
        rows = await getConversationsForUser(userId);
      }
    }
    if (typeof getUsersAvatarMap === 'function') {
      userAvatars = await getUsersAvatarMap().catch(function() { return {}; });
    }
    var enriched = typeof enrichConversationNames === 'function'
      ? await Promise.all((rows || []).map(function(c) { return enrichConversationNames(c); }))
      : (rows || []);
    conversations = conversationsForCurrentMode(enriched.map(function(c){ return mapConversation(c, userId); }));
    filtered = conversations.slice();
    renderContent();
    if (typeof paintMessagesTabBar === 'function') paintMessagesTabBar();
    else if (typeof renderQuickGigsTabBar === 'function') renderQuickGigsTabBar('messages');
    if (typeof applyRoleTheme === 'function') applyRoleTheme();
    // Keep light/dark in sync after role chrome mutates classes
    if (typeof applyTheme === 'function') applyTheme();
    else if (typeof QG_paintTheme === 'function' && typeof QG_isDarkTheme === 'function') {
      QG_paintTheme(QG_isDarkTheme());
    }
    if (typeof isSupabaseUsingStaleCache === 'function' && isSupabaseUsingStaleCache()) {
      showStaleDataBanner();
    }
  } catch(err) {
    console.error('Failed to load conversations:', err);
    var hint = String(err && err.message || '').indexOf('401') >= 0
      ? 'Session error — hard refresh and log in again.'
      : 'Could not load messages — check your connection and try again.';
    content.innerHTML = '<div class="empty-state"><div class="empty-icon">'+(typeof qgIcon==='function'?qgIcon('alert',{size:24}):'')+'</div><div class="empty-title">Could not load messages</div><div class="empty-sub">'+window.escapeHtml(hint)+'</div></div>';
  }
}

window.loadConversations = loadConversations;
window.onQuickGigsModeChange = function () {
  if (typeof loadConversations === 'function') loadConversations();
  else window.location.reload();
};

function renderContent(){
  var content = document.getElementById('mainContent');

  // No conversations at all
  if(!conversations.length){
    var taskerEmpty = typeof getMode === 'function' && getMode() === 'tasker';
    content.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-icon">'+(typeof qgIcon==='function'?qgIcon('message',{size:24}):'')+'</div>' +
        '<div class="empty-title">No ' + (taskerEmpty ? 'tasker' : 'poster') + ' messages yet</div>' +
        '<div class="empty-sub">' + (taskerEmpty
          ? 'Apply to a task — chats with posters show up here in Tasker mode.'
          : 'Accept an applicant from My Tasks — chats with taskers show up here in Poster mode.') + '</div>' +
        '<a class="empty-btn" href="' + (taskerEmpty ? 'browsetask.html' : 'mytasks.html?tab=posted') + '">' +
          (taskerEmpty ? 'Browse tasks' : 'My posted tasks') + '</a>' +
      '</div>';
    return;
  }

  // Banner — only when chat is payment-gated
  var html = '';
  var rule = (window.QG_CONFIG && window.QG_CONFIG.chatUnlockAfter) || 'accept';
  if (typeof window.getChatUnlockRule === 'function') rule = window.getChatUnlockRule();
  if (rule === 'payment') {
    var bannerCopy = typeof getMessagesBannerCopy === 'function' ? getMessagesBannerCopy() : {
      title: 'Chat locked until payment',
      sub: 'Messaging opens after the poster pays through QuickGigs.'
    };
    html += '<div class="locked-banner">' +
      '<div class="locked-icon">🔒</div>' +
      '<div class="locked-text">' +
        '<div class="locked-title">'+window.escapeHtml(bannerCopy.title)+'</div>' +
        '<div class="locked-sub">'+window.escapeHtml(bannerCopy.sub)+'</div>' +
      '</div>' +
    '</div>';
  }

  // Active conversations
  var active = filtered.filter(function(c){ return c.status === 'in_progress'; });
  var completed = filtered.filter(function(c){ return c.status === 'completed'; });

  if(active.length){
    html += '<div class="section-label">Active tasks</div>';
    html += active.map(renderConvItem).join('');
  }

  if(completed.length){
    html += '<div class="section-label">Completed</div>';
    html += completed.map(renderConvItem).join('');
  }

  content.innerHTML = html;
}

// Profile chips inside thread links — stop navigation to chat, go to profile instead.
(function bindMessagesProfileClicks() {
  var root = document.getElementById('mainContent');
  if (!root || root._qgProfileBound) return;
  root._qgProfileBound = true;
  root.addEventListener('click', function (e) {
    var chip = e.target.closest('[data-profile-href]');
    if (!chip || !root.contains(chip)) return;
    var href = chip.getAttribute('data-profile-href') || '';
    var safe = typeof safeUrl === 'function' ? safeUrl(href) : href;
    if (!safe) return;
    e.preventDefault();
    e.stopPropagation();
    window.location.href = safe;
  });
})();

function chatThreadHref(convId) {
  var id = String(convId || '').trim();
  if (!id || id === 'undefined' || id === 'null') return '';
  return 'chat.html?conv=' + encodeURIComponent(id);
}

function openConversationThread(convId) {
  var href = chatThreadHref(convId);
  if (!href) {
    console.warn('[QuickGigs messages] missing conv id');
    if (typeof showToast === 'function') showToast('Conversation not found — refresh Messages.', '#f59e0b');
    return;
  }
  // Always chat thread — never payment.html / Stripe pay modal.
  window.location.href = href;
}
window.openConversationThread = openConversationThread;
window.chatThreadHref = chatThreadHref;

function renderConvItem(c){
  var convId = c && (c.id || c.conv_id) ? String(c.id || c.conv_id) : '';
  var threadHref = chatThreadHref(convId);
  var profileHref = typeof getProfileUrl === 'function'
    ? getProfileUrl(c.otherUid)
    : ('profile.html?user=' + encodeURIComponent(c.otherUid));
  var avatarInner = typeof renderUserAvatarHtml === 'function'
    ? renderUserAvatarHtml(c.name, c.avatarUrl, { className: 'conv-avatar', gradient: c.avatarBg })
    : ('<div class="conv-avatar" style="background:'+c.avatarBg+'">'+esc(c.initials)+'</div>');
  if (c.unread > 0 && avatarInner.indexOf('unread-dot') < 0) {
    avatarInner = avatarInner.replace('</div>', '<div class="unread-dot"></div></div>');
  }
  // Real <a href> so open works without inline JS and never targets payments.
  if (!threadHref) {
    return '<div class="conv-item" aria-disabled="true" style="opacity:0.65;cursor:default">' +
      '<div class="conv-avatar-link" style="flex-shrink:0">' + avatarInner + '</div>' +
      '<div class="conv-info">' +
        '<div class="conv-name">'+esc(c.name)+'</div>' +
        '<div class="conv-task">'+c.taskIcon+' '+esc(c.taskName)+'</div>' +
        '<div class="conv-preview">Conversation unavailable — refresh</div>' +
      '</div></div>';
  }
  var safeProfile = (typeof safeUrl === 'function' ? safeUrl(profileHref) : profileHref) || 'profile.html';
  return '<a class="conv-item" href="'+esc(threadHref)+'" data-open-conv="'+esc(convId)+'">' +
    '<span class="conv-avatar-link" data-profile-href="'+esc(safeProfile)+'" style="flex-shrink:0;text-decoration:none;cursor:pointer">' +
    avatarInner +
    '</span>' +
    '<div class="conv-info">' +
      '<div class="conv-name"><span class="conv-profile-name" data-profile-href="'+esc(safeProfile)+'" style="color:inherit;text-decoration:none;cursor:pointer">'+esc(c.name)+'</span></div>' +
      '<div class="conv-task">'+c.taskIcon+' '+esc(c.taskName)+'</div>' +
      '<div class="conv-role-pill" style="font-size:10px;color:rgba(200,168,233,0.75);margin-top:2px">'+esc(c.rolePill || '')+'</div>' +
      '<div class="conv-preview'+(c.unread>0?' unread':'')+'">'+esc(c.lastMessage)+'</div>' +
    '</div>' +
    '<div class="conv-right">' +
      '<div class="conv-time">'+esc(c.time)+'</div>' +
      (c.unread > 0 ? '<div class="conv-badge">'+c.unread+'</div>' : getStatusLabel(c.status)) +
    '</div>' +
  '</a>';
}

function getStatusLabel(status){
  if(status==='in_progress') return '<span style="font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(74,222,128,0.12);color:#16a34a;">In progress</span>';
  if(status==='completed')   return '<span style="font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(107,63,160,0.2);color:#9b6fc4;">Completed</span>';
  return '';
}

window.filterConvs = function(){
  var q = document.getElementById('searchInput').value.toLowerCase().trim();
  filtered = !q ? conversations.slice() : conversations.filter(function(c){
    return c.name.toLowerCase().includes(q) || c.taskName.toLowerCase().includes(q);
  });
  renderContent();
};

function showStaleDataBanner() {
  var content = document.getElementById('mainContent');
  if (!content || content.querySelector('.stale-data-banner')) return;
  var banner = document.createElement('div');
  banner.className = 'stale-data-banner locked-banner';
  banner.style.margin = '12px 20px 0';
  banner.innerHTML = '<div class="locked-icon">'+(typeof qgIcon==='function'?qgIcon('alert',{size:24}):'')+'</div><div><div class="locked-title">Showing saved messages</div><div class="locked-sub">Could not reach Supabase. Run supabase/beta-setup-all.sql if tasks and chats keep disappearing after updates.</div></div>';
  content.insertBefore(banner, content.firstChild);
}
</script>
