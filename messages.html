<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Messages — QuickGigs</title>
<meta name="description" content="QuickGigs Messages">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f5f5f7">

<style>
/* ═══════════════════════════════════════════════════════════
   QuickGigs Messages — Apple Messages–inspired web app
   Full-viewport SPA. No site footer / tab bar / homepage chrome.
   ═══════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --im-bg:#f5f5f7;
  --im-sidebar:#ffffff;
  --im-thread:#ffffff;
  --im-hairline:rgba(0,0,0,0.08);
  --im-text:#1d1d1f;
  --im-secondary:#86868b;
  --im-blue:#007aff;
  --im-blue-pressed:#0066d6;
  --im-bubble-in:#e9e9eb;
  --im-bubble-out:#007aff;
  --im-composer:#f5f5f7;
  --im-search:#e8e8ed;
  --im-selected:rgba(0,122,255,0.12);
  --im-sidebar-w:340px;
  --im-radius:18px;
  --im-safe-b:env(safe-area-inset-bottom,0px);
  --im-safe-t:env(safe-area-inset-top,0px);
  --im-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --im-bg:#000000;
    --im-sidebar:#1c1c1e;
    --im-thread:#000000;
    --im-hairline:rgba(255,255,255,0.12);
    --im-text:#f5f5f7;
    --im-secondary:#98989d;
    --im-bubble-in:#3a3a3c;
    --im-composer:#1c1c1e;
    --im-search:#2c2c2e;
    --im-selected:rgba(10,132,255,0.22);
  }
}
html,body{
  height:100%;
  width:100%;
  overflow:hidden;
  font-family:var(--im-font);
  background:var(--im-bg);
  color:var(--im-text);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
/* Kill any injected site chrome */
.site-footer,.app-legal-footer,.qg-trust-footer,.tab-bar,#qgTabBar,
.qg-menu-fab,.qg-help-fab{display:none!important;}

.im-app{
  display:flex;
  height:100dvh;
  height:100vh;
  width:100%;
  max-width:100vw;
  overflow:hidden;
  background:var(--im-bg);
}

/* ── LEFT SIDEBAR ─────────────────────────────────────── */
.im-sidebar{
  width:var(--im-sidebar-w);
  min-width:320px;
  max-width:360px;
  flex:0 0 var(--im-sidebar-w);
  display:flex;
  flex-direction:column;
  background:var(--im-sidebar);
  border-right:0.5px solid var(--im-hairline);
  z-index:2;
}
.im-sidebar-top{
  padding:calc(12px + var(--im-safe-t)) 16px 10px;
  flex-shrink:0;
  background:rgba(255,255,255,0.72);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:0.5px solid var(--im-hairline);
}
@media (prefers-color-scheme: dark){
  .im-sidebar-top{background:rgba(28,28,30,0.78);}
}
.im-sidebar-bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;
}
.im-back-home{
  color:var(--im-blue);text-decoration:none;font-size:15px;font-weight:400;
  display:inline-flex;align-items:center;gap:2px;padding:6px 0;min-height:32px;
}
.im-back-home span{font-size:22px;line-height:1;font-weight:300;}
.im-title{font-size:28px;font-weight:700;letter-spacing:-0.4px;line-height:1.1;}
.im-search{
  display:flex;align-items:center;gap:8px;
  background:var(--im-search);border-radius:10px;padding:8px 12px;
}
.im-search svg{flex-shrink:0;opacity:0.45;}
.im-search input{
  flex:1;border:0;outline:0;background:transparent;font:400 16px/1.3 var(--im-font);
  color:var(--im-text);min-width:0;
}
.im-search input::placeholder{color:var(--im-secondary);}

.im-list{
  flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.im-list::-webkit-scrollbar{width:0;height:0;}

.im-row{
  display:flex;align-items:center;gap:12px;
  width:100%;padding:12px 16px;border:0;background:transparent;cursor:pointer;
  text-align:left;font:inherit;color:inherit;text-decoration:none;
  position:relative;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}
.im-row:active{background:rgba(0,0,0,0.04);}
.im-row.is-active{background:var(--im-selected);}
.im-row+.im-row::before{
  content:'';position:absolute;left:76px;right:0;top:0;height:0.5px;background:var(--im-hairline);
}
.im-avatar{
  width:52px;height:52px;border-radius:50%;flex:0 0 52px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:600;color:#fff;
  background:linear-gradient(145deg,#7a4cb8,#6b3fa0);
}
.im-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.im-row-body{flex:1;min-width:0;}
.im-row-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:3px;}
.im-row-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.im-row-time{font-size:13px;color:var(--im-secondary);flex-shrink:0;}
.im-row-bottom{display:flex;align-items:center;gap:8px;}
.im-row-preview{
  flex:1;min-width:0;font-size:14px;color:var(--im-secondary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.im-row-preview.is-unread{color:var(--im-text);font-weight:500;}
.im-badge{
  min-width:20px;height:20px;padding:0 6px;border-radius:999px;
  background:var(--im-blue);color:#fff;font-size:12px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
}
.im-list-empty,.im-list-loading{
  padding:48px 24px;text-align:center;color:var(--im-secondary);font-size:15px;line-height:1.45;
}
.im-list-empty strong{display:block;color:var(--im-text);font-size:17px;margin-bottom:6px;}

/* ── RIGHT THREAD ─────────────────────────────────────── */
.im-thread{
  flex:1 1 auto;min-width:0;display:flex;flex-direction:column;
  background:var(--im-thread);position:relative;
}
.im-thread-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--im-secondary);padding:40px;text-align:center;
}
.im-thread-empty .glyph{
  width:72px;height:72px;border-radius:22px;background:var(--im-search);
  display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:8px;
}
.im-thread-empty h2{font-size:22px;font-weight:600;color:var(--im-text);}
.im-thread-empty p{font-size:15px;max-width:280px;line-height:1.45;}

.im-thread-hdr{
  display:none;align-items:center;gap:10px;
  padding:10px 14px calc(10px); min-height:56px;
  padding-top:calc(10px + var(--im-safe-t));
  border-bottom:0.5px solid var(--im-hairline);
  background:rgba(255,255,255,0.78);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  flex-shrink:0;z-index:3;
}
@media (prefers-color-scheme: dark){
  .im-thread-hdr{background:rgba(0,0,0,0.72);}
}
.im-app.has-thread .im-thread-hdr{display:flex;}
.im-app.has-thread .im-thread-empty{display:none;}
.im-app.has-thread .im-thread-main{display:flex;}

.im-hdr-back{
  display:none;border:0;background:transparent;color:var(--im-blue);
  font-size:28px;line-height:1;padding:4px 6px;cursor:pointer;font-weight:300;
}
.im-hdr-avatar{
  width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;
  background:linear-gradient(145deg,#7a4cb8,#6b3fa0);
}
.im-hdr-avatar .im-hdr-avatar,
.im-hdr-avatar .im-avatar,
.im-hdr-avatar > div{
  width:36px!important;height:36px!important;min-width:36px!important;min-height:36px!important;
  border-radius:50%!important;
}
.im-hdr-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.im-hdr-meta{flex:1;min-width:0;text-align:center;}
.im-hdr-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.im-hdr-status{font-size:12px;color:var(--im-secondary);margin-top:1px;}
.im-hdr-status.is-online{color:#34c759;}
.im-hdr-actions{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.im-icon-btn{
  width:36px;height:36px;border-radius:50%;border:0;background:transparent;
  color:var(--im-blue);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  font-size:18px;
}
.im-icon-btn:active{opacity:0.6;}
.im-icon-btn:disabled{opacity:0.35;cursor:default;}

.im-thread-main{
  display:none;flex:1 1 auto;min-height:0;flex-direction:column;
}
.im-task-chip{
  display:none;margin:8px 14px 0;padding:8px 12px;border-radius:12px;
  background:var(--im-search);font-size:12px;color:var(--im-secondary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;
}
.im-task-chip.show{display:block;}
.im-task-chip strong{color:var(--im-text);font-weight:600;}

.im-scroll{
  flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 14px 8px;display:flex;flex-direction:column;gap:2px;
}
.im-scroll::-webkit-scrollbar{width:0;}

.im-date{
  align-self:center;font-size:12px;font-weight:500;color:var(--im-secondary);
  margin:12px 0 8px;letter-spacing:0.01em;
}
.im-sys{
  align-self:center;max-width:90%;text-align:center;font-size:12px;line-height:1.4;
  color:var(--im-secondary);padding:6px 10px;margin:6px 0;
}
.im-bubble-row{display:flex;flex-direction:column;max-width:100%;}
.im-bubble-row.mine{align-items:flex-end;}
.im-bubble-row.theirs{align-items:flex-start;}
.im-bubble-row.grouped{margin-top:1px;}
.im-bubble-row:not(.grouped){margin-top:7px;}
.im-bubble{
  max-width:min(78%,420px);padding:8px 14px;font-size:16px;line-height:1.35;
  word-wrap:break-word;overflow-wrap:anywhere;
}
.im-bubble-row.mine .im-bubble{
  background:var(--im-bubble-out);color:#fff;
  border-radius:18px;border-bottom-right-radius:5px;
}
.im-bubble-row.theirs .im-bubble{
  background:var(--im-bubble-in);color:var(--im-text);
  border-radius:18px;border-bottom-left-radius:5px;
}
.im-bubble-row.mine.grouped .im-bubble{border-top-right-radius:5px;border-bottom-right-radius:18px;}
.im-bubble-row.theirs.grouped .im-bubble{border-top-left-radius:5px;border-bottom-left-radius:18px;}
.im-bubble-row.mine.show-time .im-bubble{border-bottom-right-radius:5px;}
.im-bubble-row.theirs.show-time .im-bubble{border-bottom-left-radius:5px;}
.im-bubble-time{
  font-size:11px;color:var(--im-secondary);margin-top:3px;padding:0 6px;
}
.im-typing{display:none;align-self:flex-start;font-size:12px;color:var(--im-secondary);padding:4px 8px;}
.im-typing.show{display:block;}
.im-chat-empty{
  margin:auto;text-align:center;padding:32px 20px;color:var(--im-secondary);font-size:14px;line-height:1.45;
}
.im-chat-empty strong{display:block;color:var(--im-text);font-size:16px;margin-bottom:6px;}

/* Composer */
.im-composer{
  display:flex;align-items:flex-end;gap:6px;
  padding:8px 10px calc(8px + var(--im-safe-b));
  border-top:0.5px solid var(--im-hairline);
  background:rgba(245,245,247,0.88);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  flex-shrink:0;
}
@media (prefers-color-scheme: dark){
  .im-composer{background:rgba(28,28,30,0.9);}
}
.im-composer-tools{display:flex;gap:2px;flex-shrink:0;padding-bottom:2px;}
.im-field{
  flex:1;min-width:0;display:flex;align-items:flex-end;
  background:var(--im-sidebar);border:1px solid var(--im-hairline);
  border-radius:20px;padding:8px 12px;min-height:36px;
}
.im-field:focus-within{border-color:var(--im-blue);}
.im-field textarea{
  width:100%;border:0;outline:0;resize:none;background:transparent;
  font:400 16px/1.3 var(--im-font);color:var(--im-text);
  max-height:120px;min-height:22px;
}
.im-field textarea::placeholder{color:var(--im-secondary);}
.im-send{
  width:34px;height:34px;border-radius:50%;border:0;flex-shrink:0;
  background:var(--im-blue);color:#fff;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;font-size:16px;
  margin-bottom:1px;
}
.im-send:disabled{background:#c7c7cc;cursor:default;}
.im-fraud{
  display:none;margin:0 10px 6px;padding:8px 12px;border-radius:10px;
  background:#ffecec;color:#ff3b30;font-size:12px;line-height:1.4;
}
.im-fraud.show{display:block;}
.im-locked{
  display:none;padding:16px;text-align:center;color:var(--im-secondary);font-size:14px;
  border-top:0.5px solid var(--im-hairline);background:var(--im-composer);
}
.im-locked.show{display:block;}

/* ── RESPONSIVE ───────────────────────────────────────── */
@media (max-width: 860px){
  .im-sidebar{flex:0 0 100%;width:100%;max-width:none;min-width:0;border-right:0;}
  .im-thread{
    position:fixed;inset:0;z-index:5;
    transform:translateX(100%);
    transition:transform 0.28s cubic-bezier(0.22,1,0.36,1);
    box-shadow:none;
  }
  .im-app.is-chat-open .im-thread{transform:translateX(0);}
  .im-hdr-back{display:inline-flex;}
  .im-hdr-meta{text-align:left;}
  .im-thread-empty{display:none!important;}
}
@media (min-width: 861px){
  .im-hdr-back{display:none!important;}
}
</style>

<script>
/* ═══════════════════════════════════════════════════════════
   Messages app logic — list + inline thread (no site chrome)
   ═══════════════════════════════════════════════════════════ */
(function () {
  var conversations = [];
  var filtered = [];
  var userAvatars = {};
  var selectedId = '';
  var currentUserId = null;
  var currentConv = null;
  var messages = [];
  var pollTimer = null;
  var fraudDetected = false;
  var peerLastReadAt = null;

  var AVATAR_GRADIENTS = [
    'linear-gradient(135deg,#6b3fa0,#c8a8e9)',
    'linear-gradient(135deg,#16a34a,#4ade80)',
    'linear-gradient(135deg,#d97706,#fbbf24)',
    'linear-gradient(135deg,#9b6fc4,#c8a8e9)',
    'linear-gradient(135deg,#2563eb,#60a5fa)'
  ];

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return typeof escapeHtml === 'function' ? escapeHtml(s)
      : String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function avatarGradient(name) {
    var n = 0;
    for (var i = 0; i < (name || '').length; i++) n += name.charCodeAt(i);
    return AVATAR_GRADIENTS[n % AVATAR_GRADIENTS.length];
  }
  function formatRelativeTime(iso) {
    if (!iso) return '';
    var diff = Date.now() - new Date(iso).getTime();
    var mins = Math.floor(diff / 60000);
    if (mins < 1) return 'Now';
    if (mins < 60) return mins + 'm';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h';
    var days = Math.floor(hrs / 24);
    if (days === 1) return 'Yesterday';
    if (days < 7) return days + 'd';
    return new Date(iso).toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
  }
  function formatClock(iso) {
    try {
      return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    } catch (e) { return ''; }
  }
  function formatDateLabel(iso) {
    try {
      var d = new Date(iso);
      var today = new Date();
      if (d.toDateString() === today.toDateString()) return 'Today';
      var y = new Date(today); y.setDate(today.getDate() - 1);
      if (d.toDateString() === y.toDateString()) return 'Yesterday';
      return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    } catch (e2) { return ''; }
  }
  function countUnread(conv, userId) {
    var lastRead = userId === conv.poster_id ? conv.poster_last_read_at : conv.worker_last_read_at;
    if (!conv.last_message_at) return 0;
    if (!lastRead) return conv.last_message && conv.last_message_at ? 1 : 0;
    return new Date(conv.last_message_at) > new Date(lastRead) ? 1 : 0;
  }
  function mapConversation(conv, userId) {
    var posterId = conv.poster_id != null ? conv.poster_id : conv.POSTER_ID;
    var workerId = conv.worker_id != null ? conv.worker_id : conv.WORKER_ID;
    var convId = conv.conv_id != null ? conv.conv_id : conv.CONV_ID;
    var taskId = conv.task_id != null ? conv.task_id : conv.TASK_ID;
    var iAmPoster = String(posterId) === String(userId);
    var otherUid = iAmPoster ? workerId : posterId;
    otherUid = otherUid != null && String(otherUid) !== '' && String(otherUid) !== 'null' ? String(otherUid) : '';
    var otherName = iAmPoster ? (conv.worker_name || 'Tasker') : (conv.poster_name || 'Poster');
    if (typeof isGenericDisplayName === 'function' && isGenericDisplayName(otherName)) {
      otherName = iAmPoster ? 'Tasker' : 'Poster';
    }
    return {
      id: String(convId || ''),
      conv_id: String(convId || ''),
      taskId: taskId,
      posterId: posterId,
      workerId: workerId,
      otherUid: otherUid,
      name: otherName,
      initials: (otherName || 'U').charAt(0).toUpperCase(),
      avatarUrl: otherUid ? (userAvatars[String(otherUid)] || '') : '',
      avatarBg: avatarGradient(otherName),
      taskName: conv.task_title || 'Task',
      lastMessage: conv.last_message || 'No messages yet',
      time: formatRelativeTime(conv.last_message_at || conv.created_at),
      unread: countUnread(conv, userId),
      status: String(conv.status || '').toLowerCase() === 'completed' ? 'completed' : 'in_progress',
      unlocked: !!(typeof parseConversationUnlocked === 'function'
        ? parseConversationUnlocked(conv)
        : conv.is_unlocked)
    };
  }

  function avatarHtml(name, url, bg, size, className) {
    if (typeof renderUserAvatarHtml === 'function') {
      return renderUserAvatarHtml(name, url, { className: className || 'im-avatar', gradient: bg, size: size || 52 });
    }
    return '<div class="' + (className || 'im-avatar') + '" style="background:' + bg + '">' + esc((name || 'U').charAt(0)) + '</div>';
  }

  function renderList() {
    var list = $('convList');
    if (!list) return;
    if (!filtered.length) {
      list.innerHTML = '<div class="im-list-empty"><strong>No messages yet</strong>Accept an applicant or get accepted on a task — chats show up here.</div>';
      return;
    }
    list.innerHTML = filtered.map(function (c) {
      var active = selectedId && String(c.id) === String(selectedId);
      var preview = c.lastMessage || c.taskName || '';
      var badge = c.unread > 0 ? '<span class="im-badge">' + (c.unread > 9 ? '9+' : c.unread) + '</span>' : '';
      var href = 'messages.html?conv=' + encodeURIComponent(c.id);
      if (c.taskId != null && String(c.taskId) !== '') href += '&task=' + encodeURIComponent(String(c.taskId));
      if (c.otherUid) href += '&peer=' + encodeURIComponent(c.otherUid);
      console.info('[QuickGigs messages] row', { conv_id: c.id, taskId: c.taskId, otherUid: c.otherUid, href: href });
      return '<a class="im-row' + (active ? ' is-active' : '') + '" role="listitem" href="' + esc(href) + '"' +
        ' data-conv="' + esc(c.id) + '" data-task="' + esc(String(c.taskId == null ? '' : c.taskId)) + '"' +
        ' data-peer="' + esc(c.otherUid || '') + '">' +
        avatarHtml(c.name, c.avatarUrl, c.avatarBg, 52, 'im-avatar') +
        '<div class="im-row-body">' +
          '<div class="im-row-top"><div class="im-row-name">' + esc(c.name) + '</div>' +
          '<div class="im-row-time">' + esc(c.time) + '</div></div>' +
          '<div class="im-row-bottom"><div class="im-row-preview' + (c.unread ? ' is-unread' : '') + '">' +
          esc(preview) + '</div>' + badge + '</div>' +
        '</div></a>';
    }).join('');
  }

  function filterList() {
    var q = (($('searchInput') && $('searchInput').value) || '').toLowerCase().trim();
    filtered = !q ? conversations.slice() : conversations.filter(function (c) {
      return (c.name || '').toLowerCase().indexOf(q) >= 0 ||
        (c.taskName || '').toLowerCase().indexOf(q) >= 0 ||
        (c.lastMessage || '').toLowerCase().indexOf(q) >= 0;
    });
    renderList();
  }

  async function loadConversations() {
    currentUserId = window._currentUser ? window._currentUser.uid : null;
    var list = $('convList');
    if (!currentUserId) {
      if (list) list.innerHTML = '<div class="im-list-loading">Signing you in…</div>';
      return;
    }
    if (typeof getConversationsForUser !== 'function') {
      if (list) list.innerHTML = '<div class="im-list-empty"><strong>Offline</strong>Database not ready.</div>';
      return;
    }
    try {
      if (typeof syncCurrentUserProfile === 'function' && window._currentUser) {
        await syncCurrentUserProfile(window._currentUser).catch(function () {});
      }
      var rows = await getConversationsForUser(currentUserId);
      var rule = typeof window.getChatUnlockRule === 'function'
        ? window.getChatUnlockRule()
        : ((window.QG_CONFIG && window.QG_CONFIG.chatUnlockAfter) || 'accept');
      if (rule === 'accept' && typeof forceUnlockConversationForTask === 'function') {
        await Promise.all((rows || []).map(function (c) {
          if (c.is_unlocked && String(c.status || '').toLowerCase() !== 'application') return Promise.resolve();
          return forceUnlockConversationForTask(c, 'in_progress').catch(function () {});
        }));
        rows = await getConversationsForUser(currentUserId);
      }
      if (typeof getUsersAvatarMap === 'function') {
        userAvatars = await getUsersAvatarMap().catch(function () { return {}; });
      }
      var enriched = typeof enrichConversationNames === 'function'
        ? await Promise.all((rows || []).map(function (c) { return enrichConversationNames(c); }))
        : (rows || []);
      conversations = enriched.map(function (c) { return mapConversation(c, currentUserId); });
      filtered = conversations.slice();
      renderList();

      var params = new URLSearchParams(window.location.search);
      var deepConv = params.get('conv') || '';
      if (deepConv) openConversation(deepConv, { fromUrl: true });
      else if (params.get('task') || params.get('peer')) {
        resolveAndOpen(params.get('task') || '', params.get('peer') || params.get('with') || '');
      }
    } catch (err) {
      console.error('[QuickGigs messages] load failed', err);
      if (list) list.innerHTML = '<div class="im-list-empty"><strong>Could not load</strong>Check your connection and retry.</div>';
    }
  }

  async function resolveAndOpen(taskId, peer) {
    if (!taskId && !peer) return;
    var hit = conversations.find(function (c) {
      if (taskId && String(c.taskId) !== String(taskId)) return false;
      if (!peer) return true;
      return String(c.otherUid) === String(peer) ||
        String(c.posterId) === String(peer) ||
        String(c.workerId) === String(peer);
    });
    if (hit) return openConversation(hit.id, { fromUrl: true });
    if (taskId && peer && typeof getConversationForTask === 'function') {
      var resolved = await getConversationForTask(taskId, currentUserId, peer);
      if (!resolved) resolved = await getConversationForTask(taskId, peer, currentUserId);
      if (resolved && resolved.conv_id) openConversation(String(resolved.conv_id), { fromUrl: true });
    }
  }

  function setChatOpen(open) {
    var app = $('imApp');
    if (!app) return;
    app.classList.toggle('is-chat-open', !!open);
    app.classList.toggle('has-thread', !!open && !!selectedId);
  }

  function updateUrl(convId, taskId, peer) {
    try {
      var u = new URL(window.location.href);
      u.searchParams.set('conv', convId);
      if (taskId != null && String(taskId) !== '') u.searchParams.set('task', String(taskId));
      else u.searchParams.delete('task');
      if (peer) u.searchParams.set('peer', peer);
      else u.searchParams.delete('peer');
      window.history.replaceState({}, '', u.pathname + '?' + u.searchParams.toString());
    } catch (e) {}
  }

  async function openConversation(convId, opts) {
    opts = opts || {};
    if (!convId) return;
    selectedId = String(convId);
    renderList();
    setChatOpen(true);

    var meta = conversations.find(function (c) { return String(c.id) === String(selectedId); });
    paintThreadHeader(meta);
    $('chatScroll').innerHTML = '<div class="im-chat-empty">Loading…</div>';
    $('fraudInline').classList.remove('show');
    $('chatLocked').classList.remove('show');
    $('composer').style.display = '';

    if (typeof getConversation !== 'function') {
      $('chatScroll').innerHTML = '<div class="im-chat-empty"><strong>Still loading</strong>Try again in a moment.</div>';
      return;
    }

    currentConv = await getConversation(selectedId, { actorId: currentUserId });
    if (!currentConv) {
      await new Promise(function (r) { setTimeout(r, 120); });
      currentConv = await getConversation(selectedId, { actorId: currentUserId });
    }
    if (!currentConv) {
      $('chatScroll').innerHTML = '<div class="im-chat-empty"><strong>Conversation not found</strong></div>';
      return;
    }

    var isPoster = String(currentConv.poster_id) === String(currentUserId);
    var otherUid = isPoster ? currentConv.worker_id : currentConv.poster_id;
    var otherName = isPoster ? (currentConv.worker_name || 'Tasker') : (currentConv.poster_name || 'Poster');
    peerLastReadAt = isPoster ? (currentConv.worker_last_read_at || null) : (currentConv.poster_last_read_at || null);

    if (!meta) {
      meta = {
        id: selectedId,
        name: otherName,
        otherUid: otherUid,
        taskId: currentConv.task_id,
        taskName: currentConv.task_title || 'Task',
        avatarUrl: otherUid ? (userAvatars[String(otherUid)] || '') : '',
        avatarBg: avatarGradient(otherName)
      };
    }
    paintThreadHeader(meta);
    updateUrl(selectedId, currentConv.task_id, otherUid);

    var chip = $('taskChip');
    if (chip) {
      var title = currentConv.task_title || (meta && meta.taskName) || 'Task';
      chip.innerHTML = '<strong>Task</strong> · ' + esc(title);
      chip.classList.add('show');
    }

    var paymentGated = typeof window.isChatPaymentGated === 'function'
      ? window.isChatPaymentGated()
      : !!(window.QG_CONFIG && window.QG_CONFIG.paymentsEnabled && window.QG_CONFIG.chatUnlockAfter === 'payment');
    var unlocked = !!(typeof parseConversationUnlocked === 'function'
      ? parseConversationUnlocked(currentConv)
      : currentConv.is_unlocked) ||
      (!paymentGated && String(currentConv.status || '').toLowerCase() !== 'completed' &&
        String(currentConv.status || '').toLowerCase() !== 'application');

    // Accept-gated unlock: treat non-application as open when payments are off
    if (!paymentGated && String(currentConv.status || '').toLowerCase() !== 'application') {
      unlocked = true;
    }

    if (!unlocked) {
      $('composer').style.display = 'none';
      $('chatLocked').classList.add('show');
      $('chatLocked').textContent = 'Chat unlocks after the application is accepted.';
    } else {
      $('composer').style.display = '';
      $('chatLocked').classList.remove('show');
    }

    await refreshMessages({ forceScroll: true });
    if (typeof markConversationRead === 'function') {
      markConversationRead(selectedId, currentUserId).catch(function () {});
    }
    startPolling();
  }

  function paintThreadHeader(meta) {
    if (!meta) return;
    $('threadName').textContent = meta.name || 'Chat';
    $('threadStatus').textContent = meta.taskName ? String(meta.taskName) : 'QuickGigs chat';
    $('threadStatus').classList.remove('is-online');
    var wrap = $('threadAvatar');
    if (wrap) {
      wrap.innerHTML = avatarHtml(
        meta.name,
        meta.avatarUrl,
        meta.avatarBg || avatarGradient(meta.name),
        36,
        'im-hdr-avatar'
      );
    }
  }

  function mapMessageRow(m) {
    var sender = m.sender_id || m.SENDER_ID || '';
    var text = m.message || m.MESSAGE || m.text || '';
    var created = m.created_at || m.CREATED_AT || '';
    var isSystem = !!(m.is_system || m.IS_SYSTEM || sender === 'system');
    return {
      id: m.msg_id || m.MSG_ID || m.id,
      from: isSystem ? 'system' : (String(sender) === String(currentUserId) ? 'me' : 'them'),
      text: text,
      isSystem: isSystem,
      ts: created ? new Date(created).getTime() : 0,
      date: formatDateLabel(created),
      clock: formatClock(created),
      time: formatClock(created)
    };
  }

  async function refreshMessages(opts) {
    opts = opts || {};
    if (!selectedId || typeof getMessagesForConversation !== 'function') return;
    var rows = await getMessagesForConversation(selectedId, {
      actorId: currentUserId,
      trusted: true
    });
    messages = (rows || []).map(mapMessageRow);
    var near = isNearBottom();
    renderMessages();
    if (opts.forceScroll || near) scrollToBottom();

    // Instant list preview update
    var last = null;
    for (var i = messages.length - 1; i >= 0; i--) {
      if (!messages[i].isSystem) { last = messages[i]; break; }
    }
    if (last) {
      conversations.forEach(function (c) {
        if (String(c.id) === String(selectedId)) {
          c.lastMessage = last.text;
          c.time = 'Now';
          c.unread = 0;
        }
      });
      filterList();
    }
  }

  function renderMessages() {
    var scroll = $('chatScroll');
    if (!scroll) return;
    if (!messages.length) {
      scroll.innerHTML = '<div class="im-chat-empty"><strong>No messages yet</strong>Say hi — keep plans on QuickGigs.</div><div class="im-typing" id="typingBubble">typing…</div>';
      return;
    }
    var lastDate = '';
    var html = '';
    var prevFrom = '';
    var prevTs = 0;
    messages.forEach(function (m, idx) {
      if (m.isSystem || m.from === 'system') {
        html += '<div class="im-sys">' + esc(m.text) + '</div>';
        prevFrom = '';
        prevTs = 0;
        return;
      }
      if (m.date !== lastDate) {
        html += '<div class="im-date">' + esc(m.date) + '</div>';
        lastDate = m.date;
        prevFrom = '';
        prevTs = 0;
      }
      var isMe = m.from === 'me';
      var ts = m.ts || 0;
      var next = messages[idx + 1];
      while (next && (next.isSystem || next.from === 'system')) {
        idx += 1;
        next = messages[idx + 1];
      }
      var nextSame = next && next.from === m.from && next.date === m.date && next.ts && (next.ts - ts) < 120000;
      var grouped = prevFrom === m.from && prevTs && (ts - prevTs) < 120000;
      var showTime = !nextSame;
      var body = typeof escapeHtml === 'function' ? escapeHtml(m.text) : esc(m.text);
      html += '<div class="im-bubble-row ' + (isMe ? 'mine' : 'theirs') + (grouped ? ' grouped' : '') + (showTime ? ' show-time' : '') + '">' +
        '<div class="im-bubble">' + body + '</div>' +
        (showTime ? '<div class="im-bubble-time">' + esc(m.clock || m.time || '') + '</div>' : '') +
      '</div>';
      prevFrom = m.from;
      prevTs = ts;
    });
    html += '<div class="im-typing" id="typingBubble">typing…</div>';
    scroll.innerHTML = html;
  }

  function isNearBottom() {
    var scroll = $('chatScroll');
    if (!scroll) return true;
    return (scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight) < 90;
  }
  function scrollToBottom() {
    var scroll = $('chatScroll');
    if (!scroll) return;
    scroll.scrollTop = scroll.scrollHeight;
  }

  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function () {
      if (selectedId) refreshMessages();
    }, 4000);
  }

  function analyzeFraudLocal(text) {
    if (typeof analyzeOffPlatformContact === 'function') {
      var r = analyzeOffPlatformContact(text);
      if (r && r.blocked) return r;
    }
    return { blocked: false };
  }

  async function sendMessage() {
    var input = $('msgInput');
    var sendBtn = $('sendBtn');
    if (!input || !selectedId || !currentUserId) return;
    var text = (typeof sanitizeInput === 'function' ? sanitizeInput(input.value.trim(), 2000) : input.value.trim());
    if (!text || fraudDetected) return;

    var check = analyzeFraudLocal(text);
    if (check.blocked) {
      fraudDetected = true;
      var fi = $('fraudInline');
      fi.textContent = check.message || 'Keep contact info off QuickGigs.';
      fi.classList.add('show');
      sendBtn.disabled = true;
      return;
    }

    // Optimistic append
    var optimistic = {
      from: 'me', text: text, isSystem: false,
      ts: Date.now(), date: 'Today', clock: formatClock(new Date().toISOString()), time: ''
    };
    messages.push(optimistic);
    renderMessages();
    scrollToBottom();
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    var recent = messages.filter(function (m) { return m.from === 'me'; }).slice(-5).map(function (m) { return m.text; });
    var result = typeof sendChatMessage === 'function'
      ? await sendChatMessage(selectedId, currentUserId, text, recent, { convId: selectedId, senderId: currentUserId })
      : { success: false };

    if (!result || !result.success) {
      if (result && (result.blocked || result.error === 'off_platform_contact')) {
        var f2 = $('fraudInline');
        f2.textContent = (result && result.message) || 'Message blocked.';
        f2.classList.add('show');
      } else if (typeof showToast === 'function') {
        showToast('Could not send. Try again.', '#ef4444');
      }
      await refreshMessages({ forceScroll: true });
      sendBtn.disabled = false;
      return;
    }

    $('fraudInline').classList.remove('show');
    fraudDetected = false;
    await refreshMessages({ forceScroll: true });
    scrollToBottom();
  }

  function wireUi() {
    var search = $('searchInput');
    if (search) search.addEventListener('input', filterList);

    $('convList').addEventListener('click', function (e) {
      var row = e.target && e.target.closest ? e.target.closest('.im-row') : null;
      if (!row) return;
      e.preventDefault();
      var id = row.getAttribute('data-conv');
      if (id) openConversation(id);
    });

    $('threadBackBtn').addEventListener('click', function () {
      setChatOpen(false);
      selectedId = '';
      currentConv = null;
      if (pollTimer) clearInterval(pollTimer);
      renderList();
      try {
        var u = new URL(window.location.href);
        u.search = '';
        window.history.replaceState({}, '', u.pathname);
      } catch (e3) {}
    });

    var input = $('msgInput');
    var sendBtn = $('sendBtn');
    input.addEventListener('input', function () {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
      var val = input.value.trim();
      var check = val ? analyzeFraudLocal(val) : { blocked: false };
      var fi = $('fraudInline');
      if (check.blocked) {
        fraudDetected = true;
        fi.textContent = check.message || 'Keep contact info off QuickGigs.';
        fi.classList.add('show');
        sendBtn.disabled = true;
      } else {
        fraudDetected = false;
        fi.classList.remove('show');
        sendBtn.disabled = !val;
      }
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) sendMessage();
      }
    });
    sendBtn.addEventListener('click', function () { sendMessage(); });

    $('emojiBtn').addEventListener('click', function () {
      input.focus();
      try {
        document.execCommand('insertText', false, '🙂');
      } catch (e4) {
        input.value += '🙂';
        input.dispatchEvent(new Event('input'));
      }
    });

    $('moreBtn').addEventListener('click', function () {
      if (!currentConv) return;
      var other = String(currentConv.poster_id) === String(currentUserId)
        ? currentConv.worker_id : currentConv.poster_id;
      if (other) window.location.href = 'profile.html?user=' + encodeURIComponent(String(other));
    });
  }

  window.QGMessages = {
    start: function () {
      wireUi();
      loadConversations();
    },
    openConversation: openConversation,
    loadConversations: loadConversations
  };
  window.loadConversations = loadConversations;
  window.filterConvs = filterList;
})();
</script>
</body>
</html>
