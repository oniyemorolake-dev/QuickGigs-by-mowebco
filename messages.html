<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0b0118;
  --surface:rgba(255,255,255,0.04);
  --surface-hover:rgba(107,63,160,0.12);
  --border:rgba(200,168,233,0.12);
  --text:#fff;
  --text-muted:rgba(255,255,255,0.68);
  --text-faint:rgba(255,255,255,0.55);
  --purple:#6b3fa0;
  --purple-light:#9b6fc4;
  --lavender:#c8a8e9;
  --nav-bg:#0b0118;
  --tab-bg:#0e021f;
  --input-bg:rgba(255,255,255,0.06);
  --bubble-mine:#6b3fa0;
  --bubble-theirs:rgba(255,255,255,0.08);
  --bubble-theirs-text:rgba(255,255,255,0.92);
  --selected:rgba(107,63,160,0.22);
}
body.light{
  --bg:#fafafe;
  --surface:#fff;
  --surface-hover:#f5f2ff;
  --border:#ebe6ff;
  --text:#2d1b4e;
  --text-muted:#6b6580;
  --text-faint:#8a84a0;
  --nav-bg:#fff;
  --tab-bg:#fff;
  --input-bg:#f0eeff;
  --bubble-mine:#6b3fa0;
  --bubble-theirs:#efeafc;
  --bubble-theirs-text:#2d1b4e;
  --selected:#ede9ff;
  --lavender:#6b3fa0;
}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;padding-bottom:76px;
  transition:background 0.25s,color 0.25s;
  overflow-x:hidden;
}

/* Shared dialogs cover the viewport; hidden ones must never obscure Messages. */
.qg-menu-overlay:not(.open),
.qg-bell-overlay:not(.open),
.qg-ios-overlay:not(.open),
#qgReportOverlay:not(.open),
#qgDisputeOverlay:not(.open){
  display:none!important;
  visibility:hidden!important;
  opacity:0!important;
  pointer-events:none!important;
}

/* App header — same pattern as other pages */
.nav{
  position:sticky;top:0;z-index:50;background:var(--nav-bg);
  border-bottom:0.5px solid var(--border);
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;
  background:var(--surface);border:0.5px solid var(--border);color:var(--text);
  text-decoration:none;font-size:14px;font-weight:500;min-height:40px;
}
body.light .back-btn{background:#f0eeff;color:var(--purple);border-color:#e8e2ff;}
.nav-title{font-size:16px;font-weight:500;flex:1;text-align:center;}
.mode-btn{
  padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;border:none;
  font-family:inherit;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.65);
}
body.light .mode-btn{background:#f0eeff;color:var(--purple);}

/* Messages shell: list + thread inside app chrome */
.im-app{
  display:flex;
  min-height:calc(100vh - 130px);
  max-width:1100px;margin:0 auto;
  border-top:0;
}
.im-sidebar{
  width:360px;flex:0 0 360px;min-width:0;
  display:flex;flex-direction:column;
  border-right:0.5px solid var(--border);
  background:var(--bg);
}
.im-sidebar-top{padding:12px 16px 10px;flex-shrink:0;}
.im-search{
  display:flex;align-items:center;gap:8px;
  background:var(--input-bg);border:0.5px solid var(--border);
  border-radius:14px;padding:10px 14px;
}
.im-search:focus-within{border-color:var(--purple-light);}
.im-search input{
  flex:1;border:0;outline:0;background:transparent;
  font:400 14px/1.3 'DM Sans',sans-serif;color:var(--text);
}
.im-search input::placeholder{color:var(--text-faint);}
.im-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px;}
.im-list-empty,.im-list-loading{
  padding:40px 24px;text-align:center;color:var(--text-muted);font-size:14px;line-height:1.5;
}
.im-list-empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:6px;}

/* Apple-quality rows, QuickGigs colors */
.im-row{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:12px 16px;border:0;background:transparent;cursor:pointer;
  text-align:left;font:inherit;color:inherit;text-decoration:none!important;
  position:relative;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.im-row:link,.im-row:visited,.im-row:hover,.im-row:active{color:inherit;text-decoration:none!important;}
.im-row:hover{background:var(--surface-hover);}
.im-row.is-active{background:var(--selected);}
.im-row+.im-row::before{
  content:'';position:absolute;left:80px;right:0;top:0;height:0.5px;background:var(--border);
}
.im-avatar{
  width:52px;height:52px;border-radius:50%;flex:0 0 52px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:600;color:#fff;
  background:linear-gradient(135deg,#6b3fa0,#c8a8e9);
}
.im-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
body.light .im-avatar{color:#2d1b4e;}
.im-row-body{flex:1;min-width:0;}
.im-row-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:3px;}
.im-row-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.im-row-time{font-size:12px;color:var(--text-faint);flex-shrink:0;}
.im-row-bottom{display:flex;align-items:center;gap:8px;}
.im-row-preview{
  flex:1;min-width:0;font-size:13px;color:var(--text-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.im-row-preview.is-unread{color:var(--text);font-weight:500;}
.im-badge{
  min-width:18px;height:18px;padding:0 6px;border-radius:999px;
  background:var(--purple);color:#fff;font-size:11px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
}
body.light .im-badge{color:#2d1b4e;}

/* Thread panel */
.im-thread{
  flex:1 1 auto;min-width:0;display:flex;flex-direction:column;
  background:var(--bg);position:relative;min-height:60vh;
}
.im-thread-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;color:var(--text-muted);padding:40px;text-align:center;
}
.im-thread-empty .glyph{
  width:64px;height:64px;border-radius:18px;background:rgba(107,63,160,0.18);
  display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:6px;
  border:0.5px solid var(--border);
}
body.light .im-thread-empty .glyph{background:#f0eeff;}
.im-thread-empty h2{font-size:18px;font-weight:500;color:var(--text);}
.im-thread-empty p{font-size:14px;max-width:280px;line-height:1.5;}

.im-thread-hdr{
  display:none;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:0.5px solid var(--border);background:var(--nav-bg);flex-shrink:0;
}
.im-app.has-thread .im-thread-hdr{display:flex;}
.im-app.has-thread .im-thread-empty{display:none;}
.im-app.has-thread .im-thread-main{display:flex;}
.im-hdr-back{
  display:none;border:0;background:transparent;color:var(--purple-light);
  font-size:26px;line-height:1;padding:4px 6px;cursor:pointer;
}
body.light .im-hdr-back{color:var(--purple);}
.im-hdr-avatar{
  width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;
  background:linear-gradient(135deg,#6b3fa0,#c8a8e9);
}
.im-hdr-avatar .im-hdr-avatar,.im-hdr-avatar .im-avatar,.im-hdr-avatar > div{
  width:36px!important;height:36px!important;min-width:36px!important;min-height:36px!important;border-radius:50%!important;
}
.im-hdr-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.im-hdr-meta{flex:1;min-width:0;}
.im-hdr-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.im-hdr-status{font-size:12px;color:var(--text-muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.im-hdr-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.chat-hdr-btn{
  padding:6px 10px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;
  border:0.5px solid rgba(239,68,68,0.35);font-family:inherit;
  background:rgba(239,68,68,0.12);color:#ef4444;white-space:nowrap;
}
body.light .chat-hdr-btn{background:#fef2f2;border-color:#fecaca;color:#b91c1c;}
.chat-hdr-btn:disabled{opacity:0.4;cursor:default;}

.im-thread-main{display:none;flex:1 1 auto;min-height:0;flex-direction:column;}
.im-task-chip{
  display:none;margin:8px 14px 0;padding:8px 12px;border-radius:12px;
  background:rgba(107,63,160,0.14);font-size:12px;color:var(--text-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;
}
body.light .im-task-chip{background:#f0eeff;}
.im-task-chip.show{display:block;}
.im-task-chip strong{color:var(--text);font-weight:600;}

.im-scroll{
  flex:1 1 auto;min-height:280px;max-height:calc(100vh - 280px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px;display:flex;flex-direction:column;gap:2px;
}
.im-date{align-self:center;font-size:11px;color:var(--text-faint);margin:10px 0 6px;}
.im-sys{align-self:center;max-width:90%;text-align:center;font-size:12px;color:var(--text-muted);padding:6px 10px;margin:4px 0;}
.im-bubble-row{display:flex;flex-direction:column;max-width:100%;}
.im-bubble-row.mine{align-items:flex-end;}
.im-bubble-row.theirs{align-items:flex-start;}
.im-bubble-row.grouped{margin-top:1px;}
.im-bubble-row:not(.grouped){margin-top:7px;}
.im-bubble{
  max-width:min(78%,420px);padding:9px 14px;font-size:14px;line-height:1.4;
  word-wrap:break-word;overflow-wrap:anywhere;border-radius:18px;
}
.im-bubble-row.mine .im-bubble{
  background:linear-gradient(145deg,#7a4cb8,#6b3fa0);color:#fff;
  border-bottom-right-radius:5px;
}
.im-bubble-row.theirs .im-bubble{
  background:var(--bubble-theirs);color:var(--bubble-theirs-text);
  border-bottom-left-radius:5px;border:0.5px solid var(--border);
}
.im-bubble-time{font-size:10px;color:var(--text-faint);margin-top:3px;padding:0 4px;}
.im-chat-empty{margin:auto;text-align:center;padding:28px 16px;color:var(--text-muted);font-size:13px;}
.im-chat-empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:6px;}

.im-composer{
  display:flex;align-items:flex-end;gap:8px;
  padding:10px 12px;border-top:0.5px solid var(--border);
  background:var(--nav-bg);flex-shrink:0;
}
.im-field{
  flex:1;min-width:0;background:var(--input-bg);border:0.5px solid var(--border);
  border-radius:20px;padding:9px 14px;
}
.im-field:focus-within{border-color:var(--purple-light);}
.im-field textarea{
  width:100%;border:0;outline:0;resize:none;background:transparent;
  font:400 14px/1.35 'DM Sans',sans-serif;color:var(--text);max-height:100px;min-height:20px;
}
.im-field textarea::placeholder{color:var(--text-faint);}
.im-send{
  width:40px;height:40px;border-radius:50%;border:0;flex-shrink:0;cursor:pointer;
  background:linear-gradient(145deg,#8b5cc7,#6b3fa0);color:#fff;font-size:16px;
  display:inline-flex;align-items:center;justify-content:center;
}
.im-send:disabled{opacity:0.4;cursor:default;}
.im-fraud{
  display:none;margin:0 12px 6px;padding:8px 12px;border-radius:10px;
  background:rgba(239,68,68,0.1);color:#ef4444;font-size:12px;line-height:1.4;
}
.im-fraud.show{display:block;}
.im-locked{
  display:none;padding:14px;text-align:center;color:var(--text-muted);font-size:13px;
  border-top:0.5px solid var(--border);background:var(--nav-bg);
}
.im-locked.show{display:block;}

.tab-bar{
  position:fixed;bottom:0;left:0;right:0;background:var(--tab-bg);
  border-top:0.5px solid var(--border);display:flex!important;
  padding:8px 0 14px;z-index:100;min-height:56px;
}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-decoration:none;}
.tab-icon{font-size:22px;color:var(--text-faint);line-height:1;}
.tab-lbl{font-size:10px;color:var(--text-faint);}
.tab-item.active .tab-icon,.tab-item.active .tab-lbl{color:var(--purple-light);}
body.light .tab-item.active .tab-icon,body.light .tab-item.active .tab-lbl{color:var(--purple);}
.app-legal-footer{text-align:center;padding:16px 16px 96px;font-size:10px;color:var(--text-faint);line-height:1.7;}
.app-legal-footer a{color:var(--purple-light);text-decoration:none;}
body.light .app-legal-footer a{color:var(--purple);}

@media (max-width: 860px){
  .im-app{flex-direction:column;min-height:auto;}
  .im-sidebar{width:100%;flex:none;border-right:0;}
  .im-thread{
    position:fixed;inset:0;z-index:60;padding-bottom:76px;
    transform:translateX(100%);
    transition:transform 0.28s cubic-bezier(0.22,1,0.36,1);
    background:var(--bg);
  }
  .im-app.is-chat-open .im-thread{transform:translateX(0);}
  .im-hdr-back{display:inline-flex;}
  .im-thread-empty{display:none!important;}
  .im-scroll{max-height:none;flex:1;}
}
@media (min-width: 861px){
  .im-hdr-back{display:none!important;}
}
</style>

<script>
/* qg-site.js owns the shared menu loader. Clear stale full-screen overlays
   restored from browser history before repainting Messages. */
function resetMessagesOverlays() {
  document.body.classList.remove('qg-menu-open', 'qg-bell-open');
  document.querySelectorAll(
    '.qg-menu-overlay.open,.qg-bell-overlay.open,.qg-ios-overlay.open,' +
    '#qgReportOverlay.open,#qgDisputeOverlay.open'
  ).forEach(function (overlay) {
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    overlay.style.display = 'none';
  });
}
resetMessagesOverlays();
window.addEventListener('pageshow', resetMessagesOverlays);

var isDark = typeof QG_isDarkTheme === 'function' ? QG_isDarkTheme() : (localStorage.getItem('qg-theme') !== 'light');
function applyTheme(){
  if (typeof QG_applyTheme === 'function') QG_applyTheme(isDark, 'modeBtn', false);
  else {
    document.body.classList.toggle('light', !isDark);
    document.documentElement.classList.toggle('light', !isDark);
    var b = document.getElementById('modeBtn');
    if (b) b.textContent = isDark ? '☀️ Light' : '🌙 Dark';
  }
}
window.toggleTheme = function(){
  isDark = !isDark;
  if (typeof QG_setDarkTheme === 'function') QG_setDarkTheme(isDark);
  else localStorage.setItem('qg-theme', isDark ? 'dark' : 'light');
  applyTheme();
};
applyTheme();

(function paintTab(){
  function go(){
    if (typeof renderQuickGigsTabBar === 'function') renderQuickGigsTabBar('messages');
  }
  go();
  document.addEventListener('DOMContentLoaded', go);
  window.addEventListener('load', go);
})();

  var selectedId = '';
  var currentUserId = null;
  var currentConv = null;
  var currentPeer = { uid: '', name: '' };
  var messages = [];
  var pollTimer = null;
  var fraudDetected = false;

  var AVATAR_GRADIENTS = [
    'linear-gradient(135deg,#6b3fa0,#c8a8e9)',
    'linear-gradient(135deg,#16a34a,#4ade80)',
    'linear-gradient(135deg,#d97706,#fbbf24)',
    'linear-gradient(135deg,#9b6fc4,#c8a8e9)',
    'linear-gradient(135deg,#2563eb,#60a5fa)'
  ];

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return typeof escapeHtml === 'function' ? escapeHtml(s)
      : String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function avatarGradient(name) {
    var n = 0;
    for (var i = 0; i < (name || '').length; i++) n += name.charCodeAt(i);
    return AVATAR_GRADIENTS[n % AVATAR_GRADIENTS.length];
  }
  function formatRelativeTime(iso) {
    if (!iso) return '';
    var diff = Date.now() - new Date(iso).getTime();
    var mins = Math.floor(diff / 60000);
    if (mins < 1) return 'Now';
    if (mins < 60) return mins + 'm';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h';
    var days = Math.floor(hrs / 24);
    if (days === 1) return 'Yesterday';
    if (days < 7) return days + 'd';
    return new Date(iso).toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
  }
  function formatClock(iso) {
    try { return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
    catch (e) { return ''; }
  }
  function formatDateLabel(iso) {
    try {
      var d = new Date(iso), today = new Date();
      if (d.toDateString() === today.toDateString()) return 'Today';
      var y = new Date(today); y.setDate(today.getDate() - 1);
      if (d.toDateString() === y.toDateString()) return 'Yesterday';
      return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    } catch (e2) { return ''; }
  }
  function countUnread(conv, userId) {
    var lastRead = userId === conv.poster_id ? conv.poster_last_read_at : conv.worker_last_read_at;
    if (!conv.last_message_at) return 0;
    if (!lastRead) return conv.last_message && conv.last_message_at ? 1 : 0;
    return new Date(conv.last_message_at) > new Date(lastRead) ? 1 : 0;
  }
  function mapConversation(conv, userId) {
    var posterId = conv.poster_id != null ? conv.poster_id : conv.POSTER_ID;
    var workerId = conv.worker_id != null ? conv.worker_id : conv.WORKER_ID;
    var convId = conv.conv_id != null ? conv.conv_id : conv.CONV_ID;
    var taskId = conv.task_id != null ? conv.task_id : conv.TASK_ID;
    var iAmPoster = String(posterId) === String(userId);
    var otherUid = iAmPoster ? workerId : posterId;
    otherUid = otherUid != null && String(otherUid) !== '' && String(otherUid) !== 'null' ? String(otherUid) : '';
    var otherName = iAmPoster ? (conv.worker_name || 'Tasker') : (conv.poster_name || 'Poster');
    if (typeof isGenericDisplayName === 'function' && isGenericDisplayName(otherName)) {
      otherName = iAmPoster ? 'Tasker' : 'Poster';
    }
    return {
      id: String(convId || ''),
      conv_id: String(convId || ''),
      taskId: taskId,
      posterId: posterId,
      workerId: workerId,
      otherUid: otherUid,
      name: otherName,
      avatarUrl: otherUid ? (userAvatars[String(otherUid)] || '') : '',
      avatarBg: avatarGradient(otherName),
      taskName: conv.task_title || 'Task',
      lastMessage: conv.last_message || 'No messages yet',
      time: formatRelativeTime(conv.last_message_at || conv.created_at),
      unread: countUnread(conv, userId)
    };
  }
  function avatarHtml(name, url, bg, size, className) {
    if (typeof renderUserAvatarHtml === 'function') {
      return renderUserAvatarHtml(name, url, { className: className || 'im-avatar', gradient: bg, size: size || 52 });
    }
    return '<div class="' + (className || 'im-avatar') + '" style="background:' + bg + '">' + esc((name || 'U').charAt(0)) + '</div>';
  }

  /** Exact open target: messages.html?conv=<conv_id> (+ optional task/peer). Click → openConversation(conv_id). */
  function rowHref(c) {
    var href = 'messages.html?conv=' + encodeURIComponent(c.id);
    if (c.taskId != null && String(c.taskId) !== '') href += '&task=' + encodeURIComponent(String(c.taskId));
    if (c.otherUid) href += '&peer=' + encodeURIComponent(c.otherUid);
    return href;
  }

  function renderList() {
    var list = $('convList');
    if (!list) return;
    if (!filtered.length) {
      list.innerHTML = '<div class="im-list-empty"><strong>No messages yet</strong>Accept an applicant or get accepted on a task — chats show up here.</div>';
      return;
    }
    list.innerHTML = filtered.map(function (c) {
      var active = selectedId && String(c.id) === String(selectedId);
      var preview = c.lastMessage || c.taskName || '';
      var badge = c.unread > 0 ? '<span class="im-badge">' + (c.unread > 9 ? '9+' : c.unread) + '</span>' : '';
      var href = rowHref(c);
      console.info('[QuickGigs messages] row', { conv_id: c.id, taskId: c.taskId, otherUid: c.otherUid, href: href });
      return '<a class="im-row' + (active ? ' is-active' : '') + '" role="listitem" href="' + esc(href) + '"' +
        ' data-conv="' + esc(c.id) + '" data-task="' + esc(String(c.taskId == null ? '' : c.taskId)) + '"' +
        ' data-peer="' + esc(c.otherUid || '') + '">' +
        avatarHtml(c.name, c.avatarUrl, c.avatarBg, 52, 'im-avatar') +
        '<div class="im-row-body">' +
          '<div class="im-row-top"><div class="im-row-name">' + esc(c.name) + '</div>' +
          '<div class="im-row-time">' + esc(c.time) + '</div></div>' +
          '<div class="im-row-bottom"><div class="im-row-preview' + (c.unread ? ' is-unread' : '') + '">' +
          esc(preview) + '</div>' + badge + '</div>' +
        '</div></a>';
    }).join('');
  }

  function filterList() {
    var q = (($('searchInput') && $('searchInput').value) || '').toLowerCase().trim();
    filtered = !q ? conversations.slice() : conversations.filter(function (c) {
      return (c.name || '').toLowerCase().indexOf(q) >= 0 ||
        (c.taskName || '').toLowerCase().indexOf(q) >= 0 ||
        (c.lastMessage || '').toLowerCase().indexOf(q) >= 0;
    });
    renderList();
  }

  async function loadConversations() {
    currentUserId = window._currentUser ? window._currentUser.uid : null;
    var list = $('convList');
    if (!currentUserId) {
      if (list) list.innerHTML = '<div class="im-list-loading">Signing you in…</div>';
      return;
    }
    if (typeof getConversationsForUser !== 'function') {
      if (list) list.innerHTML = '<div class="im-list-empty"><strong>Offline</strong>Database not ready.</div>';
      return;
    }
    try {
      if (typeof syncCurrentUserProfile === 'function' && window._currentUser) {
        await syncCurrentUserProfile(window._currentUser).catch(function () {});
      }
      var rows = await getConversationsForUser(currentUserId);
      var rule = typeof window.getChatUnlockRule === 'function'
        ? window.getChatUnlockRule()
        : ((window.QG_CONFIG && window.QG_CONFIG.chatUnlockAfter) || 'accept');
      if (rule === 'accept' && typeof forceUnlockConversationForTask === 'function') {
        await Promise.all((rows || []).map(function (c) {
          if (c.is_unlocked && String(c.status || '').toLowerCase() !== 'application') return Promise.resolve();
          return forceUnlockConversationForTask(c, 'in_progress').catch(function () {});
        }));
        rows = await getConversationsForUser(currentUserId);
      }
      if (typeof getUsersAvatarMap === 'function') {
        userAvatars = await getUsersAvatarMap().catch(function () { return {}; });
      }
      var enriched = typeof enrichConversationNames === 'function'
        ? await Promise.all((rows || []).map(function (c) { return enrichConversationNames(c); }))
        : (rows || []);
      conversations = enriched.map(function (c) { return mapConversation(c, currentUserId); });
      filtered = conversations.slice();
      renderList();
      if (typeof renderQuickGigsTabBar === 'function') renderQuickGigsTabBar('messages');

      var params = new URLSearchParams(window.location.search);
      var deepConv = params.get('conv') || '';
      if (deepConv) openConversation(deepConv);
      else if (params.get('task') || params.get('peer')) {
        resolveAndOpen(params.get('task') || '', params.get('peer') || params.get('with') || '');
      }
    } catch (err) {
      console.error('[QuickGigs messages] load failed', err);
      if (list) list.innerHTML = '<div class="im-list-empty"><strong>Could not load</strong>Check your connection and retry.</div>';
    }
  }

  async function resolveAndOpen(taskId, peer) {
    var hit = conversations.find(function (c) {
      if (taskId && String(c.taskId) !== String(taskId)) return false;
      if (!peer) return true;
      return String(c.otherUid) === String(peer) || String(c.posterId) === String(peer) || String(c.workerId) === String(peer);
    });
    if (hit) return openConversation(hit.id);
    if (taskId && peer && typeof getConversationForTask === 'function') {
      var resolved = await getConversationForTask(taskId, currentUserId, peer);
      if (!resolved) resolved = await getConversationForTask(taskId, peer, currentUserId);
      if (resolved && resolved.conv_id) openConversation(String(resolved.conv_id));
    }
  }

  function setChatOpen(open) {
    var app = $('imApp');
    if (!app) return;
    app.classList.toggle('is-chat-open', !!open);
    app.classList.toggle('has-thread', !!open && !!selectedId);
  }

  function updateUrl(convId, taskId, peer) {
    try {
      var u = new URL(window.location.href);
      u.searchParams.set('conv', convId);
      if (taskId != null && String(taskId) !== '') u.searchParams.set('task', String(taskId));
      else u.searchParams.delete('task');
      if (peer) u.searchParams.set('peer', peer);
      else u.searchParams.delete('peer');
      window.history.replaceState({}, '', u.pathname + '?' + u.searchParams.toString());
    } catch (e) {}
  }

  function setSafetyButtons(enabled) {
    var r = $('chatReportBtn');
    var b = $('chatBlockBtn');
    if (r) r.disabled = !enabled;
    if (b) b.disabled = !enabled;
  }

  async function openConversation(convId) {
    if (!convId) return;
    selectedId = String(convId);
    renderList();
    setChatOpen(true);
    setSafetyButtons(false);

    var meta = conversations.find(function (c) { return String(c.id) === String(selectedId); });
    paintThreadHeader(meta);
    $('chatScroll').innerHTML = '<div class="im-chat-empty">Loading…</div>';
    $('fraudInline').classList.remove('show');
    $('chatLocked').classList.remove('show');
    $('composer').style.display = '';

    if (typeof getConversation !== 'function') {
      $('chatScroll').innerHTML = '<div class="im-chat-empty"><strong>Still loading</strong>Try again in a moment.</div>';
      return;
    }

    currentConv = await getConversation(selectedId, { actorId: currentUserId });
    if (!currentConv) {
      await new Promise(function (r) { setTimeout(r, 120); });
      currentConv = await getConversation(selectedId, { actorId: currentUserId });
    }
    if (!currentConv) {
      $('chatScroll').innerHTML = '<div class="im-chat-empty"><strong>Conversation not found</strong></div>';
      return;
    }

    var isPoster = String(currentConv.poster_id) === String(currentUserId);
    var otherUid = isPoster ? currentConv.worker_id : currentConv.poster_id;
    var otherName = isPoster ? (currentConv.worker_name || 'Tasker') : (currentConv.poster_name || 'Poster');
    currentPeer = { uid: otherUid ? String(otherUid) : '', name: otherName || 'User' };

    if (!meta) {
      meta = {
        id: selectedId, name: otherName, otherUid: currentPeer.uid, taskId: currentConv.task_id,
        taskName: currentConv.task_title || 'Task',
        avatarUrl: currentPeer.uid ? (userAvatars[currentPeer.uid] || '') : '',
        avatarBg: avatarGradient(otherName)
      };
    }
    paintThreadHeader(meta);
    setSafetyButtons(!!currentPeer.uid);
    updateUrl(selectedId, currentConv.task_id, currentPeer.uid);

    var chip = $('taskChip');
    if (chip) {
      chip.innerHTML = '<strong>Task</strong> · ' + esc(currentConv.task_title || meta.taskName || 'Task');
      chip.classList.add('show');
    }

    var paymentGated = typeof window.isChatPaymentGated === 'function'
      ? window.isChatPaymentGated()
      : !!(window.QG_CONFIG && window.QG_CONFIG.paymentsEnabled && window.QG_CONFIG.chatUnlockAfter === 'payment');
    var unlocked = !paymentGated && String(currentConv.status || '').toLowerCase() !== 'application';
    if (typeof parseConversationUnlocked === 'function' && parseConversationUnlocked(currentConv)) unlocked = true;

    if (!unlocked) {
      $('composer').style.display = 'none';
      $('chatLocked').classList.add('show');
      $('chatLocked').textContent = 'Chat unlocks after the application is accepted.';
    } else {
      $('composer').style.display = '';
      $('chatLocked').classList.remove('show');
    }

    await refreshMessages({ forceScroll: true });
    if (typeof markConversationRead === 'function') {
      markConversationRead(selectedId, currentUserId).catch(function () {});
    }
    startPolling();
  }

  function paintThreadHeader(meta) {
    if (!meta) return;
    $('threadName').textContent = meta.name || 'Chat';
    $('threadStatus').textContent = meta.taskName ? String(meta.taskName) : 'QuickGigs chat';
    var wrap = $('threadAvatar');
    if (wrap) {
      wrap.innerHTML = avatarHtml(meta.name, meta.avatarUrl, meta.avatarBg || avatarGradient(meta.name), 36, 'im-hdr-avatar');
    }
  }

  function mapMessageRow(m) {
    var sender = m.sender_id || m.SENDER_ID || '';
    // Data layer stores message text in `body` (SELECT_MESSAGES) — not message/text.
    var text = m.body != null ? m.body
      : (m.BODY != null ? m.BODY
        : (m.message != null ? m.message
          : (m.MESSAGE != null ? m.MESSAGE
            : (m.text != null ? m.text : ''))));
    text = String(text == null ? '' : text);
    var created = m.created_at || m.CREATED_AT || '';
    var isSystem = !!(m.is_system || m.IS_SYSTEM || sender === 'system');
    return {
      from: isSystem ? 'system' : (String(sender) === String(currentUserId) ? 'me' : 'them'),
      text: text,
      isSystem: isSystem,
      ts: created ? new Date(created).getTime() : 0,
      date: formatDateLabel(created),
      clock: formatClock(created)
    };
  }

  async function refreshMessages(opts) {
    opts = opts || {};
    if (!selectedId || typeof getMessagesForConversation !== 'function') return;
    var rows = await getMessagesForConversation(selectedId, { actorId: currentUserId, trusted: true });
    messages = (rows || []).map(mapMessageRow);
    var near = isNearBottom();
    renderMessages();
    if (opts.forceScroll || near) scrollToBottom();
    var last = null;
    for (var i = messages.length - 1; i >= 0; i--) {
      if (!messages[i].isSystem) { last = messages[i]; break; }
    }
    if (last) {
      conversations.forEach(function (c) {
        if (String(c.id) === String(selectedId)) {
          c.lastMessage = last.text; c.time = 'Now'; c.unread = 0;
        }
      });
      filterList();
    }
  }

  function renderMessages() {
    var scroll = $('chatScroll');
    if (!scroll) return;
    if (!messages.length) {
      scroll.innerHTML = '<div class="im-chat-empty"><strong>No messages yet</strong>Say hi — keep plans on QuickGigs.</div>';
      return;
    }
    var lastDate = '', html = '', prevFrom = '', prevTs = 0;
    messages.forEach(function (m, idx) {
      if (m.isSystem || m.from === 'system') {
        html += '<div class="im-sys">' + esc(m.text) + '</div>';
        prevFrom = ''; prevTs = 0; return;
      }
      if (m.date !== lastDate) {
        html += '<div class="im-date">' + esc(m.date) + '</div>';
        lastDate = m.date; prevFrom = ''; prevTs = 0;
      }
      var isMe = m.from === 'me';
      var ts = m.ts || 0;
      var next = messages[idx + 1];
      while (next && (next.isSystem || next.from === 'system')) { idx += 1; next = messages[idx + 1]; }
      var nextSame = next && next.from === m.from && next.date === m.date && next.ts && (next.ts - ts) < 120000;
      var grouped = prevFrom === m.from && prevTs && (ts - prevTs) < 120000;
      var showTime = !nextSame;
      html += '<div class="im-bubble-row ' + (isMe ? 'mine' : 'theirs') + (grouped ? ' grouped' : '') + '">' +
        '<div class="im-bubble">' + esc(m.text) + '</div>' +
        (showTime ? '<div class="im-bubble-time">' + esc(m.clock || '') + '</div>' : '') +
      '</div>';
      prevFrom = m.from; prevTs = ts;
    });
    scroll.innerHTML = html;
  }

  function isNearBottom() {
    var scroll = $('chatScroll');
    if (!scroll) return true;
    return (scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight) < 90;
  }
  function scrollToBottom() {
    var scroll = $('chatScroll');
    if (scroll) scroll.scrollTop = scroll.scrollHeight;
  }
  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function () { if (selectedId) refreshMessages(); }, 4000);
  }
  function analyzeFraudLocal(text) {
    if (typeof analyzeOffPlatformContact === 'function') {
      var r = analyzeOffPlatformContact(text);
      if (r && r.blocked) return r;
    }
    return { blocked: false };
  }

  async function sendMessage() {
    var input = $('msgInput');
    var sendBtn = $('sendBtn');
    if (!input || !selectedId || !currentUserId) return;
    var text = (typeof sanitizeInput === 'function' ? sanitizeInput(input.value.trim(), 2000) : input.value.trim());
    if (!text || fraudDetected) return;
    var check = analyzeFraudLocal(text);
    if (check.blocked) {
      fraudDetected = true;
      var fi = $('fraudInline');
      fi.textContent = check.message || 'Keep contact info off QuickGigs.';
      fi.classList.add('show');
      sendBtn.disabled = true;
      return;
    }
    messages.push({ from: 'me', text: text, isSystem: false, ts: Date.now(), date: 'Today', clock: formatClock(new Date().toISOString()) });
    renderMessages(); scrollToBottom();
    input.value = ''; input.style.height = 'auto'; sendBtn.disabled = true;
    var recent = messages.filter(function (m) { return m.from === 'me'; }).slice(-5).map(function (m) { return m.text; });
    var result = typeof sendChatMessage === 'function'
      ? await sendChatMessage(selectedId, currentUserId, text, recent, { convId: selectedId, senderId: currentUserId })
      : { success: false };
    if (!result || !result.success) {
      if (result && (result.blocked || result.error === 'off_platform_contact')) {
        $('fraudInline').textContent = (result && result.message) || 'Message blocked.';
        $('fraudInline').classList.add('show');
      } else if (typeof showToast === 'function') showToast('Could not send. Try again.', '#ef4444');
      await refreshMessages({ forceScroll: true });
      sendBtn.disabled = false;
      return;
    }
    $('fraudInline').classList.remove('show');
    fraudDetected = false;
    await refreshMessages({ forceScroll: true });
    scrollToBottom();
  }

  function wireUi() {
    var search = $('searchInput');
    if (search) search.addEventListener('input', filterList);

    $('convList').addEventListener('click', function (e) {
      var row = e.target && e.target.closest ? e.target.closest('.im-row') : null;
      if (!row) return;
      e.preventDefault();
      var id = row.getAttribute('data-conv');
      // Handler: openConversation(conv_id) — same as href messages.html?conv=<id>
      if (id) openConversation(id);
    });

    $('threadBackBtn').addEventListener('click', function () {
      setChatOpen(false);
      selectedId = '';
      currentConv = null;
      currentPeer = { uid: '', name: '' };
      setSafetyButtons(false);
      if (pollTimer) clearInterval(pollTimer);
      renderList();
      try {
        var u = new URL(window.location.href);
        u.search = '';
        window.history.replaceState({}, '', u.pathname);
      } catch (e3) {}
    });

    var input = $('msgInput');
    var sendBtn = $('sendBtn');
    input.addEventListener('input', function () {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 100) + 'px';
      var val = input.value.trim();
      var check = val ? analyzeFraudLocal(val) : { blocked: false };
      var fi = $('fraudInline');
      if (check.blocked) {
        fraudDetected = true;
        fi.textContent = check.message || 'Keep contact info off QuickGigs.';
        fi.classList.add('show');
        sendBtn.disabled = true;
      } else {
        fraudDetected = false;
        fi.classList.remove('show');
        sendBtn.disabled = !val;
      }
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) sendMessage();
      }
    });
    sendBtn.addEventListener('click', function () { sendMessage(); });

    $('chatReportBtn').addEventListener('click', function () {
      if (!currentPeer.uid) return;
      if (typeof openReportModal === 'function') {
        openReportModal({
          targetType: 'user',
          targetId: currentPeer.uid,
          targetLabel: currentPeer.name || 'User'
        });
      } else if (typeof showToast === 'function') {
        showToast('Report is unavailable right now.', '#f59e0b');
      }
    });

    $('chatBlockBtn').addEventListener('click', async function () {
      if (!currentPeer.uid || !currentUserId) return;
      var ok = window.confirm('Block ' + (currentPeer.name || 'this user') + '? You will not be able to message each other.');
      if (!ok) return;
      if (typeof blockUser !== 'function') {
        if (typeof showToast === 'function') showToast('Block is unavailable.', '#f59e0b');
        return;
      }
      var res = await blockUser(currentUserId, currentPeer.uid);
      if (res && res.success !== false) {
        if (typeof showToast === 'function') showToast('User blocked.', '#16a34a');
        setChatOpen(false);
        selectedId = '';
        await loadConversations();
      } else if (typeof showToast === 'function') {
        showToast('Could not block user.', '#ef4444');
      }
    });
  }

  window.QGMessages = {
    start: function () {
      applyTheme();
      wireUi();
      loadConversations();
      if (typeof renderQuickGigsTabBar === 'function') renderQuickGigsTabBar('messages');
    }
  };
  window.loadConversations = loadConversations;
  window.filterConvs = filterList;
  window.openConversation = openConversation;
})();
</script>
</body>
</html>
