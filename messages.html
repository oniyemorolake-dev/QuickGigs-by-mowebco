<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --msg-bg:#ffffff;
  --msg-elevated:#f2f2f7;
  --msg-separator:#c6c6c8;
  --msg-separator-inset:#e5e5ea;
  --msg-text:#000000;
  --msg-secondary:#8e8e93;
  --msg-blue:#007aff;
  --msg-nav:#f9f9f9;
  --msg-search:#e5e5ea;
  --purple:#6b3fa0;
  --tab-bg:#f9f9f9;
  --text-faint:#8e8e93;
}
body.light{
  --msg-bg:#ffffff;
  --msg-elevated:#f2f2f7;
}
/* Messages uses Apple-like light surface even in dark app mode — readability first */
body.page-messages{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  background:var(--msg-bg)!important;
  color:var(--msg-text)!important;
  font-size:17px;
  min-height:100vh;
  padding-bottom:76px;
  -webkit-font-smoothing:antialiased;
}
body.page-messages.light{background:var(--msg-bg)!important;}

/* Top bar — compact system controls */
.nav{
  position:sticky;top:0;z-index:50;
  background:rgba(249,249,249,0.92)!important;
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:0.5px solid var(--msg-separator-inset)!important;
  padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.back-btn{
  display:inline-flex;align-items:center;gap:2px;
  padding:8px 4px;border:none;background:transparent;
  color:var(--msg-blue)!important;font-size:17px;font-weight:400;
  text-decoration:none;min-height:44px;flex-shrink:0;
}
.back-arrow{font-size:22px;line-height:1;font-weight:400;}
.back-label{display:none;}
.nav-title{display:none;}
.mode-btn{
  padding:6px 10px;border-radius:8px;font-size:13px;cursor:pointer;border:none;
  font-family:inherit;background:transparent;color:var(--msg-blue)!important;
}
body.page-messages .mode-tag,
body.page-messages [data-qg-mode-tag]{display:none!important;}

/* Large title + search — iOS Messages */
.msg-hero{padding:4px 16px 8px;background:var(--msg-bg);}
.msg-large-title{
  font-size:34px;font-weight:700;letter-spacing:-0.5px;line-height:1.15;
  color:var(--msg-text);margin:0 0 12px;padding:0;
}
.search-wrap{padding:0 0 10px;background:transparent;border:none;}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--msg-search)!important;border:none!important;
  border-radius:10px;padding:9px 12px;
}
.search-box:focus-within{outline:none;box-shadow:none;}
.search-icon{color:var(--msg-secondary);opacity:1;font-size:15px;}
.search-input{
  flex:1;background:none;border:none;outline:none;font-family:inherit;
  font-size:17px;color:var(--msg-text);
}
.search-input::placeholder{color:var(--msg-secondary);opacity:1;}
.messages-safety-tip{
  margin:0 16px 8px;padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.4;
  color:#636366;background:var(--msg-elevated);border:none;
}

#mainContent{min-height:40vh;position:relative;z-index:1;background:var(--msg-bg);}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 40px;text-align:center;}
.empty-icon{font-size:48px;margin-bottom:16px;}
.empty-title{font-size:20px;font-weight:600;color:var(--msg-text);margin-bottom:8px;}
.empty-sub{font-size:15px;color:var(--msg-secondary);line-height:1.45;margin-bottom:24px;}
.empty-btn{
  padding:12px 22px;border-radius:12px;background:var(--msg-blue);color:#fff;border:none;
  font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;
}

.section-label{
  padding:18px 16px 6px;font-size:13px;font-weight:600;text-transform:none;
  letter-spacing:0;color:var(--msg-secondary);
}

/* Conversation row — Apple Messages list */
body.page-messages a.conv-item,
a.conv-item,
.conv-item{
  display:flex!important;
  flex-direction:row!important;
  align-items:center!important;
  gap:0!important;
  padding:10px 16px 10px 12px!important;
  margin:0!important;
  width:100%!important;
  box-sizing:border-box!important;
  cursor:pointer!important;
  user-select:none!important;
  -webkit-user-select:none!important;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:rgba(0,0,0,0.06);
  touch-action:manipulation;
  text-decoration:none!important;
  color:var(--msg-text)!important;
  background:var(--msg-bg)!important;
  border:0!important;
  border-radius:0!important;
  position:relative;
}
body.page-messages a.conv-item:link,
body.page-messages a.conv-item:visited,
body.page-messages a.conv-item:hover,
body.page-messages a.conv-item:active,
a.conv-item:link,a.conv-item:visited,a.conv-item:hover,a.conv-item:active{
  color:var(--msg-text)!important;
  text-decoration:none!important;
}
body.page-messages a.conv-item *,
a.conv-item *{text-decoration:none!important;user-select:none!important;-webkit-user-select:none!important;}
.conv-item:active{background:#d1d1d6!important;}
.conv-item+.conv-item::before{
  content:'';position:absolute;left:78px;right:0;top:0;height:0.5px;background:var(--msg-separator-inset);
}

.conv-unread-col{
  width:14px;flex:0 0 14px;display:flex;align-items:center;justify-content:center;align-self:stretch;
}
.conv-unread-dot{
  width:10px;height:10px;border-radius:50%;background:var(--msg-blue);
  box-shadow:0 0 0 0.5px rgba(0,122,255,0.2);
}
.conv-unread-dot.is-hidden{visibility:hidden;}

.conv-avatar-link{flex:0 0 52px!important;width:52px!important;height:52px!important;display:block!important;margin-right:12px;}
.conv-avatar{
  width:52px!important;height:52px!important;min-width:52px!important;min-height:52px!important;
  border-radius:50%!important;display:flex!important;align-items:center!important;justify-content:center!important;
  font-size:20px!important;font-weight:600!important;color:#fff!important;flex-shrink:0!important;position:relative!important;
  background-size:cover!important;background-position:center!important;overflow:hidden!important;box-sizing:border-box!important;
}
.conv-avatar.has-photo{color:transparent!important;}
.conv-avatar img{
  width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;
  object-fit:cover!important;display:block!important;border-radius:inherit!important;-webkit-user-drag:none;
}
.unread-dot{display:none!important;}

.conv-info{flex:1 1 auto!important;min-width:0!important;padding-right:8px;}
.conv-name{
  font-size:17px!important;font-weight:600!important;color:var(--msg-text)!important;
  margin:0 0 2px!important;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.conv-task,.conv-role-pill{display:none!important;}
.conv-preview{
  font-size:15px!important;font-weight:400!important;color:var(--msg-secondary)!important;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;
}
.conv-preview.unread{color:#3a3a3c!important;font-weight:500!important;}

.conv-right{
  display:flex!important;flex-direction:column!important;align-items:flex-end!important;
  gap:6px!important;flex-shrink:0!important;align-self:flex-start;padding-top:2px;
}
.conv-time{font-size:15px!important;color:var(--msg-secondary)!important;font-weight:400;}
.conv-chevron{color:#c7c7cc;font-size:14px;font-weight:600;line-height:1;}
.conv-badge{display:none!important;}

body.page-messages .nav,
body.page-messages .search-wrap,
body.page-messages #qgTabBar{display:flex!important;visibility:visible!important;opacity:1!important;}
body.page-messages .search-wrap{display:block!important;}
body.page-messages .nav{align-items:center!important;}

.locked-banner{
  margin:8px 16px;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;
  background:var(--msg-elevated);border:none;
}
.locked-icon{font-size:22px;flex-shrink:0;}
.locked-title{font-size:14px;font-weight:600;color:var(--msg-text);margin-bottom:2px;}
.locked-sub{font-size:13px;color:var(--msg-secondary);line-height:1.4;}

.tab-bar{
  position:fixed;bottom:0;left:0;right:0;background:rgba(249,249,249,0.94)!important;
  border-top:0.5px solid var(--msg-separator-inset)!important;
  display:flex!important;padding:6px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:100;
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  visibility:visible!important;opacity:1!important;pointer-events:auto;min-height:56px;
}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;text-decoration:none;color:var(--msg-secondary)!important;}
.tab-icon{font-size:22px;color:inherit;line-height:1;}
.tab-lbl{font-size:10px;color:inherit;}
.tab-item.active .tab-icon,.tab-item.active .tab-lbl{color:var(--msg-blue)!important;}
body.page-messages #qgTabBar,body[data-qg-page="messages"] #qgTabBar{display:flex!important;}
.app-legal-footer{text-align:center;padding:16px 16px 96px;font-size:11px;color:var(--msg-secondary);line-height:1.7;}
.app-legal-footer a{color:var(--msg-blue);text-decoration:none;}

<script>
(function () {
  function paintMessagesTabBar() {
    if (typeof renderQuickGigsTabBar === 'function') {
      renderQuickGigsTabBar('messages');
      return true;
    }
    return false;
  }
  window.paintMessagesTabBar = paintMessagesTabBar;
  function ensureMessagesTabBar() {
    if (paintMessagesTabBar()) return;
    var tries = 0;
    var t = setInterval(function () {
      tries += 1;
      if (paintMessagesTabBar() || tries > 40) clearInterval(t);
    }, 50);
  }
  ensureMessagesTabBar();
  document.addEventListener('DOMContentLoaded', ensureMessagesTabBar);
  window.addEventListener('load', ensureMessagesTabBar);

  var back = document.getElementById('messagesBackBtn');
  if (back) {
    back.addEventListener('click', function (e) {
      try {
        if (window.history.length > 1 && document.referrer && /quickgigs|localhost|127\.0\.0\.1/i.test(document.referrer)) {
          e.preventDefault();
          window.history.back();
        }
      } catch (err) {}
    });
  }
})();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbYJxU-3r7qVMqwzXHiC-qRkZNtmGobm0",
  authDomain: "quickgigs-7b12d.firebaseapp.com",
  projectId: "quickgigs-7b12d",
  storageBucket: "quickgigs-7b12d.firebasestorage.app",
  messagingSenderId: "698985399366",
  appId: "1:698985399366:web:8a3ca60c5f3ffac84bb647"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let authChecked = false;
const redirectTimeout = setTimeout(() => {
  if (!authChecked) window.location.href = 'login.html';
}, 3000);
window._auth = auth;
onAuthStateChanged(auth, (user) => {
  authChecked = true;
  clearTimeout(redirectTimeout);
  if (!user) { window.location.href = 'login.html'; return; }
  if (typeof setCurrentUser === 'function') setCurrentUser(user);
  else window._currentUser = user;
  function startMessages(tries) {
    tries = tries || 0;
    if (typeof window.loadConversations !== 'function') {
      if (tries < 80) setTimeout(function () { startMessages(tries + 1); }, 50);
      else showMessagesBootError('Messages script failed to load. Hard refresh and try again.');
      return;
    }
    var uid = (window._currentUser && window._currentUser.uid) || (user && user.uid);
    if (!uid) {
      if (tries < 40) setTimeout(function () { startMessages(tries + 1); }, 50);
      else showMessagesBootError('Could not verify your account. Sign in again.');
      return;
    }
    window.loadConversations().catch(function (err) {
      console.error('[QuickGigs messages] loadConversations rejected:', err);
      showMessagesBootError('Could not load messages. Check your connection and try again.');
    });
  }
  startMessages(0);
});

function showMessagesBootError(msg) {
  var content = (typeof ensureMessagesChrome === 'function' ? ensureMessagesChrome() : null) ||
    document.getElementById('mainContent');
  if (!content) return;
  var safe = typeof escapeHtml === 'function' ? escapeHtml(msg) : String(msg || 'Something went wrong.');
  content.innerHTML = '<div class="empty-state"><div class="empty-title">Messages unavailable</div><div class="empty-sub">' + safe + '</div><a class="empty-btn" href="messages.html">↻ Retry</a></div>';
  if (typeof paintMessagesTabBar === 'function') paintMessagesTabBar();
  else if (typeof renderQuickGigsTabBar === 'function') renderQuickGigsTabBar('messages');
}
window.showMessagesBootError = showMessagesBootError;
</script>

<script>
// ── THEME (shared qg-theme.js — storage key: localStorage qg-theme) ──
var isDark = typeof QG_isDarkTheme === 'function' ? QG_isDarkTheme() : (localStorage.getItem('qg-theme') !== 'light');

/** Recreate messages chrome if an older qg-ux wrap / bad DOM left footer-only. */
function ensureMessagesChrome() {
  var body = document.body;
  if (!body) return null;

  // Unwrap leftover wrappers that hide header/tabs (blank / text-only layout)
  try {
    document.querySelectorAll('main#main, main.qg-main').forEach(function (el) {
      if (!el || !el.parentNode) return;
      while (el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
      el.parentNode.removeChild(el);
    });
  } catch (eUnwrap) {}

  if (!document.getElementById('messagesHeader')) {
    var nav = document.createElement('nav');
    nav.className = 'nav';
    nav.id = 'messagesHeader';
    nav.innerHTML =
      '<a class="back-btn" href="dashboard.html" id="messagesBackBtn" aria-label="Back to dashboard">' +
      '<span class="back-arrow" aria-hidden="true">←</span><span class="back-label">Back</span></a>' +
      '<div class="nav-title">Messages</div>' +
      '<div class="nav-right" style="display:flex;gap:8px;align-items:center">' +
      '<button type="button" class="mode-btn" onclick="typeof switchRoleMode===\'function\'&&switchRoleMode()">Switch mode</button>' +
      '<button type="button" class="mode-btn" id="modeBtn" onclick="toggleTheme()">☀️ Light</button>' +
      '</div>';
    body.insertBefore(nav, body.firstChild);
  } else {
    var hdr = document.getElementById('messagesHeader');
    hdr.style.display = '';
    hdr.hidden = false;
    if (!document.getElementById('modeBtn')) {
      var right = document.querySelector('#messagesHeader .nav-right');
      if (right) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mode-btn';
        btn.id = 'modeBtn';
        btn.setAttribute('onclick', 'toggleTheme()');
        btn.textContent = isDark ? '☀️ Light' : '🌙 Dark';
        right.appendChild(btn);
      }
    }
  }

  if (!document.querySelector('.search-wrap')) {
    var search = document.createElement('div');
    search.className = 'search-wrap';
    search.innerHTML =
      '<div class="search-box"><span class="search-icon">🔍</span>' +
      '<input class="search-input" id="searchInput" placeholder="Search conversations..." oninput="filterConvs()"></div>';
    var afterNav = document.getElementById('messagesHeader');
    if (afterNav && afterNav.nextSibling) afterNav.parentNode.insertBefore(search, afterNav.nextSibling);
    else body.insertBefore(search, body.firstChild);
  }

  var content = document.getElementById('mainContent');
  if (!content) {
    content = document.createElement('div');
    content.id = 'mainContent';
    content.setAttribute('role', 'main');
    content.className = 'qg-main';
    content.innerHTML =
      '<div class="empty-state" id="messagesBootState">' +
      '<div class="empty-title">Loading messages…</div>' +
      '<div class="empty-sub">Pulling your conversations.</div></div>';
    var before = document.getElementById('siteFooter') || document.getElementById('qgTabBar');
    if (before && before.parentNode) before.parentNode.insertBefore(content, before);
    else body.appendChild(content);
  }

  if (!document.getElementById('qgTabBar')) {
    var tab = document.createElement('nav');
    tab.className = 'tab-bar';
    tab.id = 'qgTabBar';
    tab.setAttribute('data-qg-nav-active', 'messages');
    tab.setAttribute('aria-label', 'Main');
    body.appendChild(tab);
  } else {
    var tabEl = document.getElementById('qgTabBar');
    tabEl.style.display = 'flex';
    tabEl.hidden = false;
  }

  if (!document.getElementById('siteFooter')) {
    var foot = document.createElement('footer');
    foot.className = 'app-legal-footer site-footer';
    foot.id = 'siteFooter';
    var tabBar = document.getElementById('qgTabBar');
    if (tabBar && tabBar.parentNode) tabBar.parentNode.insertBefore(foot, tabBar);
    else body.appendChild(foot);
  }

  return content;
}
window.ensureMessagesChrome = ensureMessagesChrome;

function applyTheme(){
  try {
    ensureMessagesChrome();
    if (typeof QG_applyTheme === 'function') {
      QG_applyTheme(isDark, 'modeBtn', false);
    } else {
      if (document.documentElement && document.documentElement.classList) {
        document.documentElement.classList.toggle('light', !isDark);
      }
      if (document.body && document.body.classList) {
        document.body.classList.toggle('light', !isDark);
      }
      var b = document.getElementById('modeBtn');
      if (b) b.textContent = isDark ? '☀️ Light' : '🌙 Dark';
    }
    // Re-assert page + role chrome after theme paint — never throw if body was stripped
    if (document.body && document.body.classList) {
      document.body.classList.add('page-messages');
    }
    if (typeof applyRoleTheme === 'function') applyRoleTheme();
  } catch (themeErr) {
    console.warn('[QuickGigs messages] applyTheme skipped:', themeErr);
  }
}
window.toggleTheme = function(){
  isDark = !isDark;
  if (typeof QG_setThemeDark === 'function') QG_setThemeDark(isDark);
  else try { localStorage.setItem('qg-theme', isDark ? 'dark' : 'light'); } catch (e) {}
  applyTheme();
};
if (document.body) applyTheme();
else document.addEventListener('DOMContentLoaded', applyTheme);
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function () {
    ensureMessagesChrome();
    applyTheme();
  });
} else {
  ensureMessagesChrome();
  applyTheme();
}

var conversations = [];
var filtered = [];
var userAvatars = {};
var CAT_ICONS = {home:'🏠',errands:'🚗',tutoring:'🎓',beauty:'💇',moving:'🚚',cooking:'🍳',tech:'💻',care:'👶',gardening:'🌿',events:'🎉',trades:'🔧',other:'📦'};
var AVATAR_GRADIENTS = [
  'linear-gradient(135deg,#6b3fa0,#c8a8e9)',
  'linear-gradient(135deg,#16a34a,#4ade80)',
  'linear-gradient(135deg,#d97706,#fbbf24)',
  'linear-gradient(135deg,#9b6fc4,#c8a8e9)',
  'linear-gradient(135deg,#2563eb,#60a5fa)'
];

function esc(s){
  return typeof escapeHtml === 'function' ? escapeHtml(s)
    : (typeof qgEsc === 'function' ? qgEsc(s)
      : String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'));
}

function avatarGradient(name){
  var n = 0;
  for(var i = 0; i < (name || '').length; i++) n += name.charCodeAt(i);
  return AVATAR_GRADIENTS[n % AVATAR_GRADIENTS.length];
}

function formatRelativeTime(iso){
  if(!iso) return '';
  var diff = Date.now() - new Date(iso).getTime();
  var mins = Math.floor(diff / 60000);
  if(mins < 1) return 'Just now';
  if(mins < 60) return mins + 'm ago';
  var hrs = Math.floor(mins / 60);
  if(hrs < 24) return hrs + 'hr ago';
  var days = Math.floor(hrs / 24);
  if(days === 1) return 'Yesterday';
  if(days < 7) return days + 'd ago';
  return new Date(iso).toLocaleDateString('en-CA', {month:'short', day:'numeric'});
}

function countUnread(conv, userId){
  var lastRead = userId === conv.poster_id ? conv.poster_last_read_at : conv.worker_last_read_at;
  if(!conv.last_message_at) return 0;
  if(!lastRead) return conv.last_message && conv.last_message_at ? 1 : 0;
  return new Date(conv.last_message_at) > new Date(lastRead) ? 1 : 0;
}

function mapConversation(conv, userId){
  var posterId = conv.poster_id != null ? conv.poster_id : conv.POSTER_ID;
  var workerId = conv.worker_id != null ? conv.worker_id : conv.WORKER_ID;
  var convId = conv.conv_id != null ? conv.conv_id : conv.CONV_ID;
  var taskId = conv.task_id != null ? conv.task_id : conv.TASK_ID;
  var iAmPoster = String(posterId) === String(userId);
  // otherUid = the OTHER party's firebase_uid (never me)
  var otherUid = iAmPoster ? workerId : posterId;
  otherUid = otherUid != null && String(otherUid) !== '' && String(otherUid) !== 'null'
    ? String(otherUid) : '';
  var otherName = iAmPoster ? (conv.worker_name || conv.WORKER_NAME || 'Tasker') : (conv.poster_name || conv.POSTER_NAME || 'Poster');
  if (typeof isGenericDisplayName === 'function') {
    if (isGenericDisplayName(otherName)) otherName = iAmPoster ? 'Tasker' : 'Poster';
  }
  var cat = (conv.task_category || conv.TASK_CATEGORY || 'other').toLowerCase();
  return {
    id: convId,
    conv_id: convId,
    taskId: taskId,
    posterId: posterId,
    workerId: workerId,
    myRole: iAmPoster ? 'poster' : 'tasker',
    rolePill: iAmPoster ? "You're the poster" : "You're the tasker",
    otherUid: otherUid,
    name: otherName,
    initials: otherName.charAt(0).toUpperCase(),
    avatarUrl: otherUid ? (userAvatars[String(otherUid)] || '') : '',
    avatarBg: avatarGradient(otherName),
    taskName: conv.task_title || conv.TASK_TITLE || 'Task',
    taskIcon: CAT_ICONS[cat] || '📦',
    lastMessage: conv.last_message || conv.LAST_MESSAGE || 'No messages yet',
    time: formatRelativeTime(conv.last_message_at || conv.LAST_MESSAGE_AT || conv.created_at || conv.CREATED_AT),
    unread: countUnread({
      poster_id: posterId,
      worker_id: workerId,
      poster_last_read_at: conv.poster_last_read_at,
      worker_last_read_at: conv.worker_last_read_at,
      last_message: conv.last_message || conv.LAST_MESSAGE,
      last_message_at: conv.last_message_at || conv.LAST_MESSAGE_AT
    }, userId),
    status: (conv.status || '').toLowerCase() === 'application' ? 'in_progress'
      : ((conv.status || '').toLowerCase() === 'completed' ? 'completed' : 'in_progress'),
    paid: conv.is_unlocked,
    locked: !conv.is_unlocked
  };
}

function conversationsForCurrentMode(list) {
  // Show ALL threads for this firebase_uid. Filtering by poster/tasker mode hid
  // accepted chats when the user was in the "other" workspace mode — felt like
  // Messages "wouldn't open". Role pill still labels each row.
  return (list || []).slice();
}

async function loadConversations(){
  var userId = window._currentUser ? window._currentUser.uid : null;
  var content = typeof ensureMessagesChrome === 'function'
    ? ensureMessagesChrome()
    : document.getElementById('mainContent');
  if (!content) {
    content = document.getElementById('mainContent');
  }
  if (!content) {
    console.error('[QuickGigs messages] #mainContent missing after ensureMessagesChrome');
    if (typeof showToast === 'function') {
      showToast('Messages layout failed — hard refresh and try again.', '#ef4444');
    }
    return;
  }
  if (!userId) {
    content.innerHTML = '<div class="empty-state"><div class="empty-title">Signing you in…</div><div class="empty-sub">Hang tight.</div></div>';
    return;
  }
  // Always keep bottom nav painted, even if the list fetch fails
  try {
    if (typeof paintMessagesTabBar === 'function') paintMessagesTabBar();
    else if (typeof renderQuickGigsTabBar === 'function') renderQuickGigsTabBar('messages');
    if (typeof applyTheme === 'function') applyTheme();
    else if (typeof applyRoleTheme === 'function') applyRoleTheme();
  } catch (chromeErr) {
    console.warn('[QuickGigs messages] chrome paint:', chromeErr);
  }

  if (typeof getConversationsForUser !== 'function') {
    content.innerHTML = '<div class="empty-state"><div class="empty-icon">'+(typeof qgIcon==='function'?qgIcon('alert',{size:24}):'')+'</div><div class="empty-title">Messages failed to load</div><div class="empty-sub">Refresh the page. If this keeps happening, check your connection.</div><a class="empty-btn" href="messages.html">↻ Retry</a></div>';
    return;
  }
  if (typeof syncCurrentUserProfile === 'function' && window._currentUser) {
    try { await syncCurrentUserProfile(window._currentUser); } catch (eSync) {
      console.warn('[QuickGigs messages] profile sync skipped:', eSync);
    }
  }
  content.innerHTML = '<div class="empty-state"><div class="empty-icon">'+(typeof qgIcon==='function'?qgIcon('clock',{size:24}):'')+'</div><div class="empty-title">Loading messages...</div></div>';

  try {
    var rows = await getConversationsForUser(userId);
    var rule = typeof window.getChatUnlockRule === 'function'
      ? window.getChatUnlockRule()
      : ((window.QG_CONFIG && window.QG_CONFIG.chatUnlockAfter) || 'accept');
    if (rule === 'payment' && typeof syncConversationUnlock === 'function') {
      var hadLocked = false;
      await Promise.all((rows || []).map(function (c) {
        if (c.is_unlocked) return Promise.resolve();
        hadLocked = true;
        return syncConversationUnlock(c.conv_id, userId).catch(function () {});
      }));
      if (hadLocked) {
        rows = await getConversationsForUser(userId);
      }
    } else if (rule === 'accept' && typeof forceUnlockConversationForTask === 'function') {
      // When Stripe is live, restore the escrow-gated contact rule — chat unlocks only after
      // escrow is funded. Currently gated on acceptance because payments are off.
      var unlockedAny = false;
      await Promise.all((rows || []).map(function (c) {
        if (c.is_unlocked && String(c.status || '').toLowerCase() !== 'application') {
          return Promise.resolve();
        }
        unlockedAny = true;
        return forceUnlockConversationForTask(c, 'in_progress').catch(function () {});
      }));
      if (unlockedAny) {
        rows = await getConversationsForUser(userId);
      }
    }
    if (typeof getUsersAvatarMap === 'function') {
      userAvatars = await getUsersAvatarMap().catch(function() { return {}; });
    }
    var enriched = typeof enrichConversationNames === 'function'
      ? await Promise.all((rows || []).map(function(c) { return enrichConversationNames(c); }))
      : (rows || []);
    conversations = conversationsForCurrentMode(enriched.map(function(c){ return mapConversation(c, userId); }));
    filtered = conversations.slice();
    // Re-resolve in case chrome was restored mid-fetch
    content = document.getElementById('mainContent') || content;
    renderContent();
    if (typeof paintMessagesTabBar === 'function') paintMessagesTabBar();
    else if (typeof renderQuickGigsTabBar === 'function') renderQuickGigsTabBar('messages');
    if (typeof applyRoleTheme === 'function') applyRoleTheme();
    // Keep light/dark in sync after role chrome mutates classes
    if (typeof applyTheme === 'function') applyTheme();
    else if (typeof QG_paintTheme === 'function' && typeof QG_isDarkTheme === 'function') {
      QG_paintTheme(QG_isDarkTheme());
    }
    if (typeof isSupabaseUsingStaleCache === 'function' && isSupabaseUsingStaleCache()) {
      showStaleDataBanner();
    }
  } catch(err) {
    console.error('Failed to load conversations:', err);
    var hint = String(err && err.message || '').indexOf('401') >= 0
      ? 'Session error — hard refresh and log in again.'
      : 'Could not load messages — check your connection and try again.';
    var escHint = typeof escapeHtml === 'function' ? escapeHtml(hint)
      : (typeof qgEsc === 'function' ? qgEsc(hint) : String(hint).replace(/</g, '&lt;'));
    content = document.getElementById('mainContent') || (typeof ensureMessagesChrome === 'function' ? ensureMessagesChrome() : null) || content;
    if (content) {
      content.innerHTML = '<div class="empty-state"><div class="empty-icon">'+(typeof qgIcon==='function'?qgIcon('alert',{size:24}):'')+'</div><div class="empty-title">Could not load messages</div><div class="empty-sub">'+escHint+'</div><a class="empty-btn" href="messages.html">↻ Retry</a></div>';
    }
    if (typeof paintMessagesTabBar === 'function') paintMessagesTabBar();
  }
}

window.loadConversations = loadConversations;
window.onQuickGigsModeChange = function () {
  if (typeof loadConversations === 'function') loadConversations();
  else window.location.reload();
};

function renderContent(){
  var content = document.getElementById('mainContent') ||
    (typeof ensureMessagesChrome === 'function' ? ensureMessagesChrome() : null);
  if (!content) {
    console.error('[QuickGigs messages] renderContent: #mainContent missing');
    return;
  }

  // No conversations at all
  if(!conversations.length){
    content.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-icon">'+(typeof qgIcon==='function'?qgIcon('message',{size:24}):'')+'</div>' +
        '<div class="empty-title">No messages yet</div>' +
        '<div class="empty-sub">Accept an applicant (Poster) or get accepted on a task (Tasker) — chats show up here for both sides.</div>' +
        '<a class="empty-btn" href="mytasks.html">Go to My Tasks</a>' +
        '<a class="empty-btn" href="browsetask.html" style="margin-top:10px;display:inline-block">Browse tasks</a>' +
      '</div>';
    return;
  }

  // Banner — only when chat is payment-gated
  var html = '';
  var rule = (window.QG_CONFIG && window.QG_CONFIG.chatUnlockAfter) || 'accept';
  if (typeof window.getChatUnlockRule === 'function') rule = window.getChatUnlockRule();
  if (rule === 'payment') {
    var bannerCopy = typeof getMessagesBannerCopy === 'function' ? getMessagesBannerCopy() : {
      title: 'Chat locked until payment',
      sub: 'Messaging opens after the poster pays through QuickGigs.'
    };
    html += '<div class="locked-banner">' +
      '<div class="locked-icon">🔒</div>' +
      '<div class="locked-text">' +
        '<div class="locked-title">'+window.escapeHtml(bannerCopy.title)+'</div>' +
        '<div class="locked-sub">'+window.escapeHtml(bannerCopy.sub)+'</div>' +
      '</div>' +
    '</div>';
  }

  // Active conversations
  var active = filtered.filter(function(c){ return c.status === 'in_progress'; });
  var completed = filtered.filter(function(c){ return c.status === 'completed'; });

  if(active.length){
    html += '<div class="section-label">Active</div>';
    html += active.map(renderConvItem).join('');
  }

  if(completed.length){
    html += '<div class="section-label">Completed</div>';
    html += completed.map(renderConvItem).join('');
  }

  content.innerHTML = html;
}

/**
 * Native navigation — conv_id alone is enough (chat.html reads ?conv=).
 * Append task/peer when present for faster resolve / debugging.
 */
function chatThreadHref(convId, taskId, otherUid) {
  var id = String(convId || '').trim();
  if (!id || id === 'undefined' || id === 'null') return '';
  var href = 'chat.html?conv=' + encodeURIComponent(id);
  var task = taskId != null && String(taskId) !== '' && String(taskId) !== 'null' ? String(taskId) : '';
  var peer = otherUid ? String(otherUid) : '';
  if (task) href += '&task=' + encodeURIComponent(task);
  if (peer) href += '&peer=' + encodeURIComponent(peer);
  return href;
}

window.chatThreadHref = chatThreadHref;

function renderConvItem(c){
  var convId = c && (c.conv_id || c.id) ? String(c.conv_id || c.id) : '';
  var taskId = c && (c.taskId != null ? c.taskId : c.task_id);
  var otherUid = c && c.otherUid ? String(c.otherUid) : '';
  if (!otherUid && c) {
    // Fallback: derive peer from poster/worker ids if map left otherUid empty
    var me = window._currentUser && window._currentUser.uid ? String(window._currentUser.uid) : '';
    if (c.workerId && String(c.workerId) !== me) otherUid = String(c.workerId);
    else if (c.posterId && String(c.posterId) !== me) otherUid = String(c.posterId);
  }
  var threadHref = chatThreadHref(convId, taskId, otherUid);
  console.info('[QuickGigs messages] row', {
    conv_id: convId,
    taskId: taskId != null ? String(taskId) : '',
    otherUid: otherUid,
    href: threadHref
  });
  var avatarInner = typeof renderUserAvatarHtml === 'function'
    ? renderUserAvatarHtml(c.name, c.avatarUrl, { className: 'conv-avatar', gradient: c.avatarBg, size: 52 })
    : ('<div class="conv-avatar" style="background:'+c.avatarBg+'">'+esc(c.initials)+'</div>');
  var preview = (c.lastMessage && c.lastMessage !== 'No messages yet')
    ? c.lastMessage
    : ((c.taskIcon ? c.taskIcon + ' ' : '') + (c.taskName || 'Task'));
  var unread = c.unread > 0;
  // Only disable when conv_id is truly missing — chat.html loads by ?conv= alone.
  if (!threadHref) {
    return '<div class="conv-item" aria-disabled="true" style="opacity:0.55;cursor:default">' +
      '<div class="conv-unread-col"><span class="conv-unread-dot is-hidden"></span></div>' +
      '<div class="conv-avatar-link">' + avatarInner + '</div>' +
      '<div class="conv-info">' +
        '<div class="conv-name">'+esc(c.name)+'</div>' +
        '<div class="conv-preview">Conversation unavailable</div>' +
      '</div></div>';
  }
  var rowStyle = 'display:flex!important;flex-direction:row!important;align-items:center!important;width:100%;box-sizing:border-box;text-decoration:none!important;color:inherit!important;cursor:pointer;-webkit-user-select:none;user-select:none;';
  return '<a class="conv-item" href="'+esc(threadHref)+'"' +
    ' style="'+rowStyle+'"' +
    ' data-open-conv="'+esc(convId)+'"' +
    ' data-task-id="'+esc(String(taskId == null ? '' : taskId))+'"' +
    ' data-peer="'+esc(otherUid)+'">' +
    '<div class="conv-unread-col"><span class="conv-unread-dot'+(unread?'':' is-hidden')+'" aria-hidden="true"></span></div>' +
    '<div class="conv-avatar-link">' + avatarInner + '</div>' +
    '<div class="conv-info">' +
      '<div class="conv-name">'+esc(c.name)+'</div>' +
      '<div class="conv-preview'+(unread?' unread':'')+'">'+esc(preview)+'</div>' +
    '</div>' +
    '<div class="conv-right">' +
      '<div class="conv-time">'+esc(c.time)+'</div>' +
      '<div class="conv-chevron" aria-hidden="true">›</div>' +
    '</div>' +
  '</a>';
}

function getStatusLabel(status){
  return '';
}

window.filterConvs = function(){
  var q = document.getElementById('searchInput').value.toLowerCase().trim();
  filtered = !q ? conversations.slice() : conversations.filter(function(c){
    return c.name.toLowerCase().includes(q) || c.taskName.toLowerCase().includes(q);
  });
  renderContent();
};

function showStaleDataBanner() {
  var content = document.getElementById('mainContent');
  if (!content || content.querySelector('.stale-data-banner')) return;
  var banner = document.createElement('div');
  banner.className = 'stale-data-banner locked-banner';
  banner.style.margin = '12px 20px 0';
  banner.innerHTML = '<div class="locked-icon">'+(typeof qgIcon==='function'?qgIcon('alert',{size:24}):'')+'</div><div><div class="locked-title">Showing saved messages</div><div class="locked-sub">Could not reach Supabase. Run supabase/beta-setup-all.sql if tasks and chats keep disappearing after updates.</div></div>';
  content.insertBefore(banner, content.firstChild);
}
