<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent consent — QuickGigs</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="qg-trust.css">
<link rel="stylesheet" href="qg-tokens.css?v=20260811shell1" id="qg-tokens-css">
<link rel="stylesheet" href="qg-guardian.css?v=20260811guardian1" id="qg-guardian-css">
<script src="qg-theme.js"></script>
<script src="qg-brand-init.js"></script>

</head>
<body class="trust-page page-parent-consent">
<nav class="nav">
  <a class="nav-logo" href="index.html">QuickGigs</a>
  <div class="nav-right"><a class="back-btn" href="index.html">← Home</a></div>
</nav>
<main class="content">
  <span class="page-label">Family</span>
  <h1 class="page-title">Parent or guardian consent</h1>
  <p class="page-date">Required for members aged 16–17</p>

  <div class="consent-card" id="consentCard">
    <p class="consent-loading" id="consentLoading">Loading consent details…</p>
  </div>

  <div class="info-box" style="margin-top:24px">
    <p>By approving, you confirm you are the parent/legal guardian, agree to our <a href="terms.html">Terms</a>, and will receive all payments for tasks your teen completes.</p>
  </div>
</main>
<footer class="site-footer" id="siteFooter"></footer>
<script src="qg-utils.js?v=20260728welcome1"></script>
<script src="qg-config.js?v=20260729teen1"></script>
<script src="supabaseClient.js?v=20260727perf"></script>
<script src="supabase-db.js?v=20260727perf"></script>
<script src="qg-cookies.js"></script>
<script src="qg-site.js"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var payoutState = params.get('payout');
  var card = document.getElementById('consentCard');
  var endpoint = (window.QG_CONFIG && window.QG_CONFIG.guardianConsentUrl) ||
    'https://nuyfqsxstsrbloztzgau.supabase.co/functions/v1/guardian-consent';

  async function consentRequest(action, extra) {
    var response = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ token: token, action: action }, extra || {}))
    });
    var data = await response.json().catch(function () { return {}; });
    if (!response.ok || data.ok === false) {
      throw new Error(data.error || 'consent_failed');
    }
    return data;
  }

  if (payoutState === 'done') {
    card.innerHTML = '<p class="consent-ok">Guardian payout details were submitted to Stripe.</p><p class="consent-payout-note">Stripe may take a short time to finish verification.</p>';
    return;
  }
  if (payoutState === 'refresh') {
    card.innerHTML = '<div class="consent-verify-step"><strong>Payout link expired</strong>The payout setup link expired before setup was completed. Ask QuickGigs support for a new guardian payout link.</div>';
    return;
  }
  if (!token) {
    card.textContent = '';
    var miss = document.createElement('p');
    miss.className = 'consent-err';
    miss.textContent = 'Missing consent link. Ask your teen to resend from their QuickGigs dashboard.';
    card.appendChild(miss);
    return;
  }

  consentRequest('preview').then(function (result) {
    var user = result.teen || {};
    var teen = user.name || 'Your teen';
    card.innerHTML =
      '<h2>Approve account</h2>' +
      '<p class="consent-teen"><strong></strong> wants to use QuickGigs as a Tasker</p>' +
      '<div class="teen-details"><strong>Teen details</strong><br>Name: <span id="teenDetailName"></span><br>Age band: 16–17<span id="teenDetailDobWrap"></span></div>' +
      '<ul class="consent-points">' +
        '<li>QuickGigs is a local marketplace for paid help — errands, home help, and similar gigs.</li>' +
        '<li>Your teen can browse and apply as a Tasker. You approve each job application before the poster sees it.</li>' +
        '<li>Completed-gig payouts route to your guardian Stripe account — not directly to the teen.</li>' +
      '</ul>' +
      '<label class="consent-check"><input type="checkbox" id="termsAccepted"> <span>I am this teen’s parent or legal guardian and accept the <a href="terms.html" target="_blank" rel="noopener">QuickGigs Terms of Service</a>.</span></label>' +
      '<button type="button" class="consent-btn" id="approveBtn" disabled>Approve account</button><br>' +
      '<button type="button" class="consent-decline" id="declineBtn">Decline</button>' +
      '<p id="consentMsg" style="margin-top:12px"></p>';
    var strongEl = card.querySelector('.consent-teen strong');
    if (strongEl) strongEl.textContent = teen;
    var detailName = document.getElementById('teenDetailName');
    var dobWrap = document.getElementById('teenDetailDobWrap');
    if (detailName) detailName.textContent = teen;
    if (dobWrap) dobWrap.textContent = user.date_of_birth ? (' · Date of birth: ' + String(user.date_of_birth)) : '';
    var terms = document.getElementById('termsAccepted');
    var approve = document.getElementById('approveBtn');
    if (terms && approve) terms.onchange = function () { approve.disabled = !terms.checked; };

    if (approve) approve.onclick = async function () {
      var btn = document.getElementById('approveBtn');
      btn.disabled = true;
      btn.textContent = 'Approving…';
      var msg = document.getElementById('consentMsg');
      try {
        var approved = await consentRequest('approve', { terms_accepted: true });
        card.innerHTML = '<p class="consent-ok">Approved. <strong></strong> can now apply as a Tasker (you still approve each gig).</p>' +
          '<div class="consent-verify-step"><strong>Next: guardian payouts</strong>Completed-gig payouts for this teen must go to your Stripe account.</div>' +
          '<button type="button" class="consent-btn" id="payoutBtn">Set up guardian payouts</button>' +
          '<p class="consent-payout-note">You can finish Stripe verification now or return later from your email link.</p>';
        var strongDone = card.querySelector('strong');
        if (strongDone) strongDone.textContent = teen;
        var payoutBtn = document.getElementById('payoutBtn');
        if (payoutBtn) payoutBtn.onclick = async function () {
          payoutBtn.disabled = true;
          payoutBtn.textContent = 'Opening Stripe…';
          try {
            var connectUrl = (window.QG_CONFIG && window.QG_CONFIG.connectLinkUrl) ||
              'https://nuyfqsxstsrbloztzgau.supabase.co/functions/v1/create-connect-link';
            var connectRes = await fetch(connectUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ guardian_token: approved.payout_token })
            });
            var connect = await connectRes.json();
            if (!connectRes.ok || !connect.url) throw new Error(connect.error || 'payout_setup_failed');
            window.location.href = connect.url;
          } catch (payoutErr) {
            payoutBtn.disabled = false;
            payoutBtn.textContent = 'Set up guardian payouts';
            alert('Could not start payout setup. Please contact support@quickgigs.ca.');
          }
        };
      } catch (approveErr) {
        msg.className = 'consent-err';
        msg.textContent = 'Could not approve — the link may be expired or already used.';
        btn.disabled = false;
        btn.textContent = 'Approve account';
      }
    };

    var decline = document.getElementById('declineBtn');
    if (decline) decline.onclick = async function () {
      if (!window.confirm('Decline this QuickGigs account? The teen will not be able to post or apply.')) return;
      decline.disabled = true;
      try {
        await consentRequest('decline');
        card.innerHTML = '<p class="consent-ok">The account was declined. No posting, applications, or payouts are enabled.</p>';
      } catch (declineErr) {
        decline.disabled = false;
        var msg = document.getElementById('consentMsg');
        if (msg) { msg.className = 'consent-err'; msg.textContent = 'Could not decline this account. Please try again.'; }
      }
    };
  }).catch(function () {
    card.innerHTML = '<p class="consent-err">This consent link is invalid, expired, or already used. Contact <a href="mailto:support@quickgigs.ca">support@quickgigs.ca</a>.</p>';
  });
})();
</script>
</body>
</html>
