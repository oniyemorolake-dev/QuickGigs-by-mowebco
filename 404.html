<style>
/* Mockup v3 alignment (page-level; mirror into qg-content.css .qg-err-* / .trust-page rules) */
.trust-page .nav{background:var(--surface);border-bottom:1px solid var(--border);}
.trust-page .nav-logo{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;font-size:20px;letter-spacing:-0.01em;background:var(--grad-wordmark);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.trust-page .back-btn{color:var(--text-muted);font-weight:600;}
.trust-page .back-btn:hover{color:var(--text);}
.trust-page .mode-btn{border-radius:100px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);font-weight:600;font-size:12px;}

/* Centered message card */
.qg-err-wrap{box-sizing:border-box;min-height:0;width:calc(100% - 32px);max-width:26rem;margin:12vh auto;padding:32px 22px 24px;background:var(--surface);border:1px solid var(--border);border-radius:14px;}
.qg-err-code{font-family:'DM Sans',sans-serif;font-style:normal;font-weight:700;font-size:44px;letter-spacing:-0.02em;color:var(--primary);margin-bottom:10px;}
.qg-err-wrap .page-title{font-family:'DM Sans',sans-serif;font-size:21px;font-weight:700;color:var(--text);margin-bottom:6px;}
.qg-err-wrap .page-date{font-size:14px;color:var(--text-muted);margin-bottom:0;}
.qg-err-wrap .qg-cta-row{width:100%;margin-top:22px;flex-direction:column;gap:8px;}
/* .trust-page prefix needed: qg-content.css ".trust-page a{color:var(--accent)}" otherwise hides CTA text */
/* color !important: qg-role-theme.css (injected by qg-brand-init.js) recolors every <a> with html[data-qg-mode] :is(a…) */
.trust-page .qg-content-cta{box-sizing:border-box;width:100%;border-radius:12px;background:var(--primary);color:var(--primary-text) !important;font-weight:700;text-decoration:none;transition:filter 0.15s;}
.trust-page .qg-content-cta:hover{text-decoration:none;}
.trust-page .qg-content-cta.is-secondary{background:var(--surface-alt);color:var(--text) !important;border:1px solid var(--border);font-weight:600;}
.trust-page .qg-content-cta.is-secondary:hover{filter:none;border-color:var(--line-strong);}
</style>
<script src="qg-theme.js"></script>
<script src="qg-brand-init.js"></script>
