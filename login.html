<script>
document.addEventListener('DOMContentLoaded', function () {
  if (typeof attachPasswordToggle === 'function') attachPasswordToggle('password');

  var authDark = typeof QG_isDarkTheme === 'function'
    ? QG_isDarkTheme()
    : (localStorage.getItem('qg-theme') !== 'light');

  function applyAuthTheme() {
    if (typeof QG_paintTheme === 'function') QG_paintTheme(authDark);
    else document.body.classList.toggle('light', !authDark);
    var btn = document.getElementById('authThemeBtn');
    if (btn) btn.textContent = authDark ? 'Light' : 'Dark';
  }

  window.toggleAuthTheme = function () {
    authDark = !authDark;
    if (typeof QG_setThemeDark === 'function') QG_setThemeDark(authDark);
    else localStorage.setItem('qg-theme', authDark ? 'dark' : 'light');
    applyAuthTheme();
  };

  applyAuthTheme();
});
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { initializeAuth, browserLocalPersistence, browserPopupRedirectResolver, signInWithEmailAndPassword, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbYJxU-3r7qVMqwzXHiC-qRkZNtmGobm0",
  authDomain: "quickgigs-7b12d.firebaseapp.com",
  projectId: "quickgigs-7b12d",
  storageBucket: "quickgigs-7b12d.firebasestorage.app",
  messagingSenderId: "698985399366",
  appId: "1:698985399366:web:8a3ca60c5f3ffac84bb647",
  measurementId: "G-82SPKK654N"
};

const app = initializeApp(firebaseConfig);
const auth = initializeAuth(app, {
  persistence: browserLocalPersistence,
  popupRedirectResolver: browserPopupRedirectResolver
});
window._auth = auth;

/** Drop previous Auth session + user caches before new credentials (capped wait for mobile). */
async function beginFreshCredentialLogin() {
  if (typeof qgPrepareLogin === 'function') qgPrepareLogin();
  else if (typeof clearQgUserScopedStorage === 'function') clearQgUserScopedStorage();
  else {
    try { sessionStorage.clear(); } catch (e) {}
  }
  window._currentUser = null;
  // Skip signOut wait when already signed out — saves ~250–700ms on cold login.
  if (!auth.currentUser) return;
  try {
    var signOutP = auth.signOut();
    await Promise.race([
      signOutP,
      new Promise(function (resolve) { setTimeout(resolve, 250); })
    ]);
  } catch (e2) {}
}

function markPendingProfileSync() {
  try { sessionStorage.setItem('qg-pending-profile-sync', '1'); } catch (e) {}
}

function prefetchDashboard() {
  try {
    if (document.querySelector('link[data-qg-prefetch-dash]')) return;
    var link = document.createElement('link');
    link.rel = 'prefetch';
    link.href = 'dashboard.html';
    link.setAttribute('data-qg-prefetch-dash', '1');
    document.head.appendChild(link);
  } catch (e) {}
}

async function runGraduationCheck(user) {
  var url = window.QG_CONFIG && window.QG_CONFIG.graduateAccountUrl;
  if (!url || typeof callVerifiedFunction !== 'function' || !user) return null;
  try {
    var result = await Promise.race([
      callVerifiedFunction(url, {}, user),
      new Promise(function(resolve){ setTimeout(function(){ resolve(null); }, 2500); })
    ]);
    if (result && result.ok) {
      sessionStorage.setItem('qg-graduation-state', JSON.stringify(result));
    }
    return result;
  } catch (e) {
    return null;
  }
}

async function waitForLoginGateHelpers() {
  var gateWait = 0;
  while (typeof getUserLoginGate !== 'function' && typeof getUserByFirebaseUid !== 'function' && gateWait < 50) {
    await new Promise(function (r) { setTimeout(r, 40); });
    gateWait++;
  }
  return typeof getUserLoginGate === 'function' || typeof getUserByFirebaseUid === 'function';
}

async function fetchLoginGateUser(uid) {
  if (typeof getUserLoginGate === 'function') {
    return await getUserLoginGate(uid);
  }
  if (typeof getUserByFirebaseUid === 'function') {
    return await getUserByFirebaseUid(uid, { self: true });
  }
  return null;
}

function resetLoginProgressUi(method) {
  var overlay = document.getElementById('loginProgress');
  if (overlay) overlay.hidden = true;
  var submitBtn = document.getElementById('submitBtn');
  if (submitBtn) {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Log in →';
  }
  if (method === 'google' && typeof qgResetGoogleBtn === 'function') {
    qgResetGoogleBtn('googleLoginBtn');
  }
}

async function routeAfterAuthGate(user, method) {
  var errorMsg = document.getElementById('errorMsg');
  var helpersReady = await waitForLoginGateHelpers();
  if (!helpersReady) {
    errorMsg.textContent = 'Could not verify your account. Check your connection and try again.';
    errorMsg.style.display = 'block';
    resetLoginProgressUi(method);
    return;
  }

  var existing = null;
  var lookupFailed = false;
  try {
    existing = await fetchLoginGateUser(user.uid);
    if (!existing) {
      await new Promise(function (r) { setTimeout(r, 400); });
      existing = await fetchLoginGateUser(user.uid);
    }
  } catch (gateErr) {
    lookupFailed = true;
    console.warn('login gate lookup failed:', gateErr && gateErr.message ? gateErr.message : gateErr);
  }

  if (lookupFailed) {
    errorMsg.textContent = 'Could not verify your account. Check your connection and try again.';
    errorMsg.style.display = 'block';
    resetLoginProgressUi(method);
    return;
  }

  if (existing && (existing.status === 'banned' || existing.account_status === 'blocked')) {
    if (typeof clearQgUserScopedStorage === 'function') clearQgUserScopedStorage();
    await auth.signOut();
    if (typeof setCurrentUser === 'function') setCurrentUser(null);
    errorMsg.textContent = existing.account_status === 'blocked'
      ? 'This account was not approved by its parent or guardian.'
      : 'This account has been suspended. Contact support@quickgigs.ca if you think this is a mistake.';
    errorMsg.style.display = 'block';
    resetLoginProgressUi(method);
    return;
  }

  if (existing) {
    if (typeof qgMarkOnboardingDone === 'function') qgMarkOnboardingDone(user.uid);
    if (typeof qgTrackEvent === 'function') qgTrackEvent('login', { method: method });
    showLoginProgress('Opening dashboard…');
    await runGraduationCheck(user);
    var dest = typeof qgGetDashboardRedirect === 'function'
      ? qgGetDashboardRedirect()
      : (typeof getDashboardUrl === 'function' ? getDashboardUrl() : 'dashboard.html');
    window.location.replace(dest);
    return;
  }

  showLoginProgress('Almost there…');
  window.location.replace('signup.html?oauth=continue');
}

async function finishGoogleLogin(user) {
  var errorMsg = document.getElementById('errorMsg');
  if (typeof setCurrentUser === 'function') setCurrentUser(user);
  else window._currentUser = user;
  showLoginProgress('Signing you in…');
  prefetchDashboard();
  markPendingProfileSync();
  await routeAfterAuthGate(user, 'google');
}

function showLoginProgress(label) {
  var btn = document.getElementById('submitBtn');
  var gBtn = document.getElementById('googleLoginBtn');
  var overlay = document.getElementById('loginProgress');
  if (btn) {
    btn.textContent = label || 'Opening dashboard…';
    btn.disabled = true;
  }
  if (gBtn) {
    gBtn.disabled = true;
    gBtn.textContent = label || 'Opening…';
  }
  if (overlay) {
    overlay.hidden = false;
    var t = overlay.querySelector('.login-progress-text');
    if (t) t.textContent = label || 'Opening dashboard…';
  }
}

getRedirectResult(auth).then(function(result) {
  if (result && result.user) finishGoogleLogin(result.user);
}).catch(function(error) {
  var errorMsg = document.getElementById('errorMsg');
  var message = typeof qgGoogleAuthErrorMessage === 'function' ? qgGoogleAuthErrorMessage(error) : '';
  if (message && errorMsg) {
    errorMsg.textContent = message;
    errorMsg.style.display = 'block';
  }
  if (typeof qgResetGoogleBtn === 'function') qgResetGoogleBtn('googleLoginBtn');
});

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var errorMsg = document.getElementById('errorMsg');
  var okMsg = document.getElementById('okMsg');
  var submitBtn = document.getElementById('submitBtn');
  errorMsg.style.display = 'none';
  okMsg.style.display = 'none';

  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;

  submitBtn.textContent = 'Logging in…';
  submitBtn.disabled = true;

  try {
    await beginFreshCredentialLogin();
    var cred = await signInWithEmailAndPassword(auth, email, password);
    var signedIn = (cred && cred.user) || auth.currentUser;
    if (!signedIn || !signedIn.uid) throw { code: 'auth/invalid-credential' };
    if (auth.currentUser && String(auth.currentUser.uid) !== String(signedIn.uid)) {
      signedIn = auth.currentUser;
    }
    if (typeof setCurrentUser === 'function') setCurrentUser(signedIn);
    else window._currentUser = signedIn;
    try { sessionStorage.setItem('qg-pending-profile-sync', '1'); } catch (ePend) {}
    prefetchDashboard();
    showLoginProgress('Signing you in…');
    markPendingProfileSync();
    await routeAfterAuthGate(signedIn, 'email');
  } catch (error) {
    var message = 'Invalid email or password. Try again.';
    if (error.code === 'auth/invalid-email') message = 'Enter a valid email address.';
    if (error.code === 'auth/user-not-found') message = 'No account found with this email. Sign up first';
    if (error.code === 'auth/wrong-password') message = 'Incorrect password. Try again.';
    if (error.code === 'auth/invalid-credential') message = 'Invalid email or password. Try again.';
    errorMsg.textContent = message;
    errorMsg.style.display = 'block';
    submitBtn.textContent = 'Log in →';
    submitBtn.disabled = false;
  }
});

document.getElementById('forgotLink').addEventListener('click', async function() {
  var email = document.getElementById('email').value.trim();
  var errorMsg = document.getElementById('errorMsg');
  var okMsg = document.getElementById('okMsg');
  errorMsg.style.display = 'none';
  okMsg.style.display = 'none';

  if (!email) {
    errorMsg.textContent = 'Enter your email above first, then click Forgot password.';
    errorMsg.style.display = 'block';
    return;
  }
  try {
    var resetUrl = window.location.origin + '/reset-password.html';
    await sendPasswordResetEmail(auth, email, {
      url: resetUrl,
      handleCodeInApp: true
    });
    okMsg.textContent = 'Password reset email sent Check your inbox (and spam).';
    okMsg.style.display = 'block';
  } catch (error) {
    errorMsg.textContent = 'Could not send reset email. Check the address and try again.';
    errorMsg.style.display = 'block';
  }
});

document.getElementById('googleLoginBtn').addEventListener('click', async function() {
  var errorMsg = document.getElementById('errorMsg');
  var okMsg = document.getElementById('okMsg');
  var btn = document.getElementById('googleLoginBtn');
  errorMsg.style.display = 'none';
  okMsg.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Connecting…';

  var provider = typeof qgBuildGoogleProvider === 'function'
    ? qgBuildGoogleProvider(GoogleAuthProvider)
    : (function () {
        var p = new GoogleAuthProvider();
        p.addScope('profile');
        p.addScope('email');
        p.setCustomParameters({ prompt: 'select_account' });
        return p;
      })();

  var useRedirect = typeof qgGooglePreferRedirect === 'function' && qgGooglePreferRedirect();
  if (useRedirect) {
    try {
      await beginFreshCredentialLogin();
      await signInWithRedirect(auth, provider, browserPopupRedirectResolver);
    } catch (redirectErr) {
      var rMsg = typeof qgGoogleAuthErrorMessage === 'function' ? qgGoogleAuthErrorMessage(redirectErr) : '';
      if (rMsg) { errorMsg.textContent = rMsg; errorMsg.style.display = 'block'; }
      if (typeof qgResetGoogleBtn === 'function') qgResetGoogleBtn('googleLoginBtn');
    }
    return;
  }

  try {
    await beginFreshCredentialLogin();
    var result = await signInWithPopup(auth, provider, browserPopupRedirectResolver);
    await finishGoogleLogin(result.user);
  } catch (error) {
    var popupMsg = typeof qgGoogleAuthErrorMessage === 'function' ? qgGoogleAuthErrorMessage(error) : 'Google sign-in failed. Try again.';
    if (error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request') {
      if (popupMsg) { errorMsg.textContent = popupMsg; errorMsg.style.display = 'block'; }
      if (typeof qgResetGoogleBtn === 'function') qgResetGoogleBtn('googleLoginBtn');
      return;
    }
    if (popupMsg && error.code !== 'auth/popup-blocked') {
      errorMsg.textContent = popupMsg;
      errorMsg.style.display = 'block';
      if (typeof qgResetGoogleBtn === 'function') qgResetGoogleBtn('googleLoginBtn');
      return;
    }
    // Popup blocked or unknown — fall back to redirect
    try {
      await signInWithRedirect(auth, provider, browserPopupRedirectResolver);
    } catch (redirectErr) {
      var message = typeof qgGoogleAuthErrorMessage === 'function'
        ? qgGoogleAuthErrorMessage(redirectErr)
        : 'Google sign-in failed. Try again.';
      errorMsg.textContent = message;
      errorMsg.style.display = 'block';
      if (typeof qgResetGoogleBtn === 'function') qgResetGoogleBtn('googleLoginBtn');
    }
  }
});
</script>
