<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0b0118;--surface:rgba(255,255,255,0.04);--border:rgba(200,168,233,0.1);
  --text:#fff;--text-muted:rgba(255,255,255,0.35);--text-faint:rgba(255,255,255,0.22);
  --purple:#6b3fa0;--purple-light:#9b6fc4;--lavender:#c8a8e9;
  --nav-bg:#0b0118;--tab-bg:#0e021f;--card-bg:rgba(255,255,255,0.04);
}
body.light{
  --bg:#fafafe;--surface:#fff;--border:#f0eeff;--text:#2d1b4e;
  --text-muted:#5a5a72;--text-faint:#9ca3af;--nav-bg:#fff;--tab-bg:#fff;
  --card-bg:#fff;--lavender:#6b3fa0;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:15px;min-height:100vh;min-height:100dvh;transition:background 0.25s,color 0.25s;overflow-x:hidden;}

.nav{position:sticky;top:0;z-index:50;background:var(--nav-bg);border-bottom:0.5px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;transition:background 0.25s;}
.nav-brand{flex-shrink:0;min-width:0;}
.nav-title{flex:1;min-width:0;font-size:16px;font-weight:500;color:var(--text);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto;}

/* TABS */
.tabs-wrap{background:var(--nav-bg);border-bottom:0.5px solid var(--border);padding:0 20px;display:flex;gap:0;overflow-x:auto;transition:background 0.25s;}
.tabs-wrap::-webkit-scrollbar{display:none;}
.tab-btn{padding:12px 16px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;font-family:'DM Sans',sans-serif;color:var(--text-muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.15s;}
.tab-btn.active{color:var(--purple-light);border-bottom-color:var(--purple-light);}
body.light .tab-btn.active{color:var(--purple);border-bottom-color:var(--purple);}
/* Poster = your listings. Tasker = jobs you applied to — never both tab sets at once */
[data-qg-mode="poster"] #tabApplied,
body.qg-mode-poster #tabApplied{display:none!important;visibility:hidden!important;pointer-events:none!important;width:0!important;padding:0!important;overflow:hidden!important;border:none!important;}
[data-qg-mode="worker"] #tabPosted,
body.qg-mode-worker #tabPosted{display:none!important;visibility:hidden!important;pointer-events:none!important;width:0!important;padding:0!important;overflow:hidden!important;border:none!important;}

/* CONTENT */
.content{padding:16px 20px;max-width:100%;overflow-x:hidden;min-height:55vh;}

/* CARDS */
.task-card{border-radius:16px;padding:15px;margin-bottom:10px;border:0.5px solid var(--border);background:var(--card-bg);}
body.light .task-card{box-shadow:0 1px 3px rgba(107,63,160,0.08);}
.tc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
.tc-left{display:flex;align-items:flex-start;gap:10px;flex:1;min-width:0;}
.tc-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.tc-cat{font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-faint);margin-bottom:3px;}
.tc-cat a.profile-link,.tc-cat .profile-link{color:var(--purple-light,#9b6fc4)!important;text-decoration:underline;text-underline-offset:2px;font-weight:500;}
body.light .tc-cat a.profile-link,body.light .tc-cat .profile-link{color:var(--purple,#6b3fa0)!important;}
.tc-profile-tap{text-decoration:none;flex-shrink:0;border-radius:12px;transition:transform 0.15s;}
.tc-profile-tap:hover{transform:scale(1.04);}
.tc-title{font-size:15px;font-weight:500;color:var(--text);line-height:1.4;}
.tc-badge{padding:3px 9px;border-radius:20px;font-size:9px;font-weight:500;white-space:nowrap;flex-shrink:0;}
.badge-open{background:rgba(107,63,160,0.2);color:#9b6fc4;}
body.light .badge-open{background:#ede9ff;color:var(--purple);}
.badge-progress{background:rgba(251,191,36,0.15);color:#d97706;}
.badge-done{background:rgba(74,222,128,0.12);color:#16a34a;}
.tc-meta{font-size:11px;color:var(--text-faint);margin-bottom:10px;}
.tc-bottom{display:flex;align-items:center;justify-content:space-between;}
.tc-price{font-size:15px;font-weight:500;color:var(--text);}
.tc-applicants{font-size:11px;color:var(--purple-light);margin-top:8px;}
body.light .tc-applicants{color:var(--purple);}
.tc-applicants-toggle{width:100%;text-align:left;background:var(--surface);border:0.5px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--purple-light);font-size:12px;font-weight:500;transition:border-color 0.15s,background 0.15s;}
body.light .tc-applicants-toggle{color:var(--purple);}
.tc-applicants-toggle:hover{border-color:var(--purple-light);}
.tc-applicants-toggle.open{border-color:var(--purple-light);background:rgba(107,63,160,0.12);}
.applicants-panel{display:none;margin-top:8px;padding-top:4px;}
.applicants-panel.open{display:block;}

/* ACTION BUTTONS */
.action-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.act-btn{padding:8px 16px;border-radius:10px;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;border:none;transition:opacity 0.15s;min-height:44px;display:inline-flex;align-items:center;justify-content:center;}
.act-btn:hover{opacity:0.85;}
.btn-primary{background:var(--purple);color:#fff;}
.btn-secondary{background:var(--surface);border:0.5px solid var(--border);color:var(--text-muted);}
.btn-success{background:#16a34a;color:#fff;}
.btn-review{background:rgba(251,191,36,0.15);color:#d97706;border:0.5px solid rgba(251,191,36,0.3);}
.btn-danger{background:rgba(239,68,68,0.12);color:#ef4444;border:0.5px solid rgba(239,68,68,0.35);}
.btn-danger:hover{opacity:0.9;}
.decline-btn{padding:6px 12px;border-radius:8px;background:var(--surface);color:var(--text-muted);border:1px solid var(--border);font-size:11px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;flex-shrink:0;margin-right:6px;}
.decline-btn:hover:not(:disabled){opacity:0.85;}
.decline-btn:disabled{opacity:0.5;cursor:not-allowed;}
.applicant-actions{display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;gap:6px;flex-shrink:0;}
.applicant-row.is-cancelled,.applicant-row.is-withdrawn{opacity:0.4;}
.task-card.is-faded{opacity:0.55;}

/* CONFIRM MODAL */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;z-index:400;padding:20px;}
.confirm-overlay.open{display:flex;}
.confirm-box{background:var(--surface);border:0.5px solid var(--border);border-radius:18px;padding:22px;max-width:340px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,0.35);}
.confirm-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:8px;}
.confirm-msg{font-size:13px;color:var(--text-muted);line-height:1.55;margin-bottom:18px;}
.confirm-btns{display:flex;gap:10px;justify-content:flex-end;}
.confirm-cancel{padding:10px 18px;border-radius:12px;border:0.5px solid var(--border);background:transparent;color:var(--text-muted);font-family:inherit;font-size:13px;cursor:pointer;}
.confirm-ok{padding:10px 18px;border-radius:12px;border:none;background:#ef4444;color:#fff;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;}
.confirm-ok.is-neutral{background:var(--purple);}

/* APPLICANT ROW */
.applicant-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:10px 0;border-top:0.5px solid var(--border);transition:opacity 0.25s,background 0.25s;}
.applicant-row .app-price{margin-left:auto;}
.applicant-row .applicant-actions{width:100%;padding-top:4px;}
.nego-actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px;width:100%;padding-top:4px;}
.nego-status{font-size:10px;color:var(--text-muted);width:100%;text-align:right;padding-top:2px;}
.app-counter-pending{font-size:10px;color:#d97706;margin-top:2px;}
.counter-btn{color:var(--lavender)!important;border-color:rgba(155,111,196,0.35)!important;}
.nego-block{width:100%;margin-top:8px;padding:10px 12px;border-radius:10px;background:rgba(107,63,160,0.12);border:0.5px solid rgba(155,111,196,0.2);}
.nego-block-title{font-size:11px;font-weight:600;margin-bottom:8px;color:var(--lavender);}
.applicant-row.is-faded{opacity:0.35;}
.applicant-row.is-accepted{background:rgba(74,222,128,0.1);border-radius:10px;padding:10px 8px;}
.applicant-row.is-accepting{background:rgba(107,63,160,0.12);border-radius:10px;}
.app-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6b3fa0,#c8a8e9);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#fff;flex-shrink:0;text-decoration:none;}
.app-avatar.has-photo{color:transparent;}
body.light .app-avatar{color:#2d1b4e;}
.app-info{flex:1;min-width:0;}
.app-name{font-size:15px;font-weight:500;color:var(--text);}

body.light .empty-btn,
body.light .btn-primary,
body.light .btn-success,
body.light .accept-btn{color:#2d1b4e;}
.app-msg{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.app-price{font-size:13px;font-weight:500;color:var(--text);flex-shrink:0;}
.accept-btn{padding:6px 14px;border-radius:8px;background:var(--purple);color:#fff;border:none;font-size:11px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;flex-shrink:0;transition:opacity 0.2s,background 0.2s;}
.accept-btn:hover:not(:disabled){opacity:0.88;}
.accept-btn:disabled{opacity:0.55;cursor:not-allowed;}
.accept-btn.is-done{background:#16a34a;opacity:1;}
.accept-status{font-size:11px;font-weight:500;color:#16a34a;flex-shrink:0;}
.accept-status.declined{color:var(--text-faint);}

/* EMPTY */
.empty-state{text-align:center;padding:60px 20px;}
.empty-icon{font-size:44px;margin-bottom:14px;}
.empty-title{font-size:16px;font-weight:500;color:var(--text);margin-bottom:8px;}
.empty-sub{font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.6;}
.empty-btn{padding:12px 24px;border-radius:13px;background:var(--purple);color:#fff;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block;}

.mode-btn{padding:6px 13px;border-radius:20px;font-size:11px;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);min-height:44px;}
body.light .mode-btn{background:#f0eeff;color:var(--purple);}

/* TOAST */
.toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);background:#4ade80;color:#0b0118;padding:12px 18px;border-radius:20px;font-size:13px;font-weight:500;display:none;z-index:300;white-space:normal;max-width:min(92vw,340px);text-align:center;line-height:1.45;}

.app-legal-footer{text-align:center;padding:20px 16px calc(96px + env(safe-area-inset-bottom, 0px));font-size:10px;color:var(--text-faint);line-height:1.75;}
.app-legal-footer a{color:var(--purple-light);text-decoration:none;}
body.light .app-legal-footer a{color:var(--purple);}

@media (max-width: 480px) {
  .nav{padding:10px 12px;gap:8px;}
  .nav-brand .nav-logo{font-size:1.05rem;}
  .nav-brand .nav-role{display:none;}
  .nav-title{font-size:14px;}
  .mode-btn{padding:8px 10px;font-size:10px;}
  .tabs-wrap{padding:0 6px;}
  .tab-btn{padding:11px 11px;font-size:12px;}
  .content{padding:12px 14px;}
  .task-card{padding:12px;border-radius:14px;margin-bottom:8px;}
  .tc-title{font-size:14px;line-height:1.45;}
  .tc-badge{font-size:8px;padding:3px 7px;}
  .tc-meta{font-size:10px;line-height:1.5;}
  .action-row{gap:6px;}
  .action-row .act-btn{flex:1 1 calc(50% - 6px);min-width:0;padding:10px 8px;font-size:11px;line-height:1.3;}
  .action-row .act-btn[style*="pointer-events:none"]{flex:1 1 100%;}
  .applicant-row{align-items:flex-start;}
  .applicant-row .app-price{margin-left:0;width:100%;}
  .applicant-actions .accept-btn,.applicant-actions .decline-btn{min-height:44px;flex:1 1 auto;}
  .empty-state{padding:40px 16px;}
  .confirm-overlay{align-items:flex-end;padding:0;}
  .confirm-overlay.open .confirm-box{border-radius:20px 20px 0 0;max-width:100%;padding-bottom:calc(22px + env(safe-area-inset-bottom, 0px));}
  .confirm-btns{flex-direction:column-reverse;}
  .confirm-cancel,.confirm-ok{width:100%;min-height:48px;}
}
</style>

<script>
var activeTab = 'posted';
var allTasks = [], allApplications = [];
var userNames = {};
var userAvatars = {};
var workerVerifiedMap = {};
var expandedApplicantTasks = {};
var paymentByTaskId = {};
var isDark = localStorage.getItem('qg-mode') !== 'light';
var TAB_IDS = { posted: 'tabPosted', applied: 'tabApplied', inprogress: 'tabInprogress', completed: 'tabCompleted' };

function applyTheme(){ window.QG_applyTheme(isDark, 'modeBtn', false); }
window.toggleTheme = function(){ isDark = !isDark; localStorage.setItem('qg-mode', isDark?'dark':'light'); applyTheme(); };
applyTheme();

function pickDefaultTab() {
  var params = new URLSearchParams(window.location.search);
  var tabParam = params.get('tab');
  try {
    if (sessionStorage.getItem('qg-just-completed')) {
      activeTab = 'completed';
      return;
    }
  } catch (e) {}
  try {
    if (sessionStorage.getItem('qg-payment-tab') === 'inprogress') {
      activeTab = 'inprogress';
      sessionStorage.removeItem('qg-payment-tab');
      return;
    }
  } catch (e) {}
  if (params.get('paid') === '1' || tabParam === 'inprogress') {
    activeTab = 'inprogress';
    return;
  }
  if (typeof normalizeMyTasksTab === 'function') {
    activeTab = normalizeMyTasksTab(tabParam || defaultMyTasksTab());
    return;
  }
  if (tabParam && TAB_IDS[tabParam]) {
    activeTab = tabParam;
    return;
  }
  if (typeof isWorkerMode === 'function' && isWorkerMode()) {
    activeTab = 'applied';
    return;
  }
  activeTab = 'posted';
}

function enforceModeTab() {
  if (typeof normalizeMyTasksTab === 'function') {
    activeTab = normalizeMyTasksTab(activeTab);
  } else if (typeof isWorkerMode === 'function' && isWorkerMode() && activeTab === 'posted') {
    activeTab = 'applied';
  } else if (typeof isPosterMode === 'function' && isPosterMode() && activeTab === 'applied') {
    activeTab = 'posted';
  }
}

function syncRoleTabs() {
  var userId = window._currentUser ? window._currentUser.uid : null;
  var hasPosted = userId && allTasks.some(function (t) { return taskBelongsToPoster(t, userId); });
  var hasApps = userId && allApplications.some(function(a){ return getField(a, 'WORKER_ID') === userId; });
  if (typeof applyMyTasksTabsForMode === 'function') {
    applyMyTasksTabsForMode({ hasPosted: hasPosted, hasApps: hasApps });
  }
  enforceModeTab();
}

function syncTabButtons() {
  Object.keys(TAB_IDS).forEach(function(key) {
    var el = document.getElementById(TAB_IDS[key]);
    if (el) el.classList.toggle('active', activeTab === key);
  });
}

function paymentStatusRank(p) {
  var st = String((p && (p.status || p.STATUS)) || '').toLowerCase();
  if (st === 'paid' || st === 'completed') return 4;
  if (st === 'held') return 3;
  if (st === 'pending') return 1;
  return 0;
}

function isTaskPaid(taskId) {
  var p = paymentByTaskId[String(taskId)];
  if (!p) return false;
  return typeof isPaymentStatusComplete === 'function'
    ? isPaymentStatusComplete(p.status || p.STATUS)
    : (function () {
      var st = String(p.status || p.STATUS || '').toLowerCase();
      return st === 'held' || st === 'paid' || st === 'completed';
    })();
}

function indexPaymentRow(p, extraKeys) {
  if (!p) return;
  var keys = [];
  function addKey(v) {
    if (v == null || v === '') return;
    var s = String(v);
    if (keys.indexOf(s) === -1) keys.push(s);
  }
  addKey(p.task_id || p.TASK_ID);
  (extraKeys || []).forEach(addKey);
  keys.forEach(function (key) {
    var cur = paymentByTaskId[key];
    if (!cur || paymentStatusRank(p) > paymentStatusRank(cur)) {
      paymentByTaskId[key] = p;
    }
  });
}

function aliasPaymentsToUiTaskIds(userId, rows) {
  var pays = rows || [];
  function isPaidRow(p) {
    if (!p) return false;
    return typeof isPaymentStatusComplete === 'function'
      ? isPaymentStatusComplete(p.status)
      : ['held', 'paid', 'completed'].indexOf(String(p.status || '').toLowerCase()) >= 0;
  }
  var inProgIds = (allTasks || []).filter(function (t) {
    return taskStatus(t) === 'in_progress' && String(getField(t, 'POSTED_BY')) === String(userId);
  }).map(function (t) { return String(getField(t, 'TASK_ID') || ''); }).filter(Boolean);

  pays.forEach(function (p) {
    var workerId = String(p.worker_id || '');
    var extra = [];
    if (workerId) {
      (allApplications || []).forEach(function (a) {
        if (String(getField(a, 'WORKER_ID') || '') !== workerId) return;
        var st = String(getField(a, 'STATUS') || '').toLowerCase();
        if (st !== 'accepted' && st !== 'completed' && st !== 'in_progress') return;
        var atid = String(getField(a, 'TASK_ID') || '');
        if (atid) extra.push(atid);
      });
    }
    // One in-progress job + paid/held payment → UI id must unlock Pay/Message
    if (isPaidRow(p) && inProgIds.length === 1) extra.push(inProgIds[0]);
    if (extra.length) indexPaymentRow(p, extra);
  });
}

async function refreshPaymentMap(userId) {
  paymentByTaskId = {};
  if (!userId || !window.QG_CONFIG || !window.QG_CONFIG.paymentsEnabled) return;
  if (typeof getPaymentsForUser !== 'function') return;
  try {
    var rows = await getPaymentsForUser(userId, 'poster');
    (rows || []).forEach(function (p) { indexPaymentRow(p); });
    aliasPaymentsToUiTaskIds(userId, rows || []);
  } catch (e) {
    console.warn('Payment map load failed:', e);
  }
}

async function syncInProgressPaymentState(userId) {
  if (!userId || !window.QG_CONFIG || !window.QG_CONFIG.paymentsEnabled) return;
  var inProgress = allTasks.filter(function (t) {
    return taskStatus(t) === 'in_progress' && String(getField(t, 'POSTED_BY')) === String(userId);
  });
  var workerHint = '';
  var taskHint = inProgress[0] ? String(getField(inProgress[0], 'TASK_ID') || '') : '';
  if (taskHint && typeof findAcceptedApplication === 'function') {
    var acc = findAcceptedApplication(taskHint);
    if (acc) workerHint = String(getField(acc, 'WORKER_ID') || '');
  }

  // Recover paid Stripe sessions → held rows (even if local map is empty)
  var serverSync = null;
  if (typeof window.QG_syncPayment === 'function') {
    try {
      serverSync = typeof withTimeout === 'function'
        ? await withTimeout(window.QG_syncPayment(userId, { taskId: taskHint, workerId: workerHint }), 10000, null)
        : await window.QG_syncPayment(userId, { taskId: taskHint, workerId: workerHint });
    } catch (e) {
      console.warn('QG_syncPayment failed:', e);
    }
  } else if (typeof window.QG_syncPendingPayments === 'function') {
    try {
      serverSync = typeof withTimeout === 'function'
        ? await withTimeout(window.QG_syncPendingPayments(userId, { taskId: taskHint, workerId: workerHint }), 10000, null)
        : await window.QG_syncPendingPayments(userId, { taskId: taskHint, workerId: workerHint });
    } catch (e2) {
      console.warn('QG_syncPendingPayments failed:', e2);
    }
  }

  await refreshPaymentMap(userId);

  if (serverSync && serverSync.ok && serverSync.payment) {
    var aliasIds = inProgress.map(function (t) { return String(getField(t, 'TASK_ID') || ''); });
    if (serverSync.task_id) aliasIds.push(String(serverSync.task_id));
    indexPaymentRow(serverSync.payment, aliasIds);
  }

  if (typeof getPaymentByTask !== 'function') return;
  for (var i = 0; i < inProgress.length; i++) {
    var tid = String(getField(inProgress[i], 'TASK_ID'));
    var accepted = typeof findAcceptedApplication === 'function' ? findAcceptedApplication(tid) : null;
    var workerId = accepted ? String(getField(accepted, 'WORKER_ID') || '') : workerHint;
    var payCached = paymentByTaskId[tid];
    if (!workerId && payCached && payCached.worker_id) workerId = String(payCached.worker_id);
    try {
      var row = await getPaymentByTask(tid, {
        posterId: userId,
        workerId: workerId,
        actorId: userId,
        actorRole: 'poster'
      });
      if (row) indexPaymentRow(row, [tid]);
    } catch (e) {}
  }
}

function displayName(uid, taskOrApp) {
  if (typeof resolveUserName === 'function') return resolveUserName(uid, taskOrApp, userNames);
  if (taskOrApp && (taskOrApp.worker_name || taskOrApp.WORKER_NAME)) return taskOrApp.worker_name || taskOrApp.WORKER_NAME;
  if (taskOrApp && (taskOrApp.poster_name || taskOrApp.POSTER_NAME)) return taskOrApp.poster_name || taskOrApp.POSTER_NAME;
  if (userNames[uid]) return userNames[uid];
  return 'QuickGigs user';
}

function taskDomId(taskId) {
  return 'apps-' + String(taskId).replace(/[^a-zA-Z0-9_-]/g, '_');
}

function setRowStatus(row, status) {
  if (!row) return;
  row.status = status;
  row.STATUS = status;
}

function applyLocalAcceptState(taskId, appId) {
  taskId = String(taskId);
  appId = String(appId);
  allTasks.forEach(function(t) {
    if (String(getField(t, 'TASK_ID')) === taskId) setRowStatus(t, 'in_progress');
  });
  allApplications.forEach(function(a) {
    if (String(getField(a, 'TASK_ID')) !== taskId) return;
    if (String(getField(a, 'APP_ID')) === appId) setRowStatus(a, 'accepted');
    else if (getField(a, 'STATUS') === 'pending' || !getField(a, 'STATUS')) setRowStatus(a, 'declined');
  });
  if (typeof mergeTaskInCache === 'function') mergeTaskInCache(taskId, { status: 'in_progress', STATUS: 'in_progress' });
  if (typeof mergeApplicationInCache === 'function') {
    allApplications.forEach(function(a) {
      if (String(getField(a, 'TASK_ID')) !== taskId) return;
      var wid = getField(a, 'WORKER_ID');
      var aid = getField(a, 'APP_ID');
      var st = (getField(a, 'STATUS') || 'pending').toLowerCase();
      if (String(aid) === appId) mergeApplicationInCache(aid, taskId, wid, { status: 'accepted', STATUS: 'accepted' });
      else if (st === 'pending') mergeApplicationInCache(aid, taskId, wid, { status: 'declined', STATUS: 'declined' });
    });
  }
}

function isPaymentGatedChat() {
  return !window.QG_CONFIG || window.QG_CONFIG.chatUnlockAfter === 'payment';
}

function renderApplicantAction(a, taskId, task) {
  var appId = getField(a, 'APP_ID');
  var workerId = getField(a, 'WORKER_ID');
  var status = (getField(a, 'STATUS') || 'pending').toLowerCase();
  if (status === 'accepted') {
    if (isPaymentGatedChat()) {
      if (typeof isTaskPaid === 'function' && isTaskPaid(taskId)) {
        return '<button type="button" class="accept-btn" style="background:var(--surface);color:var(--lavender);border:1px solid var(--border)" onclick="openChatWithWorker('+JSON.stringify(String(taskId))+','+JSON.stringify(String(workerId))+')">💬 Chat</button>' +
          '<span class="accept-status">✓ Accepted · Paid</span>';
      }
      return '<button type="button" class="accept-btn" style="background:var(--purple);color:#fff" data-pay-task="'+escAttr(taskId)+'" data-pay-return="mytasks">💳 Pay to unlock chat</button>' +
        '<span class="accept-status">✓ Accepted</span>';
    }
    return '<button type="button" class="accept-btn" style="background:var(--surface);color:var(--lavender);border:1px solid var(--border)" onclick="openChatWithWorker('+JSON.stringify(String(taskId))+','+JSON.stringify(String(workerId))+')">💬 Chat</button>' +
      '<span class="accept-status">✓ Accepted</span>';
  }
  if (status === 'declined') return '<span class="accept-status declined">Not selected</span>';
  if (status === 'cancelled') return '<span class="accept-status declined">Withdrawn</span>';

  var negotiable = isTaskNegotiable(task);
  var neg = getNegotiationState(a);
  var negoHtml = '';
  if (negotiable) {
    if (neg.counterBy === 'worker') {
      negoHtml = '<div class="nego-actions">' +
        '<span class="nego-status">Counter: $' + neg.counterPrice + '</span>' +
        '<button type="button" class="decline-btn" data-poster-decline-counter="'+escAttr(appId)+'" data-task-id="'+escAttr(taskId)+'" data-worker-id="'+escAttr(workerId)+'">Decline counter</button>' +
        '<button type="button" class="accept-btn" data-poster-accept-counter="'+escAttr(appId)+'" data-task-id="'+escAttr(taskId)+'" data-worker-id="'+escAttr(workerId)+'">Accept $' + neg.counterPrice + '</button>' +
        '</div>';
    } else if (neg.counterBy === 'poster') {
      negoHtml = '<div class="nego-actions"><span class="nego-status">Counter sent — waiting for tasker</span></div>';
    } else if (neg.counterRound === 0) {
      negoHtml = '<div class="nego-actions">' +
        '<button type="button" class="accept-btn counter-btn" data-poster-counter="'+escAttr(appId)+'" data-task-id="'+escAttr(taskId)+'" data-worker-id="'+escAttr(workerId)+'">Counter $…</button>' +
        '</div>';
    }
  }

  var chatBtn = isPaymentGatedChat() ? '' :
    '<button type="button" class="accept-btn" style="background:var(--surface);color:var(--lavender);border:1px solid var(--border);margin-right:6px" onclick="openChatWithWorker('+JSON.stringify(String(taskId))+','+JSON.stringify(String(workerId))+')">💬 Chat</button>';
  var acceptDisabled = neg.counterBy ? ' disabled title="Resolve the counter-offer first"' : '';
  return negoHtml +
    '<div class="applicant-actions">' +
    '<button type="button" class="decline-btn" data-decline-task-id="'+escAttr(taskId)+'" data-decline-app-id="'+escAttr(appId)+'">Decline</button>' +
    chatBtn +
    '<button type="button" class="accept-btn" data-task-id="'+escAttr(taskId)+'" data-app-id="'+escAttr(appId)+'"'+acceptDisabled+'>Accept</button>' +
    '</div>';
}

function escAttr(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
    .replace(/</g, '&lt;');
}

function setAcceptLoading(acceptBtn, loading) {
  if (!acceptBtn) return;
  var row = acceptBtn.closest('.applicant-row');
  var panel = acceptBtn.closest('.applicants-panel');
  if (loading) {
    acceptBtn.disabled = true;
    acceptBtn.textContent = 'Accepting…';
    if (row) row.classList.add('is-accepting');
    if (panel) {
      panel.querySelectorAll('.applicant-row').forEach(function(other) {
        if (other !== row) other.classList.add('is-faded');
      });
    }
  } else {
    acceptBtn.disabled = false;
    acceptBtn.textContent = 'Accept';
    if (row) row.classList.remove('is-accepting');
  }
}

function applyExpandFromUrl() {
  var params = new URLSearchParams(window.location.search);
  var expand = params.get('expand');

    expandedApplicantTasks[String(expand)] = true;
    activeTab = 'posted';
    return;
  }
  if (params.get('applicants') === '1') {

    if (!userId) return;

      if (getField(t, 'POSTED_BY') !== userId || taskStatus(t) !== 'open') return;

function enrichRowsWithNames() {

  allTasks.forEach(function(t) {
    var pid = getField(t, 'POSTED_BY');
    if (pid && userNames[pid]) {
      if (!getField(t, 'POSTER_NAME') || (typeof isGenericDisplayName === 'function' && isGenericDisplayName(getField(t, 'POSTER_NAME')))) {
        t.poster_name = userNames[pid];
        t.POSTER_NAME = userNames[pid];
      }
    }
  });
  allApplications.forEach(function(a) {
    var wid = getField(a, 'WORKER_ID');
    if (wid && userNames[wid]) {
      if (!getField(a, 'WORKER_NAME') || (typeof isGenericDisplayName === 'function' && isGenericDisplayName(getField(a, 'WORKER_NAME')))) {
        a.worker_name = userNames[wid];
        a.WORKER_NAME = userNames[wid];
      }
    }
  });
}

async function hydrateApplicantAvatars() {
  var uids = {};
  allApplications.forEach(function(a) {
    var wid = getField(a, 'WORKER_ID');
    if (!wid) return;
    uids[String(wid)] = true;
  });
  var keys = Object.keys(uids).slice(0, 12);
  if (!keys.length) return;
  for (var i = 0; i < keys.length; i++) {
    var uid = keys[i];
    try {
      if (!userAvatars[uid] && typeof getUserAvatarUrl === 'function') {
        var url = await (typeof withTimeout === 'function'
          ? withTimeout(getUserAvatarUrl(uid), 3000, '')
          : getUserAvatarUrl(uid));
        if (url) userAvatars[uid] = url;
      }
      if (typeof isWorkerVerified === 'function') {
        var dbUser = typeof getUserByFirebaseUid === 'function'
          ? await (typeof withTimeout === 'function'
            ? withTimeout(getUserByFirebaseUid(uid), 3000, null)
            : getUserByFirebaseUid(uid))
          : null;
        workerVerifiedMap[uid] = await isWorkerVerified(uid, dbUser, null);
      }
    } catch (e) {}
  }
}

async function hydrateMissingNames() {
  var uids = {};
  allTasks.forEach(function(t) {
    var pid = getField(t, 'POSTED_BY');
    if (pid) uids[String(pid)] = true;
  });
  allApplications.forEach(function(a) {
    var wid = getField(a, 'WORKER_ID');
    if (wid) uids[String(wid)] = true;
  });
  var keys = Object.keys(uids).slice(0, 20);
  for (var i = 0; i < keys.length; i++) {
    var uid = keys[i];
    if (userNames[uid] && typeof isGenericDisplayName === 'function' && !isGenericDisplayName(userNames[uid])) continue;
    if (typeof getUserNameByFirebaseUid !== 'function') continue;
    try {
      var name = typeof withTimeout === 'function'
        ? await withTimeout(getUserNameByFirebaseUid(uid), 3000, '')
        : await getUserNameByFirebaseUid(uid);
      if (name && !isGenericDisplayName(name)) userNames[uid] = name;
    } catch (e) {}
  }
  enrichRowsWithNames();
}

function buildReviewHref(task, acceptedApp) {
  var userId = window._currentUser ? window._currentUser.uid : '';
  var taskId = getField(task, 'TASK_ID');
  var posterId = getField(task, 'POSTED_BY');
  var workerId = acceptedApp ? getField(acceptedApp, 'WORKER_ID') : '';
  var isPoster = posterId === userId;
  var revieweeId = isPoster ? workerId : posterId;
  var revieweeName = isPoster
    ? displayName(workerId, acceptedApp || {})
    : displayName(posterId, task);
  var role = isPoster ? 'poster' : 'worker';
  return 'review.html?taskId=' + encodeURIComponent(String(taskId)) +
    '&task=' + encodeURIComponent(getField(task, 'TITLE')) +
    '&price=' + encodeURIComponent(getField(task, 'BUDGET')) +
    '&revieweeId=' + encodeURIComponent(String(revieweeId)) +
    '&reviewee=' + encodeURIComponent(revieweeName) +
    '&role=' + role;
}

async function loadData(){
  var userId = window._currentUser ? window._currentUser.uid : null;
  if (!userId) {
    renderTabLoading();
    return;
  }

  renderTabLoading();
  var params = new URLSearchParams(window.location.search);
  var preferInProgress = params.get('paid') === '1' || params.get('tab') === 'inprogress';
  try {
    if (sessionStorage.getItem('qg-payment-tab') === 'inprogress') preferInProgress = true;
  } catch (e) {}
  if (params.get('paid') === '1' || preferInProgress) {
    activeTab = 'inprogress';
    if (typeof setSessionMode === 'function') setSessionMode('poster');
    if (typeof renderQuickGigsTabBar === 'function') renderQuickGigsTabBar('tasks');
  } else if (params.get('tab') === 'posted' || sessionStorage.getItem('qg-just-posted') === '1') {
    if (typeof setSessionMode === 'function') setSessionMode('poster');
    try { sessionStorage.removeItem('qg-just-posted'); } catch (e) {}
    activeTab = 'posted';
    if (typeof renderQuickGigsTabBar === 'function') renderQuickGigsTabBar('tasks');
  }

  // Show cached tasks immediately — never block UI on payment sync
  var cached = typeof readTasksCache === 'function' ? readTasksCache(true) : null;
  if (cached && cached.length) {
    allTasks = cached;
    if (preferInProgress) activeTab = 'inprogress';
    else pickDefaultTab();
    applyExpandFromUrl();
    syncRoleTabs();
    syncTabButtons();
    renderTab();
  }

  (async function runPaymentSyncInBackground() {
    try {
      if (typeof window.QG_handlePaymentReturn === 'function') {
        await withTimeout(window.QG_handlePaymentReturn(), 8000, false);
      }
    } catch (payRetErr) {
      console.warn('Payment return handling failed:', payRetErr);
    }
    try {
      if (typeof window.QG_syncPendingPayments === 'function') {
        await withTimeout(window.QG_syncPendingPayments(userId), 8000, null);
      }
    } catch (syncErr) {
      console.warn('Pending payment sync failed:', syncErr);
    }
  })();

  try {
    var bundlePromise = typeof fetchMyTasksBundle === 'function'
      ? (typeof withTimeout === 'function'
        ? withTimeout(fetchMyTasksBundle(userId), 12000, { tasks: [], applications: [] })
        : fetchMyTasksBundle(userId))
      : Promise.resolve(null);
    var namesPromise = typeof getUsersNameMap === 'function'
      ? withTimeout(getUsersNameMap(), 8000, {})
      : Promise.resolve({});
    var avatarsPromise = typeof getUsersAvatarMap === 'function'
      ? withTimeout(getUsersAvatarMap(), 8000, {})
      : Promise.resolve({});

    var results = await Promise.all([bundlePromise, namesPromise, avatarsPromise]);
    var bundle = results[0];
    var freshTasks = bundle && Array.isArray(bundle.tasks) ? bundle.tasks : [];
    var freshApps = bundle && Array.isArray(bundle.applications) ? bundle.applications : [];
    if (userId && !freshTasks.length && typeof fetchAllTasksFresh === 'function') {
      try {
        var scanned = await withTimeout(fetchAllTasksFresh(), 8000, []);
        freshTasks = (scanned || []).filter(function (t) {
          return typeof taskPostedByUser === 'function'
            ? taskPostedByUser(t, userId)
            : String(t.posted_by || t.POSTED_BY || '') === String(userId);
        });
      } catch (scanErr) {
        console.warn('My Tasks poster scan fallback failed:', scanErr);
      }
    }
    if (!bundle) {
      var tasksPromise = typeof fetchAllTasksFresh === 'function'
        ? withTimeout(fetchAllTasksFresh(), 8000, [])
        : (typeof getAllTasks === 'function' ? getAllTasks() : Promise.resolve([]));
      var appsPromise = typeof fetchAllApplicationsFresh === 'function'
        ? withTimeout(fetchAllApplicationsFresh(), 8000, [])
        : (typeof getAllApplications === 'function' ? getAllApplications() : Promise.resolve([]));
      var legacy = await Promise.all([tasksPromise, appsPromise]);
      freshTasks = Array.isArray(legacy[0]) ? legacy[0] : [];
      freshApps = Array.isArray(legacy[1]) ? legacy[1] : [];
    }
    allTasks = typeof mergeTaskLists === 'function'
      ? mergeTaskLists(allTasks, freshTasks)
      : (freshTasks.length ? freshTasks : allTasks);
    allApplications = typeof mergeApplicationLists === 'function'
      ? mergeApplicationLists(allApplications, freshApps)
      : (freshApps.length ? freshApps : allApplications);
    if (typeof writeTasksCache === 'function') writeTasksCache(allTasks);
    if (typeof writeAppsCache === 'function') writeAppsCache(allApplications);
    userNames = results[1] || {};
    userAvatars = results[2] || {};
    // Must finish BEFORE render so Pay→Message unlock is visible
    try {
      await withTimeout(syncInProgressPaymentState(userId), 6000, null);
    } catch (payMapErr) {
      console.warn('Payment map sync failed:', payMapErr);
      try { await refreshPaymentMap(userId); } catch (e2) {}
    }
    Promise.all([
      hydrateApplicantAvatars(),
      hydrateMissingNames()
    ]).then(function () {
      try { renderTab(); } catch (e) {}
    }).catch(function () {});
  } catch (err) {
    console.warn('My Tasks load failed:', err);
    var fallbackTasks = typeof readTasksCache === 'function' ? readTasksCache(true) : null;
    if (fallbackTasks && fallbackTasks.length && !allTasks.length) allTasks = fallbackTasks;
  }

  if (typeof isSupabaseUsingStaleCache === 'function' && isSupabaseUsingStaleCache()) {
    showToast('Showing saved tasks — reconnect or run tasks-my-tasks-fix.sql if this persists', '#f59e0b');
  }
  if (!allTasks.length && !allApplications.length && userId) {
    showToast('No tasks loaded — tap Refresh list or hard refresh the page', '#f59e0b');
  }

  try {
    if (sessionStorage.getItem('qg-just-completed')) {
      activeTab = 'completed';
    } else if (preferInProgress) {
      activeTab = 'inprogress';
      if (typeof setSessionMode === 'function') setSessionMode('poster');
    } else {
      pickDefaultTab();
    }
  } catch (tabErr) {
    if (preferInProgress) activeTab = 'inprogress';
    else pickDefaultTab();
  }
  applyExpandFromUrl();
  syncRoleTabs();
  syncTabButtons();
  try {
    renderTab();
  } catch (renderErr) {
    console.error('My Tasks render failed:', renderErr);
    var tabEl = document.getElementById('tabContent');
    if (tabEl) {
      tabEl.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Could not load this page</div><div class="empty-sub">Hard refresh the app. If it keeps happening, run supabase/launch-stabilize.sql in Supabase.</div><button type="button" class="empty-btn" onclick="location.reload()">Refresh</button></div>';
    }
  }
  var tabEl = document.getElementById('tabContent');
  if (tabEl) tabEl.removeAttribute('aria-busy');

  var expandTarget = new URLSearchParams(window.location.search).get('expand');
  if (expandTarget) {
    setTimeout(function () {
      var panel = document.getElementById(taskDomId(expandTarget));
      if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 150);
  }
}

var CAT_BG    = {home:'rgba(107,63,160,0.2)',errands:'rgba(251,191,36,0.15)',tutoring:'rgba(74,222,128,0.1)',beauty:'rgba(200,168,233,0.15)',moving:'rgba(107,63,160,0.2)',cooking:'rgba(251,191,36,0.12)',tech:'rgba(107,63,160,0.2)',care:'rgba(74,222,128,0.1)',gardening:'rgba(74,222,128,0.08)',events:'rgba(200,168,233,0.15)',trades:'rgba(107,63,160,0.2)',other:'rgba(255,255,255,0.06)'};

function getCat(t){ var k=(t.CATEGORY||t.category||'other').toLowerCase(); return {icon:CAT_ICONS[k]||'📦',bg:CAT_BG[k]||'rgba(255,255,255,0.06)'}; }
function getField(row,f){
  var fieldMap = {
    APP_ID:['APP_ID','app_id','id'],
    TASK_ID:['TASK_ID','task_id','id'],
    TITLE:['TITLE','title'],
    CATEGORY:['CATEGORY','category'],
    TASK_MODE:['TASK_MODE','task_mode'],
    BUDGET:['BUDGET','budget'],
    BUDGET_NEGOTIABLE:['BUDGET_NEGOTIABLE','budget_negotiable'],
    LOCATION:['LOCATION','location'],
    STATUS:['STATUS','status'],
    CREATED_AT:['CREATED_AT','created_at'],
    POSTED_BY:['POSTED_BY','posted_by'],
    POSTER_NAME:['POSTER_NAME','poster_name'],
    WORKER_ID:['WORKER_ID','worker_id'],
    WORKER_NAME:['WORKER_NAME','worker_name'],
    MESSAGE:['MESSAGE','message'],
    PRICE:['PRICE','price'],
    COUNTER_PRICE:['COUNTER_PRICE','counter_price'],
    COUNTER_BY:['COUNTER_BY','counter_by'],
    COUNTER_ROUND:['COUNTER_ROUND','counter_round']
  };
  var keys = fieldMap[f] || [f, f.toLowerCase()];
  for(var i = 0; i < keys.length; i++){
    if(row && row[keys[i]] != null) return row[keys[i]];
  }
  return '';
}
function isTaskNegotiable(task) {
  if (typeof isTaskBudgetNegotiable === 'function') return isTaskBudgetNegotiable(task);
  return !!(getField(task, 'BUDGET_NEGOTIABLE'));
}

function getNegotiationState(a) {
  if (typeof parseNegotiationFields === 'function') {
    var parsed = parseNegotiationFields(a);
    return {
      counterPrice: parsed.counterPrice,
      counterBy: parsed.counterBy || '',
      counterRound: parsed.counterRound || 0
    };
  }
  return {
    counterPrice: getField(a, 'COUNTER_PRICE') ? Number(getField(a, 'COUNTER_PRICE')) : null,
    counterBy: getField(a, 'COUNTER_BY') || '',
    counterRound: Number(getField(a, 'COUNTER_ROUND') || 0) || 0
  };
}

function formatAppPriceHtml(a) {
  var price = getField(a, 'PRICE');
  var neg = getNegotiationState(a);
  if (neg.counterBy && neg.counterPrice) {
    var who = neg.counterBy === 'poster' ? 'Poster counter' : 'Your counter';
    return '$' + price + '<div class="app-counter-pending">' + who + ': $' + neg.counterPrice + '</div>';
  }
  return '$' + price;
}

function formatTaskBudgetMeta(task) {
  var budget = getField(task, 'BUDGET');
  if (isTaskNegotiable(task)) return 'Around $' + budget + ' · negotiable';
  return '$' + budget + ' · fixed';
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function personLink(name, uid) {
  if (uid && typeof profileNameLink === 'function') return profileNameLink(name, uid, { className: 'profile-link' });
  return esc(name || 'User');
}

function personLinkWithBadge(name, uid) {
  var link = personLink(name, uid);
  if (uid && workerVerifiedMap[String(uid)] && typeof renderVerifiedBadge === 'function') {
    return link + ' ' + renderVerifiedBadge(true);
  }
  return link;
}

function profileTapIcon(uid, fallbackHtml) {
  if (!uid || typeof getProfileUrl !== 'function') return fallbackHtml;
  return '<a class="tc-profile-tap" href="' + getProfileUrl(uid) + '" aria-label="View profile">' + fallbackHtml + '</a>';
}

function taskStatus(row) {
  return String(getField(row, 'STATUS') || 'open').toLowerCase();
}

function taskBelongsToPoster(t, userId) {
  if (typeof taskPostedByUser === 'function') return taskPostedByUser(t, userId);
  return String(getField(t, 'POSTED_BY') || '') === String(userId || '');
}

function tasksForPoster(userId, statusFilter) {
  return allTasks.filter(function (t) {
    if (!taskBelongsToPoster(t, userId)) return false;
    if (!statusFilter) return true;
    return taskStatus(t) === statusFilter;
  });
}

document.getElementById('tabContent').addEventListener('click', function(e) {
  var acceptBtn = e.target.closest('.accept-btn');
  if (acceptBtn && acceptBtn.hasAttribute('data-app-id')) {
    e.preventDefault();
    if (acceptBtn.disabled) return;
    setAcceptLoading(acceptBtn, true);
    acceptApplicant(
      acceptBtn.getAttribute('data-task-id'),
      acceptBtn.getAttribute('data-app-id'),
      acceptBtn
    );
    return;
  }
  var posterCounterBtn = e.target.closest('[data-poster-counter]');
  if (posterCounterBtn) {
    e.preventDefault();
    openCounterModal({
      role: 'poster',
      appId: posterCounterBtn.getAttribute('data-poster-counter'),
      taskId: posterCounterBtn.getAttribute('data-task-id'),
      workerId: posterCounterBtn.getAttribute('data-worker-id')
    });
    return;
  }
  var workerCounterBtn = e.target.closest('[data-worker-counter-back]');
  if (workerCounterBtn) {
    e.preventDefault();
    openCounterModal({
      role: 'worker',
      appId: workerCounterBtn.getAttribute('data-worker-counter-back'),
      taskId: workerCounterBtn.getAttribute('data-task-id')
    });
    return;
  }
  var workerAcceptBtn = e.target.closest('[data-worker-accept-counter]');
  if (workerAcceptBtn) {
    e.preventDefault();
    runWorkerCounterAction(workerAcceptBtn.getAttribute('data-worker-accept-counter'), workerAcceptBtn.getAttribute('data-task-id'), 'accept');
    return;
  }
  var workerDeclineBtn = e.target.closest('[data-worker-decline-counter]');
  if (workerDeclineBtn) {
    e.preventDefault();
    runWorkerCounterAction(workerDeclineBtn.getAttribute('data-worker-decline-counter'), workerDeclineBtn.getAttribute('data-task-id'), 'decline');
    return;
  }
  var posterAcceptCounterBtn = e.target.closest('[data-poster-accept-counter]');
  if (posterAcceptCounterBtn) {
    e.preventDefault();
    runPosterCounterAction(posterAcceptCounterBtn.getAttribute('data-poster-accept-counter'), posterAcceptCounterBtn.getAttribute('data-task-id'), posterAcceptCounterBtn.getAttribute('data-worker-id'), 'accept');
    return;
  }
  var posterDeclineCounterBtn = e.target.closest('[data-poster-decline-counter]');
  if (posterDeclineCounterBtn) {
    e.preventDefault();
    runPosterCounterAction(posterDeclineCounterBtn.getAttribute('data-poster-decline-counter'), posterDeclineCounterBtn.getAttribute('data-task-id'), posterDeclineCounterBtn.getAttribute('data-worker-id'), 'decline');
    return;
  }
  var declineBtn = e.target.closest('.decline-btn[data-decline-app-id]');
  if (declineBtn) {
    e.preventDefault();
    if (declineBtn.disabled) return;
    declineApplicant(
      declineBtn.getAttribute('data-decline-task-id'),
      declineBtn.getAttribute('data-decline-app-id'),
      declineBtn
    );
    return;
  }
  var toggleBtn = e.target.closest('.tc-applicants-toggle');
  if (toggleBtn) {
    toggleApplicants(toggleBtn.getAttribute('data-applicants-toggle'));
    return;
  }
  var cancelPostingBtn = e.target.closest('[data-cancel-posting]');
  if (cancelPostingBtn) {
    e.preventDefault();
    confirmCancelPosting(cancelPostingBtn.getAttribute('data-cancel-posting'));
    return;
  }
  var cancelProgBtn = e.target.closest('[data-cancel-inprogress]');
  if (cancelProgBtn) {
    e.preventDefault();
    confirmCancelInProgress(cancelProgBtn.getAttribute('data-cancel-inprogress'));
    return;
  }
  var repostBtn = e.target.closest('[data-repost-task]');
  if (repostBtn) {
    e.preventDefault();
    confirmRepostTask(repostBtn.getAttribute('data-repost-task'));
  }
});

function showToast(msg, color){
  var t = document.getElementById('toast');
  if (!t) return;
  if (msg != null && typeof msg === 'object') {
    if (typeof formatSupabaseActionError === 'function') {
      msg = formatSupabaseActionError('complete action', msg.error || msg.message || msg);
    } else if (typeof window.QG_formatPayError === 'function') {
      msg = window.QG_formatPayError(msg);
    } else {
      msg = msg.message || msg.error || 'Something went wrong — refresh and try again';
      if (typeof msg === 'object') msg = 'Something went wrong — refresh and try again';
    }
  }
  if (msg === '[object Object]' || msg == null || msg === '') {
    msg = 'Something went wrong — refresh and try again';
  }
  t.textContent = String(msg);
  t.style.background = color || '#4ade80';
  t.style.color = color ? '#fff' : '#0b0118';
  t.style.display = 'block';
  setTimeout(function(){ t.style.display='none'; }, 3000);
}

var pendingConfirm = null;

window.showConfirm = function(opts) {
  pendingConfirm = opts || null;
  document.getElementById('confirmTitle').textContent = opts.title || 'Are you sure?';
  document.getElementById('confirmMsg').textContent = opts.message || '';
  var okBtn = document.getElementById('confirmOkBtn');
  okBtn.textContent = opts.confirmLabel || 'Confirm';
  okBtn.classList.toggle('is-neutral', !!opts.neutral);
  document.getElementById('confirmOverlay').classList.add('open');
};

window.closeConfirm = function() {
  pendingConfirm = null;
  document.getElementById('confirmOverlay').classList.remove('open');
};

window.runConfirm = async function() {
  var opts = pendingConfirm;
  closeConfirm();
  if (opts && typeof opts.onConfirm === 'function') await opts.onConfirm();
};

var pendingCounterAction = null;

window.openCounterModal = function(opts) {
  pendingCounterAction = opts || null;
  document.getElementById('counterTitle').textContent = opts && opts.role === 'worker' ? 'Counter back' : 'Counter offer';
  document.getElementById('counterMsg').textContent = opts && opts.role === 'worker'
    ? 'Send your counter (max 2 rounds in beta).'
    : 'Propose a different price — the tasker gets a notification.';
  document.getElementById('counterAmount').value = '';
  document.getElementById('counterOverlay').classList.add('open');
  setTimeout(function(){ document.getElementById('counterAmount').focus(); }, 50);
};

window.closeCounterModal = function() {
  pendingCounterAction = null;
  document.getElementById('counterOverlay').classList.remove('open');
};

window.runCounterSubmit = async function() {
  var opts = pendingCounterAction;
  if (!opts) return;
  var amount = Math.round(Number(document.getElementById('counterAmount').value));
  if (!amount || amount < 20) {
    showToast('Enter at least $20', '#ef4444');
    return;
  }
  var btn = document.getElementById('counterOkBtn');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  var userId = window._currentUser ? window._currentUser.uid : null;
  var result;
  if (opts.role === 'worker' && typeof workerRespondToCounter === 'function') {
    result = await workerRespondToCounter(opts.appId, userId, 'counter', amount, { taskId: opts.taskId });
  } else if (typeof posterSendCounterOffer === 'function') {
    result = await posterSendCounterOffer(opts.appId, userId, amount, { taskId: opts.taskId, workerId: opts.workerId });
  } else {
    result = { success: false, error: 'missing_api' };
  }
  btn.disabled = false;
  btn.textContent = 'Send counter';
  closeCounterModal();
  if (!result || !result.success) {
    var msg = typeof formatSupabaseActionError === 'function'
      ? formatSupabaseActionError('send counter', (result && result.error) || 'failed')
      : 'Could not send counter — run supabase/negotiation.sql, then refresh.';
    if (result && result.error === 'max_rounds') msg = 'Max 2 counter rounds reached for beta.';
    showToast(msg, '#ef4444');
    return;
  }
  showToast('Counter sent', '#4ade80');
  await reloadMyTasksData();
  renderTab();
};

async function runWorkerCounterAction(appId, taskId, action, amount) {
  var userId = window._currentUser ? window._currentUser.uid : null;
  if (!userId || typeof workerRespondToCounter !== 'function') return;
  var result = await workerRespondToCounter(appId, userId, action, amount, { taskId: taskId });
  if (!result.success) {
    showToast(typeof formatSupabaseActionError === 'function'
      ? formatSupabaseActionError('update counter', result.error)
      : 'Could not update counter', '#ef4444');
    return;
  }
  showToast(action === 'accept' ? 'Counter accepted — price updated' : 'Counter declined', '#4ade80');
  await reloadMyTasksData();
  renderTab();
}

async function runPosterCounterAction(appId, taskId, workerId, action) {
  var userId = window._currentUser ? window._currentUser.uid : null;
  if (!userId || typeof posterRespondToCounter !== 'function') return;
  var result = await posterRespondToCounter(appId, userId, action, { taskId: taskId, workerId: workerId });
  if (!result.success) {
    showToast(typeof formatSupabaseActionError === 'function'
      ? formatSupabaseActionError('update counter', result.error)
      : 'Could not update counter', '#ef4444');
    return;
  }
  showToast(action === 'accept' ? 'Counter accepted — price updated' : 'Counter declined', '#4ade80');
  await reloadMyTasksData();
  renderTab();
}

async function reloadMyTasksData() {
  if (typeof getAllApplications === 'function') {
    allApplications = await getAllApplications();
  }
}

window.showTab = function(tab, btn){
  activeTab = typeof normalizeMyTasksTab === 'function' ? normalizeMyTasksTab(tab) : tab;
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  if (btn && btn.id && TAB_IDS[activeTab] === btn.id) btn.classList.add('active');
  else syncTabButtons();
  if (window.history && window.history.replaceState) {
    var url = new URL(window.location.href);
    url.searchParams.set('tab', activeTab);
    window.history.replaceState({}, '', url.pathname + url.search);
  }
  renderTab();
};

        }
        actions = '<div class="action-row">';

          actions += '<button class="act-btn btn-secondary" onclick="openChatForTask('+taskIdStr+')">💬 Message poster</button>';
        } else {
          actions += '<span class="tc-meta" style="margin:0">Chat opens after the poster accepts you and pays</span>';

        actions += '<button class="act-btn btn-danger" onclick="confirmWithdrawApplication('+appIdStr+')">Withdraw application</button></div>';
        if (typeof reportButtonHtml === 'function') {

        }
      } else if (appStatus === 'accepted') {
        if (!isPaymentGatedChat()) {
          actions = '<div class="action-row"><button class="act-btn btn-secondary" onclick="openChatForTask('+taskIdStr+')">💬 Message poster</button></div>';
        } else {
          actions = '<div class="action-row"><span class="tc-meta" style="margin:0">Waiting for poster payment to unlock chat</span></div>';
