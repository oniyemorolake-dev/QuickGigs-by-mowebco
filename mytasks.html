};

window._auth = auth;
let authChecked = false;
const redirectTimeout = setTimeout(() => {

<script>
/* ──────────────────────────────────────────────────────────────────────────
   My gigs. The in-progress view is
   Claude outputs/sg-design/templates/active-gig.html; the list around it is
   built from the same primitives, because the design does not draw one.
   All data and action logic is carried over from mytasks-legacy.html.
   ────────────────────────────────────────────────────────────────────────── */
(function () {
  'use strict';

  var allTasks = [], allApplications = [], userNames = {}, userAvatars = {};
  var paymentByTaskId = {};
  var activeTab = 'posted';
  var activeTaskId = '';
  var currentUserId = null;
  var map = null, mapMarker = null;
  var evidenceByTask = {};
  var confirmHandler = null, counterHandler = null;

  var params = new URLSearchParams(window.location.search);

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return typeof escapeHtml === 'function' ? escapeHtml(s)
      : String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function toast(msg, ok) {
    var el = $('sgToast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'sg-toast' + (ok === false ? ' is-error' : ' is-ok');
    el.hidden = false;
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.hidden = true; }, 3600);
  }
  /* The legacy page called showToast(msg, '#ef4444') for errors. Keep the name
     so the carried-over handlers read the same, and map the colour onto the
     two states the toast actually has. */
  function showToast(msg, color) { toast(msg, !(color === '#ef4444')); }

  // Field names come back in both cases depending on which endpoint answered.
  var FIELD_MAP = {
    APP_ID: ['APP_ID', 'app_id', 'id'], TASK_ID: ['TASK_ID', 'task_id', 'id'],
    TITLE: ['TITLE', 'title'], CATEGORY: ['CATEGORY', 'category'],
    BUDGET: ['BUDGET', 'budget'], BUDGET_NEGOTIABLE: ['BUDGET_NEGOTIABLE', 'budget_negotiable'],
    LOCATION: ['LOCATION', 'location'], STATUS: ['STATUS', 'status'],
    CREATED_AT: ['CREATED_AT', 'created_at'], SCHEDULED_AT: ['SCHEDULED_AT', 'scheduled_at'],
    POSTED_BY: ['POSTED_BY', 'posted_by'], POSTER_NAME: ['POSTER_NAME', 'poster_name'],
    WORKER_ID: ['WORKER_ID', 'worker_id'], WORKER_NAME: ['WORKER_NAME', 'worker_name'],
    MESSAGE: ['MESSAGE', 'message'], PRICE: ['PRICE', 'price'],
    COUNTER_PRICE: ['COUNTER_PRICE', 'counter_price'], COUNTER_BY: ['COUNTER_BY', 'counter_by'],
    COUNTER_ROUND: ['COUNTER_ROUND', 'counter_round'],
    GUARDIAN_STATUS: ['GUARDIAN_STATUS', 'guardian_status'],
    LAT: ['LAT', 'lat', 'latitude'], LNG: ['LNG', 'lng', 'longitude'],
    PRECISE_ADDRESS: ['PRECISE_ADDRESS', 'precise_address']
  };
  function getField(row, f) {
    if (!row) return '';
    var keys = FIELD_MAP[f] || [f];
    for (var i = 0; i < keys.length; i++) {
      if (row[keys[i]] != null && row[keys[i]] !== '') return row[keys[i]];
    }
    return '';
  }
  function setRowStatus(row, status) {
    if (!row) return;
    row.status = status;
    row.STATUS = status;
  }
  function taskStatusOf(row) { return String(getField(row, 'STATUS') || '').toLowerCase(); }
  function taskBelongsToPoster(t, userId) {
    return typeof taskPostedByUser === 'function'
      ? taskPostedByUser(t, userId)
      : String(getField(t, 'POSTED_BY')) === String(userId);
  }
  function tasksForPoster(userId, statusFilter) {
    return allTasks.filter(function (t) {
      if (!taskBelongsToPoster(t, userId)) return false;
      return statusFilter ? taskStatusOf(t) === statusFilter : true;
    });
  }
  function findTask(taskId) {
    return allTasks.find(function (t) { return String(getField(t, 'TASK_ID')) === String(taskId); }) || null;
  }
  function findAcceptedApplication(taskId) {
    return allApplications.find(function (a) {
      return String(getField(a, 'TASK_ID')) === String(taskId) &&
        ['accepted', 'completed', 'in_progress'].indexOf(String(getField(a, 'STATUS')).toLowerCase()) >= 0;
    }) || null;
  }
  function displayName(uid, row) {
    var name = userNames[String(uid)] ||
      (row ? (getField(row, 'WORKER_NAME') || getField(row, 'POSTER_NAME')) : '');
    if (name && typeof isGenericDisplayName === 'function' && isGenericDisplayName(name)) name = '';
    return name || 'A SwiftGigs member';
  }
  function isPaymentGatedChat() {
    if (typeof QG_paymentsLive === 'function' && !QG_paymentsLive()) return false;
    var rule = window.QG_CONFIG && window.QG_CONFIG.chatUnlockRule;
    return String(rule || 'accept') === 'payment';
  }
  function isTaskPaid(taskId) {
    var p = paymentByTaskId[String(taskId)];
    if (!p) return false;
    var s = String(p.status || '').toLowerCase();
    return s === 'paid' || s === 'held' || s === 'escrow' || s === 'released' || s === 'completed';
  }
  function money(v) { return '$' + esc(String(v == null ? 0 : v)); }
  function toDate(v) {
    if (!v) return null;
    var ms = typeof parseQgTimestamp === 'function' ? parseQgTimestamp(v) : Date.parse(v);
    if (!ms || isNaN(ms)) return null;
    var d = new Date(ms);
    return isNaN(d.getTime()) ? null : d;
  }
  function whenLabel(t) {
    var d = toDate(getField(t, 'SCHEDULED_AT'));
    if (!d) return '';
    var today = new Date(), tom = new Date(Date.now() + 86400000);
    var sameDay = function (a, b) { return a.toDateString() === b.toDateString(); };
    var day = sameDay(d, today) ? 'Today' : sameDay(d, tom) ? 'Tomorrow'
      : d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    return day + ' · ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  }
  function locLabel(t) {
    /* A precise address is shown as the poster typed it. formatLocationDisplay
       title-cases every word, which turns "17 Ave SW" into "17 Ave Sw"; that is
       fine for the coarse city field it was written for, not for a street. */
    var precise = getField(t, 'PRECISE_ADDRESS');
    if (precise) return String(precise);
    var raw = getField(t, 'LOCATION');
    return typeof formatLocationDisplay === 'function' ? formatLocationDisplay(raw) : String(raw || '');
  }
  function titleOf(t) {
    return typeof formatTaskDisplayTitle === 'function'
      ? formatTaskDisplayTitle(t) : (getField(t, 'TITLE') || 'Untitled gig');
  }
  function catSvg(cat) {
    if (typeof qgIcon === 'function') {
      var info = typeof getCatInfo === 'function' ? getCatInfo(cat) : null;
      var name = info && info.icon ? info.icon : 'clipboard';
      return qgIcon(name, { size: 20 });
    }
    return '<svg class="i " viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M9 3h6v4H9z"/></svg>';
  }

  /* ── Sheets ────────────────────────────────────────────────────────────── */
  function openSheet(id) {
    var el = $(id);
    if (!el) return;
    el.classList.add('open');
    el.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function closeSheet(el) {
    if (!el) return;
    el.classList.remove('open');
    el.setAttribute('aria-hidden', 'true');
    if (!document.querySelector('.sg-sheet.open')) document.body.style.overflow = '';
  }
  document.addEventListener('click', function (e) {
    var closer = e.target.closest('[data-close]');
    if (closer) closeSheet(closer.closest('.sg-sheet'));
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSheet(document.querySelector('.sg-sheet.open'));
  });

  function confirmThen(title, message, label, danger, fn) {
    $('sgConfirmTitle').textContent = title;
    $('sgConfirmMsg').textContent = message;
    var go = $('sgConfirmGo');
    go.textContent = label;
    go.className = 'sg-btn ' + (danger ? 'sg-btn-quiet' : 'teal');
    go.style.color = danger ? 'var(--danger)' : '';
    confirmHandler = fn;
    openSheet('sgConfirmSheet');
  }

  /* ── Tabs ──────────────────────────────────────────────────────────────── */
  function isWorker() { return typeof isWorkerMode === 'function' && isWorkerMode(); }

  /* The qg-nav.js tab helper is not loaded here: a poster never needs
     Applied and a tasker never needs Posted, so the tab simply is not there. */
  function tabsForMode() {
    return isWorker()
      ? [['applied', 'Applied'], ['inprogress', 'In progress'], ['completed', 'Done']]
      : [['posted', 'Posted'], ['inprogress', 'In progress'], ['completed', 'Done']];
  }
  function normalizeTab(tab) {
    var ids = tabsForMode().map(function (p) { return p[0]; });
    if (ids.indexOf(tab) >= 0) return tab;
    return typeof defaultMyTasksTab === 'function' ? defaultMyTasksTab() : ids[0];
  }
  function paintSeg() {
    $('sgSeg').innerHTML = tabsForMode().map(function (p) {
      return '<button role="tab" data-tab="' + p[0] + '" aria-selected="' + (p[0] === activeTab) + '"' +
        (p[0] === activeTab ? ' class="on"' : '') + '>' + p[1] + '</button>';
    }).join('');
  }
  function showTab(tab) {
    activeTab = normalizeTab(tab);
    paintSeg();
    if (window.history && window.history.replaceState) {
      var url = new URL(window.location.href);
      url.searchParams.set('tab', activeTab);
      url.searchParams.delete('paid');
      window.history.replaceState({}, '', url.pathname + url.search);
    }
    renderTab();
  }

  /* ── List rendering ────────────────────────────────────────────────────── */
  function gigRow(t, opts) {
    opts = opts || {};
    var bits = [locLabel(t), whenLabel(t)].filter(Boolean).join(' · ');
    return '<a class="sg-card sg-gig" href="#" data-task="' + esc(String(getField(t, 'TASK_ID'))) + '">' +
      '<span class="sg-isq teal">' + catSvg(getField(t, 'CATEGORY')) + '</span>' +
      '<span class="t"><b>' + esc(titleOf(t)) + '</b>' +
      (opts.who ? '<span class="sg-meta">' + esc(opts.who) + '</span>' : '') +
      (bits ? '<span class="sg-meta">' + esc(bits) + '</span>' : '') +
      (opts.note ? '<span class="sg-meta">' + esc(opts.note) + '</span>' : '') +
      '</span>' +
      '<span class="sg-money">' + money(getField(t, 'BUDGET')) + '</span></a>';
  }
  function emptyState(title, sub, action) {
    if (typeof QG_emptyStateHtml === 'function') {
      return QG_emptyStateHtml({ icon: 'inbox', title: title, sub: sub, action: action });
    }
    return '<div class="sg-state"><div class="sg-state-title">' + esc(title) + '</div>' +
      '<div class="sg-state-sub">' + esc(sub) + '</div></div>';
  }
  /* Stands in for the role gate that qg-nav.js renders on injector pages. */
  function roleGate(targetMode, title, sub) {
    return '<div class="sg-state"><div class="sg-state-title">' + esc(title) + '</div>' +
      '<div class="sg-state-sub">' + esc(sub) + '</div>' +
      '<div class="sg-state-actions"><button class="sg-btn teal" data-switch-mode="' + targetMode + '">' +
      (targetMode === 'poster' ? 'Switch to Poster' : 'Switch to Tasker') + '</button></div></div>';
  }

  function renderTab() {
    var content = $('sgTabContent');
    if (!content || !currentUserId) return;
    var userId = currentUserId;

    if (activeTab === 'posted') {
      if (isWorker()) {
        content.innerHTML = roleGate('poster', 'Posting lives in Poster mode',
          'Switch to Poster mode to manage your listings and review applicants.');
        return;
      }
      var open = tasksForPoster(userId, 'open');
      if (!open.length) {
        var inProg = tasksForPoster(userId, 'in_progress').length;
        content.innerHTML = emptyState('No open postings',
          inProg ? 'Accepted gigs move to In progress — you have ' + inProg + ' there.'
            : 'Post a gig and taskers nearby can apply.',
          { label: 'Post a gig', href: 'posttask.html' });
        return;
      }
      content.innerHTML = '<div class="sg-gigs">' + open.map(function (t) {
        var apps = applicantsFor(getField(t, 'TASK_ID'));
        var pending = apps.filter(function (a) { return appStatus(a) === 'pending'; });
        return gigRow(t, {
          note: pending.length
            ? pending.length + ' applicant' + (pending.length === 1 ? '' : 's') + ' — tap to review'
            : 'No applicants yet — tap to share'
        });
      }).join('') + '</div>';
      return;
    }

    if (activeTab === 'applied') {
      if (!isWorker()) {
        content.innerHTML = roleGate('tasker', 'Applications live in Tasker mode',
          'Switch to Tasker mode to browse gigs, apply and track your work.');
        return;
      }
      var mine = allApplications.filter(function (a) {
        return String(getField(a, 'WORKER_ID')) === String(userId);
      });
      var order = { pending: 0, accepted: 1, declined: 2, cancelled: 3 };
      mine.sort(function (a, b) { return (order[appStatus(a)] || 4) - (order[appStatus(b)] || 4); });
      if (!mine.length) {
        content.innerHTML = emptyState('No applications yet',
          'Browse gigs near you and apply to start earning.',
          { label: 'Browse gigs', href: 'browsetask.html' });
        return;
      }
      content.innerHTML = '<div class="sg-gigs">' + mine.map(applicationCard).join('') + '</div>';
      return;
    }

    if (activeTab === 'inprogress') {
      var live = inProgressTasks(userId);
      if (!live.length) {
        content.innerHTML = emptyState('Nothing in progress',
          isWorker() ? 'When a poster accepts you, the gig shows here.'
            : 'After you accept a tasker, the gig appears here.',
          isWorker() ? { label: 'Browse gigs', href: 'browsetask.html' } : null);
        return;
      }
      content.innerHTML = '<div class="sg-gigs">' + live.map(function (t) {
        var app = findAcceptedApplication(getField(t, 'TASK_ID'));
        var mineAsPoster = taskBelongsToPoster(t, userId);
        var who = mineAsPoster
          ? (app ? 'Tasker: ' + displayName(getField(app, 'WORKER_ID'), app) : 'Awaiting tasker')
          : 'For ' + displayName(getField(t, 'POSTED_BY'), t);
        return gigRow(t, { who: who });
      }).join('') + '</div>';
      return;
    }

    if (activeTab === 'completed') {
      var done = completedTasks(userId);
      if (!done.length) {
        content.innerHTML = emptyState('Nothing finished yet',
          'Completed and cancelled gigs land here.',
          isWorker() ? { label: 'Browse gigs', href: 'browsetask.html' } : { label: 'Post a gig', href: 'posttask.html' });
        return;
      }
      content.innerHTML = '<div class="sg-gigs">' + done.map(completedCard).join('') + '</div>';
    }
  }

  function appStatus(a) { return String(getField(a, 'STATUS') || 'pending').toLowerCase(); }
  function applicantsFor(taskId) {
    return allApplications.filter(function (a) {
      return String(getField(a, 'TASK_ID')) === String(taskId) &&
        String(getField(a, 'WORKER_ID')) !== String(currentUserId);
    });
  }
  function inProgressTasks(userId) {
    if (!isWorker()) return tasksForPoster(userId, 'in_progress');
    return allTasks.filter(function (t) {
      return taskStatusOf(t) === 'in_progress' && allApplications.some(function (a) {
        return String(getField(a, 'TASK_ID')) === String(getField(t, 'TASK_ID')) &&
          String(getField(a, 'WORKER_ID')) === String(userId) && appStatus(a) === 'accepted';
      });
    });
  }
  function completedTasks(userId) {
    return allTasks.filter(function (t) {
      var st = taskStatusOf(t);
      if (['completed', 'cancelled', 'expired'].indexOf(st) < 0) return false;
      if (!isWorker()) return taskBelongsToPoster(t, userId);
      return allApplications.some(function (a) {
        return String(getField(a, 'TASK_ID')) === String(getField(t, 'TASK_ID')) &&
          String(getField(a, 'WORKER_ID')) === String(userId);
      });
    });
  }

  function applicationCard(a) {
    var task = findTask(getField(a, 'TASK_ID'));
    if (!task && typeof taskRowFromApplication === 'function') task = taskRowFromApplication(a);
    if (!task) task = {};
    var st = appStatus(a);
    var guardian = String(getField(a, 'GUARDIAN_STATUS') || 'approved').toLowerCase();
    var posterId = getField(task, 'POSTED_BY') || a.posted_by || '';
    var label = guardian === 'pending_guardian' ? 'Waiting for guardian approval'
      : guardian === 'rejected' ? 'Guardian declined'
        : st === 'accepted' ? 'Accepted'
          : st === 'declined' ? 'Not selected'
            : st === 'cancelled' ? 'Withdrawn' : 'Pending';
    var offer = getField(a, 'COUNTER_PRICE') || getField(a, 'PRICE') || getField(task, 'BUDGET');

    var neg = '';
    var counterBy = String(getField(a, 'COUNTER_BY') || '').toLowerCase();
    if (st === 'pending' && counterBy === 'poster') {
      var amt = getField(a, 'COUNTER_PRICE');
      var round = Number(getField(a, 'COUNTER_ROUND') || 0);
      neg = '<div class="sg-sheet-foot" style="flex-wrap:wrap;margin-top:12px">' +
        '<button class="sg-btn teal" data-counter-accept="' + esc(String(getField(a, 'APP_ID'))) + '" data-task="' + esc(String(getField(a, 'TASK_ID'))) + '">Accept ' + money(amt) + '</button>' +
        (round === 1 ? '<button class="sg-btn sg-btn-quiet" data-counter-back="' + esc(String(getField(a, 'APP_ID'))) + '" data-task="' + esc(String(getField(a, 'TASK_ID'))) + '">Counter again</button>' : '') +
        '<button class="sg-btn sg-btn-quiet" data-counter-decline="' + esc(String(getField(a, 'APP_ID'))) + '" data-task="' + esc(String(getField(a, 'TASK_ID'))) + '">Decline</button>' +
        '</div>';
    } else if (st === 'pending' && counterBy === 'worker') {
      neg = '<p class="sg-muted" style="font-size:13px;margin-top:10px">Your counter of ' + money(getField(a, 'COUNTER_PRICE')) + ' is with the poster.</p>';
    }

    var actions = '<div class="sg-sheet-foot" style="flex-wrap:wrap;margin-top:12px">';
    if (st === 'pending' || st === 'accepted') {
      actions += '<button class="sg-btn sg-btn-quiet" data-chat-task="' + esc(String(getField(a, 'TASK_ID'))) + '">Message poster</button>';
    }
    if (st === 'pending') {
      actions += '<button class="sg-btn sg-btn-quiet" style="color:var(--danger)" data-withdraw="' + esc(String(getField(a, 'APP_ID'))) + '">Withdraw</button>';
    }
    actions += '</div>';

    return '<div class="sg-card" style="padding:16px">' +
      '<div style="display:flex;align-items:flex-start;gap:12px">' +
      '<span class="sg-isq teal">' + catSvg(getField(task, 'CATEGORY')) + '</span>' +
      '<span style="flex:1;min-width:0"><b style="display:block;font-size:15.5px">' + esc(titleOf(task)) + '</b>' +
      '<span class="sg-meta">' + esc('Posted by ' + displayName(posterId, task)) + '</span>' +
      '<span class="sg-meta">' + esc(label) + '</span></span>' +
      '<span class="sg-money">' + money(offer) + '</span></div>' +
      neg + actions + '</div>';
  }

  function completedCard(t) {
    var st = taskStatusOf(t);
    var taskId = String(getField(t, 'TASK_ID'));
    var app = findAcceptedApplication(taskId);
    var mineAsPoster = taskBelongsToPoster(t, currentUserId);
    var otherId = mineAsPoster ? (app ? getField(app, 'WORKER_ID') : '') : getField(t, 'POSTED_BY');
    var otherName = displayName(otherId, mineAsPoster ? app : t);
    var badge = st === 'expired' ? 'Expired' : st === 'cancelled' ? 'Cancelled' : 'Done';

    var actions = '<div class="sg-sheet-foot" style="flex-wrap:wrap;margin-top:12px">';
    if (st === 'expired' && mineAsPoster) {
      actions += '<button class="sg-btn teal" data-repost="' + esc(taskId) + '">Repost gig</button>';
    } else if (st === 'completed') {
      actions += '<a class="sg-btn teal" href="' + esc(reviewHref(t, app)) + '">Leave a review</a>';
      if (mineAsPoster) actions += '<button class="sg-btn sg-btn-quiet" data-post-again="' + esc(taskId) + '">Post again</button>';
    }
    actions += '<button class="sg-btn sg-btn-quiet" data-report-task="' + esc(taskId) + '">Report a problem</button></div>';

    return '<div class="sg-card" style="padding:16px">' +
      '<div style="display:flex;align-items:flex-start;gap:12px">' +
      '<span class="sg-isq teal">' + catSvg(getField(t, 'CATEGORY')) + '</span>' +
      '<span style="flex:1;min-width:0"><b style="display:block;font-size:15.5px">' + esc(titleOf(t)) + '</b>' +
      '<span class="sg-meta">' + esc((mineAsPoster ? 'Tasker: ' : 'Poster: ') + otherName) + '</span>' +
      '<span class="sg-meta">' + esc(badge + ' · ' + locLabel(t)) + '</span></span>' +
      '<span class="sg-money">' + money(getField(t, 'BUDGET')) + '</span></div>' + actions + '</div>';
  }

  function reviewHref(task, app) {
    var taskId = String(getField(task, 'TASK_ID'));
    var mineAsPoster = taskBelongsToPoster(task, currentUserId);
    var target = mineAsPoster ? (app ? getField(app, 'WORKER_ID') : '') : getField(task, 'POSTED_BY');
    return 'review.html?task=' + encodeURIComponent(taskId) +
      (target ? '&user=' + encodeURIComponent(String(target)) : '');
  }

  /* ── Applicants sheet ──────────────────────────────────────────────────── */
  var sheetTaskId = '';

  function openApplicants(taskId) {
    sheetTaskId = String(taskId);
    var t = findTask(taskId);
    $('sgAppsFor').textContent = t ? titleOf(t) : '';
    renderApplicants();
    openSheet('sgAppsSheet');
  }

  function renderApplicants() {
    var list = $('sgAppsList');
    var t = findTask(sheetTaskId);
    var apps = applicantsFor(sheetTaskId);
    var accepted = apps.filter(function (a) { return appStatus(a) === 'accepted'; });
    var shown = accepted.length ? apps : apps.filter(function (a) { return appStatus(a) === 'pending'; });
    if (!shown.length) {
      list.innerHTML = emptyState('No applicants yet', 'Share your posting so more taskers see it.', null);
      return;
    }
    list.innerHTML = shown.map(function (a) {
      var workerId = String(getField(a, 'WORKER_ID'));
      var name = displayName(workerId, a);
      var st = appStatus(a);
      var avatar = userAvatars[workerId];
      var offer = getField(a, 'COUNTER_PRICE') || getField(a, 'PRICE') || (t ? getField(t, 'BUDGET') : 0);
      var msg = getField(a, 'MESSAGE');
      var counterBy = String(getField(a, 'COUNTER_BY') || '').toLowerCase();

      var actions = '';
      if (st === 'pending') {
        if (counterBy === 'worker') {
          actions = '<button class="sg-btn teal" data-poster-counter-accept="' + esc(String(getField(a, 'APP_ID'))) + '">Accept ' + money(getField(a, 'COUNTER_PRICE')) + '</button>' +
            '<button class="sg-btn sg-btn-quiet" data-poster-counter-decline="' + esc(String(getField(a, 'APP_ID'))) + '">Decline counter</button>';
        } else {
          actions = '<button class="sg-btn teal" data-accept-app="' + esc(String(getField(a, 'APP_ID'))) + '">Accept</button>' +
            '<button class="sg-btn sg-btn-quiet" data-counter-app="' + esc(String(getField(a, 'APP_ID'))) + '">Counter</button>' +
            '<button class="sg-btn sg-btn-quiet" style="color:var(--danger)" data-decline-app="' + esc(String(getField(a, 'APP_ID'))) + '">Decline</button>';
        }
      } else {
        actions = '<span class="sg-chip-status">' + esc(st.charAt(0).toUpperCase() + st.slice(1)) + '</span>';
      }

      return '<div class="sg-card" style="padding:16px;margin-bottom:12px">' +
        '<div style="display:flex;align-items:flex-start;gap:12px">' +
        '<a class="sg-avatar" href="' + esc(profileHref(workerId)) + '">' +
        (avatar ? '<img src="' + esc(avatar) + '" alt="">' : esc(name.charAt(0).toUpperCase())) + '</a>' +
        '<span style="flex:1;min-width:0"><b style="display:block;font-size:15px">' + esc(name) + '</b>' +
        (msg ? '<span class="sg-meta">' + esc(msg) + '</span>' : '') + '</span>' +
        '<span class="sg-money">' + money(offer) + '</span></div>' +
        '<div class="sg-sheet-foot" style="flex-wrap:wrap;margin-top:12px">' + actions +
        '<button class="sg-btn sg-btn-quiet" data-report-user="' + esc(workerId) + '" data-report-name="' + esc(name) + '">Report</button>' +
        '</div></div>';
    }).join('');
  }
  function profileHref(uid) {
    return typeof getProfileUrl === 'function' ? getProfileUrl(uid)
      : 'profile.html?user=' + encodeURIComponent(String(uid));
  }

  /* ── Active Gig ────────────────────────────────────────────────────────── */
  var STAMPS = ['on_my_way', 'arrived', 'started', 'completed'];

  function stampsDone(taskId) {
    var e = evidenceByTask[String(taskId)];
    var done = {};
    ((e && (e.stamps || e.data)) || []).forEach(function (s) {
      if (s && s.stamp_type) done[s.stamp_type] = s;
    });
    return done;
  }

  async function openActive(taskId) {
    var t = findTask(taskId);
    if (!t) { toast('That gig is no longer here.', false); return; }
    activeTaskId = String(taskId);
    $('sgListScreen').hidden = true;
    $('sgActiveScreen').hidden = false;
    window.scrollTo(0, 0);

    var mineAsPoster = taskBelongsToPoster(t, currentUserId);
    var app = findAcceptedApplication(activeTaskId);
    var otherId = mineAsPoster ? (app ? getField(app, 'WORKER_ID') : '') : getField(t, 'POSTED_BY');
    var otherName = displayName(otherId, mineAsPoster ? app : t);

    $('sgActiveTitle').textContent = titleOf(t);
    $('sgActiveFor').textContent = mineAsPoster
      ? (otherId ? 'Tasker ' + otherName : 'Awaiting tasker')
      : 'For ' + otherName;

    var where = locLabel(t);
    $('sgActiveWhere').textContent = where;
    $('sgActiveWhereRow').hidden = !where;
    var when = whenLabel(t);
    $('sgActiveWhen').textContent = when;
    $('sgActiveWhenRow').hidden = !when;

    $('sgActiveChat').onclick = function (e) { e.preventDefault(); openChatForTask(activeTaskId); };
    $('sgActiveChat').textContent = mineAsPoster ? 'Message tasker' : 'Message client';

    paintMap(t);
    paintExtras(t, mineAsPoster, otherId, otherName);
    paintSteps(t, mineAsPoster);

    if (typeof QG_getTaskEvidence === 'function') {
      try {
        evidenceByTask[activeTaskId] = await QG_getTaskEvidence(activeTaskId);
        if ($('sgActiveScreen').hidden === false && activeTaskId === String(taskId)) paintSteps(t, mineAsPoster);
      } catch (e) {}
    }
  }

  function closeActive() {
    $('sgActiveScreen').hidden = true;
    $('sgListScreen').hidden = false;
    activeTaskId = '';
    if (window.history && window.history.replaceState) {
      var url = new URL(window.location.href);
      url.searchParams.delete('task');
      window.history.replaceState({}, '', url.pathname + url.search);
    }
  }

  function paintMap(t) {
    var box = $('sgActiveMap');
    var lat = Number(getField(t, 'LAT')), lng = Number(getField(t, 'LNG'));
    if (typeof L === 'undefined' || !isFinite(lat) || !isFinite(lng) || (!lat && !lng)) {
      // No coordinates on the row: the template's flat preview box stands in.
      return;
    }
    box.innerHTML = '';
    box.style.padding = '0';
    if (!map) {
      map = L.map(box, { zoomControl: false, attributionControl: true, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false, keyboard: false });
      /* OpenStreetMap, not cartocdn: carto answers 200 with an "API key
         required" placeholder tile now. OSM's tile policy requires the
         attribution line, hence attributionControl above. */
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);
    }
    map.setView([lat, lng], 14);
    if (mapMarker) map.removeLayer(mapMarker);
    mapMarker = L.marker([lat, lng], {
      icon: L.divIcon({ className: '', html: '<span class="sg-pin"></span>', iconSize: [18, 18], iconAnchor: [9, 9] })
    }).addTo(map);
    setTimeout(function () { try { map.invalidateSize(); } catch (e) {} }, 60);
  }

  function paintSteps(t, mineAsPoster) {
    var done = stampsDone(activeTaskId);
    var finished = taskStatusOf(t) === 'completed';
    /* The design draws three stops. "On the way" is the on_my_way stamp;
       arrived and started sit between it and Complete, so they fold into it. */
    var steps = [
      { label: 'Accepted', done: true },
      { label: 'On the way', done: !!(done.on_my_way || done.arrived || done.started) },
      { label: 'Complete', done: finished || !!done.completed }
    ];
    $('sgActiveSteps').innerHTML = steps.map(function (s, i) {
      return (i ? '<span class="line"></span>' : '') +
        '<span class="s' + (s.done ? ' done' : '') + '"><i class="dot"></i>' + esc(s.label) + '</span>';
    }).join('');

    var next = nextAction(t, mineAsPoster, done);
    $('sgActiveNext').textContent = next.next;
    $('sgActiveNextCard').hidden = !next.next;
    var btn = $('sgActivePrimary');
    btn.textContent = next.label;
    btn.disabled = !next.action;
    btn.onclick = next.action || null;
    $('sgActiveStatus').textContent = finished ? 'Completed' : 'In Progress';
  }

  /* One primary action at a time, as the design shows. For the tasker it walks
     the evidence stamps; for the poster it is fund-then-complete. */
  function nextAction(t, mineAsPoster, done) {
    var taskId = String(getField(t, 'TASK_ID'));
    if (taskStatusOf(t) === 'completed') {
      return { label: 'Leave a review', next: 'Rate how it went', action: function () { window.location.href = reviewHref(t, findAcceptedApplication(taskId)); } };
    }
    if (mineAsPoster) {
      if (isPaymentGatedChat() && !isTaskPaid(taskId)) {
        return { label: 'Pay & fund escrow', next: 'Fund the gig so chat unlocks', action: function () { payTask(t); } };
      }
      return { label: 'Mark complete', next: 'Confirm the work is done', action: function () { markComplete(taskId, $('sgActivePrimary')); } };
    }
    if (!done.on_my_way) return { label: 'I am on my way', next: 'Set off and let the client know', action: function () { stamp(taskId, 'on_my_way'); } };
    if (!done.arrived) return { label: 'Mark as Arrived', next: 'Arrive and confirm with client', action: function () { stamp(taskId, 'arrived'); } };
    if (!done.started) return { label: 'Start gig', next: 'Start the work', action: function () { stamp(taskId, 'started'); } };
    return { label: 'Mark complete', next: 'Finish up and mark it done', action: function () { markComplete(taskId, $('sgActivePrimary')); } };
  }

  async function stamp(taskId, type) {
    var btn = $('sgActivePrimary');
    btn.disabled = true;
    if (typeof QG_stampTask !== 'function') { toast('Check-in is not available right now.', false); btn.disabled = false; return; }
    var res = await QG_stampTask(taskId, type);
    if (!res || res.ok === false) {
      btn.disabled = false;
      toast((res && (res.message || res.error)) || 'Could not check in — try again.', false);
      return;
    }
    if (typeof QG_getTaskEvidence === 'function') {
      try { evidenceByTask[String(taskId)] = await QG_getTaskEvidence(taskId); } catch (e) {}
    }
    var t = findTask(taskId);
    paintSteps(t, taskBelongsToPoster(t, currentUserId));
    toast(type === 'arrived' ? 'Marked as arrived' : 'Updated');
    if (typeof haptic === 'function') haptic([10, 20]);
  }

  function paintExtras(t, mineAsPoster, otherId, otherName) {
    var taskId = String(getField(t, 'TASK_ID'));
    var rows = [];
    if (mineAsPoster) {
      rows.push('<button class="sg-btn sg-btn-quiet" data-change-tasker="' + esc(taskId) + '">Change tasker</button>');
      rows.push('<button class="sg-btn sg-btn-quiet" style="color:var(--danger)" data-cancel-task="' + esc(taskId) + '">Cancel gig</button>');
      if (isPaymentGatedChat() && !isTaskPaid(taskId)) {
        rows.push('<button class="sg-btn sg-btn-quiet" data-sync-pay="' + esc(taskId) + '">Sync payment</button>');
      }
    }
    rows.push('<button class="sg-btn sg-btn-quiet" data-dispute-task="' + esc(taskId) + '" data-other="' + esc(String(otherId || '')) + '" data-other-name="' + esc(otherName) + '">Open a dispute</button>');
    if (otherId) rows.push('<button class="sg-btn sg-btn-quiet" data-report-user="' + esc(String(otherId)) + '" data-report-name="' + esc(otherName) + '">Report ' + esc(otherName) + '</button>');

    $('sgActiveExtras').innerHTML = '<div class="sg-sheet-sec">If something goes wrong</div>' +
      '<div class="sg-sheet-foot" style="flex-wrap:wrap;margin-top:0">' + rows.join('') + '</div>';
  }

  /* ── Actions ───────────────────────────────────────────────────────────── */
  function openChatForTask(taskId) {
    var convId = '';
    try { convId = sessionStorage.getItem('qg-task-conv-' + String(taskId)) || ''; } catch (e) {}
    window.location.href = convId
      ? 'messages.html?conv=' + encodeURIComponent(convId)
      : 'messages.html?task=' + encodeURIComponent(String(taskId));
  }

  function payTask(t) {
    var taskId = String(getField(t, 'TASK_ID'));
    if (typeof window.QG_openPayModal !== 'function') { toast('Payments are still loading — try again.', false); return; }
    var app = findAcceptedApplication(taskId);
    var convId = '';
    try { convId = sessionStorage.getItem('qg-task-conv-' + taskId) || ''; } catch (e) {}
    window.QG_openPayModal(taskId, currentUserId, {
      returnPage: 'mytasks',
      returnConv: convId,
      amount: (app && getField(app, 'PRICE')) || getField(t, 'BUDGET'),
      title: titleOf(t),
      subtitle: 'Held securely until you mark the gig complete',
      task: t,
      feeOpts: typeof feeOptsFromTask === 'function' ? feeOptsFromTask(t) : undefined
    }).catch(function () { toast('Could not open payment — try again.', false); });
  }

  async function acceptApplicant(appId, btn) {
    var taskId = sheetTaskId;
    var task = findTask(taskId);
    var app = allApplications.find(function (a) { return String(getField(a, 'APP_ID')) === String(appId); });
    if (!task || !app) { toast('Could not find that application.', false); return; }

    var workerId = String(getField(app, 'WORKER_ID'));
    if (workerId === String(currentUserId)) { toast('You cannot accept yourself on your own gig.', false); return; }
    if (typeof hasPendingApplicationCounter === 'function' && hasPendingApplicationCounter(app)) {
      toast('Resolve the counter-offer before accepting.', false);
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Accepting…';

    // Both gates the legacy page applied before an accept could go through.
    var workerUser = typeof getUserByFirebaseUid === 'function' ? await getUserByFirebaseUid(workerId) : null;
    if (!workerUser || workerUser.tasker_verified !== true) {
      btn.disabled = false; btn.textContent = 'Accept';
      toast('This tasker must verify their identity before they can be accepted.', false);
      return;
    }
    var paymentsOn = typeof QG_paymentsLive === 'function' ? QG_paymentsLive()
      : !!(window.QG_CONFIG && window.QG_CONFIG.paymentsEnabled);
    if (paymentsOn) {
      var guardianOwns = String(workerUser.payout_owner || '') === 'guardian';
      var ready = guardianOwns
        ? (workerUser.guardian_stripe_payouts_enabled === true || workerUser.guardian_stripe_payouts_enabled === 1)
        : (workerUser.stripe_payouts_enabled === true || workerUser.stripe_payouts_enabled === 1 ||
          workerUser.guardian_stripe_payouts_enabled === true || workerUser.guardian_stripe_payouts_enabled === 1);
      if (!ready) {
        btn.disabled = false; btn.textContent = 'Accept';
        toast(guardianOwns
          ? 'This teen tasker needs a parent or guardian to finish payout setup first.'
          : 'This tasker must finish payout setup before they can take paid gigs.', false);
        return;
      }
    }

    var workerName = displayName(workerId, app);
    if (workerUser.name && typeof isGenericDisplayName === 'function' && !isGenericDisplayName(workerUser.name)) {
      workerName = workerUser.name;
    }
    var posterName = window._currentUser.displayName || String(window._currentUser.email || '').split('@')[0];
    if (typeof formatPersonName === 'function') posterName = formatPersonName(posterName);

    var res = await updateApplicationStatus(appId, 'accepted', { taskId: taskId, workerId: workerId });
    if (!res.success) {
      btn.disabled = false; btn.textContent = 'Accept';
      toast('Could not accept: ' + String(res.error || 'unknown error'), false);
      return;
    }
    var ts = await updateTaskStatus(taskId, 'in_progress');
    if (!ts.success) {
      btn.disabled = false; btn.textContent = 'Accept';
      toast('Accepted, but the gig did not move to In progress — refresh and try again.', false);
      return;
    }
    if (typeof notifyWorkerAccepted === 'function') {
      try { await notifyWorkerAccepted(workerId, '', { title: getField(task, 'TITLE'), TASK_ID: taskId }, posterName); } catch (e) {}
    }
    if (typeof declinePendingApplicationsForTask === 'function') {
      try { await declinePendingApplicationsForTask(taskId, appId); } catch (e) {}
    }

    setRowStatus(app, 'accepted');
    setRowStatus(task, 'in_progress');
    allApplications.forEach(function (a) {
      if (String(getField(a, 'TASK_ID')) === String(taskId) && String(getField(a, 'APP_ID')) !== String(appId)) {
        if (appStatus(a) === 'pending') setRowStatus(a, 'declined');
      }
    });
    if (typeof writeTasksCache === 'function') writeTasksCache(allTasks);
    if (typeof writeAppsCache === 'function') writeAppsCache(allApplications);

    var conv = await createConversation({
      task_id: taskId, poster_id: currentUserId, worker_id: workerId,
      poster_name: posterName, worker_name: workerName,
      task_title: getField(task, 'TITLE'), task_category: getField(task, 'CATEGORY'),
      status: 'in_progress', is_unlocked: !isPaymentGatedChat()
    });
    var convId = conv && conv.data && conv.data.conv_id ? String(conv.data.conv_id) : '';
    if (convId) { try { sessionStorage.setItem('qg-task-conv-' + taskId, convId); } catch (e) {} }
    if (convId && !isPaymentGatedChat() && typeof unlockConversationIfAllowed === 'function') {
      try { await unlockConversationIfAllowed(convId, conv.data.status, 'in_progress'); } catch (e) {}
    }

    closeSheet($('sgAppsSheet'));
    if (typeof qgBurstConfetti === 'function') qgBurstConfetti({ count: 36 });
    toast('Accepted ' + workerName);
    showTab('inprogress');

    if (isPaymentGatedChat()) {
      if (convId && typeof window.QG_markJustPaidConv === 'function') window.QG_markJustPaidConv(taskId, convId);
      payTask(task);
    }
    loadData();
  }

  async function declineApplicant(appId, btn) {
    var app = allApplications.find(function (a) { return String(getField(a, 'APP_ID')) === String(appId); });
    if (!app) return;
    var prev = getField(app, 'STATUS') || 'pending';
    btn.disabled = true;
    setRowStatus(app, 'declined');
    renderApplicants();
    var res = await declineApplication(appId, { taskId: sheetTaskId, workerId: getField(app, 'WORKER_ID') });
    if (!res.success) {
      setRowStatus(app, prev);
      renderApplicants();
      toast('Could not decline: ' + String(res.error || 'unknown error'), false);
      return;
    }
    toast('Applicant declined');
    renderTab();
  }

  function openCounter(appId, who) {
    var app = allApplications.find(function (a) { return String(getField(a, 'APP_ID')) === String(appId); });
    if (!app) return;
    var task = findTask(getField(app, 'TASK_ID'));
    var asked = getField(app, 'PRICE') || (task ? getField(task, 'BUDGET') : '');
    $('sgCounterSub').textContent = who === 'poster'
      ? 'They asked for ' + money(asked) + '. What will you pay?'
      : 'The poster offered ' + money(getField(app, 'COUNTER_PRICE')) + '. What do you need?';
    $('sgCounterAmount').value = '';
    $('sgCounterErr').hidden = true;
    counterHandler = async function (amount) {
      if (who === 'poster') {
        await runPosterCounter(appId, getField(app, 'TASK_ID'), getField(app, 'WORKER_ID'), 'counter', amount);
      } else {
        await runWorkerCounter(appId, getField(app, 'TASK_ID'), 'counter', amount);
      }
    };
    openSheet('sgCounterSheet');
  }

  async function runWorkerCounter(appId, taskId, action, amount) {
    if (typeof workerRespondToCounter !== 'function') return;
    if (action === 'accept' && typeof getAccountActionPermission === 'function') {
      var perm = await getAccountActionPermission(currentUserId, 'accept');
      if (!perm.allowed) {
        if (perm.reason === 'tasker_identity_verification_required' && typeof QG_openVerificationPrompt === 'function') {
          QG_openVerificationPrompt('tasker');
        } else {
          toast(perm.message || 'Verification is required.', false);
        }
        return;
      }
    }
    var res = await workerRespondToCounter(appId, currentUserId, action, amount, { taskId: taskId });
    if (!res.success) {
      toast(typeof formatSupabaseActionError === 'function'
        ? formatSupabaseActionError('update counter', res.error) : 'Could not update the counter.', false);
      return;
    }
    toast(action === 'accept' ? 'Counter accepted — price updated' : action === 'counter' ? 'Counter sent' : 'Counter declined');
    await reloadApplications();
    renderTab();
  }

  async function runPosterCounter(appId, taskId, workerId, action, amount) {
    if (typeof posterRespondToCounter !== 'function') return;
    var res = await posterRespondToCounter(appId, currentUserId, action, { taskId: taskId, workerId: workerId, amount: amount });
    if (!res.success) {
      toast(typeof formatSupabaseActionError === 'function'
        ? formatSupabaseActionError('update counter', res.error) : 'Could not update the counter.', false);
      return;
    }
    toast(action === 'accept' ? 'Counter accepted — price updated' : action === 'counter' ? 'Counter sent' : 'Counter declined');
    await reloadApplications();
    renderApplicants();
    renderTab();
  }

  async function reloadApplications() {
    if (typeof getAllApplications === 'function') {
      try { allApplications = await getAllApplications() || allApplications; } catch (e) {}
    }
  }

  async function markComplete(taskId, btn) {
    taskId = String(taskId);
    var task = findTask(taskId);
    var app = findAcceptedApplication(taskId);
    var posterId = task ? getField(task, 'POSTED_BY') : currentUserId;
    var workerId = app ? getField(app, 'WORKER_ID') : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Completing…'; }

    var opts = { taskRow: task, acceptedApp: app, posterId: posterId || currentUserId, workerId: workerId };
    var result = { success: false };
    try {
      if (typeof updateTaskStatus === 'function') result = await updateTaskStatus(taskId, 'completed', opts);
      if ((!result || !result.success) && typeof completeTaskViaServer === 'function') {
        var server = await completeTaskViaServer(taskId, currentUserId, { posterId: opts.posterId, workerId: workerId });
        if (server && server.success) result = { success: true, task_id: server.task_id || taskId };
        else if (server) result = server;
      }
      if ((!result || !result.success) && typeof completeTask === 'function') {
        result = await completeTask(taskId, currentUserId, opts);
      }
    } catch (err) {
      if (btn) { btn.disabled = false; btn.textContent = 'Mark complete'; }
      toast(String((err && err.message) || 'Could not mark complete. Try again.'), false);
      return;
    }
    if (!result || !result.success) {
      if (btn) { btn.disabled = false; btn.textContent = 'Mark complete'; }
      var msg = String((result && (result.message || result.error)) || 'Could not mark complete. Try again.');
      if (typeof formatSupabaseActionError === 'function') msg = formatSupabaseActionError('mark complete', msg);
      toast(msg, false);
      return;
    }

    if (task) setRowStatus(task, 'completed');
    if (app) setRowStatus(app, 'completed');
    if (typeof mergeTaskInCache === 'function') mergeTaskInCache(taskId, { status: 'completed', STATUS: 'completed' });
    if (typeof writeTasksCache === 'function') writeTasksCache(allTasks);
    if (typeof QGTeenSafety !== 'undefined' && typeof QGTeenSafety.endSession === 'function') {
      try { QGTeenSafety.endSession(taskId, 'ended_complete'); } catch (e) {}
    }
    if (typeof qgBurstConfetti === 'function') qgBurstConfetti();
    if (typeof haptic === 'function') haptic([15, 30, 15]);

    // Escrow release is attempted whichever completion path answered.
    if (typeof releaseTaskPayout === 'function') {
      try {
        var rel = await releaseTaskPayout(result.task_id || taskId, currentUserId, { posterId: posterId || currentUserId, workerId: workerId });
        if (rel && rel.transfer_id) toast('Gig complete — tasker payout released.');
        else if (rel && (rel.error === 'worker_payout_setup_required' || rel.error === 'guardian_payout_setup_required')) {
          toast('Gig complete — payout held until the tasker finishes payout setup.', false);
        }
      } catch (e) {}
    }
    if (typeof notifyTaskCompleted === 'function') {
      try {
        if (posterId) await notifyTaskCompleted(posterId, '', { title: getField(task, 'TITLE') }, 'poster');
        if (workerId) await notifyTaskCompleted(workerId, '', { title: getField(task, 'TITLE') }, 'worker');
      } catch (e) {}
    }

    closeActive();
    showTab('completed');
    toast('Gig complete. Leave a review when you can.');
  }

  /* ── Load ──────────────────────────────────────────────────────────────── */
  async function refreshPaymentMap(userId) {
    if (typeof getPaymentsForUser !== 'function') return;
    try {
      var rows = await getPaymentsForUser(userId, 'poster') || [];
      paymentByTaskId = {};
      rows.forEach(function (p) {
        if (p && p.task_id) paymentByTaskId[String(p.task_id)] = p;
      });
    } catch (e) {}
  }

  async function loadData() {
    var userId = currentUserId;
    if (!userId) return;

    var cached = typeof readTasksCache === 'function' ? readTasksCache(true) : null;
    if (cached && cached.length) {
      allTasks = cached;
      if (typeof readAppsCache === 'function') allApplications = readAppsCache(true) || [];
      renderTab();
    }

    // Payment return and pending-payment sync must never block the list.
    (async function () {
      try { if (typeof window.QG_handlePaymentReturn === 'function') await window.QG_handlePaymentReturn(); } catch (e) {}
      try { if (typeof window.QG_syncPendingPayments === 'function') await window.QG_syncPendingPayments(userId); } catch (e) {}
    })();

    try {
      var bundle = typeof fetchMyTasksBundle === 'function' ? await fetchMyTasksBundle(userId) : null;
      var freshTasks = bundle && Array.isArray(bundle.tasks) ? bundle.tasks : [];
      var freshApps = bundle && Array.isArray(bundle.applications) ? bundle.applications : [];
      if (!freshTasks.length && typeof fetchAllTasksFresh === 'function') {
        var scanned = await fetchAllTasksFresh() || [];
        freshTasks = scanned.filter(function (t) { return taskBelongsToPoster(t, userId); });
      }
      if (!bundle && typeof fetchAllApplicationsFresh === 'function') {
        freshApps = await fetchAllApplicationsFresh() || [];
      }
      allTasks = typeof mergeTaskLists === 'function' ? mergeTaskLists(allTasks, freshTasks) : (freshTasks.length ? freshTasks : allTasks);
      allApplications = typeof mergeApplicationLists === 'function' ? mergeApplicationLists(allApplications, freshApps) : (freshApps.length ? freshApps : allApplications);
      if (typeof writeTasksCache === 'function') writeTasksCache(allTasks);
      if (typeof writeAppsCache === 'function') writeAppsCache(allApplications);

      if (typeof getUsersNameMap === 'function') { try { userNames = await getUsersNameMap() || {}; } catch (e) {} }
      if (typeof getUsersAvatarMap === 'function') { try { userAvatars = await getUsersAvatarMap() || {}; } catch (e) {} }
      await refreshPaymentMap(userId);
    } catch (err) {
      if (!allTasks.length) {
        $('sgTabContent').innerHTML = typeof QG_errorStateHtml === 'function'
          ? QG_errorStateHtml({ title: 'Could not load your gigs', sub: 'Check your connection, then try again.' })
          : '<div class="sg-state"><div class="sg-state-title">Could not load your gigs</div></div>';
        return;
      }
    }

    renderTab();
    var openTask = params.get('task') || params.get('expand');
    if (openTask && findTask(openTask)) {
      if (taskStatusOf(findTask(openTask)) === 'in_progress') openActive(openTask);
    }
  }

  window.SG_onUser = function (user) {
    currentUserId = user.uid;
    if (typeof QG_applyRoleMode === 'function') QG_applyRoleMode();
    activeTab = params.get('paid') === '1' ? 'inprogress' : normalizeTab(params.get('tab') || '');
    paintSeg();
    loadData();
  };

  /* ── Wiring ────────────────────────────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', function () {
    $('sgSeg').addEventListener('click', function (e) {
      var b = e.target.closest('[data-tab]');
      if (b) showTab(b.getAttribute('data-tab'));
    });
    $('sgActiveBack').onclick = closeActive;

    $('sgConfirmGo').onclick = function () {
      var fn = confirmHandler;
      confirmHandler = null;
      closeSheet($('sgConfirmSheet'));
      if (fn) fn();
    };
    $('sgCounterSend').onclick = function () {
      var amount = Number($('sgCounterAmount').value);
      if (!isFinite(amount) || amount < 5) {
        $('sgCounterErr').textContent = 'Enter an amount of $5 or more.';
        $('sgCounterErr').hidden = false;
        return;
      }
      $('sgCounterErr').hidden = true;
      var fn = counterHandler;
      counterHandler = null;
      closeSheet($('sgCounterSheet'));
      if (fn) fn(amount);
    };

    $('sgAppsShare').onclick = async function () {
      var t = findTask(sheetTaskId);
      if (!t || typeof shareTask !== 'function') { toast('Sharing is not available here.', false); return; }
      var res = await shareTask(t);
      if (res && res.copied) toast('Link copied');
      else if (res && res.success === false) toast('Could not share that link.', false);
    };
    $('sgAppsCancel').onclick = function () {
      var t = findTask(sheetTaskId);
      confirmThen('Cancel posting?',
        '"' + (t ? titleOf(t) : 'This gig') + '" comes off browse and pending applicants are told.',
        'Cancel posting', true, async function () {
          closeSheet($('sgAppsSheet'));
          if (typeof invalidateTasksCache === 'function') invalidateTasksCache();
          var res = await cancelTask(sheetTaskId);
          if (!res.success) { toast('Could not cancel: ' + String(res.error || 'unknown error'), false); return; }
          if (t) setRowStatus(t, 'cancelled');
          toast('Posting cancelled');
          showTab('completed');
        });
    };

    // One delegated handler for every action button the lists render.
    document.addEventListener('click', function (e) {
      var el;

      el = e.target.closest('[data-task]');
      if (el && el.closest('#sgTabContent')) {
        e.preventDefault();
        var id = el.getAttribute('data-task');
        if (activeTab === 'inprogress') openActive(id);
        else openApplicants(id);
        return;
      }
      el = e.target.closest('[data-switch-mode]');
      if (el) {
        var next = el.getAttribute('data-switch-mode') === 'poster' ? 'poster' : 'tasker';
        if (typeof setMode === 'function') setMode(next);
        if (typeof QG_applyRoleMode === 'function') QG_applyRoleMode();
        activeTab = normalizeTab(activeTab);
        paintSeg();
        renderTab();
        return;
      }
      el = e.target.closest('[data-accept-app]');
      if (el) { acceptApplicant(el.getAttribute('data-accept-app'), el); return; }
      el = e.target.closest('[data-decline-app]');
      if (el) { declineApplicant(el.getAttribute('data-decline-app'), el); return; }
      el = e.target.closest('[data-counter-app]');
      if (el) { openCounter(el.getAttribute('data-counter-app'), 'poster'); return; }
      el = e.target.closest('[data-poster-counter-accept]');
      if (el) {
        var aid = el.getAttribute('data-poster-counter-accept');
        var ap = allApplications.find(function (a) { return String(getField(a, 'APP_ID')) === aid; });
        runPosterCounter(aid, getField(ap, 'TASK_ID'), getField(ap, 'WORKER_ID'), 'accept');
        return;
      }
      el = e.target.closest('[data-poster-counter-decline]');
      if (el) {
        var did = el.getAttribute('data-poster-counter-decline');
        var dp = allApplications.find(function (a) { return String(getField(a, 'APP_ID')) === did; });
        runPosterCounter(did, getField(dp, 'TASK_ID'), getField(dp, 'WORKER_ID'), 'decline');
        return;
      }
      el = e.target.closest('[data-counter-accept]');
      if (el) { runWorkerCounter(el.getAttribute('data-counter-accept'), el.getAttribute('data-task'), 'accept'); return; }
      el = e.target.closest('[data-counter-decline]');
      if (el) { runWorkerCounter(el.getAttribute('data-counter-decline'), el.getAttribute('data-task'), 'decline'); return; }
      el = e.target.closest('[data-counter-back]');
      if (el) { openCounter(el.getAttribute('data-counter-back'), 'worker'); return; }
      el = e.target.closest('[data-chat-task]');
      if (el) { openChatForTask(el.getAttribute('data-chat-task')); return; }
      el = e.target.closest('[data-withdraw]');
      if (el) {
        var wid = el.getAttribute('data-withdraw');
        confirmThen('Withdraw application?', 'Your offer is removed from this gig.', 'Withdraw', true, async function () {
          var ap2 = allApplications.find(function (a) { return String(getField(a, 'APP_ID')) === wid; });
          var res = await cancelApplication(wid, { taskId: ap2 ? getField(ap2, 'TASK_ID') : '', workerId: currentUserId });
          if (!res.success) { toast('Could not withdraw — try again.', false); return; }
          if (ap2) setRowStatus(ap2, 'cancelled');
          renderTab();
          toast('Application withdrawn');
        });
        return;
      }
      el = e.target.closest('[data-repost]');
      if (el) {
        var rid = el.getAttribute('data-repost');
        confirmThen('Repost this gig?', 'It goes back on browse as a new open listing with the same details.',
          'Repost now', false, async function () {
            if (typeof invalidateTasksCache === 'function') invalidateTasksCache();
            var res = await repostTask(rid, currentUserId);
            if (!res.success) {
              toast(res.error === 'not_expired' ? 'Only expired gigs can be reposted.' : 'Could not repost — try again.', false);
              return;
            }
            toast('Reposted — live on browse again');
            await loadData();
            showTab('posted');
          });
        return;
      }
      el = e.target.closest('[data-post-again]');
      if (el) { window.location.href = 'posttask.html?from=' + encodeURIComponent(el.getAttribute('data-post-again')); return; }
      el = e.target.closest('[data-cancel-task]');
      if (el) {
        var cid = el.getAttribute('data-cancel-task');
        confirmThen('Cancel this gig?', 'The tasker is told and any held funds are returned.', 'Cancel gig', true, async function () {
          if (typeof invalidateTasksCache === 'function') invalidateTasksCache();
          var res = await cancelTask(cid);
          if (!res.success) { toast('Could not cancel: ' + String(res.error || 'unknown error'), false); return; }
          var ct = findTask(cid);
          if (ct) setRowStatus(ct, 'cancelled');
          closeActive();
          showTab('completed');
          toast('Gig cancelled');
        });
        return;
      }
      el = e.target.closest('[data-change-tasker]');
      if (el) {
        var chid = el.getAttribute('data-change-tasker');
        confirmThen('Change tasker?', 'The current tasker is released and the gig goes back to open so others can apply.',
          'Change tasker', true, async function () {
            var res = await updateTaskStatus(chid, 'open');
            if (!res.success) { toast('Could not reopen the gig — try again.', false); return; }
            var cht = findTask(chid);
            if (cht) setRowStatus(cht, 'open');
            closeActive();
            showTab('posted');
            toast('Gig reopened for applications');
            loadData();
          });
        return;
      }
      el = e.target.closest('[data-sync-pay]');
      if (el) {
        (async function () {
          if (typeof window.QG_syncPendingPayments === 'function') await window.QG_syncPendingPayments(currentUserId);
          await refreshPaymentMap(currentUserId);
          var t = findTask(activeTaskId || el.getAttribute('data-sync-pay'));
          if (t) paintSteps(t, taskBelongsToPoster(t, currentUserId));
          toast(isTaskPaid(el.getAttribute('data-sync-pay')) ? 'Payment found' : 'No payment found yet', isTaskPaid(el.getAttribute('data-sync-pay')));
        })();
        return;
      }
      el = e.target.closest('[data-dispute-task]');
      if (el && typeof openDisputeModal === 'function') {
        var dt = findTask(el.getAttribute('data-dispute-task'));
        openDisputeModal(el.getAttribute('data-dispute-task'), dt ? titleOf(dt) : '',
          el.getAttribute('data-other'), el.getAttribute('data-other-name'));
        return;
      }
      el = e.target.closest('[data-report-user]');
      if (el && typeof openReportModal === 'function') {
        openReportModal('user', el.getAttribute('data-report-user'), el.getAttribute('data-report-name'));
        return;
      }
      el = e.target.closest('[data-report-task]');
      if (el && typeof openReportModal === 'function') {
        var rt = findTask(el.getAttribute('data-report-task'));
        openReportModal('task', el.getAttribute('data-report-task'), rt ? titleOf(rt) : '');
      }
    });
  });

  // Switching mode changes which tabs exist, so the whole bar is repainted.
  document.addEventListener('qg-mode-changed', function () {
    activeTab = normalizeTab(activeTab);
    paintSeg();
    renderTab();
  });

  window.QG_refreshPaymentState = async function () {
    await refreshPaymentMap(currentUserId);
    if (activeTaskId) {
      var t = findTask(activeTaskId);
      if (t) paintSteps(t, taskBelongsToPoster(t, currentUserId));
    }
    renderTab();
  };
})();
</script>
</body>
</html>
