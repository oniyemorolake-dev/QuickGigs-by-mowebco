        '<div class="tc-meta">Your offer: '+formatAppPriceHtml(a)+' · '+esc(getField(a,'MESSAGE')).substring(0,60)+'...'+(getField(task,'CREATED_AT') && typeof formatRelativeTime === 'function' ? ' · Task posted '+esc(formatRelativeTime(getField(task,'CREATED_AT'))) : '')+'</div>'+
        negoBlock+
        actions+
      '</div>';
    }).join('');
  }

  else if(activeTab === 'inprogress'){
    var inProg;
    if (isPoster) {
      inProg = tasksForPoster(userId, 'in_progress');
    } else {
      inProg = allTasks.filter(function(t){
        return taskStatus(t) === 'in_progress' && allApplications.some(function(a){
          return String(getField(a,'TASK_ID')) === String(getField(t,'TASK_ID')) &&
            getField(a,'WORKER_ID') === userId && String(getField(a,'STATUS') || 'pending').toLowerCase() === 'accepted';
        });
      });
    }
    if(!inProg.length){
      var emptySub = isPoster
        ? (isPaymentGatedChat()
          ? 'After you accept a tasker, pay to unlock chat — then coordinate here until the job is done.'
          : 'After you accept a tasker from Posted, the job appears here.')
        : 'When a poster accepts you, the job shows here. Switch to Tasker mode on Profile if you were browsing as a poster.';
      var openPosted = tasksForPoster(userId, 'open').length;
      var postedLink = openPosted > 0 && isPoster
        ? '<button type="button" class="empty-btn" onclick="showTab(\'posted\',document.getElementById(\'tabPosted\'))">Review ' + openPosted + ' open posting' + (openPosted !== 1 ? 's' : '') + ' →</button>'
        : '';
      content.innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-title">Nothing in progress</div><div class="empty-sub">' + emptySub + '</div>' +
        postedLink +
        (isPoster ? '' : '<a class="empty-btn" href="browsetask.html">Browse tasks</a>') +
        '</div>';
      return;
    }
    content.innerHTML = inProg.map(function(t){
      var cat = getCat(t);
      var userId = window._currentUser ? window._currentUser.uid : null;
      var isPosterTask = getField(t,'POSTED_BY') === userId;
      var taskId = getField(t,'TASK_ID');
      var acceptedApp = findAcceptedApplication(taskId);
      var workerId = acceptedApp ? getField(acceptedApp,'WORKER_ID') : '';
      var workerName = acceptedApp ? displayName(workerId, acceptedApp) : '';
      var posterId = getField(t,'POSTED_BY');
      var roleLabel = isPosterTask
        ? (workerName ? 'Tasker: ' + personLinkWithBadge(workerName, workerId) : 'Awaiting tasker')
        : 'Posted by '+personLink(displayName(posterId, t), posterId);
      var otherUserId = isPosterTask ? workerId : posterId;
      var otherName = isPosterTask ? workerName : displayName(posterId, t);
      var iconHtml = profileTapIcon(otherUserId, '<div class="tc-icon" style="background:'+cat.bg+'">'+cat.icon+'</div>');
      var disputeBtn = typeof disputeButtonHtml === 'function'
        ? disputeButtonHtml(taskId, getField(t,'TITLE'), otherUserId, otherName)
        : '';
      var reportBtns = typeof reportButtonHtml === 'function' && otherUserId
        ? reportButtonHtml('user', otherUserId, otherName)
        : (typeof reportButtonHtml === 'function'
          ? reportButtonHtml('task', taskId, getField(t,'TITLE'))
          : '');
      var selfTask = isPosterTask && workerId && String(workerId) === String(userId);
      var taskPaid = isPosterTask && isTaskPaid(taskId);
      if (!workerId && paymentByTaskId[String(taskId)] && paymentByTaskId[String(taskId)].worker_id) {
        workerId = String(paymentByTaskId[String(taskId)].worker_id);
      }
      var payAction = '';
      if (isPosterTask && isPaymentGatedChat()) {
        if (selfTask) {
          payAction = '<span class="act-btn btn-danger" style="opacity:0.95;cursor:default;pointer-events:none;font-size:12px">⚠ Same account as tasker — cancel &amp; use 2 logins</span>';
        } else if (taskPaid) {
          payAction = '<span class="act-btn btn-secondary" style="opacity:0.9;cursor:default;pointer-events:none">✓ Paid · chat unlocked</span>';
        } else {
          payAction = '<button type="button" class="act-btn btn-primary" data-pay-task="'+escAttr(taskId)+'" data-pay-return="mytasks" data-pay-amount="'+escAttr(String(getField(t,'BUDGET')))+'" data-pay-title="'+escAttr(getField(t,'TITLE'))+'">💳 Pay to unlock</button>' +
            '<button type="button" class="act-btn btn-secondary" data-sync-pay-task="'+escAttr(taskId)+'" title="Paid in Stripe but still locked? Tap to sync">↻ Sync payment</button>';
        }
      }
      var chatNeedsPay = isPosterTask && isPaymentGatedChat() && !taskPaid && !selfTask;
      var messageBtn = isPosterTask
        ? (chatNeedsPay
          ? '<button class="act-btn btn-secondary" onclick="openChatForTask('+JSON.stringify(String(taskId))+')" title="Pay first to unlock chat">💬 Message</button>'
          : '<button class="act-btn btn-primary" onclick="openChatForTask('+JSON.stringify(String(taskId))+')">💬 Message</button>')
        : '';
      var posterActions = isPosterTask
        ? payAction +
          messageBtn +
          '<button class="act-btn btn-success" onclick="markComplete('+JSON.stringify(String(taskId))+', this)">✓ Mark complete</button>' +
          '<button class="act-btn btn-primary" onclick="confirmChangeTasker('+JSON.stringify(String(taskId))+')">↩ Change tasker</button>' +
          '<button class="act-btn btn-danger" data-cancel-inprogress="'+escAttr(taskId)+'">✕ Cancel task</button>'
        : '';
      var workerActions = !isPosterTask
        ? '<button class="act-btn btn-secondary" onclick="openChatForTask('+JSON.stringify(String(taskId))+')">💬 Message poster</button>' +
          '<button class="act-btn btn-success" onclick="markComplete('+JSON.stringify(String(taskId))+', this)">✓ Mark complete</button>'
        : '';
      return '<div class="task-card">'+
        '<div class="tc-top"><div class="tc-left">'+iconHtml+'<div><div class="tc-cat">'+roleLabel+'</div><div class="tc-title">'+esc(getField(t,'TITLE'))+'</div></div></div><span class="tc-badge badge-progress">⏳ In progress</span></div>'+
        '<div class="tc-meta">📍 '+esc(getField(t,'LOCATION'))+' · $'+getField(t,'BUDGET')+'</div>'+
        '<div class="qg-action-row">'+disputeBtn+reportBtns+'</div>'+
        '<div class="action-row">' + posterActions + workerActions + '</div>'+
      '</div>';
    }).join('');
  }

  else if(activeTab === 'completed'){
    var done;
    if (isPoster) {
      done = allTasks.filter(function(t){
        var st = taskStatus(t);
        return (st === 'completed' || st === 'cancelled' || st === 'expired') && taskBelongsToPoster(t, userId);
      });
    } else {
      done = allTasks.filter(function(t){
        var st = taskStatus(t);
        if (st !== 'completed' && st !== 'cancelled') return false;
        return allApplications.some(function(a){
          return String(getField(a,'TASK_ID')) === String(getField(t,'TASK_ID')) && getField(a,'WORKER_ID') === userId;
        });
      });
    }
    if(!done.length){
      content.innerHTML = '<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-title">No completed tasks yet</div><div class="empty-sub">'+(isPoster?'Completed, cancelled, and expired postings appear here. Expired tasks can be reposted with one tap.':'Completed or cancelled tasks will appear here.')+'</div></div>';
      return;
    }
    content.innerHTML = '<div class="hint-box" style="background:rgba(107,63,160,0.12);border:1px solid rgba(200,168,233,0.2);border-radius:14px;padding:14px;margin-bottom:14px;font-size:13px;line-height:1.55;color:var(--text-muted);">⭐ <strong>Please leave a review</strong> on completed jobs — honest feedback helps QuickGigs stay safe for everyone.</div>' +
    done.map(function(t){
      var cat = getCat(t);
      var st = taskStatus(t);
      var isCancelled = st === 'cancelled';
      var isExpired = st === 'expired';
      var acceptedApp = findAcceptedApplication(getField(t,'TASK_ID'));
      var isPoster = getField(t,'POSTED_BY') === userId;
      var workerId = acceptedApp ? getField(acceptedApp, 'WORKER_ID') : '';
      var posterId = getField(t, 'POSTED_BY');
      var otherLabel = isPoster
        ? ('Tasker: ' + personLinkWithBadge(displayName(workerId, acceptedApp || {}), workerId))
        : ('Poster: ' + personLink(displayName(posterId, t), posterId));
      var reviewHref = buildReviewHref(t, acceptedApp);
      var otherUid = isPoster ? workerId : posterId;
      var otherNm = isPoster ? displayName(workerId, acceptedApp || {}) : displayName(posterId, t);
      var disputeBtn = typeof disputeButtonHtml === 'function'
        ? disputeButtonHtml(getField(t,'TASK_ID'), getField(t,'TITLE'), otherUid, otherNm)
        : '';
      var reportBtns = typeof reportButtonHtml === 'function'
        ? reportButtonHtml('task', getField(t,'TASK_ID'), getField(t,'TITLE')) +
          (otherUid ? reportButtonHtml('user', otherUid, otherNm) : '')
        : '';
      var badge = isExpired
        ? '<span class="tc-badge badge-open" style="opacity:0.75">⏱ Expired</span>'
        : isCancelled
        ? '<span class="tc-badge badge-open" style="opacity:0.75">✕ Cancelled</span>'
        : '<span class="tc-badge badge-done">✓ Done</span>';
      var actions = isExpired
        ? '<div class="action-row"><button type="button" class="act-btn btn-primary" data-repost-task="'+escAttr(getField(t,'TASK_ID'))+'">↻ Repost task</button></div>'
        : isCancelled
        ? ''
        : '<div class="action-row"><a class="act-btn btn-review" href="'+reviewHref+'">⭐ Leave a review</a></div>';
      return '<div class="task-card'+(isCancelled || isExpired ?' is-faded':'')+'">'+
        '<div class="tc-top"><div class="tc-left">'+profileTapIcon(otherUid, '<div class="tc-icon" style="background:'+cat.bg+'">'+cat.icon+'</div>')+'<div><div class="tc-cat">'+otherLabel+'</div><div class="tc-title">'+esc(getField(t,'TITLE'))+'</div></div></div>'+badge+'</div>'+
        '<div class="tc-meta">📍 '+esc(getField(t,'LOCATION'))+' · $'+getField(t,'BUDGET')+'</div>'+
        '<div class="qg-action-row">'+disputeBtn+reportBtns+'</div>'+
        actions+
      '</div>';
    }).join('');
  }

  if (typeof bindDisputeTriggers === 'function') bindDisputeTriggers(content);
  if (typeof bindReportTriggers === 'function') bindReportTriggers(content);
}

window.acceptApplicant = async function(taskId, appId, acceptBtn){
  var userId = window._currentUser ? window._currentUser.uid : null;
  if(!userId) return;

  taskId = String(taskId);
  appId = String(appId);
  if (!appId) {
    setAcceptLoading(acceptBtn, false);
    showToast('Invalid application — refresh and try again', '#ef4444');
    return;
  }

  var task = allTasks.find(function(t){ return String(getField(t,'TASK_ID')) === taskId; });
  var app = allApplications.find(function(a){ return String(getField(a,'APP_ID')) === appId; });
  if(!task || !app){
    setAcceptLoading(acceptBtn, false);
    showToast('Could not find task or application', '#ef4444');
    return;
  }

  var workerId = getField(app, 'WORKER_ID');
  if (String(workerId) === String(userId)) {
    setAcceptLoading(acceptBtn, false);
    showToast('You cannot accept yourself on your own task', '#ef4444');
    return;
  }

  var workerName = displayName(workerId, app);

  if (typeof hasPendingApplicationCounter === 'function' && hasPendingApplicationCounter(app)) {
    setAcceptLoading(acceptBtn, false);
    showToast('Resolve the counter-offer before accepting', '#ef4444');
    return;
  }

  var workerUser = await getUserByFirebaseUid(workerId);
  if (workerUser && workerUser.name && typeof isGenericDisplayName === 'function' && !isGenericDisplayName(workerUser.name)) {
    workerName = workerUser.name;
  } else if (typeof getUserNameByFirebaseUid === 'function') {
    var fetchedWorker = await getUserNameByFirebaseUid(workerId);
    if (fetchedWorker) workerName = fetchedWorker;
  }

  var posterName = window._currentUser.displayName || window._currentUser.email.split('@')[0];
  if (typeof formatPersonName === 'function') posterName = formatPersonName(posterName);

  var appStatus = await updateApplicationStatus(appId, 'accepted', {
    taskId: taskId,
    workerId: workerId
  });
  if(!appStatus.success){
    console.error('Accept failed:', appStatus.error);
    setAcceptLoading(acceptBtn, false);
    console.error('FULL acceptApplicant failure:', JSON.stringify(appStatus));
    showToast('Could not accept: ' + String(appStatus.error || 'unknown_error'), '#ef4444');
    return;
  }

  var taskStatus = await updateTaskStatus(taskId, 'in_progress');
  if (!taskStatus.success) {
    console.error('Task status update failed:', taskStatus.error);
    setAcceptLoading(acceptBtn, false);
    var progMsg = typeof formatSupabaseActionError === 'function'
      ? formatSupabaseActionError('start this task', taskStatus.error)
      : 'Accepted applicant but could not move task to In Progress — refresh and try again.';
    showToast(progMsg, '#ef4444');
    return;
  }

  if (typeof notifyWorkerAccepted === 'function') {
    try {
      await notifyWorkerAccepted(workerId, workerUser && workerUser.email, {
        title: getField(task, 'TITLE'),
        TASK_ID: taskId
      }, posterName);
    } catch (notifyErr) {
      console.warn('Accept notification skipped:', notifyErr);
    }
  }

  if (typeof declinePendingApplicationsForTask === 'function') {
    await declinePendingApplicationsForTask(taskId, appId);
  }

  applyLocalAcceptState(taskId, appId);

  if (acceptBtn) {
    acceptBtn.textContent = '✓ Accepted';
    acceptBtn.classList.add('is-done');
    acceptBtn.disabled = true;
    var row = acceptBtn.closest('.applicant-row');
    if (row) {
      row.classList.remove('is-accepting');
      row.classList.add('is-accepted');
    }
  }

  activeTab = 'inprogress';
  if (window.history && window.history.replaceState) {
    var progUrl = new URL(window.location.href);
    progUrl.searchParams.set('tab', 'inprogress');
    window.history.replaceState({}, '', progUrl.pathname + progUrl.search);
  }
  syncTabButtons();
  renderTab();

  var convResult = await createConversation({
    task_id:       taskId,
    poster_id:     userId,
    worker_id:     workerId,
    poster_name:   posterName,
    worker_name:   workerName,
    task_title:    getField(task, 'TITLE'),
    task_category: getField(task, 'CATEGORY'),
    status:        'in_progress',
    is_unlocked:   !isPaymentGatedChat()
  });

  if(!convResult.success){
    setAcceptLoading(acceptBtn, false);
    showToast('Accepted but chat setup failed — try Messages or refresh', '#f59e0b');
    loadData();
    return;
  }

  if (convResult.data && convResult.data.conv_id && !isPaymentGatedChat()) {
    await unlockConversationIfAllowed(convResult.data.conv_id, convResult.data.status, 'in_progress');
    showToast('Accepted ' + workerName + '! Opening chat…');
    try {
      sessionStorage.setItem('qg-task-conv-' + String(taskId), String(convResult.data.conv_id));
    } catch (e) {}
    window.location.href = 'chat.html?conv=' + encodeURIComponent(convResult.data.conv_id);
  } else if (isPaymentGatedChat()) {
    showToast('Accepted ' + workerName + '! Opening payment…', '#4ade80');
    activeTab = 'inprogress';
    syncTabButtons();
    renderTab();
    setAcceptLoading(acceptBtn, false);
    var payAmount = getField(app, 'PRICE') || getField(task, 'BUDGET');
    var payConvId = convResult.data && convResult.data.conv_id ? String(convResult.data.conv_id) : '';
    if (payConvId) {
      try { sessionStorage.setItem('qg-task-conv-' + String(taskId), payConvId); } catch (e) {}
      if (typeof window.QG_markJustPaidConv === 'function') {
        window.QG_markJustPaidConv(taskId, payConvId);
      }
    }
    if (typeof window.QG_openPayModal === 'function') {
      window.QG_openPayModal(taskId, userId, {
        returnPage: 'mytasks',
        returnConv: payConvId,
        amount: payAmount,
        title: getField(task, 'TITLE') || 'Pay to unlock chat'
      }).catch(function (err) {
        console.error('Pay modal failed:', err);
        showToast('Could not open payment — tap Pay on this task', '#ef4444');
      });
    } else {
      showToast('Payment module not loaded — refresh the page', '#ef4444');
    }
  } else {
    showToast('Accepted ' + workerName + '! Moved to In Progress 💬');
  }
  setTimeout(function () { loadData(); }, 100);
};

function findAcceptedApplication(taskId) {
  taskId = String(taskId || '');
  var pay = paymentByTaskId[taskId];
  var payUuid = pay && pay.task_id ? String(pay.task_id) : '';
  var payWorker = pay && pay.worker_id ? String(pay.worker_id) : '';
  var keys = [taskId];
  if (payUuid && keys.indexOf(payUuid) === -1) keys.push(payUuid);

  var accepted = allApplications.find(function(a) {
    var atid = String(getField(a, 'TASK_ID') || '');
    var st = String(getField(a, 'STATUS') || '').toLowerCase();
    if (st !== 'accepted') return false;
    if (keys.indexOf(atid) >= 0) return true;
    if (payWorker && String(getField(a, 'WORKER_ID') || '') === payWorker) return true;
    return false;
  });
  if (accepted) return accepted;

  // Fallback: in_progress / completed app rows for this task (legacy id mismatch)
  return allApplications.find(function(a) {
    var atid = String(getField(a, 'TASK_ID') || '');
    var st = String(getField(a, 'STATUS') || '').toLowerCase();
    if (st !== 'accepted' && st !== 'in_progress' && st !== 'completed') return false;
    if (keys.indexOf(atid) >= 0) return true;
    if (payWorker && String(getField(a, 'WORKER_ID') || '') === payWorker) return true;
    return false;
  });
}

window.openChatWithWorker = async function(taskId, workerId){
  var userId = window._currentUser ? window._currentUser.uid : null;
  if(!userId || !taskId || !workerId) {
    showToast('Could not open chat — refresh and try again', '#ef4444');
    return;
  }

  var task = allTasks.find(function(t){ return String(getField(t,'TASK_ID')) === String(taskId); });
  if(!task){
    showToast('Task not found', '#ef4444');
    return;
  }

  var posterId = getField(task, 'POSTED_BY');
  if (String(posterId) === String(workerId)) {
    showToast('Same account as tasker — cancel this task and test with two logins', '#ef4444');
    return;
  }

  if (typeof window.QG_syncPendingPayments === 'function') {
    if (typeof withTimeout === 'function') {
      withTimeout(window.QG_syncPendingPayments(userId), 1500, null);
    } else {
      window.QG_syncPendingPayments(userId);
    }
  }
  if (typeof window.QG_refreshPaymentState === 'function') {
    window.QG_refreshPaymentState(taskId);
  }

  if (typeof window.qgShowGlobalLoading === 'function') {
    window.qgShowGlobalLoading('Opening chat…');
  }

  var cachedConv = '';
  try { cachedConv = sessionStorage.getItem('qg-task-conv-' + String(taskId)) || ''; } catch (e) {}
  if (cachedConv) {
    window.location.href = 'chat.html?conv=' + encodeURIComponent(cachedConv);
    return;
  }

  var existingConv = await getConversationForTask(taskId, posterId, workerId);
  if (existingConv && existingConv.conv_id) {
    window.location.href = 'chat.html?conv=' + encodeURIComponent(String(existingConv.conv_id));
    return;
  }

  if (isPaymentGatedChat() && typeof ensureChatReadyForTask === 'function') {
    var ready = await ensureChatReadyForTask(taskId, userId);
    if ((!ready || !ready.ok) && ready && ready.error === 'not_paid' && typeof window.QG_syncPayment === 'function') {
      try {
        var recovered = await window.QG_syncPayment(userId, {
          taskId: String(taskId),
          workerId: String(workerId || '')
        });
        if (recovered && recovered.ok) {
          if (recovered.payment && typeof indexPaymentRow === 'function') {
            indexPaymentRow(recovered.payment, [String(taskId), String(recovered.task_id || '')]);
          }
          ready = await ensureChatReadyForTask(taskId, userId, { skipSync: true });
        }
      } catch (recoverErr) {
        console.warn('Payment recover before chat failed:', recoverErr);
      }
    }
    if (ready.ok && ready.conv_id) {
      window.location.href = 'chat.html?conv=' + encodeURIComponent(ready.conv_id);
      return;
    }
    if (ready.error === 'not_paid') {
      if (ready.conv_id) {
        window.location.href = 'chat.html?conv=' + encodeURIComponent(String(ready.conv_id));
        return;
      }
      if (typeof window.qgHideGlobalLoading === 'function') window.qgHideGlobalLoading();
      showToast('Payment not linked yet — tap Sync payment (do not pay twice)', '#f59e0b');
      return;
    }
    if (ready.error === 'self_task') {
      if (typeof window.qgHideGlobalLoading === 'function') window.qgHideGlobalLoading();
      showToast('Same account as tasker — use two logins to test pay + chat', '#ef4444');
      return;
    }
  }

  var statusForChat = taskStatus(task);
  var conv = await getConversationForTask(taskId, posterId, workerId);
  if (conv && conv.conv_id) {
    window.location.href = 'chat.html?conv=' + encodeURIComponent(conv.conv_id);
    return;
  }

  if (typeof window.qgHideGlobalLoading === 'function') window.qgHideGlobalLoading();
  showToast('No chat thread yet — check Messages', '#f59e0b');
  setTimeout(function(){ window.location.href = 'messages.html'; }, 1200);
};

window.openChatForTask = async function(taskId){
  var userId = window._currentUser ? window._currentUser.uid : null;
  if(!userId) return;
  taskId = String(taskId);

  if (typeof window.QG_syncPendingPayments === 'function') {
    if (typeof withTimeout === 'function') {
      await withTimeout(window.QG_syncPendingPayments(userId), 2000, null);
    } else {
      await window.QG_syncPendingPayments(userId);
    }
  }
  if (typeof window.QG_refreshPaymentState === 'function') {
    await window.QG_refreshPaymentState(taskId);
  }

  var task = allTasks.find(function(t){ return String(getField(t,'TASK_ID')) === taskId; });
  if(!task) {
    showToast('Task not found — refresh and try again', '#ef4444');
    return;
  }

  var posterId = getField(task, 'POSTED_BY');
  if (String(posterId) === String(userId)) {
    var acceptedApp = findAcceptedApplication(taskId);
    var workerId = acceptedApp ? getField(acceptedApp, 'WORKER_ID') : '';
    if (!workerId && paymentByTaskId[taskId] && paymentByTaskId[taskId].worker_id) {
      workerId = paymentByTaskId[taskId].worker_id;
    }
    if (!workerId) {
      var pendingApp = allApplications.find(function(a){
        return String(getField(a,'TASK_ID')) === taskId;
      });
      if (pendingApp) workerId = getField(pendingApp, 'WORKER_ID');
    }
    if (workerId) {
      await openChatWithWorker(taskId, workerId);
      return;
    }
  } else {
    await openChatWithWorker(taskId, userId);
    return;
  }

  showToast('No chat yet — open Messages', '#f59e0b');
  setTimeout(function(){ window.location.href = 'messages.html'; }, 1200);
};

window.markComplete = async function(taskId, btn){
  console.log('BUTTON CLICKED — markComplete fired', taskId);
  taskId = String(taskId);
  if (btn) { btn.disabled = true; btn.textContent = 'Completing…'; }
  if (typeof haptic === 'function') haptic(12);
  var userId = window._currentUser ? window._currentUser.uid : '';
  if (!userId) {
    if (btn) { btn.disabled = false; btn.textContent = '✓ Mark complete'; }
    showToast('Not signed in — refresh and try again', '#ef4444');
    return;
  }
  var taskRow = allTasks.find(function(t){ return String(getField(t,'TASK_ID')) === taskId; });
  var acceptedApp = typeof findAcceptedApplication === 'function' ? findAcceptedApplication(taskId) : null;
  var posterId = taskRow ? String(getField(taskRow, 'POSTED_BY') || '') : String(userId);
  var workerId = acceptedApp ? String(getField(acceptedApp, 'WORKER_ID') || '') : '';
  var payRow = paymentByTaskId[taskId];
  if (!workerId && payRow && payRow.worker_id) workerId = String(payRow.worker_id);
  if (!posterId && payRow && payRow.poster_id) posterId = String(payRow.poster_id);
  if (!workerId && posterId && typeof getConversationsForUser === 'function') {
    try {
      var convs = await getConversationsForUser(posterId);
      var matchConv = (convs || []).find(function (c) {
        var cTid = String(c.task_id || '');
        var cSt = String(c.status || '').toLowerCase();
        return (cTid === taskId || (payRow && String(payRow.task_id) === cTid)) &&
          (cSt === 'in_progress' || cSt === 'application' || cSt === 'completed');
      }) || (convs || []).find(function (c) {
        return String(c.poster_id || '') === posterId &&
          String(c.status || '').toLowerCase() === 'in_progress';
      });
      if (matchConv && matchConv.worker_id) workerId = String(matchConv.worker_id);
    } catch (convErr) {
      console.warn('markComplete conv lookup failed:', convErr);
    }
  }
  if (typeof getPaymentByTask === 'function' && posterId) {
    try {
      payRow = await getPaymentByTask(taskId, {
        posterId: posterId,
        workerId: workerId,
        actorId: userId,
        actorRole: 'poster'
      }) || payRow;
      if (payRow) {
        indexPaymentRow(payRow, [taskId]);
        if (payRow.worker_id) workerId = String(payRow.worker_id);
      }
    } catch (payErr) {
      console.warn('markComplete payment lookup failed:', payErr);
    }
  }
  var canonicalTaskId = '';
  if (payRow && payRow.task_id && /^[0-9a-f]{8}-/i.test(String(payRow.task_id))) {
    canonicalTaskId = String(payRow.task_id);
  } else if (taskRow && /^[0-9a-f]{8}-/i.test(String(getField(taskRow, 'TASK_ID') || ''))) {
    canonicalTaskId = String(getField(taskRow, 'TASK_ID'));
  }
  console.log('markComplete resolved', {
    taskId: taskId,
    userId: userId,
    posterId: posterId,
    workerId: workerId,
    canonicalTaskId: canonicalTaskId,
    hasTaskRow: !!taskRow,
    hasPay: !!payRow
  });

  var completeOpts = {
    taskRow: taskRow || null,
    acceptedApp: acceptedApp || null,
    posterId: posterId || userId,
    workerId: workerId,
    canonicalTaskId: canonicalTaskId
  };
  var result;
  try {
    // Prefer edge function with explicit UUID when known
    if (typeof completeTaskViaServer === 'function') {
      var serverFirst = await completeTaskViaServer(taskId, userId, {
        posterId: completeOpts.posterId,
        workerId: completeOpts.workerId,
        canonicalTaskId: canonicalTaskId
      });
      console.log('completeTaskViaServer first:', JSON.stringify(serverFirst));
      if (serverFirst && serverFirst.success) {
        result = {
          success: true,
          task_id: serverFirst.task_id || canonicalTaskId || taskId,
          release: { ok: true, skipped: true },
          pendingPayout: false,
          payoutFailed: false
        };
        // Best-effort payout (never block Completed UI)
        if (typeof releaseTaskPayout === 'function') {
          try {
            result.release = await releaseTaskPayout(result.task_id, userId, {
              posterId: completeOpts.posterId,
              workerId: completeOpts.workerId
            });
            result.pendingPayout = !!(result.release && result.release.error === 'worker_payout_setup_required');
            result.payoutFailed = !!(result.release && !result.release.ok && !result.release.skipped && !result.pendingPayout);
          } catch (e) {
            result.release = { ok: false, error: e.message || String(e) };
            result.payoutFailed = true;
          }
        }
      }
    }
    if (!result || !result.success) {
      if (typeof completeTask === 'function') {
        result = await completeTask(taskId, userId, completeOpts);
      } else {
        result = await updateTaskStatus(canonicalTaskId || taskId, 'completed', completeOpts);
      }
    }
    console.log('completeTask result:', JSON.stringify(result));
  } catch (completeErr) {
    console.error('markComplete threw:', completeErr);
    if (btn) { btn.disabled = false; btn.textContent = '✓ Mark complete'; }
    showToast('Could not mark complete: ' + (completeErr.message || 'refresh and try again'), '#ef4444');
    return;
  }
  if (!result || !result.success) {
    if (btn) { btn.disabled = false; btn.textContent = '✓ Mark complete'; }
    var errCode = (result && result.error) || 'unknown_error';
    if (result && result.release && result.release.error && errCode === 'unknown_error') {
      errCode = result.release.error;
    }
    console.error('FULL markComplete failure:', JSON.stringify(result));
    showToast('Could not mark complete: ' + String(errCode), '#ef4444');
    return;
  }
  if (result.release && result.release.ok && !result.release.skipped && !result.release.already) {
    showToast('Payout sent to tasker (75/25 split)', '#4ade80');
  } else if (result.pendingPayout) {
    showToast('Task complete — payout waits until tasker sets up Stripe in Profile', '#f59e0b');
  } else if (result.payoutFailed) {
    var payoutMsg = (result.release && result.release.error) ? String(result.release.error) : 'Payout pending';
    if (payoutMsg.length > 80) payoutMsg = payoutMsg.slice(0, 80) + '…';
    showToast('Task complete — payout will retry (' + payoutMsg + ')', '#f59e0b');
  }

  try { sessionStorage.setItem('qg-just-completed', taskId); } catch (e) {}
  try { sessionStorage.removeItem('qg-payment-tab'); } catch (e) {}

  var completedKeys = [taskId];
  if (result.task_id) completedKeys.push(String(result.task_id));
  if (payRow && payRow.task_id) completedKeys.push(String(payRow.task_id));
  // Always update the exact row object we completed (ID mismatch-safe)
  if (taskRow) setRowStatus(taskRow, 'completed');
  allTasks.forEach(function(t) {
    var tid = String(getField(t, 'TASK_ID'));
    if (completedKeys.indexOf(tid) >= 0 || t === taskRow) setRowStatus(t, 'completed');
  });
  allApplications.forEach(function(a) {
    var atid = String(getField(a, 'TASK_ID'));
    if (completedKeys.indexOf(atid) >= 0 || (workerId && String(getField(a, 'WORKER_ID')) === String(workerId))) {
      var st = String(getField(a, 'STATUS')).toLowerCase();
      if (st === 'accepted' || st === 'completed' || st === 'in_progress') setRowStatus(a, 'completed');
    }
  });
  if (typeof mergeTaskInCache === 'function') {
    completedKeys.forEach(function (k) { mergeTaskInCache(k, { status: 'completed', STATUS: 'completed' }); });
  }
  if (typeof writeTasksCache === 'function') writeTasksCache(allTasks);

  activeTab = 'completed';
  if (window.history && window.history.replaceState) {
    var doneUrl = new URL(window.location.href);
    doneUrl.searchParams.set('tab', 'completed');
    doneUrl.searchParams.delete('paid');
    window.history.replaceState({}, '', doneUrl.pathname + doneUrl.search);
  }
  syncTabButtons();
  renderTab();
  if (typeof qgBurstConfetti === 'function') qgBurstConfetti();
  showToast('Task complete! Please leave a review.');
  if (btn) { btn.disabled = false; btn.textContent = '✓ Mark complete'; }

  if (typeof notifyTaskCompleted === 'function') {
    try {
      var doneTask = allTasks.find(function(t){ return String(getField(t,'TASK_ID')) === taskId; });
      var notifyPosterId = doneTask ? getField(doneTask, 'POSTED_BY') : posterId;
      var workerApp = allApplications.find(function(a){
        return String(getField(a,'TASK_ID')) === taskId && ['accepted','completed'].indexOf(String(getField(a,'STATUS')).toLowerCase()) >= 0;
      });
      var notifyWorkerId = workerApp ? getField(workerApp, 'WORKER_ID') : workerId;
      if (notifyPosterId) {
        var posterUser = await getUserByFirebaseUid(notifyPosterId);
        await notifyTaskCompleted(notifyPosterId, posterUser && posterUser.email, { title: getField(doneTask, 'TITLE') }, 'poster');
      }
      if (notifyWorkerId) {
        var wUser = await getUserByFirebaseUid(notifyWorkerId);
        await notifyTaskCompleted(notifyWorkerId, wUser && wUser.email, { title: getField(doneTask, 'TITLE') }, 'worker');
      }
    } catch (notifyErr) {
      console.warn('Complete notification skipped:', notifyErr);
    }
  }

  // Soft background refresh — do NOT call loadData() (it resets the Completed tab)
  setTimeout(function () {
    try { sessionStorage.removeItem('qg-just-completed'); } catch (e) {}
  }, 8000);
};

window.declineApplicant = async function(taskId, appId, declineBtn) {
  taskId = String(taskId);
  appId = String(appId);
  if (!appId) {
    showToast('Invalid application — refresh and try again', '#ef4444');
    return;
  }
  var app = allApplications.find(function(a){ return String(getField(a, 'APP_ID')) === appId; });
  var workerId = app ? getField(app, 'WORKER_ID') : '';
  if (declineBtn) {
    declineBtn.disabled = true;
    declineBtn.textContent = 'Declining…';
  }
  var result = await declineApplication(appId, { taskId: taskId, workerId: workerId });
  if (!result.success) {
    if (declineBtn) {
      declineBtn.disabled = false;
      declineBtn.textContent = 'Decline';
    }
    console.error('FULL declineApplicant failure:', JSON.stringify(result));
    showToast('Could not decline: ' + String(result.error || 'unknown_error'), '#ef4444');
    return;
  }
  allApplications.forEach(function(a) {
    if (String(getField(a, 'APP_ID')) === appId ||
        (String(getField(a, 'TASK_ID')) === taskId && String(getField(a, 'WORKER_ID')) === String(workerId))) {
      setRowStatus(a, 'declined');
    }
  });
  showToast('Applicant declined');
  renderTab();
};

window.confirmWithdrawApplication = function(appId) {
  showConfirm({
    title: 'Withdraw application?',
    message: 'Your offer will be removed and the poster will no longer see you as an applicant. You can apply again later if the task is still open.',
    confirmLabel: 'Withdraw',
    onConfirm: async function() {
      var app = allApplications.find(function(a){ return String(getField(a, 'APP_ID')) === String(appId); });
      var taskId = app ? getField(app, 'TASK_ID') : '';
      var workerId = window._currentUser ? window._currentUser.uid : (app ? getField(app, 'WORKER_ID') : '');
      var result = await cancelApplication(String(appId), { taskId: taskId, workerId: workerId });
      if (!result.success) {
        var withdrawMsg = typeof formatSupabaseActionError === 'function'
          ? formatSupabaseActionError('withdraw application', result.error)
          : 'Could not withdraw — run supabase/tasks-beta-fix.sql in Supabase, then refresh.';
        showToast(withdrawMsg, '#ef4444');
        return;
      }
      showToast('Application withdrawn');
      loadData();
    }
  });
};

window.confirmRepostTask = function(taskId) {
  taskId = String(taskId);
  var task = allTasks.find(function(t) { return String(getField(t, 'TASK_ID')) === taskId; });
  var title = task ? getField(task, 'TITLE') : 'this task';
  showConfirm({
    title: 'Repost this task?',
    message: '“' + title + '” will be posted again as a new open listing with the same details. The expired copy stays in your history.',
    confirmLabel: 'Repost now',
    onConfirm: async function() {
      var userId = window._currentUser ? window._currentUser.uid : null;
      if (!userId || typeof repostTask !== 'function') {
        showToast('Could not repost — refresh and try again', '#ef4444');
        return;
      }
      if (typeof invalidateTasksCache === 'function') invalidateTasksCache();
      var result = await repostTask(taskId, userId);
      if (!result.success) {
        var msg = result.error === 'not_expired'
          ? 'Only expired tasks can be reposted.'
          : (typeof formatSupabaseActionError === 'function'
            ? formatSupabaseActionError('repost task', result.error)
            : 'Could not repost — try again.');
        showToast(msg, '#ef4444');
        return;
      }
      showToast('Task reposted — now live on browse');
      await loadData();
      showTab('posted', document.getElementById('tabPosted'));
    }
  });
};

window.confirmCancelPosting = function(taskId) {
  taskId = String(taskId);
  var task = allTasks.find(function(t) { return String(getField(t, 'TASK_ID')) === taskId; });
  var title = task ? getField(task, 'TITLE') : 'this task';
  showConfirm({
    title: 'Cancel posting?',
    message: '“' + title + '” will be removed from browse and all pending applicants will be notified. This cannot be undone.',
    confirmLabel: 'Cancel posting',
    onConfirm: async function() {
      if (typeof invalidateTasksCache === 'function') invalidateTasksCache();
      var result = await cancelTask(taskId);
      if (!result.success) {
        console.error('FULL cancelPosting failure:', JSON.stringify(result));
        showToast('Could not cancel posting: ' + String(result.error || 'unknown_error'), '#ef4444');
        return;
      }
      allTasks.forEach(function(t) {
        if (String(getField(t, 'TASK_ID')) === taskId) setRowStatus(t, 'cancelled');
      });
      if (typeof mergeTaskInCache === 'function') mergeTaskInCache(taskId, { status: 'cancelled' });
      activeTab = 'completed';
      syncTabButtons();
      renderTab();
      showToast('Posting cancelled');
      await loadData();
    }

window.confirmChangeTasker = function(taskId) {
  taskId = String(taskId);
  var task = allTasks.find(function(t) { return String(getField(t, 'TASK_ID')) === taskId; });
  var acceptedApp = findAcceptedApplication(taskId);
  var title = task ? getField(task, 'TITLE') : 'this task';
  var workerId = acceptedApp ? getField(acceptedApp, 'WORKER_ID') : '';
  var workerName = acceptedApp ? displayName(workerId, acceptedApp) : 'this tasker';
  var appId = acceptedApp ? getField(acceptedApp, 'APP_ID') : '';
  if (!appId) {
    showToast('No assigned tasker found — refresh and try again', '#ef4444');
    return;
  }
  if (typeof isTaskPaid === 'function' && isTaskPaid(taskId)) {
    showToast('Cannot change tasker after payment — cancel the task or contact support', '#f59e0b');
    return;
  }
  showConfirm({
    title: 'Change tasker?',
    message: '“' + title + '” will go back to Open and ' + workerName + ' will be notified they were not selected. You can review and accept another applicant from Posted.',
    confirmLabel: 'Change tasker',
    neutral: true,
    onConfirm: async function() {
      if (typeof invalidateTasksCache === 'function') invalidateTasksCache();
      var result = typeof releaseAcceptedTasker === 'function'
        ? await releaseAcceptedTasker(taskId, String(appId))
        : { success: false };
      if (!result.success) {
        console.error('FULL changeTasker failure:', JSON.stringify(result));
        showToast('Could not change tasker: ' + String(result.error || 'unknown_error'), '#ef4444');
        return;
      }
      allTasks.forEach(function(t) {
        if (String(getField(t, 'TASK_ID')) === taskId) setRowStatus(t, 'open');
      });
      allApplications.forEach(function(a) {
        if (String(getField(a, 'TASK_ID')) !== taskId) return;
        if (String(getField(a, 'APP_ID')) === String(appId) || String(getField(a, 'WORKER_ID')) === String(workerId)) {
          setRowStatus(a, 'declined');
        }
      });
      if (typeof mergeTaskInCache === 'function') mergeTaskInCache(taskId, { status: 'open' });
      expandedApplicantTasks[taskId] = true;
      activeTab = 'posted';
      syncTabButtons();
      renderTab();
      showToast('Task reopened — pick another applicant');
      await loadData();
    }
  });
};

window.confirmCancelInProgress = function(taskId) {
  taskId = String(taskId);
  var task = allTasks.find(function(t) { return String(getField(t, 'TASK_ID')) === taskId; });
  var title = task ? getField(task, 'TITLE') : 'this task';
  var paid = typeof isTaskPaid === 'function' ? isTaskPaid(taskId) : false;
  var payRowPromise = typeof getPaymentByTask === 'function' ? getPaymentByTask(taskId) : Promise.resolve(null);
  payRowPromise.then(function(payRow) {
    var pst = payRow && String(payRow.status || payRow.STATUS || '').toLowerCase();
    if (pst === 'paid') {
      showToast('Task already paid out — open a dispute if you need help', '#f59e0b');
      return;
    }
    var refundNote = (paid || pst === 'held')
      ? ' Payment in escrow will be refunded to your card.'
      : '';
    showConfirm({
      title: 'Cancel this task?',
      message: '“' + title + '” will be marked cancelled. The assigned worker will be notified.' + refundNote,
      confirmLabel: 'Cancel task',
      onConfirm: async function() {
        if (typeof invalidateTasksCache === 'function') invalidateTasksCache();
        var userId = window._currentUser ? window._currentUser.uid : '';
        var result = await cancelTask(taskId, { actorId: userId, refundHeld: true });
        if (!result.success) {
          if (result.needsDispute || result.error === 'paid_task_needs_dispute') {
            showToast('Already paid out — use Dispute or contact support', '#f59e0b');
            return;
          }
          console.error('FULL cancelInProgress failure:', JSON.stringify(result));
          showToast('Could not cancel task: ' + String(result.error || 'unknown_error'), '#ef4444');
          return;
        }
        allTasks.forEach(function(t) {
          if (String(getField(t, 'TASK_ID')) === taskId) setRowStatus(t, 'cancelled');
        });
        if (typeof mergeTaskInCache === 'function') mergeTaskInCache(taskId, { status: 'cancelled' });
        activeTab = 'completed';
        syncTabButtons();
        renderTab();
        showToast((paid || pst === 'held') ? 'Task cancelled — refund processing' : 'Task cancelled');
        await loadData();
      }
    });
  });
};
