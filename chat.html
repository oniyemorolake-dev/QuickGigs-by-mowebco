<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0b0118;
  --surface:rgba(255,255,255,0.04);
  --border:rgba(200,168,233,0.1);
  --text:#fff;
  --text-muted:rgba(255,255,255,0.68);
  --text-faint:rgba(255,255,255,0.62);
  --purple:#6b3fa0;
  --purple-light:#9b6fc4;
  --lavender:#c8a8e9;
  --nav-bg:#0b0118;
  --tab-bg:#0e021f;
  --input-bg:rgba(255,255,255,0.06);
  --input-border:rgba(200,168,233,0.15);
  --bubble-mine:#6b3fa0;
  --bubble-theirs:rgba(255,255,255,0.07);
  --bubble-theirs-text:rgba(255,255,255,0.88);
  --time-color:rgba(255,255,255,0.55);
}
body.light{
  --bg:#fafafe;
  --surface:#fff;
  --border:#f0eeff;
  --text:#2d1b4e;
  --text-muted:#6b6580;
  --text-faint:#6b6580;
  --nav-bg:#fff;
  --tab-bg:#fff;
  --input-bg:#f0eeff;
  --input-border:#e8e2ff;
  --bubble-theirs:#fff;
  --bubble-theirs-text:#2d1b4e;
  --time-color:#6b6580;
  --lavender:#6b3fa0;
}

body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:15px;height:100vh;height:100dvh;max-height:100dvh;display:flex;flex-direction:column;transition:background 0.25s,color 0.25s;overflow:hidden;padding-bottom:var(--qg-keyboard-inset, 0px);}

/* Soft thread atmosphere — gradient plane, not a flat void */
body.qg-page-chat::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 50% at 10% 0%, rgba(107,63,160,0.28), transparent 55%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(56,189,248,0.08), transparent 50%),
    var(--bg);
}
body.light.qg-page-chat::before{
  background:
    radial-gradient(ellipse 70% 45% at 0% 0%, rgba(107,63,160,0.12), transparent 55%),
    radial-gradient(ellipse 50% 35% at 100% 100%, rgba(14,165,233,0.06), transparent 50%),
    var(--bg);
}
body.qg-page-chat > *{position:relative;z-index:1;}

/* NAV */
.nav{background:var(--nav-bg);border-bottom:0.5px solid var(--border);padding:12px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0;transition:background 0.25s;}
.back-btn{font-size:20px;color:var(--purple-light);cursor:pointer;text-decoration:none;flex-shrink:0;}
.nav-center{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:inherit;}
.nav-center:hover .nav-name{text-decoration:underline;text-underline-offset:3px;}
.nav-avatar-row{display:flex;align-items:center;justify-content:center;gap:8px;max-width:100%;}
.nav-chat-avatar{
  width:32px;height:32px;min-width:32px;min-height:32px;max-width:32px;max-height:32px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#fff;
  flex-shrink:0;background-size:cover;background-position:center;overflow:hidden;box-sizing:border-box;
}
.nav-chat-avatar.has-photo{color:transparent;}
.nav-chat-avatar img{
  width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;
  object-fit:cover;display:block;border-radius:inherit;
}
.nav-name{font-size:15px;font-weight:500;color:var(--text);}
.nav-sub{font-size:11px;color:var(--text-muted);}
.nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.mode-btn{padding:5px 11px;border-radius:20px;font-size:10px;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);}
body.light .mode-btn{background:#f0eeff;color:var(--purple);}
.chat-hdr-btn{padding:5px 10px;border-radius:20px;font-size:10px;font-weight:500;cursor:pointer;border:0.5px solid rgba(239,68,68,0.35);font-family:'DM Sans',sans-serif;background:rgba(239,68,68,0.12);color:#ef4444;white-space:nowrap;}
body.light .chat-hdr-btn{background:#fef2f2;border-color:#fecaca;color:#b91c1c;}
.chat-hdr-btn:hover{filter:brightness(1.08);}

/* TASK BANNER — pinned task context */
.task-banner{background:var(--nav-bg);border-bottom:0.5px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-shrink:0;transition:background 0.25s;}
.tb-dot{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.tb-info{flex:1;min-width:0;}
.tb-title{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-meta{font-size:11px;color:var(--text-muted);margin-top:1px;}
.tb-status{font-size:10px;padding:3px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.status-progress{background:rgba(74,222,128,0.12);color:#16a34a;}
.status-done{background:rgba(107,63,160,0.2);color:var(--purple-light);}
.status-open{background:rgba(251,191,36,0.12);color:#d97706;}
.status-cancelled{background:rgba(239,68,68,0.12);color:#ef4444;}

/* QUICK ACTIONS (in-chat marketplace) */
.chat-actions{display:none;flex-wrap:wrap;gap:8px;padding:8px 18px;background:var(--nav-bg);border-bottom:0.5px solid var(--border);flex-shrink:0;}
.chat-actions.is-visible{display:flex;}
.chat-action-btn{padding:7px 12px;border-radius:999px;border:0.5px solid var(--border);background:rgba(107,63,160,0.18);color:var(--text);font:500 11px 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;}
.chat-action-btn:hover{border-color:var(--purple-light);}
.chat-action-btn:disabled{opacity:0.45;cursor:not-allowed;}
body.light .chat-action-btn{background:#ede9ff;color:var(--purple);}

/* ONE-TIME SAFETY BANNER */
.safety-banner{display:none;background:rgba(107,63,160,0.14);border-bottom:0.5px solid rgba(200,168,233,0.22);padding:10px 14px 10px 18px;font-size:12px;color:var(--lavender);line-height:1.45;flex-shrink:0;align-items:flex-start;gap:10px;}
.safety-banner.is-visible{display:flex;}
body.light .safety-banner{background:#f5f2ff;color:#5b21b6;border-color:#e8e2ff;}
.safety-banner-text{flex:1;min-width:0;}
.safety-banner-dismiss{border:none;background:transparent;color:inherit;opacity:0.7;cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;flex-shrink:0;}
.safety-banner-dismiss:hover{opacity:1;}

/* LEGACY FRAUD BAR (kept for photo tip when safety banner dismissed) */
.fraud-bar{background:rgba(251,191,36,0.07);border-bottom:0.5px solid rgba(251,191,36,0.15);padding:8px 18px;font-size:11px;color:rgba(251,191,36,0.75);line-height:1.5;flex-shrink:0;}
body.light .fraud-bar{background:#fffbeb;color:#92400e;border-color:#fde68a;}

/* CHAT SCROLL AREA */
.chat-scroll{
  flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px;
}
.chat-scroll::-webkit-scrollbar{width:3px;}
.chat-scroll::-webkit-scrollbar-thumb{background:rgba(200,168,233,0.2);border-radius:2px;}

/* Empty thread (not the inbox empty state) */
.chat-empty{
  margin:auto 0;padding:28px 18px;text-align:center;max-width:280px;align-self:center;
}
.chat-empty-glyph{
  width:56px;height:56px;margin:0 auto 14px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  background:rgba(107,63,160,0.18);border:0.5px solid rgba(200,168,233,0.22);
}
body.light .chat-empty-glyph{background:#f0eeff;border-color:#e8e2ff;}
.chat-empty-title{font-size:15px;font-weight:500;color:var(--text);margin-bottom:6px;}
.chat-empty-sub{font-size:13px;color:var(--text-muted);line-height:1.5;}

/* DATE DIVIDER */
.date-divider{
  align-self:center;text-align:center;font-size:11px;font-weight:500;letter-spacing:0.04em;
  color:var(--text-faint);margin:10px 0 6px;padding:4px 12px;border-radius:999px;
  background:rgba(255,255,255,0.05);border:0.5px solid var(--border);
}
body.light .date-divider{background:#f5f2ff;border-color:#ebe6ff;}

/* BUBBLES — QuickGigs thread (not a generic chat clone) */
.bubble-row{display:flex;flex-direction:column;max-width:100%;animation:qgBubbleIn 0.22s ease both;}
@keyframes qgBubbleIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bubble-row.mine{align-items:flex-end;}
.bubble-row.theirs{align-items:flex-start;}
.bubble-row.grouped{margin-top:-4px;}
.bubble{
  max-width:min(78%, 340px);padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;
  word-wrap:break-word;box-shadow:0 6px 18px rgba(0,0,0,0.12);
}
.bubble-row.mine .bubble{
  background:linear-gradient(145deg,#7a4cb8 0%,#6b3fa0 55%,#5a3490 100%);
  color:#fff;border-bottom-right-radius:5px;
}
body.light .bubble-row.mine .bubble{color:#fff;}
.bubble-row.theirs .bubble{
  background:var(--bubble-theirs);color:var(--bubble-theirs-text);
  border-bottom-left-radius:5px;border:0.5px solid var(--border);
  backdrop-filter:blur(8px);
}
.bubble-time{font-size:10px;color:var(--time-color);margin-top:3px;padding:0 4px;letter-spacing:0.01em;}
.bubble-check{font-size:10px;color:var(--time-color);letter-spacing:-0.04em;}
.bubble-check.is-read{color:#4ade80;}
body.light .bubble-check.is-read{color:#16a34a;}

/* SYSTEM EVENT IN THREAD */
.sys-msg{align-self:center;max-width:90%;text-align:center;font-size:11px;line-height:1.45;color:var(--text-muted);padding:6px 12px;margin:2px 0;border-radius:999px;background:rgba(107,63,160,0.12);border:0.5px solid rgba(200,168,233,0.18);}
body.light .sys-msg{background:#f0eeff;border-color:#e8e2ff;color:#5b21b6;}

/* TYPING */
.typing-bubble{display:none;align-self:flex-start;font-size:11px;color:var(--text-faint);padding:4px 8px;margin-top:2px;}
.typing-bubble.show{display:block;}

/* BLOCKED MESSAGE */
.blocked-msg{background:rgba(239,68,68,0.1);border:0.5px solid rgba(239,68,68,0.25);border-radius:12px;padding:10px 14px;font-size:12px;color:#ef4444;line-height:1.5;margin:0 0 6px;}
body.light .blocked-msg{background:#fef2f2;border-color:#fecaca;color:#dc2626;}

/* INPUT AREA — pinned above keyboard via --qg-keyboard-inset on body */
.input-area{
  background:rgba(11,1,24,0.92);border-top:0.5px solid var(--border);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
  display:flex;align-items:flex-end;gap:10px;flex-shrink:0;
  transition:background 0.25s;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
body.light .input-area{background:rgba(255,255,255,0.94);}
.task-photo-strip{display:none;flex-wrap:wrap;gap:8px;padding:10px 18px;background:var(--nav-bg);border-bottom:0.5px solid var(--border);flex-shrink:0;}
.task-photo-strip img{width:64px;height:64px;min-width:64px;min-height:64px;max-width:64px;max-height:64px;object-fit:cover;border-radius:10px;border:0.5px solid var(--border);display:block;}
.task-photo-label{font-size:10px;color:var(--text-muted);width:100%;}
.input-wrap{flex:1;background:var(--input-bg);border:0.5px solid var(--input-border);border-radius:20px;padding:10px 16px;transition:border-color 0.2s;}
.input-wrap:focus-within{border-color:var(--purple-light);}
.msg-input{width:100%;background:none;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);resize:none;max-height:100px;min-height:20px;line-height:1.4;}
.msg-input::placeholder{color:var(--lavender);opacity:0.35;}
body.light .msg-input::placeholder{color:var(--purple);opacity:0.3;}
.send-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#8b5cc7,#6b3fa0);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0;transition:opacity 0.15s,transform 0.15s;box-shadow:0 4px 14px rgba(107,63,160,0.35);}
.send-btn:hover{opacity:0.92;transform:translateY(-1px);}
.send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
body.light .send-btn{color:#fff;}
.attach-btn{width:42px;height:42px;border-radius:50%;background:var(--input-bg);border:0.5px solid var(--input-border);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.attach-btn.visible{display:flex;}
.attach-btn:disabled{opacity:0.4;cursor:not-allowed;}
.bubble-image{max-width:min(220px,72vw);max-height:280px;width:auto;height:auto;object-fit:cover;border-radius:14px;display:block;cursor:pointer;}
.bubble-image-caption{font-size:10px;color:var(--text-muted);margin-top:4px;}

/* FRAUD WARNING INLINE */
.fraud-inline{font-size:11px;padding:8px 12px;border-radius:10px;background:rgba(239,68,68,0.08);color:#ef4444;border:0.5px solid rgba(239,68,68,0.2);display:none;margin-top:6px;line-height:1.5;}
body.light .fraud-inline{background:#fef2f2;color:#dc2626;border-color:#fecaca;}

/* LOCKED STATE */
.locked-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 30px;text-align:center;}
.locked-icon{font-size:48px;margin-bottom:16px;}
.locked-title{font-size:18px;font-weight:500;color:var(--text);margin-bottom:8px;}
.locked-sub{font-size:14px;color:var(--text-muted);line-height:1.6;}
.locked-action{margin-top:16px;padding:12px 20px;border-radius:13px;text-decoration:none;font-size:13px;font-weight:500;display:inline-block;}
.locked-review-btn{background:rgba(251,191,36,0.15);color:#d97706;border:0.5px solid rgba(251,191,36,0.35);}
.locked-pay-btn{background:var(--purple);color:#fff;}

/* TAB BAR */
.tab-bar{background:var(--tab-bg);border-top:0.5px solid var(--border);display:flex;padding:8px 0 14px;flex-shrink:0;transition:background 0.25s;}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-decoration:none;}
.tab-icon{font-size:22px;color:var(--text-faint);}
.tab-lbl{font-size:10px;color:var(--text-faint);}
.tab-item.active .tab-icon,.tab-item.active .tab-lbl{color:var(--purple-light);}
body.light .tab-item.active .tab-icon,body.light .tab-item.active .tab-lbl{color:var(--purple);}
</style>

<!-- NAV -->
<nav class="nav">

<!-- TASK BANNER — pinned context (title / price / status) -->

<div class="task-photo-strip" id="taskPhotoStrip"></div>

<!-- In-chat marketplace actions (accept / agree price / complete) -->
<div class="chat-actions" id="chatQuickActions" aria-label="Task actions"></div>

<!-- ONE-TIME SAFETY BANNER (new conversations) -->
<div class="safety-banner" id="chatSafetyBanner" role="status">
  <span class="safety-banner-text">Keep chat and payment on QuickGigs — off-platform deals aren't protected.</span>
  <button type="button" class="safety-banner-dismiss" id="chatSafetyDismiss" aria-label="Dismiss safety tip">✕</button>
</div>

<!-- CHAT AREA -->
<div class="chat-scroll" id="chatScroll" role="log" aria-live="polite"></div>

<!-- INPUT -->
<div class="input-area">
  <!-- Image attach hidden until backend moderation is ready -->
  <input type="file" id="chatPhotoInput" accept="image/*" style="display:none" disabled aria-hidden="true">
  <button type="button" class="attach-btn" id="attachBtn" hidden disabled aria-hidden="true" title="Photo sharing coming soon">📷</button>
  <div style="flex:1">
    <div class="input-wrap">
      <textarea class="msg-input" id="msgInput" placeholder="Type a message..." rows="1" enterkeyhint="send" autocomplete="off" autocorrect="on" oninput="handleInput(this)" onkeydown="handleKey(event)"></textarea>
    </div>
    <div class="fraud-inline" id="fraudInline">
      🚫 <span id="fraudInlineText">You can't share phone numbers or email addresses on QuickGigs. Keep all communication here to stay protected.</span>
    </div>
  </div>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled aria-label="Send message">➤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbYJxU-3r7qVMqwzXHiC-qRkZNtmGobm0",
  authDomain: "quickgigs-7b12d.firebaseapp.com",
  projectId: "quickgigs-7b12d",
  storageBucket: "quickgigs-7b12d.firebasestorage.app",
  messagingSenderId: "698985399366",
  appId: "1:698985399366:web:8a3ca60c5f3ffac84bb647"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let authChecked = false;
const redirectTimeout = setTimeout(() => {
  if (!authChecked) window.location.href = 'login.html';
}, 3000);
window._auth = auth;
onAuthStateChanged(auth, (user) => {
  authChecked = true;
  clearTimeout(redirectTimeout);
  if (!user) { window.location.href = 'login.html'; return; }
  if (typeof setCurrentUser === 'function') setCurrentUser(user);
  else window._currentUser = user;
  function startChat() {
    if (typeof window.initChat === 'function' && typeof getConversation === 'function') {
      Promise.resolve(window.initChat()).catch(function (err) {
        console.error('[QuickGigs chat] init failed:', err);
        if (typeof showChatLoadError === 'function') {
          showChatLoadError('Could not open this chat. Check your connection and try again.');
        }
      });
    } else {
      setTimeout(startChat, 40);
    }
  }
  startChat();
});
</script>

<script>
// ── THEME ──────────────────────────────────────────────
var isDark = (typeof QG_isDarkTheme === 'function')
  ? QG_isDarkTheme()
  : (localStorage.getItem('qg-theme') !== 'light');
function applyTheme(){
  document.body.classList.toggle('light', !isDark);
  document.body.classList.add('qg-page-chat', 'page-chat');
  document.documentElement.setAttribute('data-qg-page', 'chat');
  var b = document.getElementById('modeBtn');
  if (b) b.textContent = isDark ? '☀️ Light' : '🌙 Dark';
}
window.toggleTheme = function(){
  isDark = !isDark;
  if (typeof QG_setThemeDark === 'function') QG_setThemeDark(isDark);
  else localStorage.setItem('qg-theme', isDark ? 'dark' : 'light');
  applyTheme();
};
applyTheme();

// Keep composer above the mobile keyboard (visualViewport).
(function bindChatKeyboardInset() {
  function syncInset() {
    try {
      if (!window.visualViewport) {
        document.documentElement.style.setProperty('--qg-keyboard-inset', '0px');
        return;
      }
      var vv = window.visualViewport;
      var inset = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
      document.documentElement.style.setProperty('--qg-keyboard-inset', inset + 'px');
    } catch (e) {}
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncInset);
    window.visualViewport.addEventListener('scroll', syncInset);
  }
  window.addEventListener('resize', syncInset);
  syncInset();
})();

function ensureChatChrome() {
  // Unwrap leftover <main> that previously blanked the flex chat column.
  try {
    document.querySelectorAll('main#main, main.qg-main').forEach(function (el) {
      if (!el || !el.parentNode) return;
      while (el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
      el.parentNode.removeChild(el);
    });
  } catch (e) {}
  var scroll = document.getElementById('chatScroll');
  if (scroll) {
    scroll.classList.remove('qg-main');
    if (!scroll.getAttribute('role')) scroll.setAttribute('role', 'log');
    scroll.style.flex = '1 1 auto';
    scroll.style.minHeight = '0';
  }
  var input = document.querySelector('.input-area');
  if (input) input.style.display = '';
  var nav = document.querySelector('.nav');
  if (nav) nav.style.display = '';
  return !!(scroll && input && nav);
}
window.ensureChatChrome = ensureChatChrome;
ensureChatChrome();

var CAT_ICONS = {home:'🏠',errands:'🚗',tutoring:'🎓',beauty:'💇',moving:'🚚',cooking:'🍳',tech:'💻',care:'👶',gardening:'🌿',events:'🎉',trades:'🔧',other:'📦'};
var CAT_BG = {home:'rgba(107,63,160,0.2)',errands:'rgba(251,191,36,0.15)',tutoring:'rgba(74,222,128,0.1)',beauty:'rgba(200,168,233,0.15)',moving:'rgba(107,63,160,0.2)',cooking:'rgba(251,191,36,0.12)',tech:'rgba(107,63,160,0.2)',care:'rgba(74,222,128,0.1)',gardening:'rgba(74,222,128,0.08)',events:'rgba(200,168,233,0.15)',trades:'rgba(107,63,160,0.2)',other:'rgba(255,255,255,0.06)'};

var _qgChatParams = new URLSearchParams(window.location.search);
var convId = _qgChatParams.get('conv');
var taskIdFromUrl = _qgChatParams.get('task') || '';
var withUidFromUrl = _qgChatParams.get('peer') || _qgChatParams.get('with') || '';
var currentConv = null;
var messages = [];
var pollTimer = null;
var currentUserId = null;
var chatIsPoster = false;
var chatLightboxBound = false;
var chatOtherUid = '';
var chatOtherName = '';
var chatTaskRow = null;
var chatAcceptedApp = null;
var peerLastReadAt = null;
var _typingHideTimer = null;
var _realtimeMode = 'poll';

// ── FRAUD + CONTENT MODERATION (shared rules) ──────────

function getRecentMyTexts(){
  return messages.filter(function(m){ return m.from === 'me'; }).slice(-4).map(function(m){ return m.text; });
}

function analyzeFraud(text){
  var recent = getRecentMyTexts();
  if (typeof analyzeOffPlatformContact === 'function') {
    return analyzeOffPlatformContact(text, recent, { convId: convId, senderId: currentUserId });
  }
  if (typeof containsOffPlatformContact === 'function' && containsOffPlatformContact(text, recent, { convId: convId, senderId: currentUserId })) {
    return { blocked: true, reason: 'pattern', message: typeof getOffPlatformWarning === 'function' ? getOffPlatformWarning() : '' };
  }
  return { blocked: false };
}

function analyzeContentSafety(text){
  if (typeof moderateText !== 'function') return { blocked: false };
  return moderateText(text);
}

function containsFraud(text){
  return analyzeFraud(text).blocked;
}

function fraudViolationKey(){
  return 'qg-fraud-violations:' + (convId || 'none');
}

function getFraudViolationCount(){
  try { return parseInt(sessionStorage.getItem(fraudViolationKey()) || '0', 10) || 0; }
  catch (e) { return 0; }
}

function bumpFraudViolation(){
  var n = getFraudViolationCount() + 1;
  try { sessionStorage.setItem(fraudViolationKey(), String(n)); } catch (e) {}
  return n;
}

function showFraudStrongModal(){
  var existing = document.getElementById('fraudStrongModal');
  if (existing) existing.remove();
  var msg = typeof getOffPlatformStrongWarning === 'function'
    ? getOffPlatformStrongWarning()
    : 'Sharing contact info violates our terms and can lead to a ban';
  var wrap = document.createElement('div');
  wrap.id = 'fraudStrongModal';
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-modal', 'true');
  wrap.style.cssText = 'position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;padding:24px;';
  wrap.innerHTML =
    '<div style="max-width:340px;width:100%;background:var(--card-bg,#150830);color:var(--text,#fff);border:0.5px solid rgba(239,68,68,0.35);border-radius:16px;padding:22px 20px;font-family:DM Sans,sans-serif;box-shadow:0 16px 48px rgba(0,0,0,0.45)">' +
      '<div style="font-size:15px;font-weight:600;margin-bottom:10px;color:#ef4444">Terms warning</div>' +
      '<div style="font-size:13px;line-height:1.55;opacity:0.9;margin-bottom:18px">' + (typeof escapeHtml === 'function' ? escapeHtml(msg) : msg) + '</div>' +
      '<button type="button" id="fraudStrongOk" style="width:100%;padding:12px;border:none;border-radius:10px;background:#ef4444;color:#fff;font:600 14px DM Sans,sans-serif;cursor:pointer">I understand</button>' +
    '</div>';
  document.body.appendChild(wrap);
  document.getElementById('fraudStrongOk').onclick = function(){ wrap.remove(); };
  wrap.addEventListener('click', function(e){ if (e.target === wrap) wrap.remove(); });
}

function showRulesBlockInline(msg){
  var fraudInline = document.getElementById('fraudInline');
  var warnEl = document.getElementById('fraudInlineText');
  if (fraudInline) fraudInline.style.display = 'block';
  if (warnEl) warnEl.textContent = msg || (typeof getOffPlatformWarning === 'function' ? getOffPlatformWarning() : 'Message blocked.');
}

function handleFraudBlock(check, preview, opts){
  check = check || {};
  opts = opts || {};
  var msg = check.message || (typeof getOffPlatformWarning === 'function' ? getOffPlatformWarning() : 'Message blocked.');
  showRulesBlockInline(msg);

  if (check.reason === 'digits_only' || check.reason === 'digit_fragment') {
    if (typeof showToast === 'function') showToast(msg, '#f59e0b');
    return;
  }

  var count = bumpFraudViolation();
  if (!opts.skipLog && typeof logFraudContactEvent === 'function') {
    logFraudContactEvent({
      userId: currentUserId,
      convId: convId,
      reason: check.reason || 'contact',
      violation: count,
      preview: preview || ''
    });
  }
  if (count >= 2) {
    showFraudStrongModal();
  } else if (typeof showToast === 'function') {
    showToast(msg, '#f59e0b');
  }
}

function handleContentModBlock(mod, preview, opts){
  mod = mod || {};
  opts = opts || {};
  var msg = mod.message || (typeof QG_CONTENT_MOD_MESSAGE === 'string' ? QG_CONTENT_MOD_MESSAGE :
    "This contains language that isn't allowed on QuickGigs — please edit and try again");
  showRulesBlockInline(msg);
  if (!opts.skipLog && typeof logModerationAttempt === 'function') {
    logModerationAttempt({
      userId: currentUserId,
      source: 'chat',
      targetType: 'chat_message',
      targetId: convId || 'chat',
      flags: mod.flags || [],
      preview: preview || '',
      message: msg
    });
  }
  if (typeof showToast === 'function') showToast(msg, '#ef4444');
}

function safetyBannerKey(id){
  return 'qg-chat-safety-seen:' + (id || 'none');
}

function maybeShowSafetyBanner(id, messageCount){
  var banner = document.getElementById('chatSafetyBanner');
  if (!banner) return;
  var seen = false;
  try { seen = !!localStorage.getItem(safetyBannerKey(id)); } catch (e) {}
  // One-time for a conversation (especially new / low-message threads)
  var isNew = !messageCount || messageCount < 3;
  if (!seen && isNew) banner.classList.add('is-visible');
  else banner.classList.remove('is-visible');
}

function dismissSafetyBanner(){
  var banner = document.getElementById('chatSafetyBanner');
  if (banner) banner.classList.remove('is-visible');
  try { localStorage.setItem(safetyBannerKey(convId), '1'); } catch (e) {}
}

function wireSafetyBanner(){
  var btn = document.getElementById('chatSafetyDismiss');
  if (btn && !btn._qgBound) {
    btn._qgBound = true;
    btn.addEventListener('click', dismissSafetyBanner);
  }
}

function wireChatSafetyActions(otherUid, otherName){
  chatOtherUid = otherUid || '';
  chatOtherName = otherName || 'this user';
  var reportBtn = document.getElementById('chatReportBtn');
  var blockBtn = document.getElementById('chatBlockBtn');
  if (reportBtn) {
    reportBtn.hidden = !chatOtherUid;
    if (!reportBtn._qgBound) {
      reportBtn._qgBound = true;
      reportBtn.addEventListener('click', function(){
        if (!chatOtherUid) return;
        if (typeof openReportModal === 'function') {
          openReportModal({
            targetType: 'user',
            targetId: chatOtherUid,
            targetLabel: chatOtherName
          });
        } else if (typeof showToast === 'function') {
          showToast('Report is loading — try again in a moment.', '#f59e0b');
        }
      });
    }
  }
  if (blockBtn) {
    blockBtn.hidden = !chatOtherUid;
    if (!blockBtn._qgBound) {
      blockBtn._qgBound = true;
      blockBtn.addEventListener('click', function(){
        if (!chatOtherUid) return;
        if (typeof confirmAndBlockUser === 'function') {
          confirmAndBlockUser(chatOtherUid, chatOtherName);
        } else if (typeof showToast === 'function') {
          showToast('Block is loading — try again in a moment.', '#f59e0b');
        }
      });
    }
  }
}

window.onUserBlocked = function(){
  if (typeof showToast === 'function') showToast('User blocked. Returning to messages…');
  setTimeout(function(){ window.location.href = 'messages.html'; }, 900);
};

function taskStatusLabel(status){
  var s = String(status || '').toLowerCase();
  if (s === 'completed' || s === 'done') return 'Completed';
  if (s === 'cancelled' || s === 'canceled') return 'Cancelled';
  if (s === 'in_progress' || s === 'accepted' || s === 'assigned') return 'In progress';
  if (s === 'open' || s === 'posted') return 'Open';
  if (s === 'expired') return 'Expired';
  return s ? (s.charAt(0).toUpperCase() + s.slice(1).replace(/_/g, ' ')) : 'In progress';
}

function taskStatusClass(status){
  var s = String(status || '').toLowerCase();
  if (s === 'completed' || s === 'done') return 'status-done';
  if (s === 'cancelled' || s === 'canceled') return 'status-cancelled';
  if (s === 'open' || s === 'posted') return 'status-open';
  return 'status-progress';
}

function formatTaskPrice(budget){
  if (budget == null || budget === '' || isNaN(Number(budget))) return 'Price TBD';
  if (typeof formatCadMoney === 'function') return formatCadMoney(budget);
  return '$' + Number(budget);
}

async function loadTaskPhotos(taskId){
  if (!taskId || typeof getTaskById !== 'function') return;
  var task = await getTaskById(taskId);
  if (!task) return;
  var urls = typeof parsePhotoUrls === 'function' ? parsePhotoUrls(task.photo_urls || task.PHOTO_URLS) : [];
  var strip = document.getElementById('taskPhotoStrip');
  if (!strip || !urls.length) return;
  strip.style.display = 'flex';
  strip.innerHTML = '<span class="task-photo-label">Reference photos (what needs doing)</span>' +
    urls.map(function(url){
      var safe = typeof safeMediaUrl === 'function' ? safeMediaUrl(url)
        : (typeof safeUrl === 'function' ? safeUrl(url) : '');
      if (!safe) return '';
      return '<img src="'+window.escapeHtml(safe)+'" alt="Task reference photo" loading="lazy" decoding="async" width="64" height="64">';
    }).join('');
}

function formatMessageTime(iso){
  if (!iso) return '';
  if (typeof timeAgo === 'function') {
    var ago = timeAgo(iso);
    if (ago) return ago;
  }
  if (typeof formatRelativeTime === 'function') {
    var rel = formatRelativeTime(iso);
    if (rel) return rel;
  }
  return new Date(iso).toLocaleTimeString('en-CA', {hour:'numeric', minute:'2-digit', hour12:true});
}

function formatMessageDate(iso){
  if (!iso) return '';
  var d = new Date(iso);
  var today = new Date();
  if(d.toDateString() === today.toDateString()) return 'Today';
  var yesterday = new Date(today);
  yesterday.setDate(today.getDate() - 1);
  if(d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-CA', {month:'short', day:'numeric', year:'numeric'});
}

function formatMessageClock(iso){
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString('en-CA', {hour:'numeric', minute:'2-digit', hour12:true});
}

function isJustPaidConv(id) {
  if (!id) return false;
  try {
    var raw = sessionStorage.getItem('qg-just-paid-conv');
    if (!raw) return false;
    var parts = raw.split('|');
    if (String(parts[0]) !== String(id)) return false;
    return Date.now() - Number(parts[1] || 0) < 300000;
  } catch (e) { return false; }
}

function clearJustPaidConv(id) {
  try {
    if (isJustPaidConv(id)) sessionStorage.removeItem('qg-just-paid-conv');
  } catch (e) {}
}

function cleanPaidUrlParams() {
  if (!window.history || !window.history.replaceState) return;
  var url = new URL(window.location.href);
  if (!url.searchParams.get('paid') && !url.searchParams.get('session_id')) return;
  url.searchParams.delete('paid');
  url.searchParams.delete('session_id');
  window.history.replaceState({}, '', url.pathname + '?' + url.searchParams.toString());
}

function renderChatHeaderFromConv(conv, isPoster, otherName, otherUid, taskRow) {
  var cat = ((taskRow && (taskRow.category || taskRow.CATEGORY)) || conv.task_category || 'other').toLowerCase();
  var title = (taskRow && (taskRow.title || taskRow.TITLE)) || conv.task_title || 'Task';
  var budget = taskRow
    ? (taskRow.budget != null ? taskRow.budget : taskRow.BUDGET)
    : conv.task_budget;
  var statusRaw = taskRow
    ? String(taskRow.status || taskRow.STATUS || '').toLowerCase()
    : String(conv.status || 'in_progress').toLowerCase();
  if (!statusRaw) statusRaw = String(conv.status || 'in_progress').toLowerCase();

  document.getElementById('chatName').textContent = otherName;
  var profileLink = document.getElementById('chatProfileLink');
  if (profileLink && otherUid) {
    profileLink.href = typeof getProfileUrl === 'function'
      ? getProfileUrl(otherUid)
      : ('profile.html?user=' + encodeURIComponent(otherUid));
    profileLink.title = 'View ' + otherName + '\'s profile';
  }
  // Header: other person + task title (WhatsApp-style context, QuickGigs-branded)
  document.getElementById('chatSub').textContent = title || 'Task';

  document.getElementById('taskTitle').textContent = title;
  document.getElementById('taskMeta').textContent = formatTaskPrice(budget) + ' · ' + taskStatusLabel(statusRaw);
  document.getElementById('taskIcon').textContent = CAT_ICONS[cat] || '📦';
  document.getElementById('taskIcon').style.background = CAT_BG[cat] || 'rgba(107,63,160,0.2)';
  document.getElementById('taskStatus').textContent = taskStatusLabel(statusRaw);
  document.getElementById('taskStatus').className = 'tb-status ' + taskStatusClass(statusRaw);

  if (budget != null) conv.task_budget = budget;
  if (title) conv.task_title = title;

  wireChatSafetyActions(otherUid, otherName);
  wireSafetyBanner();
}

async function hydratePinnedTask(conv, isPoster, otherName, otherUid) {
  var taskRow = null;
  if (conv && conv.task_id && typeof getTaskById === 'function') {
    try { taskRow = await getTaskById(conv.task_id); } catch (e) { taskRow = null; }
  }
  chatTaskRow = taskRow;
  renderChatHeaderFromConv(conv, isPoster, otherName, otherUid, taskRow);
  await loadChatQuickActions(conv, taskRow, isPoster);
  return taskRow;
}

async function loadChatQuickActions(conv, taskRow, isPoster) {
  var bar = document.getElementById('chatQuickActions');
  if (!bar || !conv || !conv.is_unlocked) {
    if (bar) { bar.classList.remove('is-visible'); bar.innerHTML = ''; }
    return;
  }
  var taskId = conv.task_id;
  var st = String((taskRow && (taskRow.status || taskRow.STATUS)) || conv.status || '').toLowerCase();
  var html = '';
  chatAcceptedApp = null;

  if (taskId && typeof getApplicationsByTask === 'function') {
    try {
      var apps = await getApplicationsByTask(taskId, {
        posterId: conv.poster_id,
        asPoster: !!isPoster
      });
      chatAcceptedApp = (apps || []).find(function (a) {
        return String(a.status || a.STATUS || '').toLowerCase() === 'accepted' &&
          String(a.worker_id || a.WORKER_ID || '') === String(conv.worker_id);
      }) || null;
      if (!chatAcceptedApp) {
        chatAcceptedApp = (apps || []).find(function (a) {
          return String(a.worker_id || a.WORKER_ID || '') === String(conv.worker_id);
        }) || null;
      }
    } catch (eApps) {}
  }

  var price = chatAcceptedApp && typeof getEffectiveApplicationPrice === 'function'
    ? getEffectiveApplicationPrice(chatAcceptedApp)
    : (conv.task_budget != null ? Number(conv.task_budget) : (taskRow && (taskRow.budget || taskRow.BUDGET)));
  price = Math.round(Number(price) || 0);

  var pendingCounter = chatAcceptedApp && typeof hasPendingApplicationCounter === 'function'
    ? hasPendingApplicationCounter(chatAcceptedApp)
    : false;
  var neg = chatAcceptedApp && typeof parseNegotiationFields === 'function'
    ? parseNegotiationFields(chatAcceptedApp)
    : null;

  if (pendingCounter && neg && neg.counterBy) {
    var iAmWaiting = (isPoster && neg.counterBy === 'worker') || (!isPoster && neg.counterBy === 'poster');
    if (iAmWaiting) {
      html += '<button type="button" class="chat-action-btn" id="chatActAcceptOffer">Accept offer $' +
        window.escapeHtml(String(neg.counterPrice)) + '</button>';
    }
  }

  if (st === 'in_progress' || st === 'accepted' || st === 'open') {
    if (price > 0) {
      html += '<button type="button" class="chat-action-btn" id="chatActAgreePrice">Agree price $' +
        window.escapeHtml(String(price)) + '</button>';
    }
  }

  if ((st === 'in_progress' || st === 'accepted') && isPoster) {
    html += '<button type="button" class="chat-action-btn" id="chatActComplete">Mark complete</button>';
  }

  if (!html) {
    bar.classList.remove('is-visible');
    bar.innerHTML = '';
    return;
  }
  bar.innerHTML = html;
  bar.classList.add('is-visible');

  var agreeBtn = document.getElementById('chatActAgreePrice');
  if (agreeBtn) {
    agreeBtn.onclick = function () { chatAgreePrice(price); };
  }
  var completeBtn = document.getElementById('chatActComplete');
  if (completeBtn) {
    completeBtn.onclick = function () { chatMarkComplete(); };
  }
  var acceptBtn = document.getElementById('chatActAcceptOffer');
  if (acceptBtn) {
    acceptBtn.onclick = function () { chatAcceptCounterOffer(); };
  }
}

async function postSystemEvent(text) {
  if (!convId || !currentUserId || typeof sendSystemChatMessage !== 'function') return;
  var res = await sendSystemChatMessage(convId, currentUserId, text);
  if (res && res.success) await refreshMessages({ forceScroll: true });
  else if (typeof showToast === 'function') showToast('Could not post update', '#f59e0b');
}

async function chatAgreePrice(amount) {
  amount = Math.round(Number(amount) || 0);
  if (!amount || !currentConv) return;
  var btn = document.getElementById('chatActAgreePrice');
  if (btn) btn.disabled = true;
  try {
    if (chatAcceptedApp && typeof patchApplicationFields === 'function') {
      var appId = chatAcceptedApp.app_id || chatAcceptedApp.APP_ID || chatAcceptedApp.id;
      await patchApplicationFields(appId, { price: amount }, {
        taskId: currentConv.task_id,
        workerId: currentConv.worker_id
      });
    }
    await postSystemEvent('Price agreed: $' + amount);
    if (typeof showToast === 'function') showToast('Price agreed: $' + amount);
    await loadChatQuickActions(currentConv, chatTaskRow, chatIsPoster);
  } catch (e) {
    if (typeof showToast === 'function') showToast('Could not agree price', '#ef4444');
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function chatMarkComplete() {
  if (!currentConv || !currentConv.task_id || !currentUserId) return;
  var ok = window.confirm('Mark this task complete? Both of you can leave a review after.');
  if (!ok) return;
  var btn = document.getElementById('chatActComplete');
  if (btn) btn.disabled = true;
  try {
    var result = typeof completeTask === 'function'
      ? await completeTask(currentConv.task_id, currentUserId, {
          posterId: currentConv.poster_id,
          workerId: currentConv.worker_id,
          taskRow: chatTaskRow
        })
      : { success: false };
    if (!result || !result.success) {
      if (typeof showToast === 'function') showToast((result && result.error) || 'Could not complete task', '#ef4444');
      return;
    }
    await postSystemEvent('Task marked complete');
    if (chatTaskRow) {
      chatTaskRow.status = 'completed';
      chatTaskRow.STATUS = 'completed';
    }
    currentConv.status = 'completed';
    renderChatHeaderFromConv(currentConv, chatIsPoster, chatOtherName, chatOtherUid, chatTaskRow);
    await loadChatQuickActions(currentConv, chatTaskRow, chatIsPoster);
    if (typeof showToast === 'function') showToast('Task completed');
    if (typeof window.openReviewPrompt === 'function') {
      try { window.openReviewPrompt(currentConv.task_id); } catch (eR) {}
    }
  } catch (err) {
    if (typeof showToast === 'function') showToast('Could not complete task', '#ef4444');
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function chatAcceptCounterOffer() {
  if (!chatAcceptedApp || !currentConv || !currentUserId) return;
  var appId = chatAcceptedApp.app_id || chatAcceptedApp.APP_ID || chatAcceptedApp.id;
  var neg = typeof parseNegotiationFields === 'function' ? parseNegotiationFields(chatAcceptedApp) : {};
  var amount = neg.counterPrice;
  var btn = document.getElementById('chatActAcceptOffer');
  if (btn) btn.disabled = true;
  try {
    var result;
    if (chatIsPoster && typeof posterRespondToCounter === 'function') {
      result = await posterRespondToCounter(appId, currentUserId, 'accept', {
        taskId: currentConv.task_id,
        workerId: currentConv.worker_id
      });
    } else if (!chatIsPoster && typeof workerRespondToCounter === 'function') {
      result = await workerRespondToCounter(appId, currentUserId, 'accept', null, {
        taskId: currentConv.task_id
      });
    }
    if (!result || !result.success) {
      if (typeof showToast === 'function') showToast('Could not accept offer', '#ef4444');
      return;
    }
    await postSystemEvent('Offer accepted' + (amount != null ? (': $' + amount) : ''));
    if (typeof showToast === 'function') showToast('Offer accepted');
    await loadChatQuickActions(currentConv, chatTaskRow, chatIsPoster);
  } catch (e) {
    if (typeof showToast === 'function') showToast('Could not accept offer', '#ef4444');
  } finally {
    if (btn) btn.disabled = false;
  }
}

function deferChatEnrichment(conv, otherUid, otherName, isPoster) {
  (async function () {
    var name = otherName;
    if ((!name || (typeof isGenericDisplayName === 'function' && isGenericDisplayName(name))) &&
        typeof getUserNameByFirebaseUid === 'function') {
      var fetchedName = await getUserNameByFirebaseUid(otherUid);
      if (fetchedName) {
        name = fetchedName;
        document.getElementById('chatName').textContent = fetchedName;
      }
    }
    if (typeof getUserAvatarUrl === 'function') {
      var otherAvatar = await getUserAvatarUrl(otherUid);
      var chatAvatarEl = document.getElementById('chatAvatar');
      if (chatAvatarEl && typeof renderUserAvatarHtml === 'function') {
        var avatarHtml = renderUserAvatarHtml(name, otherAvatar, { className: 'nav-chat-avatar', size: 32 });
        chatAvatarEl.outerHTML = avatarHtml.replace('class="nav-chat-avatar"', 'class="nav-chat-avatar" id="chatAvatar"');
      }
    }
    if (conv && conv.task_id) loadTaskPhotos(conv.task_id);
    if (typeof enrichConversationNames === 'function') {
      enrichConversationNames(conv).catch(function () {});
    }
  })();
}

function runBackgroundUnlock(conv, sessionId) {
  if (!conv || !conv.task_id) return;
  (async function () {
    if (sessionId && typeof window.QG_confirmCheckoutSession === 'function') {
      await window.QG_confirmCheckoutSession(sessionId).catch(function () {});
    }
    if (typeof unlockChatForTask === 'function') {
      await unlockChatForTask(conv.task_id, conv.poster_id, conv.worker_id).catch(function () {});
    }
  })();
}

async function initChat(){
  ensureChatChrome();
  currentUserId = window._currentUser ? window._currentUser.uid : null;
  if(!currentUserId){
    window.location.href = 'login.html';
    return;
  }

  var payParams = new URLSearchParams(window.location.search);
  var paidReturn = payParams.get('paid') === '1';
  var taskFromUrl = payParams.get('task') || '';
  var sessionFromUrl = payParams.get('session_id') || '';

  if (paidReturn && taskFromUrl && !convId) {
    var cachedConv = typeof window.QG_readCachedTaskConv === 'function'
      ? window.QG_readCachedTaskConv(taskFromUrl)
      : '';
    if (!cachedConv) {
      try { cachedConv = sessionStorage.getItem('qg-task-conv-' + taskFromUrl) || ''; } catch (e) {}
    }
    if (cachedConv && typeof window.QG_buildChatPayReturnUrl === 'function') {
      window.location.replace(window.QG_buildChatPayReturnUrl(taskFromUrl, sessionFromUrl, cachedConv));
      return;
    }
    window.location.replace('mytasks.html?tab=inprogress&task=' + encodeURIComponent(taskFromUrl));
    return;
  }

  // Resolve thread when opened as chat.html?task=&peer= (firebase_uid) without conv
  if (!convId && (taskIdFromUrl || withUidFromUrl) && typeof getConversationForTask === 'function') {
    try {
      var peer = withUidFromUrl || '';
      var resolved = null;
      if (taskIdFromUrl && peer) {
        resolved = await getConversationForTask(taskIdFromUrl, currentUserId, peer);
        if (!resolved) resolved = await getConversationForTask(taskIdFromUrl, peer, currentUserId);
      }
      if (!resolved && typeof getConversationsForUser === 'function') {
        var inbox = await getConversationsForUser(currentUserId);
        resolved = (inbox || []).find(function (c) {
          if (taskIdFromUrl && String(c.task_id) !== String(taskIdFromUrl)) return false;
          if (!peer) return true;
          return String(c.poster_id) === String(peer) || String(c.worker_id) === String(peer);
        }) || null;
      }
      if (resolved && resolved.conv_id) {
        convId = String(resolved.conv_id);
        try {
          var u = new URL(window.location.href);
          u.searchParams.set('conv', convId);
          if (taskIdFromUrl) u.searchParams.set('task', taskIdFromUrl);
          if (peer) u.searchParams.set('peer', peer);
          window.history.replaceState({}, '', u.pathname + '?' + u.searchParams.toString());
        } catch (eHist) {}
      }
    } catch (resolveErr) {
      console.warn('[QuickGigs chat] task/peer resolve failed:', resolveErr);
    }
  }

  if(!convId){
    window.location.href = 'messages.html';
    return;
  }

  if (typeof getConversation !== 'function') {
    console.warn('[QuickGigs chat] DB not ready — will retry');
    showChatLoadError('Chat is still loading. Tap Try again in a moment.');
    setTimeout(function () {
      if (typeof getConversation === 'function' && typeof window.initChat === 'function') {
        window.initChat();
      }
    }, 250);
    return;
  }

  console.info('[QuickGigs chat] init', { convId: convId, uid: currentUserId });

  var justPaid = paidReturn || !!sessionFromUrl || isJustPaidConv(convId);

  if (typeof syncCurrentUserProfile === 'function' && window._currentUser) {
    syncCurrentUserProfile(window._currentUser).catch(function () {});
  }

  if (justPaid && sessionFromUrl) {
    cleanPaidUrlParams();
  }

  var actorOpts = { actorId: currentUserId };
  var convPromise = getConversation(convId, actorOpts);
  var messagesPromise = (justPaid && typeof getMessagesForConversation === 'function')
    ? getMessagesForConversation(convId, { actorId: currentUserId, trusted: true })
    : null;

  currentConv = await convPromise;
  if (!currentConv) {
    // Brief retry — currentActorId can lag one tick behind auth on first open.
    await new Promise(function (r) { setTimeout(r, 120); });
    currentConv = await getConversation(convId, actorOpts);
  }
  if (!currentConv) {
    // Last resort: list-scoped fetch (same firebase_uid filter as Messages inbox)
    try {
      if (typeof getConversationsForUser === 'function') {
        var inbox = await getConversationsForUser(currentUserId);
        currentConv = (inbox || []).find(function (c) {
          return String(c.conv_id) === String(convId);
        }) || null;
      }
    } catch (listErr) {
      console.warn('Chat inbox fallback failed:', listErr);
    }
  }
  if (!currentConv) {
    console.error('[QuickGigs chat] conversation not found', { convId: convId, uid: currentUserId });
    showChatLoadError('Could not load this conversation. It may have been removed, or your connection failed.');
    return;
  }
  if (String(currentConv.poster_id) !== String(currentUserId) &&
      String(currentConv.worker_id) !== String(currentUserId)) {
    console.error('[QuickGigs chat] not a party on conversation', {
      convId: convId,
      uid: currentUserId,
      poster: currentConv.poster_id,
      worker: currentConv.worker_id
    });
    showChatLoadError('You are not a participant in this chat.');
    return;
  }

  // When Stripe is live, restore the escrow-gated contact rule — chat unlocks only after
  // escrow is funded. Currently gated on acceptance because payments are off.
  var unlockRule = typeof window.getChatUnlockRule === 'function'
    ? window.getChatUnlockRule()
    : ((window.QG_CONFIG && window.QG_CONFIG.chatUnlockAfter) || 'accept');
  var paymentGated = typeof window.isChatPaymentGated === 'function'
    ? window.isChatPaymentGated()
    : unlockRule === 'payment';

  // Accept / apply mode: unlock on open — never send the user into a pay wall.
  // syncConversationUnlock hits confirm-checkout (payment) — only use it when payment-gated.
  if (!justPaid) {
    if (paymentGated && typeof syncConversationUnlock === 'function') {
      try {
        var syncUnlock = await syncConversationUnlock(convId, currentUserId);
        if (syncUnlock && syncUnlock.ok && syncUnlock.unlocked) {
          var syncedConv = await getConversation(convId, actorOpts);
          if (syncedConv) currentConv = syncedConv;
        }
      } catch (syncErr) {
        console.warn('Chat unlock sync skipped:', syncErr);
      }
    } else if (!paymentGated && typeof forceUnlockConversationForTask === 'function') {
      try {
        var taskStatusHint = '';
        if (currentConv.task_id && typeof getTaskById === 'function') {
          var unlockTask = await getTaskById(currentConv.task_id);
          if (unlockTask) taskStatusHint = unlockTask.status || unlockTask.STATUS || '';
        }
        var forced = await forceUnlockConversationForTask(currentConv, taskStatusHint);
        if (forced && forced.conv) currentConv = forced.conv;
        else if (forced && forced.success) {
          var refreshed = await getConversation(convId, actorOpts);
          if (refreshed) currentConv = refreshed;
        }
      } catch (forceErr) {
        console.warn('Accept-mode chat unlock skipped:', forceErr);
      }
    }
  }

  if (justPaid) {
    runBackgroundUnlock(currentConv, sessionFromUrl);
    clearJustPaidConv(convId);
  }

  var isPoster = String(currentConv.poster_id) === String(currentUserId);
  var otherUid = isPoster ? currentConv.worker_id : currentConv.poster_id;
  var otherName = isPoster ? (currentConv.worker_name || 'Tasker') : (currentConv.poster_name || 'Poster');
  chatIsPoster = isPoster;
  window._chatIsPoster = isPoster;
  console.info('[QuickGigs chat] party ok', {
    isPoster: isPoster,
    unlockRule: unlockRule,
    paymentGated: paymentGated,
    is_unlocked: currentConv.is_unlocked,
    status: currentConv.status
  });

  // Blocked users cannot message each other
  if (typeof areUsersBlocked === 'function') {
    try {
      var blockedPair = await areUsersBlocked(currentUserId, otherUid);
      if (blockedPair) {
        await hydratePinnedTask(currentConv, isPoster, otherName, otherUid);
        document.querySelector('.input-area').style.display = 'none';
        document.getElementById('chatScroll').innerHTML =
          '<div class="locked-state">' +
            '<div class="locked-icon">🚫</div>' +
            '<div class="locked-title">Messaging unavailable</div>' +
            '<div class="locked-sub">You can\'t message this user because one of you has blocked the other.</div>' +
            '<a class="locked-action" href="messages.html">Back to messages</a>' +
          '</div>';
        if (typeof window.qgHideGlobalLoading === 'function') window.qgHideGlobalLoading();
        return;
      }
    } catch (blockCheckErr) {
      console.warn('Block check skipped:', blockCheckErr);
    }
  }

  var convStatus = (currentConv.status || 'in_progress').toLowerCase();
  var taskStatus = '';
  var isCompleted = convStatus === 'completed';
  var isCancelled = false;
  var paymentVerified = false;

  var chatOpen = justPaid || (typeof parseConversationUnlocked === 'function'
    ? parseConversationUnlocked(currentConv)
    : !!currentConv.is_unlocked);

  // Accept / apply: open the thread for parties — never bounce them into payments.
  // (is_unlocked / status can lag after accept; messages list already proved access.)
  if (!chatOpen && !paymentGated) {
    var csOpen = String(currentConv.status || '').toLowerCase();
    var tsOpen = '';
    if (currentConv.task_id && typeof getTaskById === 'function') {
      try {
        var tOpen = await getTaskById(currentConv.task_id);
        if (tOpen) tsOpen = String(tOpen.status || tOpen.STATUS || '').toLowerCase();
      } catch (eOpen) {}
    }
    var ruleSaysOpen = typeof window.shouldUnlockChatNow === 'function'
      ? window.shouldUnlockChatNow(csOpen, tsOpen)
      : true;
    if (ruleSaysOpen || unlockRule === 'apply' || unlockRule === 'accept') {
      if (csOpen !== 'completed' && tsOpen !== 'completed' && tsOpen !== 'cancelled') {
        chatOpen = true;
        currentConv.is_unlocked = true;
      }
    }
  }

  if (!chatOpen && !justPaid) {
    if (currentConv.task_id && typeof getTaskById === 'function') {
      var taskRow = await getTaskById(currentConv.task_id);
      if (taskRow) {
        taskStatus = (taskRow.status || taskRow.STATUS || '').toLowerCase();
        isCancelled = taskStatus === 'cancelled';
        isCompleted = isCompleted || taskStatus === 'completed';
        currentConv.task_budget = taskRow.budget != null ? taskRow.budget : taskRow.BUDGET;
        renderChatHeaderFromConv(currentConv, isPoster, otherName, otherUid, taskRow);
      }
    }
    var taskAlreadyPaid = false;
    if (currentConv.task_id && typeof getPaymentByTask === 'function') {
      var payRow = await getPaymentByTask(currentConv.task_id, {
        posterId: currentConv.poster_id,
        workerId: currentConv.worker_id,
        actorId: currentUserId,
        actorRole: isPoster ? 'poster' : 'worker'
      });
      var paySt = payRow && String(payRow.status || '').toLowerCase();
      taskAlreadyPaid = paySt === 'held' || paySt === 'paid' || paySt === 'completed';
    }
    if (taskAlreadyPaid) {
      chatOpen = true;
      paymentVerified = true;
      currentConv.is_unlocked = true;
      if (typeof unlockChatForTask === 'function') {
        unlockChatForTask(currentConv.task_id, currentConv.poster_id, currentConv.worker_id).catch(function () {});
      }
    }
    if (!chatOpen) {
      if (!document.getElementById('taskTitle').textContent || document.getElementById('taskTitle').textContent === 'Loading task…') {
        await hydratePinnedTask(currentConv, isPoster, otherName, otherUid);
      } else {
        wireChatSafetyActions(otherUid, otherName);
      }
      document.getElementById('taskMeta').textContent =
        formatTaskPrice(currentConv.task_budget) + ' · Payment required · Chat locked';
      showLockedState(isCompleted, isCancelled, taskAlreadyPaid);
      if (typeof window.qgHideGlobalLoading === 'function') window.qgHideGlobalLoading();
      deferChatEnrichment(currentConv, otherUid, otherName, isPoster);
      return;
    }
  }

  await hydratePinnedTask(currentConv, isPoster, otherName, otherUid);

  // Accept/apply mode: parties always message once matched — never re-lock on stale is_unlocked.
  if (!paymentGated && !isCompleted && !isCancelled) {
    chatOpen = true;
    currentConv.is_unlocked = true;
  }
  if (justPaid || paymentVerified) {
    chatOpen = true;
    currentConv.is_unlocked = true;
  }

  console.info('[QuickGigs chat] open decision', { chatOpen: chatOpen, paymentGated: paymentGated, isCompleted: isCompleted });

  if (isCompleted || isCancelled) {
    currentConv.is_unlocked = false;
    document.querySelector('.input-area').style.display = 'none';
    showLockedState(isCompleted, isCancelled, false);
    if (typeof window.qgHideGlobalLoading === 'function') window.qgHideGlobalLoading();
    deferChatEnrichment(currentConv, otherUid, otherName, isPoster);
    return;
  }

  if (!chatOpen) {
    document.querySelector('.input-area').style.display = 'none';
    document.getElementById('taskMeta').textContent =
      formatTaskPrice(currentConv.task_budget) + ' · Payment required · Chat locked';
    showLockedState(false, false, false);
    if (typeof window.qgHideGlobalLoading === 'function') window.qgHideGlobalLoading();
    deferChatEnrichment(currentConv, otherUid, otherName, isPoster);
    return;
  }

  document.querySelector('.input-area').style.display = '';

  if (messagesPromise) {
    var rows = await messagesPromise;
    messages = (rows || []).map(mapMessageRow);
    renderMessages();
    scrollToBottom();
  } else {
    await refreshMessages();
  }

  maybeShowSafetyBanner(convId, messages.length);
  // Photo attach deferred until backend moderation is ready
  var attachBtn = document.getElementById('attachBtn');
  if (attachBtn) {
    attachBtn.hidden = true;
    attachBtn.classList.remove('visible');
  }
  ensureChatLightbox();
  startChatRealtime();
  if (typeof markConversationRead === 'function') {
    markConversationRead(convId, currentUserId, currentConv.poster_id).catch(function () {});
  }
  updatePeerReadFromConv(currentConv);
  if (typeof refreshMessagesUnreadBadge === 'function') {
    setTimeout(function () { refreshMessagesUnreadBadge(); }, 400);
  }
  if (typeof window.qgHideGlobalLoading === 'function') window.qgHideGlobalLoading();
  deferChatEnrichment(currentConv, otherUid, otherName, isPoster);
}
window.initChat = initChat;

function showChatLoadError(message) {
  try {
    if (typeof window.qgHideGlobalLoading === 'function') window.qgHideGlobalLoading();
  } catch (e) {}
  var scroll = document.getElementById('chatScroll');
  var input = document.querySelector('.input-area');
  if (input) input.style.display = 'none';
  var title = document.getElementById('taskTitle');
  if (title) title.textContent = 'Chat unavailable';
  var meta = document.getElementById('taskMeta');
  if (meta) meta.textContent = '';
  var msg = message || 'Could not open this chat.';
  if (scroll) {
    scroll.innerHTML =
      '<div class="locked-state">' +
        '<div class="locked-icon">💬</div>' +
        '<div class="locked-title">Couldn\'t open chat</div>' +
        '<div class="locked-sub">' + (typeof escapeHtml === 'function' ? escapeHtml(msg) : String(msg)) + '</div>' +
        '<a class="locked-action locked-pay-btn" href="messages.html">← Back to messages</a>' +
        '<button type="button" class="locked-action locked-review-btn" style="margin-top:10px" onclick="window.location.reload()">↻ Try again</button>' +
      '</div>';
  }
  if (typeof showToast === 'function') showToast(msg, '#ef4444');
  console.error('[QuickGigs chat]', msg);
}

function setupChatImageAttach() {
  // Intentionally no-op: photo attach waits for backend moderation.
  var attachBtn = document.getElementById('attachBtn');
  if (attachBtn) {
    attachBtn.hidden = true;
    attachBtn.classList.remove('visible');
    attachBtn.disabled = true;
  }
}

function ensureChatLightbox() {
  if (chatLightboxBound) return;
  var scroll = document.getElementById('chatScroll');
  if (scroll && typeof bindQgPhotoLightbox === 'function') {
    bindQgPhotoLightbox(scroll, '.bubble-image.qg-modal-photo-tap');
    chatLightboxBound = true;
  }
}

function renderMessageBubble(text, opts) {
  opts = opts || {};
  if (typeof isChatImageBody === 'function' && isChatImageBody(text)) {
    var url = typeof parseChatImageUrl === 'function' ? parseChatImageUrl(text) : '';
    if (url) {
      var caption = opts.senderIsPoster ? 'Reference photo' : 'Progress photo';
      var escUrl = window.escapeHtml(url);
      return '<img class="bubble-image qg-modal-photo-tap" src="'+escUrl+'" alt="'+window.escapeHtml(caption)+'" loading="lazy" decoding="async" data-photo="'+escUrl+'" data-photo-caption="'+window.escapeHtml(caption)+'">' +
        '<div class="bubble-image-caption">'+window.escapeHtml(caption)+'</div>';
    }
  }
  return window.escapeHtml(text);
}

window.sendChatImage = async function(input) {
  var posterOnly = !!(window.QG_CONFIG && window.QG_CONFIG.posterOnlyChatImages);
  if (posterOnly && !chatIsPoster) {
    showToast('Only the poster can send photos in chat. Taskers can describe questions in text.', '#f59e0b');
    input.value = '';
    return;
  }
  if (!currentConv || !currentConv.is_unlocked || !convId || !currentUserId) return;
  var file = input.files && input.files[0];
  input.value = '';
  if (!file) return;

  var attachBtn = document.getElementById('attachBtn');
  var prevLabel = attachBtn ? attachBtn.textContent : '';
  if (attachBtn) {
    attachBtn.disabled = true;
    attachBtn.textContent = '⏳';
  }

  var upload = await uploadChatPhoto(file, currentUserId, convId);
  if (!upload.success) {
    showToast(typeof formatUploadError === 'function' ? formatUploadError(upload.error) : (upload.error || 'Could not upload photo.'), '#ef4444');
    if (attachBtn) {
      attachBtn.disabled = false;
      attachBtn.textContent = prevLabel || '📷';
    }
    return;
  }

  var body = (window.CHAT_IMAGE_PREFIX || '[img]') + upload.url;
  var result = await sendChatMessage(convId, currentUserId, body);
  if (!result.success) {
    showToast('Photo uploaded but could not send. Try again.', '#ef4444');
    if (attachBtn) {
      attachBtn.disabled = false;
      attachBtn.textContent = prevLabel || '📷';
    }
    return;
  }

  if (attachBtn) {
    attachBtn.disabled = false;
    attachBtn.textContent = prevLabel || '📷';
  }
  await refreshMessages();
  scrollToBottom();
};
window.sendPosterImage = window.sendChatImage;

function buildChatReviewHref() {
  if (!currentConv || !currentUserId || !currentConv.task_id) return '';
  var isPoster = currentConv.poster_id === currentUserId;
  var revieweeId = isPoster ? currentConv.worker_id : currentConv.poster_id;
  var revieweeName = isPoster
    ? (currentConv.worker_name || 'Tasker')
    : (currentConv.poster_name || 'Poster');
  var role = isPoster ? 'poster' : 'worker';
  return 'review.html?taskId=' + encodeURIComponent(String(currentConv.task_id)) +
    '&task=' + encodeURIComponent(currentConv.task_title || 'Task') +
    '&price=' + encodeURIComponent(String(currentConv.task_budget || '')) +
    '&revieweeId=' + encodeURIComponent(String(revieweeId)) +
    '&reviewee=' + encodeURIComponent(revieweeName) +
    '&role=' + role +
    '&from=chat&conv=' + encodeURIComponent(String(convId || ''));
}

function showLockedState(isCompleted, isCancelled, taskAlreadyPaid){
  var isPoster = currentConv && currentConv.poster_id === currentUserId;
  var lockMsg;
  if (isCompleted) {
    lockMsg = isCancelled
      ? 'This task was cancelled. Chat is now closed.'
      : 'This task is completed. Chat is now closed.';
  } else if (taskAlreadyPaid) {
    lockMsg = 'Payment received — opening chat…';
  } else {
    lockMsg = typeof getChatLockMessage === 'function'
      ? getChatLockMessage(isPoster)
      : 'Messaging opens after payment is completed through QuickGigs.';
  }
  var actionHtml = '';
  if (isCompleted && !isCancelled && currentConv && currentConv.task_id) {
    var reviewHref = buildChatReviewHref();
    if (reviewHref) {
      actionHtml = '<a href="'+reviewHref+'" class="locked-action locked-review-btn">⭐ Leave a review</a>';
    }
  } else if (!isCompleted && isPoster && currentConv && currentConv.task_id && !taskAlreadyPaid) {
    // Only offer Stripe pay when explicitly payment-gated — never when config is missing/accept.
    var payGatedUi = typeof window.isChatPaymentGated === 'function'
      ? window.isChatPaymentGated()
      : !!(window.QG_CONFIG && window.QG_CONFIG.paymentsEnabled && window.QG_CONFIG.chatUnlockAfter === 'payment');
    if (payGatedUi) {
      actionHtml = '<button type="button" class="locked-action locked-pay-btn" data-pay-task="'+String(currentConv.task_id)+'" data-pay-return="chat" data-pay-conv="'+String(convId)+'">💳 Pay & unlock chat</button>';
    } else {
      actionHtml = '<a class="locked-action locked-pay-btn" href="messages.html">← Back to messages</a>';
    }
  } else if (!isCompleted && taskAlreadyPaid) {
    actionHtml = '<button type="button" class="locked-action locked-pay-btn" onclick="window.location.reload()">↻ Refresh chat</button>';
  }
  document.querySelector('.input-area').style.display = 'none';
  document.getElementById('chatScroll').innerHTML =
    '<div class="locked-state">' +
      '<div class="locked-icon">'+(isCompleted ? '✅' : '🔒')+'</div>' +
      '<div class="locked-title">'+(isCompleted ? 'Chat closed' : 'Chat locked')+'</div>' +
      '<div class="locked-sub">'+window.escapeHtml(lockMsg)+'</div>' +
      actionHtml +
    '</div>';
}

function updatePeerReadFromConv(conv) {
  if (!conv || !currentUserId) return;
  var iAmPoster = String(conv.poster_id) === String(currentUserId);
  peerLastReadAt = iAmPoster ? (conv.worker_last_read_at || null) : (conv.poster_last_read_at || null);
}

function mapMessageRow(m) {
  var body = m.body || '';
  var isSys = typeof isSystemChatBody === 'function' && isSystemChatBody(body);
  return {
    id: m.message_id || m.id,
    from: isSys ? 'system' : (String(m.sender_id) === String(currentUserId) ? 'me' : 'them'),
    text: isSys && typeof parseSystemChatBody === 'function' ? parseSystemChatBody(body) : body,
    rawBody: body,
    isSystem: isSys,
    senderId: m.sender_id,
    senderIsPoster: currentConv && String(m.sender_id) === String(currentConv.poster_id),
    time: formatMessageTime(m.created_at),
    clock: formatMessageClock(m.created_at),
    date: formatMessageDate(m.created_at),
    ts: m.created_at ? new Date(m.created_at).getTime() : 0,
    createdAt: m.created_at
  };
}

function receiptForMine(m) {
  if (!m || !m.createdAt) return { cls: '', label: 'Sent', mark: '✓' };
  if (peerLastReadAt) {
    var readMs = new Date(peerLastReadAt).getTime();
    var msgMs = new Date(m.createdAt).getTime();
    if (!isNaN(readMs) && !isNaN(msgMs) && readMs >= msgMs - 500) {
      return { cls: ' is-read', label: 'Read', mark: '✓✓' };
    }
  }
  return { cls: '', label: 'Delivered', mark: '✓' };
}

function startChatRealtime() {
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
  if (typeof qgUnsubscribeChat === 'function') qgUnsubscribeChat();

  var sub = typeof qgSubscribeChat === 'function'
    ? qgSubscribeChat({
        convId: convId,
        pollMs: 4000,
        softPollMs: 22000,
        pollFn: function () { refreshMessages(); },
        onMessage: function (row) {
          if (!row) return;
          var id = row.message_id || row.id;
          if (id && messages.some(function (m) { return String(m.id) === String(id); })) return;
          var mapped = mapMessageRow(row);
          messages.push(mapped);
          messages.sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });
          var wasNear = isNearBottom();
          renderMessages();
          if (wasNear || mapped.from === 'me' || mapped.isSystem) scrollToBottom();
          if (mapped.from === 'them' && typeof markConversationRead === 'function') {
            markConversationRead(convId, currentUserId, currentConv && currentConv.poster_id).catch(function () {});
          }
          if (typeof refreshMessagesUnreadBadge === 'function') refreshMessagesUnreadBadge();
        },
        onConvUpdate: function (row) {
          if (!row) return;
          currentConv = Object.assign({}, currentConv || {}, row);
          // Accept-mode: never re-lock from a stale realtime is_unlocked=false patch
          var payGatedRt = typeof window.isChatPaymentGated === 'function'
            ? window.isChatPaymentGated()
            : false;
          if (!payGatedRt && currentConv && String(currentConv.status || '').toLowerCase() !== 'completed') {
            currentConv.is_unlocked = true;
          }
          updatePeerReadFromConv(currentConv);
          renderMessages();
          var by = row.typing_by || row.TYPING_BY;
          var at = row.typing_at || row.TYPING_AT;
          showTypingBubble(by, at);
        },
        onTyping: function (payload) {
          if (!payload) return;
          if (String(payload.userId) === String(currentUserId)) return;
          showTypingBubble(payload.userId, payload.at || Date.now());
        }
      })
    : null;

  _realtimeMode = (sub && sub.mode) || 'poll';
  if (_realtimeMode === 'poll' && !pollTimer) {
    pollTimer = setInterval(function () { refreshMessages(); }, 4000);
  }
}

function showTypingBubble(by, at) {
  var el = document.getElementById('typingBubble');
  if (!el) return;
  if (!by || String(by) === String(currentUserId)) {
    el.classList.remove('show');
    return;
  }
  var age = Date.now() - new Date(at).getTime();
  if (isNaN(age) || age < 0 || age > 6000) {
    el.classList.remove('show');
    return;
  }
  el.classList.add('show');
  clearTimeout(_typingHideTimer);
  _typingHideTimer = setTimeout(function () { el.classList.remove('show'); }, 5500);
}

async function refreshMessages(opts){
  opts = opts || {};
  if(!convId) return;
  var rows = await getMessagesForConversation(convId, {
    actorId: currentUserId,
    // Party already verified in initChat — skip re-fetch that can silently return [].
    trusted: true
  });
  var prevLen = messages.length;
  var wasNear = isNearBottom();
  messages = (rows || []).map(mapMessageRow);
  if (currentConv) updatePeerReadFromConv(currentConv);
  renderMessages();
  if (opts.forceScroll || wasNear || messages.length <= prevLen) scrollToBottom();
  else if (messages.length > prevLen) {
    var pill = document.getElementById('qgNewMsgPill');
    if (pill) pill.classList.add('show');
  }
  if (typeof markConversationRead === 'function' && currentUserId && currentConv) {
    markConversationRead(convId, currentUserId, currentConv.poster_id).catch(function () {});
  }
}

function renderMessages(){
  var scroll = document.getElementById('chatScroll');
  if (!scroll) return;
  var userMsgs = messages.filter(function(m){ return !(m.isSystem || m.from === 'system'); });
  if (!userMsgs.length) {
    scroll.innerHTML =
      '<div class="chat-empty" role="status">' +
        '<div class="chat-empty-glyph" aria-hidden="true">💬</div>' +
        '<div class="chat-empty-title">No messages yet — say hi</div>' +
        '<div class="chat-empty-sub">Keep plans and payments on QuickGigs so you stay protected.</div>' +
      '</div>' +
      '<div class="typing-bubble" id="typingBubble" aria-live="polite">typing…</div>';
    return;
  }
  var lastDate = '';
  var html = '';
  var prevFrom = '';
  var prevTs = 0;
  messages.forEach(function(m, idx){
    if (m.isSystem || m.from === 'system') {
      html += '<div class="sys-msg" role="status">'+window.escapeHtml(m.text)+'</div>';
      prevFrom = '';
      prevTs = 0;
      return;
    }
    if(m.date !== lastDate){
      html += '<div class="date-divider">'+window.escapeHtml(m.date)+'</div>';
      lastDate = m.date;
      prevFrom = '';
      prevTs = 0;
    }
    var isMe = m.from === 'me';
    var ts = m.ts || 0;
    var next = messages[idx + 1];
    while (next && (next.isSystem || next.from === 'system')) {
      idx += 1;
      next = messages[idx + 1];
    }
    var nextSame = next && next.from === m.from && next.date === m.date && next.ts && (next.ts - ts) < 120000;
    var grouped = prevFrom === m.from && prevTs && (ts - prevTs) < 120000;
    var showTime = !nextSame;
    var timeLabel = window.escapeHtml(m.clock || m.time || '');
    var clockTitle = window.escapeHtml(m.clock || m.time || '');
    var receipt = isMe ? receiptForMine(m) : null;
    html += '<div class="bubble-row '+(isMe?'mine':'theirs')+(grouped?' grouped':'')+(showTime?' show-time':'')+'">' +
      '<div class="bubble">'+renderMessageBubble(m.text, { senderIsPoster: m.senderIsPoster })+'</div>' +
      (showTime ? '<div class="bubble-time" title="'+clockTitle+'">'+timeLabel+
        (receipt ? ' <span class="bubble-check'+receipt.cls+'" aria-label="'+receipt.label+'">'+receipt.mark+'</span>' : '') +
      '</div>' : '') +
    '</div>';
    prevFrom = m.from;
    prevTs = ts;
  });
  html += '<div class="typing-bubble" id="typingBubble" aria-live="polite">typing…</div>';
  scroll.innerHTML = html;
  if (!document.getElementById('qgNewMsgPill')) {
    var pill = document.createElement('button');
    pill.type = 'button';
    pill.id = 'qgNewMsgPill';
    pill.className = 'qg-new-msg-pill';
    pill.setAttribute('aria-label', 'Jump to new messages');
    pill.textContent = '↓ New messages';
    pill.onclick = function(){ scrollToBottom(); pill.classList.remove('show'); };
    var wrap = scroll.parentNode;
    if (wrap) {
      if (getComputedStyle(wrap).position === 'static') wrap.style.position = 'relative';
      wrap.appendChild(pill);
    }
  }
}

function isNearBottom(){
  var scroll = document.getElementById('chatScroll');
  if (!scroll) return true;
  return (scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight) < 80;
}

function markChatTimeGroups(){
  var rows=document.querySelectorAll('#chatScroll .bubble-row');
  rows.forEach(function(row,i){
    var next=rows[i+1];
    var show=!next || next.classList.contains('mine')!==row.classList.contains('mine');
    row.classList.toggle('show-time', show);
  });
}
function scrollToBottom(){
  var scroll = document.getElementById('chatScroll');
  scroll.scrollTop = scroll.scrollHeight;
  if(typeof markChatTimeGroups==='function') markChatTimeGroups();
  var pill = document.getElementById('qgNewMsgPill');
  if (pill) pill.classList.remove('show');
}

// ── INPUT HANDLING ─────────────────────────────────────
var fraudDetected = false;

var _typingTimer = null;
window.handleInput = function(el){
  // Auto-resize textarea (max ~4 lines)
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 96) + 'px';

  var val = el.value.trim();
  var sendBtn = document.getElementById('sendBtn');
  var fraudInline = document.getElementById('fraudInline');

  var check = val ? analyzeFraud(val) : { blocked: false };
  var mod = (!check.blocked && val) ? analyzeContentSafety(val) : { blocked: false };
  if(check.blocked || mod.blocked){
    fraudDetected = true;
    fraudInline.style.display = 'block';
    var warnEl = document.getElementById('fraudInlineText');
    if (warnEl) {
      warnEl.textContent = check.blocked
        ? (check.message || (typeof getOffPlatformWarning === 'function' ? getOffPlatformWarning() : ''))
        : (mod.message || (typeof QG_CONTENT_MOD_MESSAGE === 'string' ? QG_CONTENT_MOD_MESSAGE : 'Message blocked.'));
    }
    sendBtn.disabled = true;
  } else {
    fraudDetected = false;
    fraudInline.style.display = 'none';
    sendBtn.disabled = !val;
  }
  if (val && convId && currentUserId) {
    clearTimeout(_typingTimer);
    _typingTimer = setTimeout(function(){
      if (typeof qgBroadcastTyping === 'function') qgBroadcastTyping(convId, currentUserId);
      else if (typeof qgSetTypingFlag === 'function') qgSetTypingFlag(convId, currentUserId);
    }, 280);
  }
};
// Typing via Realtime broadcast (+ REST fallback inside qgBroadcastTyping)
setInterval(function(){
  if (!convId || !currentUserId) return;
  if (typeof qgPollTyping === 'function') qgPollTyping(convId, currentUserId, document.getElementById('typingBubble'));
}, 5000);

window.handleKey = function(e){
  // Send on Enter (not Shift+Enter)
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    if(!document.getElementById('sendBtn').disabled){
      sendMessage();
    }
  }
};

window.sendMessage = async function(){
  var input = document.getElementById('msgInput');
  var text = window.sanitizeInput(input.value.trim(), 2000);
  var paymentGatedSend = typeof window.isChatPaymentGated === 'function'
    ? window.isChatPaymentGated()
    : !!(window.QG_CONFIG && window.QG_CONFIG.paymentsEnabled && window.QG_CONFIG.chatUnlockAfter === 'payment');
  var unlocked = !!(currentConv && (
    (typeof parseConversationUnlocked === 'function'
      ? parseConversationUnlocked(currentConv)
      : !!currentConv.is_unlocked) ||
    (!paymentGatedSend && String(currentConv.status || '').toLowerCase() !== 'completed')
  ));
  if (currentConv && unlocked) currentConv.is_unlocked = true;
  if(!text || fraudDetected || !currentConv || !unlocked) {
    if (currentConv && !unlocked && typeof showToast === 'function') {
      showToast('Chat is locked for this task.', '#f59e0b');
    } else if (!text && typeof showToast === 'function') {
      showToast('Type a message first.', '#f59e0b');
    }
    return;
  }

  var check = analyzeFraud(text);
  if(check.blocked){
    handleFraudBlock(check, text);
    fraudDetected = true;
    document.getElementById('sendBtn').disabled = true;
    return;
  }

  var mod = analyzeContentSafety(text);
  if(mod.blocked){
    handleContentModBlock(mod, text);
    fraudDetected = true;
    document.getElementById('sendBtn').disabled = true;
    return;
  }

  var sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  var recent = getRecentMyTexts();
  var result = typeof sendChatMessage === 'function'
    ? await sendChatMessage(convId, currentUserId, text, recent, { convId: convId, senderId: currentUserId })
    : { success: false };
  if(!result.success){
    if (result.error === 'user_blocked') {
      showToast('Messaging is blocked between you and this user.', '#ef4444');
      document.querySelector('.input-area').style.display = 'none';
    } else if (result.blocked || result.error === 'off_platform_contact') {
      handleFraudBlock({
        blocked: true,
        reason: result.reason || 'pattern',
        message: result.message || (typeof getOffPlatformWarning === 'function' ? getOffPlatformWarning() : '')
      }, text, { skipLog: !!result.logged });
    } else if (result.error === 'content_moderation' || result.reason === 'content_moderation') {
      handleContentModBlock({
        blocked: true,
        message: result.message || '',
        flags: result.flags || []
      }, text, { skipLog: true });
    } else {
      showToast('Could not send message. Try again.', '#ef4444');
    }
    sendBtn.disabled = false;
    return;
  }

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('fraudInline').style.display = 'none';
  fraudDetected = false;

  await refreshMessages();
  scrollToBottom();
};

window.addEventListener('beforeunload', function(){
  if(pollTimer) clearInterval(pollTimer);
  if (typeof qgUnsubscribeChat === 'function') qgUnsubscribeChat();
});
window.addEventListener('pagehide', function(){
  if (typeof qgUnsubscribeChat === 'function') qgUnsubscribeChat();
});
</script>
