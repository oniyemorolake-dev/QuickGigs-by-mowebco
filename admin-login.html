<!--

  server-side RLS/service-role enforcement (to be added with backend).
  Do NOT treat a hidden URL as protection.
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0A14">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 400px;
    padding: 26px 22px 22px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
  }
  .logo {
    display: inline-block;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 22px;
    line-height: 1.2;
    background: var(--grad-wordmark);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .badge {
    display: inline-block;
    margin-top: 6px;
    margin-left: 8px;
    vertical-align: 4px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--danger);
    background: var(--danger-soft);
    border-radius: 100px;
    padding: 3px 9px;
  }
  h1 {
    margin-top: 18px;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.25;
    color: var(--text);
  }
  .sub {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
  }
  label {
    display: block;
    margin-top: 16px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  input {
    width: 100%;
    margin-top: 6px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input::placeholder { color: var(--text-muted); }
  input:focus {
    border-color: var(--accent);
    outline: 2px solid color-mix(in srgb, var(--accent) 30%, transparent);
  }
  button[type="submit"] {
    width: 100%;
    margin-top: 20px;
    padding: 13px 16px;
    border: none;
    border-radius: 12px;
    background: var(--primary);
    color: var(--primary-text);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s;
  }
  button[type="submit"]:hover:not(:disabled) { filter: brightness(1.08); }
  button[type="submit"]:focus-visible {
    outline: 2px solid color-mix(in srgb, var(--primary) 40%, transparent);
    outline-offset: 2px;
  }
  button[type="submit"]:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .msg {
    display: none;
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.4;
  }
  .msg.error {
    display: block;
    background: var(--danger-soft);
    border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
    color: var(--danger);
  }
  .msg.ok {
    display: block;
    background: var(--money-soft);
    border: 1px solid color-mix(in srgb, var(--green) 30%, transparent);
    color: var(--green);
  }
  .foot {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
  }
  .foot a { color: var(--primary); font-weight: 600; text-decoration: none; }
  .foot a:hover { text-decoration: underline; }
  .note {
    margin-top: 14px;
    font-size: 11.5px;

    line-height: 1.45;
  }
</style>
<link rel="stylesheet" href="qg-tokens.css?v=20260811light1" id="qg-tokens-css">
</head>
<body>
  <div class="card">
    <div class="logo">SwiftGigs</div>
    <div class="badge">Admin</div>
    <h1>Admin log in</h1>
    <p class="sub">Isolated console sign-in. Prior account sessions are cleared before credentials are applied.</p>

    <div class="msg" id="errorMsg" role="alert"></div>
    <div class="msg" id="okMsg"></div>

    <form id="adminLoginForm" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required placeholder="admin@example.com">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Your password">

      <button type="submit" id="submitBtn">Sign in to admin →</button>
    </form>

    <p class="note">
      <!-- True enforcement is server-side (RLS + service-role admin API / custom claim)
           once the backend exists. This page is UX gating only: Firebase Auth +
           users.role === 'admin' and verified/email_verified. No password or secret
           is hardcoded here. -->
      Access requires Firebase Auth plus users.role = admin and verified. Client checks are UX only.
    </p>
    <p class="foot"><a href="login.html">Regular user log in</a></p>
  </div>

  <script defer src="qg-config.js"></script>
  <script defer src="qg-utils.js?v=20260728welcome1"></script>
  <script defer src="supabaseClient.js?v=20260727perf"></script>
  <script defer src="supabase-db.js?v=20260827chat1"></script>
  <script defer src="qg-admin-api.js?v=20260828admin1"></script>
  <script defer src="qg-admin-gate.js?v=20260828admin1"></script>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import {
  initializeAuth,
  browserLocalPersistence,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

/**
 * Isolated admin login.
 * SECURITY: Client UX only. Enforcement = admin-console Edge Function (admins table).
 * No hardcoded password/secret.
 */

const firebaseConfig = {
  apiKey: "AIzaSyBbYJxU-3r7qVMqwzXHiC-qRkZNtmGobm0",
  authDomain: "quickgigs-7b12d.firebaseapp.com",
  projectId: "quickgigs-7b12d",
  storageBucket: "quickgigs-7b12d.firebasestorage.app",
  messagingSenderId: "698985399366",
  appId: "1:698985399366:web:8a3ca60c5f3ffac84bb647"
};

const app = initializeApp(firebaseConfig);
const auth = initializeAuth(app, { persistence: browserLocalPersistence });
window._auth = auth;

const errorMsg = document.getElementById('errorMsg');
const okMsg = document.getElementById('okMsg');
const submitBtn = document.getElementById('submitBtn');

function showError(text) {
  okMsg.style.display = 'none';
  okMsg.className = 'msg';
  errorMsg.textContent = text || 'Something went wrong.';
  errorMsg.className = 'msg error';
  errorMsg.style.display = 'block';
}

function showOk(text) {
  errorMsg.style.display = 'none';
  errorMsg.className = 'msg';
  okMsg.textContent = text || '';
  okMsg.className = 'msg ok';
  okMsg.style.display = 'block';
}

function clearMessages() {
  errorMsg.style.display = 'none';
  errorMsg.className = 'msg';
  errorMsg.textContent = '';
  okMsg.style.display = 'none';
  okMsg.className = 'msg';
  okMsg.textContent = '';
}

/** Wipe prior identity so account A never bleeds into this admin session. */
async function beginFreshAdminLogin() {
  if (typeof qgPrepareLogin === 'function') qgPrepareLogin();
  else if (typeof clearQgUserScopedStorage === 'function') clearQgUserScopedStorage();
  else {
    try { sessionStorage.clear(); } catch (e) {}
  }
  window._qgAdminDbOk = false;
  window._qgAdminDbUser = null;
  window._currentUser = null;
  try { await signOut(auth); } catch (e2) {}
}

async function refuseNonAdmin(reason) {
  if (typeof clearQgUserScopedStorage === 'function') clearQgUserScopedStorage();
  try { await signOut(auth); } catch (e) {}
  if (typeof setCurrentUser === 'function') setCurrentUser(null);
  else window._currentUser = null;
  window._qgAdminDbOk = false;
  window._qgAdminDbUser = null;
  showError("This account doesn't have admin access.");
  console.warn('Admin login refused:', reason || 'not_admin');
}

document.getElementById('adminLoginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  clearMessages();

  var email = String(document.getElementById('email').value || '').trim();
  var password = String(document.getElementById('password').value || '');
  if (!email || !password) {
    showError('Enter email and password.');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Signing in…';

  try {
    await beginFreshAdminLogin();

    var cred = await signInWithEmailAndPassword(auth, email, password);
    var signedIn = (cred && cred.user) || auth.currentUser;
    if (!signedIn || !signedIn.uid) {
      throw { code: 'auth/invalid-credential' };
    }
    // Derive identity ONLY from the fresh Auth result.
    if (auth.currentUser && String(auth.currentUser.uid) !== String(signedIn.uid)) {
      signedIn = auth.currentUser;
    }
    if (typeof setCurrentUser === 'function') setCurrentUser(signedIn);
    else window._currentUser = signedIn;

    submitBtn.textContent = 'Checking admin access…';

    var access = typeof resolveAdminAccess === 'function'
      ? await resolveAdminAccess(signedIn)
      : { ok: false, reason: 'gate_missing' };

    if (!access || !access.ok) {
      await refuseNonAdmin(access && access.reason);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in to admin →';
      return;
    }

    // Confirm Auth still matches the user we just verified.
    var live = auth.currentUser;
    if (!live || String(live.uid) !== String(signedIn.uid)) {
      await refuseNonAdmin('auth_mismatch');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in to admin →';
      return;
    }

    showOk('Admin verified — opening console…');
    window.location.replace('admin.html');
  } catch (err) {
    var message = typeof qgFirebaseAuthErrorMessage === 'function'
      ? qgFirebaseAuthErrorMessage(err)
      : 'Incorrect email or password.';
    if (err && (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' ||
        err.code === 'auth/invalid-credential' || err.code === 'auth/invalid-login-credentials')) {
      message = 'Incorrect email or password.';
    }
    showError(message);
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign in to admin →';
  }
});
  </script>
</body>
</html>
