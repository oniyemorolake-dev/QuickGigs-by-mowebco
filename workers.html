<head>

<style>
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:76px;}
.nav{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.nav-logo{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;font-size:18px;}
.nav-right{display:flex;align-items:center;gap:10px;}
.mode-btn{padding:6px 13px;border-radius:100px;font-size:11.5px;font-weight:600;cursor:pointer;border:1px solid var(--border);font-family:'DM Sans',sans-serif;background:var(--surface-alt);color:var(--text);transition:border-color .15s;}
.mode-btn:hover{border-color:var(--accent);}
.back-link{color:var(--accent);text-decoration:none;font-size:13.5px;font-weight:600;}
/* Page header (overrides qg-features.css old-palette hero) */
.qg-page-hero{padding:20px 16px 4px;}
.qg-page-kicker{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:6px;}
.qg-page-title{font-family:'DM Sans',sans-serif;font-style:normal;font-size:21px;font-weight:700;line-height:1.25;color:var(--text);margin-bottom:4px;}
.qg-page-sub{font-size:13px;line-height:1.5;color:var(--text-muted);max-width:520px;}
/* Search input */
.qg-search-hero{padding:14px 16px 12px;}
.qg-search-box{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);box-shadow:none;transition:border-color .15s;}
.qg-search-box:focus-within{border-color:var(--accent);box-shadow:none;outline:2px solid color-mix(in srgb, var(--accent) 30%, transparent);}
.qg-search-box input{flex:1;min-width:0;border:none;outline:none;background:none;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);}
.qg-search-box input::placeholder{color:var(--text-muted);}
/* Skill filter chips */
.filter-pills{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.filter-pills::-webkit-scrollbar{display:none;}
.filter-pill{flex-shrink:0;padding:7px 14px;border-radius:100px;border:1px solid var(--border);background:var(--surface);font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text);transition:background .15s,border-color .15s,color .15s;}
.filter-pill:hover{border-color:var(--accent);}
.filter-pill.active{border-color:var(--accent);color:var(--accent-text, var(--primary-text));background:var(--accent);}
.filter-pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
/* Tasker list: divided rows like the mockup Messages list */
.qg-worker-list{display:flex;flex-direction:column;gap:0;padding:0 16px 24px;}
.qg-worker-card{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border:none;border-bottom:1px solid var(--border);border-radius:0;background:transparent;color:var(--text);text-decoration:none;transition:background .15s;}
.qg-worker-card:last-child{border-bottom:none;}
.qg-worker-card:hover{transform:none;border-color:var(--border);background:color-mix(in srgb, var(--surface-alt) 50%, transparent);}
.qg-worker-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px;}
.qg-worker-avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;background-color:var(--surface-alt);background-image:none;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--primary);}
.qg-worker-avatar.has-photo{color:transparent;}
.qg-worker-body{flex:1;min-width:0;}
.qg-worker-name{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;}
.qg-worker-meta{font-size:11px;line-height:1.45;color:var(--text-muted);margin-bottom:6px;}
.qg-worker-meta svg{vertical-align:-2px;color:var(--text-muted);}
.qg-worker-skills{display:flex;flex-wrap:wrap;gap:5px;}
.qg-worker-skill{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:100px;border:1px solid var(--border);background:var(--surface);color:var(--text);}
body.light .qg-worker-skill{background:var(--surface);color:var(--text);}
.qg-worker-name .qg-worker-skill{font-weight:600;background:var(--attention-soft);border-color:transparent;color:var(--attention);}
/* Rating / completion chips (markup from qg-stats.js) */
.qg-worker-card .qg-trust-row{justify-content:flex-start;gap:5px;margin:0 0 6px;}
.qg-worker-card .qg-trust-badge,
body.light .qg-worker-card .qg-trust-badge{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:100px;border:none;background:var(--accent-soft);color:var(--accent);}
.qg-worker-card .qg-trust-badge.is-green{background:var(--money-soft);color:var(--green);}
.qg-worker-card .qg-trust-badge.is-amber{background:var(--attention-soft);color:var(--attention);}
.qg-worker-list .qg-empty-discovery{text-align:center;padding:48px 24px;font-size:13px;color:var(--text-muted);}
</style>
</head>
<body>
<script src="qg-theme.js"></script>
<nav class="nav">
  <a class="back-link" href="dashboard.html" aria-label="Back to dashboard">← Home</a>
  <div class="nav-brand"><span class="nav-logo sg-wordmark">SwiftGigs</span></div>
  <div class="nav-right">
    <button class="mode-btn" id="modeBtn" onclick="toggleTheme()">Light</button>
  </div>
</nav>

<div class="qg-page-hero">
  <p class="qg-page-kicker">Discovery</p>
  <h1 class="qg-page-title">Find taskers near you</h1>
  <p class="qg-page-sub" id="heroSub">Browse verified taskers by skill, completion rate, and reviews.</p>
</div>

<div class="qg-search-hero">
  <label class="sr-only" for="workerSearch">Search taskers</label>
  <div class="qg-search-box">
    <span aria-hidden="true" data-qg-ico="search" data-qg-ico-size="16"></span>
    <input type="search" id="workerSearch" placeholder="Search by name or skill…" autocomplete="off" oninput="renderWorkers()">
  </div>
</div>

<div class="filter-pills" id="skillFilters" role="tablist" aria-label="Filter by skill"></div>

<div class="qg-worker-list" id="workerList" aria-live="polite">
  <div class="qg-inline-load" role="status" aria-busy="true"><span class="qg-spinner" aria-hidden="true"></span><span>Loading taskers…</span></div>
</div>

<nav class="tab-bar" id="qgTabBar"></nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyBbYJxU-3r7qVMqwzXHiC-qRkZNtmGobm0",
  authDomain: "quickgigs-7b12d.firebaseapp.com",
  projectId: "quickgigs-7b12d",
  storageBucket: "quickgigs-7b12d.firebasestorage.app",
  messagingSenderId: "698985399366",
  appId: "1:698985399366:web:8a3ca60c5f3ffac84bb647"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
onAuthStateChanged(auth, function (user) {
  if (!user) { window.location.href = 'login.html'; return; }
  window._currentUser = user;
  if (typeof syncCurrentUserProfile === 'function') syncCurrentUserProfile(user);
  loadWorkers();
});
</script>

<script src="qg-nav.js"></script>
<script src="qg-config.js"></script>
<script src="qg-utils.js?v=20260728welcome1"></script>
<script src="qg-categories.js"></script>
<script src="qg-icons.js"></script>
<script src="qg-location.js?v=20260827geo1"></script>
<script src="qg-pwa.js?v=947d37a-1789577525"></script>
<script src="qg-stats.js?v=20260811trust3"></script>
<script src="qg-share.js"></script>
<script src="qg-report.js?v=20260716d"></script>
<script src="supabase-db.js?v=20260827chat1"></script>
<script>
if (typeof renderQuickGigsTabBar === 'function') renderQuickGigsTabBar('home');
else {
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof renderQuickGigsTabBar === 'function') renderQuickGigsTabBar('home');
  });
}

var isDark = typeof QG_isDarkTheme === 'function' ? QG_isDarkTheme() : (localStorage.getItem('qg-theme') !== 'light');
function applyTheme() {
  if (typeof window.QG_applyTheme === 'function') window.QG_applyTheme(isDark, 'modeBtn', false);
  else document.body.classList.toggle('light', !isDark);
}
window.toggleTheme = function () {
  isDark = !isDark;
  if (typeof QG_setThemeDark === 'function') QG_setThemeDark(isDark);
  else localStorage.setItem('qg-theme', isDark ? 'dark' : 'light');
  applyTheme();
};
applyTheme();

var allWorkers = [];
var activeSkill = 'all';

function esc(s) {
  return typeof escapeHtml === 'function' ? escapeHtml(s)
    : (typeof qgEsc === 'function' ? qgEsc(s)
      : String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'));
}

function buildSkillFilters() {
  var skills = ['all'];
  allWorkers.forEach(function (w) {
    (w.skills || []).forEach(function (s) {
      var key = String(s).replace(/^[^\s]+\s/, '').trim();
      if (key && skills.indexOf(key) === -1) skills.push(key);
    });
  });
  var wrap = document.getElementById('skillFilters');
  wrap.innerHTML = skills.slice(0, 10).map(function (s) {
    var label = s === 'all' ? 'All skills' : s;
    var cls = s === activeSkill ? 'filter-pill active' : 'filter-pill';
    return '<button type="button" class="' + cls + '" data-skill="' + esc(s) + '">' + esc(label) + '</button>';
  }).join('');
  wrap.querySelectorAll('.filter-pill').forEach(function (btn) {
    btn.onclick = function () { setSkillFilter(btn.getAttribute('data-skill'), btn); };
  });
}

window.setSkillFilter = function (skill, el) {
  activeSkill = skill;
  document.querySelectorAll('.filter-pill').forEach(function (p) { p.classList.remove('active'); });
  if (el) el.classList.add('active');
  renderWorkers();
};

async function loadWorkers() {
  var city = typeof getUserCityLabel === 'function' ? getUserCityLabel() : '';
  document.getElementById('heroSub').textContent = 'Taskers with photos and skills — near ' + city + '.';

  var users = typeof getUsers === 'function' ? await getUsers() : [];
  var rows = (users || []).filter(function (u) {
    var role = String(u.role || '').toLowerCase();
    if (u.is_tasker !== true && role !== 'worker' && role !== 'both') return false;
    var uid = u.firebase_uid || u.user_id || u.id;
    if (!uid) return false;
    if (u.status === 'banned') return false;
    return true;
  });

  allWorkers = [];
  for (var i = 0; i < rows.length; i++) {
    var u = rows[i];
    var uid = String(u.firebase_uid || u.user_id || u.id);
    var avatar = typeof resolveUserAvatarUrl === 'function' ? await resolveUserAvatarUrl(uid) : (u.avatar_url || '');
    if (typeof hasProfilePhotoUrl === 'function' && !hasProfilePhotoUrl(avatar)) continue;

    var skills = typeof parseUserSkills === 'function' ? parseUserSkills(u) : [];
    var stats = typeof fetchUserTrustStats === 'function' ? await fetchUserTrustStats(uid) : {};
    allWorkers.push({
      id: uid,
      name: u.name || 'SwiftGigs tasker',
      bio: (u.bio || '').trim(),
      skills: skills,
      avatar: avatar,
      stats: stats,
      availability: u.availability || 'available',
      service_area: u.service_area || '',
      languages: u.languages || ''
    });
  }

  allWorkers.sort(function (a, b) {
    var ar = (a.stats && a.stats.avgRating) || 0;
    var br = (b.stats && b.stats.avgRating) || 0;
    if (br !== ar) return br - ar;
    return (b.stats && b.stats.completedCount || 0) - (a.stats && a.stats.completedCount || 0);
  });

  buildSkillFilters();
  renderWorkers();
}

window.renderWorkers = function () {
  var q = (document.getElementById('workerSearch').value || '').toLowerCase().trim();
  var list = allWorkers.filter(function (w) {
    if (activeSkill !== 'all') {
      var matchSkill = (w.skills || []).some(function (s) {
        return String(s).toLowerCase().indexOf(activeSkill.toLowerCase()) >= 0;
      });
      if (!matchSkill) return false;
    }
    if (!q) return true;
    var hay = (w.name + ' ' + (w.bio || '') + ' ' + (w.skills || []).join(' ')).toLowerCase();
    return hay.indexOf(q) >= 0;
  });

  var el = document.getElementById('workerList');
  if (!list.length) {
    el.innerHTML = typeof QG_emptyStateHtml === 'function'
      ? QG_emptyStateHtml({
          icon: 'users',
          title: 'No taskers match',
          sub: 'Try another skill or check back soon.'
        })
      : '<div class="qg-empty-discovery">No taskers match — try another skill or check back soon.</div>';
    return;
  }

  el.innerHTML = list.map(function (w) {
    var initial = esc((w.name || 'T').charAt(0).toUpperCase());
    var avatarCls = w.avatar ? 'qg-worker-avatar has-photo' : 'qg-worker-avatar';
    var cssUrl = typeof safeCssUrl === 'function' ? safeCssUrl(w.avatar) : '';
    var avatarStyle = cssUrl ? ' style="background-image:' + cssUrl + '"' : '';
    var trust = typeof renderTrustBadges === 'function' ? renderTrustBadges(w.stats) : '';
    var skillHtml = (w.skills || []).slice(0, 4).map(function (s) {
      return '<span class="qg-worker-skill">' + esc(s) + '</span>';
    }).join('');
    var meta = w.bio ? esc(w.bio.substring(0, 90)) + (w.bio.length > 90 ? '…' : '') : 'Available for gigs on SwiftGigs';
    if (w.service_area) meta = (typeof qgIcon==='function'?qgIcon('mapPin',{size:12}):'') + ' ' + esc(w.service_area) + ' · ' + meta;
    var availBadge = w.availability === 'busy' ? '<span class="qg-worker-skill" style="opacity:0.7">Busy</span>' : '';
    return '<a class="qg-worker-card" href="' + (typeof getProfileUrl === 'function' ? getProfileUrl(w.id) : ('profile.html?user=' + encodeURIComponent(w.id))) + '">' +
      '<div class="' + avatarCls + '"' + avatarStyle + ' aria-hidden="true">' + (w.avatar ? '' : initial) + '</div>' +
      '<div class="qg-worker-body">' +
        '<div class="qg-worker-name">' + esc(w.name) + availBadge + '</div>' +
        '<div class="qg-worker-meta">' + meta + '</div>' +
        trust +
        '<div class="qg-worker-skills">' + skillHtml + '</div>' +
      '</div>' +
    '</a>';
  }).join('');
};
</script>
</body>
</html>
