};

let authChecked = false;

  if (!authChecked) window.location.href = 'login.html';

<script>
/* ──────────────────────────────────────────────────────────────────────────
   Browse. Markup is Claude outputs/sg-design/templates/browse.html and
   gig-detail.html; everything below is the data wiring carried over from
   browsetask-legacy.html.
   ────────────────────────────────────────────────────────────────────────── */
(function () {
  'use strict';

  var APPLY_MSG_MIN = 20;
  var BUDGET_MIN = 20;

  function esc(s) {
    return typeof escapeHtml === 'function' ? escapeHtml(s)
      : String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function byId(id) { return document.getElementById(id); }

  /* parseQgTimestamp returns epoch milliseconds, not a Date, and it is the only
     parser that reads a zoneless Postgres stamp as UTC. */
  function toDate(raw) {
    if (raw == null || raw === '') return null;
    var ms = typeof parseQgTimestamp === 'function' ? parseQgTimestamp(raw) : Date.parse(raw);
    if (ms == null || !isFinite(ms)) return null;
    var d = new Date(ms);
    return isNaN(d.getTime()) ? null : d;
  }

  // ── Category icons ────────────────────────────────────────────────────────
  // Drawn inline rather than through qgIcon() so each row is byte-for-byte the
  // shape the template uses.
  var CAT_SVG = {
    errands: '<path d="M6 7h12l-1 14H7L6 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/>',
    home: '<path d="M3.5 11L12 3.5 20.5 11"/><path d="M5.5 9.5V20h5v-6h3v6h5V9.5"/>',
    tutoring: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 5.5v15"/>',
    beauty: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.1 8.1L20 20M14.5 9.5L20 4M8.1 15.9l3.4-3.4"/>',
    moving: '<path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5v-9z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/>',
    cooking: '<path d="M4 10h16v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5v-5z"/><path d="M8 10V7M12 10V6M16 10V7"/>',
    tech: '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M2 20h20"/>',
    care: '<circle cx="12" cy="15.5" r="3.5"/><circle cx="7" cy="9" r="1.8"/><circle cx="17" cy="9" r="1.8"/><circle cx="10" cy="5.5" r="1.6"/><circle cx="14" cy="5.5" r="1.6"/>',
    gardening: '<path d="M5 19C5 11 11 5 19 5c0 8-6 14-14 14z"/><path d="M5 19c3-3 6-5 9-6"/>',
    events: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18 17l.9 2.1L21 20l-2.1.9L18 23l-.9-2.1L15 20l2.1-.9z"/>',
    trades: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4 2.6-2.6z"/>',
    other: '<path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5v-9z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/>'
  };
  var PIN_SVG = '<svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
  var CLOCK_SVG = '<svg class="i " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  function catSvg(cat) {
    return '<svg class="i " viewBox="0 0 24 24" aria-hidden="true">' + (CAT_SVG[cat] || CAT_SVG.other) + '</svg>';
  }

  // ── Normalising a task row ────────────────────────────────────────────────
  var userNames = {};
  function normaliseTask(row) {
    var catInfo = typeof getCatInfo === 'function' ? getCatInfo(row.CATEGORY || row.category) : { label: 'Other' };
    var mode = (row.TASK_MODE || row.task_mode || 'standard').toLowerCase();
    var budget = parseFloat(row.BUDGET || row.budget || 0);
    var posterUid = row.posted_by || row.POSTED_BY || '';
    var posterName = row.poster_name || row.POSTER_NAME || '';
    if (!posterName && posterUid && typeof resolveUserName === 'function') {
      posterName = resolveUserName(posterUid, row, userNames);
    }
    return {
      id: row.task_id || row.TASK_ID || row.id,
      mode: mode,
      cat: (row.CATEGORY || row.category || 'other').toLowerCase(),
      catLabel: catInfo.label,
      title: typeof formatTaskDisplayTitle === 'function' ? formatTaskDisplayTitle(row) : (row.TITLE || row.title || 'Untitled task'),
      desc: row.DESCRIPTION || row.description || '',
      price: budget,
      budgetNegotiable: !!(row.budget_negotiable || row.BUDGET_NEGOTIABLE),
      location: row.LOCATION || row.location || '',
      preciseAddress: row.precise_address || row.PRECISE_ADDRESS || '',
      lat: row.lat != null ? Number(row.lat) : (row.LAT != null ? Number(row.LAT) : null),
      lng: row.lng != null ? Number(row.lng) : (row.LNG != null ? Number(row.LNG) : null),
      whenLabel: row.scheduled_label || row.SCHEDULED_LABEL || '',
      scheduledAt: row.scheduled_at || row.SCHEDULED_AT || '',
      createdAt: row.created_at || row.CREATED_AT || '',
      status: (row.STATUS || row.status || 'open').toLowerCase(),
      posterId: posterUid,
      posterName: posterName || 'a SwiftGigs member',
      photoUrls: typeof parsePhotoUrls === 'function' ? parsePhotoUrls(row.photo_urls || row.PHOTO_URLS) : [],
      requiresPhotos: !!(row.requires_photos || row.REQUIRES_PHOTOS),
      estHours: row.est_hours != null ? row.est_hours : row.EST_HOURS,
      rateType: String(row.rate_type || row.RATE_TYPE || (mode === 'recurring' ? 'hourly' : 'fixed')).toLowerCase(),
      agePreference: String(row.age_preference || row.AGE_PREFERENCE || 'adults_only').toLowerCase()
    };
  }

  // ── Labels the design asks for ────────────────────────────────────────────
  function dayLabel(d) {
    var now = new Date();
    var start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var days = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - start) / 86400000);
    if (days === 0) return 'Today';
    if (days === 1) return 'Tomorrow';
    if (days > 1 && days < 7) return d.toLocaleDateString('en-US', { weekday: 'short' });
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  function timeLabel(d) {
    // Fixed to en-US: the design reads "4:00 PM". A 24-hour locale would give
    // "16:00", and en-CA gives "4:00 p.m.".
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  }
  function whenLabel(t) {
    var d = toDate(t.scheduledAt);
    if (d) return dayLabel(d) + ' · ' + timeLabel(d);
    return t.whenLabel || '';
  }
  function durationLabel(t) {
    var h = Number(t.estHours);
    if (!isFinite(h) || h <= 0) return '';
    if (h < 1) return '~' + Math.round(h * 60) + ' min';
    return '~' + (h % 1 === 0 ? h : h.toFixed(1)) + ' hour' + (h === 1 ? '' : 's');
  }
  function distanceLabel(t) {
    if (t._distanceKm == null) return '';
    return typeof formatDistanceKm === 'function'
      ? formatDistanceKm(t._distanceKm) + ' away'
      : t._distanceKm.toFixed(1) + ' km away';
  }
  /* sortTasksByProximity only stamps _distanceKm on the pairs its comparator
     happens to visit, so the row meta came out blank for anything it skipped.
     Stamp every task up front instead. */
  function stampDistances(list) {
    var pos = typeof getGeoFilterPos === 'function' ? getGeoFilterPos() : null;
    if (!pos || typeof taskDistanceKm !== 'function') return;
    list.forEach(function (t) {
      var km = taskDistanceKm(t, pos);
      t._distanceKm = isFinite(km) ? km : null;
    });
  }

  // ── State ─────────────────────────────────────────────────────────────────
  var allTasks = [];
  var appliedTaskIds = {};
  var activeTask = null;
  var view = 'list';
  // Nearby starts on, as the design shows it. It only narrows anything once a
  // position is known, so it is a no-op before location permission.
  var filters = { search: '', cat: 'all', budget: '', date: 'any', dist: '', sort: 'nearest', nearby: true };
  var submitInFlight = false;
  window._qgAgeTier = window._qgAgeTier || 'loading';

  function currentUserId() { return window._currentUser ? String(window._currentUser.uid) : ''; }
  function isOwnPostedTask(t) {
    return !!(t && t.posterId && currentUserId() && String(t.posterId) === currentUserId());
  }
  function browseable(list) {
    return (list || []).filter(function (t) {
      return t.status === 'open' && !isOwnPostedTask(t) && !appliedTaskIds[String(t.id)];
    });
  }

  function toast(msg, ok) {
    var el = byId('sgToast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'sg-toast' + (ok ? ' is-ok' : ' is-error');
    el.hidden = false;
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.hidden = true; }, 5000);
  }

  // ── Filtering and sorting ─────────────────────────────────────────────────
  function matchesDate(t, range) {
    if (!range || range === 'any') return true;
    var d = toDate(t.scheduledAt) || toDate(t.createdAt);
    if (!d) return range === 'any';
    var now = new Date();
    var start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var days = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - start) / 86400000);
    if (range === 'today') return days === 0;
    if (range === 'week') return days >= 0 && days <= 7;
    return true;
  }

  function filtered() {
    var search = filters.search.toLowerCase().trim();
    var list = allTasks.filter(function (t) {
      if (window._qgAgeTier === 'teen' && typeof QG_taskAllowsTeen === 'function' && !QG_taskAllowsTeen(t)) return false;
      if (filters.cat !== 'all' && t.cat !== filters.cat) return false;
      if (!matchesDate(t, filters.date)) return false;
      var price = Number(t.price) || 0;
      if (filters.budget === 'under50' && price >= 50) return false;
      if (filters.budget === '50to100' && (price < 50 || price > 100)) return false;
      if (filters.budget === '100plus' && price < 100) return false;
      if (!search) return true;
      var hay = (t.title + ' ' + t.catLabel + ' ' + t.desc + ' ' + t.posterName + ' ' + t.location).toLowerCase();
      return hay.indexOf(search) >= 0;
    });

    var radius = filters.dist ? Number(filters.dist) : (filters.nearby ? 25 : Infinity);
    var pos = typeof getGeoFilterPos === 'function' ? getGeoFilterPos() : null;
    if (pos && isFinite(radius) && typeof filterTasksByDistance === 'function') {
      list = filterTasksByDistance(list, { pos: pos, radiusKm: radius });
    }

    var sort = filters.sort;
    if (sort === 'nearest' && typeof sortTasksByProximity === 'function') {
      list = sortTasksByProximity(list, typeof getUserLocation === 'function' ? getUserLocation() : '');
    } else if (sort === 'pay') {
      list = list.slice().sort(function (a, b) { return (b.price || 0) - (a.price || 0); });
    } else if (sort === 'pay_low') {
      list = list.slice().sort(function (a, b) { return (a.price || 0) - (b.price || 0); });
    } else {
      list = list.slice().sort(function (a, b) {
        return (toDate(b.createdAt) || 0) - (toDate(a.createdAt) || 0);
      });
    }
    return list;
  }

  function activeFilterCount() {
    var n = 0;
    if (filters.search) n++;
    if (filters.cat !== 'all') n++;
    if (filters.budget) n++;
    if (filters.date !== 'any') n++;
    if (filters.dist) n++;
    if (filters.sort !== 'nearest') n++;
    return n;
  }

  // ── Rendering ─────────────────────────────────────────────────────────────
  function gigRowHtml(t) {
    var metaBits = [distanceLabel(t), whenLabel(t)].filter(Boolean).join(' · ');
    var dur = durationLabel(t);
    return '<a class="sg-card sg-gig" href="#" data-gig="' + esc(String(t.id)) + '">' +
      '<span class="sg-isq teal">' + catSvg(t.cat) + '</span>' +
      '<span class="t"><b>' + esc(t.title) + '</b>' +
        (metaBits ? '<span class="sg-meta">' + PIN_SVG + esc(metaBits) + '</span>' : '') +
        (dur ? '<span class="sg-meta">' + CLOCK_SVG + esc(dur) + '</span>' : '') +
      '</span>' +
      '<span class="sg-money">$' + esc(String(t.price)) + '</span></a>';
  }

  /* The design's subtitle always names a place. Prefer the user's own city;
     fall back to the one most of the open gigs are in, so the line still reads
     properly before location permission is granted. */
  function scopeCity(list) {
    var city = typeof getUserCityLabel === 'function' ? getUserCityLabel() : '';
    if (city) return city;
    var tally = {}, best = '', bestN = 0;
    list.forEach(function (t) {
      var parts = String(t.location || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      if (!parts.length) return;
      // "1420 17 Ave SW, Calgary" → Calgary; "Calgary, AB" → Calgary, AB.
      var last = parts[parts.length - 1];
      var name = (last.length <= 3 && parts.length > 1) ? parts.slice(-2).join(', ') : last;
      if (!name) return;
      tally[name] = (tally[name] || 0) + 1;
      if (tally[name] > bestN) { bestN = tally[name]; best = name; }
    });
    return best;
  }

  function setCount(list) {
    var el = byId('sgGigCount');
    if (!el) return;
    var n = list.length;
    var base = n + ' gig' + (n === 1 ? '' : 's');
    var city = scopeCity(list);
    el.textContent = city ? base + ' near ' + city : base + ' available';
  }

  function render() {
    stampDistances(allTasks);
    var list = filtered();
    setCount(list);

    var badge = byId('sgFilterCount');
    if (badge) {
      var n = activeFilterCount();
      badge.textContent = String(n);
      badge.hidden = n === 0;
    }

    byId('sgGigList').hidden = view !== 'list';
    byId('sgMapView').hidden = view !== 'map';
    byId('sgSpotlightView').hidden = view !== 'spotlight';

    if (view === 'list') renderList(list);
    else if (view === 'map') renderMap(list);
    else renderSpotlight(list);
  }

  function emptyHtml() {
    if (typeof QG_emptyStateHtml === 'function') {
      return QG_emptyStateHtml({
        icon: 'search',
        title: 'No gigs match',
        sub: activeFilterCount() ? 'Try widening your filters.' : 'Nothing open near you right now. Check back shortly.',
        action: activeFilterCount() ? { label: 'Reset filters', onclick: 'SG_resetFilters()' } : null
      });
    }
    return '<div class="sg-state"><div class="sg-state-title">No gigs match</div></div>';
  }

  function renderList(list) {
    var host = byId('sgGigList');
    if (window._qgAgeTier === 'loading') {
      host.innerHTML = typeof QG_listSkeletonHtml === 'function'
        ? QG_listSkeletonHtml({ rows: 3, label: 'Checking gig eligibility…' })
        : '<div class="sg-inline-load">Loading…</div>';
      return;
    }
    host.innerHTML = list.length ? list.map(gigRowHtml).join('') : emptyHtml();
  }

  // ── Map segment ───────────────────────────────────────────────────────────
  var map = null, layer = null;
  function renderMap(list) {
    var withCoords = list.filter(function (t) { return isFinite(t.lat) && isFinite(t.lng); });
    byId('sgMapList').innerHTML = list.length ? list.slice(0, 20).map(gigRowHtml).join('') : emptyHtml();
    if (typeof L === 'undefined') return;
    if (!map) {
      map = L.map('sgMap', { zoomControl: false, attributionControl: true });
      /* OpenStreetMap, not cartocdn: carto answers 200 with an "API key
         required" placeholder tile now, so the map rendered blank. OSM's tile
         policy requires the attribution line, hence attributionControl above. */
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);
      map.setView([51.0447, -114.0719], 11);
    }
    if (layer) layer.remove();
    layer = L.layerGroup().addTo(map);
    withCoords.forEach(function (t) {
      L.marker([t.lat, t.lng], {
        icon: L.divIcon({ className: 'sg-pin', html: '<span>$' + esc(String(t.price)) + '</span>', iconSize: null })
      }).addTo(layer).on('click', function () { openGig(t.id); });
    });
    if (withCoords.length) {
      map.fitBounds(L.latLngBounds(withCoords.map(function (t) { return [t.lat, t.lng]; })).pad(0.25));
    }
    setTimeout(function () { map.invalidateSize(); }, 60);
  }

  // ── Spotlight segment ─────────────────────────────────────────────────────
  var spotIndex = 0;
  function renderSpotlight(list) {
    var host = byId('sgSpotlightView');
    if (!list.length) { host.innerHTML = emptyHtml(); return; }
    if (spotIndex >= list.length) spotIndex = 0;
    var t = list[spotIndex];
    var metaBits = [distanceLabel(t), whenLabel(t), durationLabel(t)].filter(Boolean).join(' · ');
    host.innerHTML =
      '<div class="sg-card" style="margin-top:18px;padding:24px 20px;text-align:center">' +
        '<span class="sg-isq lg teal" style="margin:0 auto">' + catSvg(t.cat) + '</span>' +
        '<h2 class="sg-h2" style="margin-top:16px">' + esc(t.title) + '</h2>' +
        '<div class="sg-money" style="font-size:28px;margin-top:6px">$' + esc(String(t.price)) + '</div>' +
        (metaBits ? '<p class="sg-sub" style="margin-top:8px">' + esc(metaBits) + '</p>' : '') +
        (t.desc ? '<p class="sg-desc" style="margin-top:14px">' + esc(t.desc.slice(0, 180)) + '</p>' : '') +
        '<div style="display:flex;gap:10px;margin-top:22px">' +
          '<button class="sg-btn sg-btn-quiet" data-spot="skip">Skip</button>' +
          '<button class="sg-btn teal" data-spot="open">View gig</button>' +
        '</div>' +
        '<p class="sg-sub" style="margin-top:14px">' + (spotIndex + 1) + ' of ' + list.length + '</p>' +
      '</div>';
    host.querySelector('[data-spot="skip"]').onclick = function () { spotIndex++; render(); };
    host.querySelector('[data-spot="open"]').onclick = function () { openGig(t.id); };
  }

  // ── Loading ───────────────────────────────────────────────────────────────
  async function loadMyAppliedTaskIds(userId) {
    appliedTaskIds = {};
    if (!userId || typeof getApplicationsByWorker !== 'function') return;
    try {
      var apps = await getApplicationsByWorker(userId);
      (apps || []).forEach(function (a) {
        var tid = a.task_id || a.TASK_ID;
        var st = String(a.status || a.STATUS || 'pending').toLowerCase();
        if (!tid) return;
        if (st === 'declined' || st === 'withdrawn' || st === 'cancelled') return;
        appliedTaskIds[String(tid)] = true;
      });
    } catch (e) {
      console.warn('Could not load your applications:', e);
    }
  }

  async function hydratePosterNames() {
    if (typeof getUsersNameMap !== 'function') return;
    try {
      userNames = (await getUsersNameMap()) || {};
      allTasks.forEach(function (t) {
        if (t.posterId && userNames[t.posterId]) t.posterName = userNames[t.posterId];
      });
    } catch (e) {}
  }

  async function loadTasks() {
    var cached = typeof readTasksCache === 'function' ? readTasksCache(true) : null;
    if (cached && cached.length) {
      allTasks = browseable(cached.map(normaliseTask));
      render();
    }
    try {
      var items = typeof getTasks === 'function' ? await getTasks() : [];
      if (items && items.length) allTasks = browseable(items.map(normaliseTask));
    } catch (err) {
      console.warn('Supabase unreachable:', err);
      if ((!cached || !cached.length) && typeof QG_errorStateHtml === 'function') {
        byId('sgGigList').innerHTML = QG_errorStateHtml({
          offline: true,
          retry: { label: 'Try again', onclick: 'SG_reload()' }
        });
        return;
      }
    }
    await hydratePosterNames();
    if (currentUserId()) {
      if (typeof loadSavedTaskIds === 'function') await loadSavedTaskIds(currentUserId());
      await loadMyAppliedTaskIds(currentUserId());
      allTasks = browseable(allTasks);
    }
    render();

    // Second pass on the detail select, so scheduled_at and coordinates are present.
    if (typeof fetchAllTasksFresh === 'function') {
      fetchAllTasksFresh().then(function (fresh) {
        if (!fresh || !fresh.length) return;
        allTasks = browseable(fresh.map(normaliseTask));
        return hydratePosterNames();
      }).then(render).catch(function (err) {
        console.warn('Background task refresh failed:', err);
      });
    }
  }
  window.SG_reload = loadTasks;

  // ── Gig detail ────────────────────────────────────────────────────────────
  function openSheet(id) {
    var el = byId(id);
    if (!el) return;
    el.classList.add('open');
    el.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function closeSheet(id) {
    var el = byId(id);
    if (!el) return;
    el.classList.remove('open');
    el.setAttribute('aria-hidden', 'true');
    if (!document.querySelector('.sg-sheet.open')) document.body.style.overflow = '';
  }
  window.SG_closeSheet = closeSheet;

  async function openGig(id) {
    var t = allTasks.filter(function (x) { return String(x.id) === String(id); })[0];
    if (!t) return;
    activeTask = t;
    if (typeof qgTrackTaskView === 'function') qgTrackTaskView(t);
    if (typeof haptic === 'function') haptic(10);

    if (isOwnPostedTask(t)) {
      toast('This is your own posting. Switch to Poster mode to manage applicants.');
      return;
    }

    byId('sgGigIcon').innerHTML = catSvg(t.cat);
    byId('sgGigTitle').textContent = t.title;
    byId('sgGigPrice').textContent = '$' + t.price;

    var loc = t.preciseAddress || t.location || '';
    var dist = distanceLabel(t);
    byId('sgGigLoc').innerHTML = esc(loc) + (dist ? '<small>' + esc(dist) + '</small>' : '');
    byId('sgGigLocRow').hidden = !loc;

    var when = [whenLabel(t), durationLabel(t)].filter(Boolean).join(' · ');
    byId('sgGigWhen').textContent = when;
    byId('sgGigWhenRow').hidden = !when;

    byId('sgGigDesc').textContent = t.desc || 'No extra details were added.';
    byId('sgGigPosterName').textContent = 'Posted by ' + t.posterName;
    byId('sgGigPosterAv').textContent = String(t.posterName || 'P').trim().charAt(0).toUpperCase() || 'P';
    byId('sgGigPosterMeta').textContent = 'SwiftGigs member';

    openSheet('sgGigSheet');
    loadPosterCard(t.posterId);
  }
  window.SG_openGig = openGig;

  async function loadPosterCard(posterId) {
    if (!posterId) return;
    try {
      var user = typeof getUserByFirebaseUid === 'function' ? await getUserByFirebaseUid(posterId) : null;
      var av = byId('sgGigPosterAv');
      var avatarUrl = user && (user.avatar_url || user.AVATAR_URL);
      if (av && avatarUrl && typeof safeMediaUrl === 'function') {
        var safeAv = safeMediaUrl(avatarUrl);
        if (safeAv) av.innerHTML = '<img src="' + esc(safeAv) + '" alt="">';
      }
      /* The design's person row carries "Member since YYYY" and nothing else.
         The poster's rating, review count and payment-verified flag are all
         still read on this screen but have no slot in it — raised with
         Morolake rather than added back unilaterally. */
      var sinceDate = toDate(user && (user.created_at || user.CREATED_AT));
      if (sinceDate) byId('sgGigPosterMeta').textContent = 'Member since ' + sinceDate.getFullYear();
    } catch (e) {}
  }

  // ── Apply ─────────────────────────────────────────────────────────────────
  function showApplyError(msg) {
    var el = byId('sgOfferError');
    el.textContent = msg;
    el.hidden = !msg;
  }

  function updateFeeLine() {
    var el = byId('sgOfferFee');
    var price = parseFloat(byId('sgOfferPrice').value);
    if (!isFinite(price) || typeof calculateFees !== 'function') { el.hidden = true; return; }
    try {
      var fees = calculateFees(price);
      var net = fees && (fees.workerPayout != null ? fees.workerPayout : fees.worker_payout);
      if (net == null) { el.hidden = true; return; }
      el.innerHTML = CLOCK_SVG + '<span>You receive <b class="sg-money">$' + esc(Number(net).toFixed(2)) + '</b> after the service fee.</span>';
      el.hidden = false;
    } catch (e) { el.hidden = true; }
  }

  async function openApply() {
    if (!activeTask) return;

    if (typeof getMode === 'function' && getMode() === 'poster') {
      var taskerAllowed = typeof QG_canUseRole === 'function' ? QG_canUseRole('tasker') : null;
      if (taskerAllowed === false) {
        if (typeof QG_offerRoleOptIn === 'function') QG_offerRoleOptIn('tasker');
        return;
      }
      if (!confirm('You are in Poster mode. Switch to Tasker mode to apply for gigs?')) return;
      if (typeof QG_setActiveRoleMode === 'function') {
        var switched = await QG_setActiveRoleMode('tasker');
        if (!switched.success) return;
      } else if (typeof setMode === 'function') {
        setMode('tasker');
      }
    }

    if (typeof QG_loadVerification === 'function') {
      var verification = await QG_loadVerification();
      if (!verification || verification.tasker_verified !== true) {
        if (typeof QG_openVerificationPrompt === 'function') QG_openVerificationPrompt('tasker');
        else window.location.href = 'profile.html?verification=tasker';
        return;
      }
    }

    var userId = currentUserId();
    if (userId) await loadMyAppliedTaskIds(userId);
    var already = !!appliedTaskIds[String(activeTask.id)];
    byId('sgApplyAlready').hidden = !already;
    byId('sgApplyForm').hidden = already;

    if (!already && typeof ensureTaskerProfilePhoto === 'function') {
      var photoCheck = await ensureTaskerProfilePhoto();
      if (!photoCheck.ok) {
        if (confirm('Taskers need a profile photo before applying. Add your photo now?')) {
          window.location.href = 'profile.html?setup=photo&required=1&return=browsetask.html';
        }
        return;
      }
    }

    var priceEl = byId('sgOfferPrice');
    priceEl.value = activeTask.price;
    priceEl.readOnly = !activeTask.budgetNegotiable;
    byId('sgOfferNego').textContent = activeTask.budgetNegotiable
      ? 'Open to offers — name your price here. Chat is for schedule and details, not price.'
      : "Fixed budget — your offer matches the poster's price.";
    byId('sgOfferMsg').value = '';
    byId('sgOfferAvail').value = '';
    showApplyError('');
    updateFeeLine();

    var teen = byId('sgOfferTeen');
    var meetupHtml = (typeof QGTeenSafety !== 'undefined' && typeof QGTeenSafety.meetupBannerHtml === 'function')
      ? QGTeenSafety.meetupBannerHtml(activeTask) : '';
    teen.innerHTML = meetupHtml || '';
    teen.hidden = !meetupHtml;

    openSheet('sgApplySheet');
  }

  async function sendApplication() {
    if (submitInFlight) return;
    var btn = byId('sgOfferSend');
    function unlock() {
      submitInFlight = false;
      btn.textContent = 'Send application';
      btn.disabled = false;
    }
    submitInFlight = true;
    btn.textContent = 'Sending…';
    btn.disabled = true;
    showApplyError('');

    try {
      if (!activeTask || !activeTask.id) { showApplyError('Pick a gig first.'); unlock(); return; }
      if (appliedTaskIds[String(activeTask.id)]) {
        byId('sgApplyAlready').hidden = false;
        byId('sgApplyForm').hidden = true;
        unlock();
        return;
      }

      var userId = currentUserId();
      if (!userId) {
        showApplyError('Log in again to apply.');
        unlock();
        setTimeout(function () { window.location.href = 'login.html'; }, 1200);
        return;
      }

      // Payout setup is required before applying, so an accepted application can
      // always be paid out.
      if (typeof getUserByFirebaseUid === 'function') {
        try {
          var payoutUser = await getUserByFirebaseUid(userId);
          var ready = !!(payoutUser && (payoutUser.stripe_payouts_enabled === true ||
            payoutUser.stripe_payouts_enabled === 'true' || payoutUser.stripe_payouts_enabled === 1));
          if (!ready) {
            showApplyError('Set up your payout details before applying, so you can get paid when a gig completes. Open Profile → Payouts.');
            unlock();
            return;
          }
        } catch (e) {
          // A network hiccup shouldn't hard-block the applicant; the poster-side
          // payout gate at completion is the backstop.
        }
      }

      var sanitize = typeof window.sanitizeInput === 'function'
        ? window.sanitizeInput
        : function (t) { return String(t == null ? '' : t).trim(); };
      var priceNum = parseFloat(byId('sgOfferPrice').value);
      var msg = sanitize(byId('sgOfferMsg').value, 1000);
      var avail = sanitize(byId('sgOfferAvail').value, 120);

      if (!isFinite(priceNum) || priceNum < BUDGET_MIN) {
        showApplyError('Please enter an offer of at least $' + BUDGET_MIN + '.');
        unlock();
        return;
      }
      if (!msg || msg.length < APPLY_MSG_MIN) {
        showApplyError('Please write a message of at least ' + APPLY_MSG_MIN + ' characters.');
        unlock();
        return;
      }

      if (typeof QGTeenSafety !== 'undefined' && typeof QGTeenSafety.meetupPolicyForTask === 'function' &&
          typeof QGTeenSafety.isTeen === 'function' && QGTeenSafety.isTeen()) {
        var policy = QGTeenSafety.meetupPolicyForTask(activeTask);
        if (policy && policy.blocked) {
          showApplyError(policy.warning || 'This category is restricted for under-18 taskers.');
          unlock();
          return;
        }
        if (policy && policy.flagged && policy.warning &&
            !confirm(policy.warning + '\n\nContinue? Your guardian still reviews each apply.')) {
          unlock();
          return;
        }
      }

      var contactCheck = typeof analyzeOffPlatformContact === 'function'
        ? analyzeOffPlatformContact(msg + (avail ? ' ' + avail : ''))
        : { blocked: false };
      if (contactCheck.blocked) {
        var cMsg = contactCheck.message ||
          (typeof getOffPlatformWarning === 'function' ? getOffPlatformWarning() : 'Remove contact details from your message.');
        if (typeof logFraudContactEvent === 'function') {
          logFraudContactEvent({ userId: userId, reason: contactCheck.reason || 'contact', preview: msg, violation: 1 });
        }
        showApplyError(cMsg);
        unlock();
        return;
      }

      if (typeof moderateText === 'function') {
        var mod = moderateText(msg);
        if (mod.blocked) {
          var mMsg = mod.message || 'Message not allowed.';
          if (typeof logModerationAttempt === 'function') {
            logModerationAttempt({
              userId: userId, source: 'application', targetType: 'task',
              targetId: activeTask.id, field: 'message', flags: mod.flags || [], preview: msg, message: mMsg
            });
          }
          showApplyError(mMsg);
          unlock();
          return;
        }
      }

      if (typeof getAccountActionPermission === 'function') {
        var perm = await getAccountActionPermission(userId, 'apply');
        if (!perm.allowed) {
          if (perm.reason === 'tasker_role_required' && typeof QG_offerRoleOptIn === 'function') {
            closeSheet('sgApplySheet');
            QG_offerRoleOptIn('tasker');
          }
          showApplyError(perm.message);
          unlock();
          return;
        }
      }
      if (isOwnPostedTask(activeTask)) {
        showApplyError('You cannot apply to your own gig.');
        unlock();
        return;
      }

      // applications.task_id is UUID (FK → tasks.task_id)
      var taskId = String(activeTask.id);
      if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(taskId)) {
        showApplyError('This gig has an invalid id — refresh Browse and try again.');
        unlock();
        return;
      }

      // applications.worker_id = Firebase Auth uid (TEXT). Never users.user_id (UUID PK).
      var workerName = window._currentUser.displayName ||
        (window._currentUser.email && window._currentUser.email.split('@')[0]) || 'Tasker';
      if (typeof formatPersonName === 'function') workerName = formatPersonName(workerName);

      var dbSubmit = typeof window.submitApplicationToDb === 'function'
        ? window.submitApplicationToDb
        : (typeof window.submitApplication === 'function' ? window.submitApplication : null);
      if (typeof dbSubmit !== 'function') {
        showApplyError('Still loading — wait a second and try again.');
        unlock();
        return;
      }

      var createdRow = null, guardianPending = false;
      try {
        var result = await dbSubmit({
          task_id: taskId,
          worker_id: userId,
          worker_name: workerName,
          message: msg + (avail ? ' · Available: ' + avail : ''),
          price: priceNum
        });
        if (!result || !result.success) throw new Error((result && result.error) || 'save failed');
        createdRow = result.data || null;
        guardianPending = result.guardian_status === 'pending_guardian' ||
          (createdRow && createdRow.guardian_status === 'pending_guardian');
      } catch (err) {
        var m = err && err.message;
        if (m === 'photo_required' || m === 'profile_photo_required') {
          window.location.href = 'profile.html?setup=photo&required=1&return=browsetask.html';
          return;
        }
        if (m === 'already_applied') {
          appliedTaskIds[taskId] = true;
          byId('sgApplyAlready').hidden = false;
          byId('sgApplyForm').hidden = true;
        } else if (m === 'tasker_identity_verification_required') {
          if (typeof QG_openVerificationPrompt === 'function') QG_openVerificationPrompt('tasker');
          showApplyError('Verify your email to start working.');
        } else if (m === 'tasker_role_required') {
          if (typeof QG_offerRoleOptIn === 'function') QG_offerRoleOptIn('tasker');
          showApplyError('Enable Tasker mode before applying to gigs.');
        } else {
          showApplyError(m === 'cannot_apply_own_task' ? 'You cannot apply to your own gig.'
            : (typeof formatSupabaseActionError === 'function'
              ? formatSupabaseActionError('send application', m)
              : 'Could not send application: ' + (m || 'try again')));
        }
        unlock();
        return;
      }

      var chatNote = '';
      try {
        var chatUnlocked = typeof resolveChatUnlockedOnCreate === 'function' && resolveChatUnlockedOnCreate('application');
        if (!guardianPending && activeTask.posterId && typeof createConversation === 'function') {
          var posterName = activeTask.posterName || 'Poster';
          if (typeof getUserNameByFirebaseUid === 'function') {
            var fetched = await getUserNameByFirebaseUid(activeTask.posterId);
            if (fetched) posterName = fetched;
          }
          var conv = await createConversation({
            task_id: taskId,
            poster_id: activeTask.posterId,
            worker_id: userId,
            poster_name: posterName,
            worker_name: workerName,
            task_title: activeTask.title,
            task_category: activeTask.cat,
            status: 'application'
          });
          if (conv.success && conv.data && conv.data.conv_id && chatUnlocked && typeof sendChatMessage === 'function') {
            var sent = await sendChatMessage(conv.data.conv_id, userId,
              msg + (avail ? ' · Available: ' + avail : '') + ' · My offer: $' + priceNum);
            chatNote = (sent && sent.blocked)
              ? ' Chat stays locked until payment.'
              : ' Open Messages to chat with the poster.';
          } else if (conv.success) {
            chatNote = ' Chat opens after acceptance and payment.';
          }
        }
      } catch (chatErr) {
        chatNote = ' Open Messages if chat does not appear yet.';
      }

      if (typeof qgTrackEvent === 'function') qgTrackEvent('apply_task', { task_id: taskId });
      appliedTaskIds[taskId] = true;
      allTasks = allTasks.filter(function (t) { return String(t.id) !== taskId; });
      closeSheet('sgApplySheet');
      closeSheet('sgGigSheet');
      render();
      toast(guardianPending
        ? 'Sent to your guardian for approval. The poster cannot see it yet.'
        : 'Application sent.' + chatNote, true);
      unlock();
    } catch (fatal) {
      console.error('Send application failed:', fatal);
      showApplyError('Could not send application: ' + (fatal && fatal.message ? fatal.message : 'try again'));
      unlock();
    }
  }

  // ── Filter panel ──────────────────────────────────────────────────────────
  function buildCategoryChips() {
    var host = byId('sgCatChips');
    var map = window.QG_CAT_MAP || {};
    var ids = Object.keys(map);
    var html = '<button class="sg-chip teal-on" data-cat="all">All</button>';
    ids.forEach(function (id) {
      var label = (map[id] && map[id].label) || id;
      html += '<button class="sg-chip" data-cat="' + esc(id) + '">' + esc(label) + '</button>';
    });
    host.innerHTML = html;
  }

  function chipGroup(hostId, attr, onPick) {
    var host = byId(hostId);
    if (!host) return;
    host.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-' + attr + ']');
      if (!btn) return;
      host.querySelectorAll('.sg-chip').forEach(function (c) { c.classList.remove('teal-on'); });
      btn.classList.add('teal-on');
      onPick(btn.getAttribute('data-' + attr));
    });
  }

  function resetFilters() {
    filters = { search: '', cat: 'all', budget: '', date: 'any', dist: '', sort: 'nearest', nearby: true };
    byId('sgSearchInput').value = '';
    [['sgCatChips', 'all'], ['sgBudgetChips', ''], ['sgDateChips', 'any'], ['sgDistChips', ''], ['sgSortChips', 'nearest']]
      .forEach(function (pair) {
        var host = byId(pair[0]);
        if (!host) return;
        host.querySelectorAll('.sg-chip').forEach(function (c, i) { c.classList.toggle('teal-on', i === 0); });
      });
    byId('sgQuickChips').querySelectorAll('.sg-chip').forEach(function (c, i) {
      c.classList.toggle('teal-on', i === 0);
    });
    if (typeof qgSaveBrowseFilters === 'function') qgSaveBrowseFilters(filters);
    render();
  }
  window.SG_resetFilters = function () { resetFilters(); closeSheet('sgFilterSheet'); };

  // ── Wiring ────────────────────────────────────────────────────────────────
  function wire() {
    document.addEventListener('click', function (e) {
      var closer = e.target.closest('[data-sg-close]');
      if (closer) { e.preventDefault(); closeSheet(closer.getAttribute('data-sg-close')); return; }
      var gig = e.target.closest('[data-gig]');
      if (gig) { e.preventDefault(); openGig(gig.getAttribute('data-gig')); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      var open = document.querySelector('.sg-sheet.open');
      if (open) { e.preventDefault(); closeSheet(open.id); }
    });

    byId('sgFilterBtn').onclick = function () { openSheet('sgFilterSheet'); };
    byId('sgSortBtn').onclick = function () { openSheet('sgFilterSheet'); };
    byId('sgFilterApply').onclick = function () { closeSheet('sgFilterSheet'); render(); };
    byId('sgFilterReset').onclick = resetFilters;
    byId('sgSearchInput').addEventListener('input', function () {
      filters.search = this.value;
      if (typeof qgSaveBrowseFilters === 'function') qgSaveBrowseFilters(filters);
      render();
    });

    buildCategoryChips();
    chipGroup('sgCatChips', 'cat', function (v) { filters.cat = v; render(); });
    chipGroup('sgBudgetChips', 'budget', function (v) { filters.budget = v; render(); });
    chipGroup('sgDateChips', 'date', function (v) { filters.date = v; render(); });
    chipGroup('sgDistChips', 'dist', function (v) { filters.dist = v; render(); });
    chipGroup('sgSortChips', 'sort', function (v) { filters.sort = v; render(); });

    byId('sgQuickChips').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-quick]');
      if (!btn) return;
      var kind = btn.getAttribute('data-quick');
      var on = !btn.classList.contains('teal-on');
      if (kind === 'nearby') { filters.nearby = on; }
      if (kind === 'today') { filters.date = on ? 'today' : 'any'; }
      if (kind === 'pay') { filters.sort = on ? 'pay' : 'nearest'; }
      btn.classList.toggle('teal-on', on);
      if (typeof qgSaveBrowseFilters === 'function') qgSaveBrowseFilters(filters);
      render();
    });

    byId('sgViewSeg').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-view]');
      if (!btn) return;
      view = btn.getAttribute('data-view');
      this.querySelectorAll('button').forEach(function (b) {
        var on = b === btn;
        b.classList.toggle('on', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      try { sessionStorage.setItem('qg-browse-view', view); } catch (err) {}
      render();
    });

    byId('sgApplyBtn').onclick = openApply;
    byId('sgOfferSend').onclick = sendApplication;
    byId('sgOfferPrice').addEventListener('input', updateFeeLine);
    byId('sgGigMsg').onclick = function () {
      window.location.href = activeTask ? 'messages.html?task=' + encodeURIComponent(activeTask.id) : 'messages.html';
    };
    byId('sgGigMore').onclick = function () {
      if (activeTask && typeof qgOpenReport === 'function') qgOpenReport('task', activeTask.id);
      else if (activeTask && typeof qgShareTask === 'function') qgShareTask(activeTask);
    };

    // Restore what the user last chose.
    try {
      var savedView = sessionStorage.getItem('qg-browse-view');
      if (savedView) {
        var segBtn = byId('sgViewSeg').querySelector('[data-view="' + savedView + '"]');
        if (segBtn) segBtn.click();
      }
    } catch (err) {}
    if (typeof qgLoadBrowseFilters === 'function') {
      var saved = qgLoadBrowseFilters();
      if (saved && saved.search) { filters.search = saved.search; byId('sgSearchInput').value = saved.search; }
    }

    var params = new URLSearchParams(window.location.search);
    var cat = params.get('cat');
    if (cat) {
      var catBtn = byId('sgCatChips').querySelector('[data-cat="' + cat.toLowerCase() + '"]');
      if (catBtn) catBtn.click();
    }
    var deepTask = params.get('task');
    if (deepTask) setTimeout(function () { openGig(deepTask); }, 900);
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  window.SG_onUser = function () {
    if (typeof QG_loadAgeTier === 'function' && window._currentUser) {
      QG_loadAgeTier(window._currentUser.uid).then(function (result) {
        window._qgAgeTier = (result && result.tier) || 'adult';
        render();
      }).catch(function () { window._qgAgeTier = 'adult'; render(); });
    } else {
      window._qgAgeTier = 'adult';
    }
    if (typeof QG_loadVerification === 'function') QG_loadVerification().then(render).catch(function () {});
    if (typeof QG_applyRoleMode === 'function') QG_applyRoleMode();
    loadTasks();
  };

  function boot() {
    wire();
    render();
    if (typeof initUserLocation === 'function') {
      initUserLocation().then(render).catch(function () {});
    }
    // Auth may already have resolved before this inline script ran.
    if (window._currentUser) window.SG_onUser(window._currentUser);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
